addFlat("marx","导论：马克思主义与鲜明特征","教材主干",[
["my-origin","马克思主义的产生、组成与诞生标志",1,"资本主义发展及其矛盾暴露，无产阶级作为独立政治力量登上历史舞台；德国古典哲学、英国古典政治经济学、英法空想社会主义提供思想来源。","马克思主义由马克思主义哲学、政治经济学和科学社会主义组成。唯物史观和剩余价值学说是马克思一生的两个伟大发现，使社会主义由空想变为科学；1848年《共产党宣言》发表标志马克思主义公开问世。","选择题常把理论来源、自然科学前提、阶级基础和诞生标志组合设错；分析题可从科学性与人民性统一说明马克思主义的生命力。","《共产党宣言》是公开问世标志，不是唯物史观第一次系统阐述的著作；《德意志意识形态》首次系统阐述历史唯物主义基本原理。",["bk-manifesto","bk-german1845"],"http://www.jsxinwendao.com/uploadfile/20261111101602557.pdf"],
["my-features","马克思主义的鲜明特征与当代价值",1,"马克思主义源于实践并在人民求解放的实践中发展，不是封闭僵化的教条。","科学性、人民性、实践性、发展开放性是鲜明特征；人民性是本质属性，实践性是区别于其他理论的显著特征。纪念马克思诞辰200周年讲话概括为科学的理论、人民的理论、实践的理论、不断发展的开放的理论。","用于回答马克思主义为什么行、为什么能与时俱进：揭示规律、站稳人民立场、指导改造世界、随实践和时代发展。","科学性与革命性统一不能理解为只讲价值立场不讲客观规律；开放性也不等于放弃基本原理。",["ev-marx200","kw-marx-people"],"http://www.12371.cn/special/mksdc200zn/"]
]);
addFlat("marx","辩证唯物论：物质、运动与意识","教材主干",[
["my-philosophy","哲学基本问题与两大派别",1,"任何哲学都要回答思维和存在的关系问题，这是划分基本哲学派别的依据。","第一方面是何者第一性：认为存在第一性属于唯物主义，认为思维第一性属于唯心主义；第二方面是思维能否正确认识存在，区分可知论与不可知论。辩证法与形而上学回答世界怎样存在，不是哲学基本问题的第三方面。","先识别题干问的是本原还是同一性，再判断派别；不能把可知论等同唯物主义、不可知论等同唯心主义。","唯物主义并非都坚持辩证法，唯心主义并非都是不可知论；旧唯物主义在历史观上可能仍是唯心的。",[]],
["my-matter-motion","物质、运动与静止",1,"列宁从物质与意识关系界定物质，反对把哲学物质范畴等同某种具体实物。","物质是不依赖于人的意识并能为人的意识所反映的客观实在；唯一特性是客观实在性。运动是物质的根本属性和存在方式，静止是运动的特殊状态，是有条件、暂时的、相对的。","材料出现变化中的相对稳定性、基准和条件时，可用绝对运动与相对静止统一分析；反对夸大静止或否认稳定。","无运动的物质是形而上学，无物质的运动是唯心主义；相对静止不是绝对不动。",["kw-matter-only","kw-motion-attribute"]],
["my-spacetime","时间、空间与物质运动",2,"物质运动总是在一定时间和空间中展开，时空观是唯物论常见辨析点。","时间是物质运动的持续性、顺序性，特点是一维性；空间是物质运动的广延性、伸张性，特点是三维性。时空具有客观性、绝对性与相对性、无限性与有限性。","具体时空特性随物质运动状态变化，不等于时空是主观感觉；分析实际问题要一切以时间、地点、条件为转移。","时空客观性不能因相对性被否定；具体形态的时空有限与整个物质世界时空无限要分清。",[]],
["my-consciousness","意识的本质、起源与能动作用",1,"意识是物质世界长期发展的产物，也是社会历史的产物，劳动在意识产生发展中起决定性作用。","意识是人脑的机能和属性，是客观世界的主观映象；内容客观、形式主观。能动作用表现为目的性计划性、创造性、指导实践改造世界、调控人的行为和生理活动。","材料强调正确理念、科学规划、精神力量时，既答意识能动反作用，也要补尊重客观规律、通过实践实现。","意识不能凭空创造物质，也不能直接改变客观世界；正确和错误意识都是对客观存在的反映，只是反映性质不同。",[]],
["my-material-unity","世界物质统一性与客观规律、主观能动性",1,"自然界、人类社会和人的意识统一于物质；尊重规律是正确发挥主观能动性的前提。","世界的真正统一性在于物质性。规律是事物运动发展中本质的、必然的、稳定的联系，具有客观性；发挥主观能动性要认识利用规律并通过实践，把尊重客观规律与发挥主观能动性统一起来。","分析题常见答题链：从实际出发、尊重规律→发挥能动性、创造条件→实践转化→反对唯意志论和消极无为。","人能认识利用规律，但不能创造、消灭或改变规律本身；条件可以改变，规律不能凭意志改变。",[]]
]);
addFlat("marx","唯物辩证法：规律与范畴","教材主干",[
["my-connection","普遍联系与系统观念",1,"事物内部各要素及事物之间相互影响、相互制约、相互作用，联系具有客观性、普遍性、多样性和条件性。","要用联系观点看问题，善于分析具体联系和条件，把握整体与部分的辩证统一；整体居于主导地位、统率部分，关键部分功能及其变化也可能对整体功能起决定作用。","材料出现系统推进、协同治理、链条堵点，可答普遍联系、整体优化和条件分析，反对孤立片面。","并非任何两个事物都有直接联系；整体功能不总是各部分功能简单相加，关键部分“决定作用”有条件。",["kw-dialectic-general"]],
["my-development","永恒发展与新事物必然战胜旧事物",1,"发展的实质是事物的前进和上升，是新事物产生和旧事物灭亡，不等于一切运动变化。","新事物符合客观规律、具有强大生命力和远大前途，否定旧事物中消极腐朽因素并保留合理因素；发展是前进性与曲折性的统一。","材料出现改革创新、成长中的困难、长期趋势，可答发展实质和前途光明道路曲折，既坚定信心又准备克服困难。","新出现的事物不一定是新事物；形式上新旧、出现先后和力量暂时强弱都不是根本判断标准。",[]],
["my-same-struggle","矛盾同一性与斗争性",1,"矛盾是反映事物内部和事物之间对立统一关系的哲学范畴，同一性与斗争性是两种基本属性。","同一性是有条件的、相对的，包括相互依存和相互贯通并在一定条件下相互转化；斗争性是无条件的、绝对的。斗争性寓于同一性之中，同一性通过斗争性表现，二者结合推动事物发展。","材料出现危与机、压力与动力、竞争与合作，可答在对立中把握同一、在同一中把握对立，并积极创造转化条件。","矛盾双方转化必须有一定条件；和谐不排斥矛盾，斗争性也不等于只采用对抗形式。",["kw-contradiction-core","mao-contradict"]],
["my-universal-special","矛盾普遍性与特殊性",1,"矛盾无处不在、无时不有，又有不同性质、地位和解决方式，要求承认矛盾并具体分析。","普遍性寓于特殊性之中并通过特殊性表现，特殊性也离不开普遍性；二者在一定条件下相互转化。矛盾普遍性与特殊性、共性与个性的关系是矛盾问题的精髓。","这是马克思主义基本原理同中国具体实际相结合、一般号召与个别指导结合、试点与推广结合的重要哲学依据。","不能说普遍性包含特殊性，正确的是普遍性寓于特殊性；具体问题具体分析是马克思主义活的灵魂。",["kw-contradiction-essence","mao-contradict"]],
["my-main-aspect","主次矛盾与矛盾主次方面",1,"复杂事物有多个矛盾，同一矛盾内部又有两个方面，不平衡性要求区分对象。","主要矛盾在事物发展过程中处于支配地位、起决定作用；矛盾主要方面在每一矛盾双方中处于支配地位、起主导作用，事物性质主要由主要矛盾的主要方面决定。要坚持两点论和重点论统一。","题干问“抓重点工作、中心任务”多用主次矛盾；问“评价事物性质、主流支流、利弊”多用矛盾主次方面。","两个原理不能见“重点”就混选；主次矛盾和主次方面都会在一定条件下转化，但转化不取消重点论。",["kw-contradiction-method"]],
["my-quality","质量互变规律与适度原则",1,"质是一事物区别于他事物的内在规定性，量是规模、程度、速度等规定性，度是保持事物质的量的限度。","量变是质变的必要准备，质变是量变的必然结果，质变又为新的量变开辟道路；量变和质变相互渗透。要重视量的积累、抓住时机促成飞跃，并掌握适度原则。","材料出现久久为功、积小胜为大胜、临界点、过犹不及，可从量变质变及相互渗透作答。","并非任何量变都会立即引起质变，量变只有达到一定程度才引起质变；质变也不等于发展，只有前进上升的质变才构成发展。",[]],
["my-negation","辩证否定观与否定之否定",1,"事物内部肯定与否定因素相互作用，使发展呈现螺旋式上升和波浪式前进。","辩证否定是事物自身的否定，是发展的环节和联系的环节，实质是扬弃，即既克服又保留；否定之否定揭示方向前进、道路曲折。","用于分析守正创新、批判继承传统文化、改革中的保留与突破，反对全盘肯定和全盘否定。","扬弃不是简单抛弃，也不是折中调和；循环论只看见复归，直线论只看见前进，都片面。",[]],
["my-categories","唯物辩证法五对基本范畴",2,"联系和发展的基本环节通过成对范畴揭示事物不同侧面。","原因与结果揭示引起与被引起；必然与偶然揭示发展趋势及表现；可能与现实区分潜在和已经实现；现象与本质区分外部表现和内在联系；内容与形式区分构成要素与结构方式。","答题要先识别材料关系，再对应方法论：透过现象看本质、重视必然并把握偶然、立足现实创造条件、反对形式主义。","本质与现象始终相联系，假象也是本质的表现；原因与结果可在一定条件下相互转化，但不能把先后关系一概当因果。",[]]
]);
addFlat("marx","认识论：实践、认识与真理","教材主干",[
["my-practice","实践的本质、特征与基本形式",1,"实践是人类能动地改造世界的社会性物质活动，是马克思主义认识论首要和基本的观点。","实践具有客观实在性、自觉能动性和社会历史性；基本形式包括物质生产实践、社会政治实践和科学文化实践，其中物质生产实践是最基本的实践活动。","判断认识来源、理论形成和检验标准时首先回到实践；虚拟实践是实践新形式，但不能脱离现实社会条件。","实践不是单纯主观认识活动，也不是动物本能活动；直接经验和间接经验都是认识，不等于实践本身。",["kw-practice-view","mao-practice"]],
["my-two-leaps","认识运动两次飞跃与能动反映",1,"认识是主体在实践基础上对客体的能动反映，经历由实践到认识、再由认识到实践的过程。","第一次飞跃由感性认识上升为理性认识，需要丰富真实材料并运用科学思维；第二次飞跃由理性认识回到实践，指导实践并接受检验，意义更重大。","材料出现调查研究—形成理论—政策试验—修正完善，可完整写两次飞跃和反复过程。","感性认识不一定错误、理性认识不一定正确；第二次飞跃不是简单重复第一次，也不是认识过程终结。",["mao-practice"]],
["my-truth","真理的客观性、绝对性与相对性",1,"真理是标志主观同客观相符合的哲学范畴，是对客观事物及其规律的正确反映。","真理内容客观、形式主观，真理是一元的；绝对性指真理包含不依赖主体的客观内容及认识可不断接近无限发展的物质世界，相对性指具体真理在广度深度和进程上有限。二者相互依存、相互包含。","材料出现科学理论发展、适用范围、修正错误，可答坚持和发展真理统一，反对绝对主义和相对主义。","真理多元论错误，不等于不同学科不能有多样表达；相对真理不是包含谬误，也不是真理可以随人而定。",[]],
["my-truth-value","真理与价值、实践标准的确定性不确定性",1,"人的实践既追求正确认识世界，又追求满足主体需要，要求真理尺度与价值尺度统一。","成功的实践是真理尺度和价值尺度统一，价值评价以主体需要为尺度但有客观标准，最广大人民根本利益是根本评价标准。实践是检验真理唯一标准，其实践本身受历史条件制约。","用于分析科技进步与社会价值、发展与安全、历史条件下认识局限，既坚持实践标准又发展真理。","实践标准不确定性不否认唯一标准；有用即真理把价值等同真理，属于实用主义错误。",["kw-truth-standard","e1978-truth"]],
["my-cognition-process","认识过程的反复性、无限性与上升性",1,"主体受实践水平、知识结构和客体暴露程度限制，客观世界又不断发展，认识不会一次完成。","人们对复杂事物的正确认识往往经实践、认识、再实践、再认识多次反复；认识运动无限发展并呈波浪式前进、螺旋式上升。要做到主观与客观、理论与实践具体的历史的统一。","分析题可解释政策试点、理论创新、认识纠偏和不断调查研究，反对一次认识终结论。","反复不是原地循环，真理发展也不意味着此前真理被全盘推翻；错误认识不等于必然成为正确认识的必经阶段。",[]]
]);
addFlat("marx","唯物史观：社会规律与人民主体","教材主干",[
["my-social-being","社会存在与社会意识",1,"社会存在是社会物质生活条件的总和，主要包括自然地理环境、人口因素和物质生产方式，其中生产方式是决定性因素。","社会存在决定社会意识，社会意识是社会存在的反映并具有相对独立性：不完全同步性、不平衡性、历史继承性、内部相互影响以及对社会存在的能动反作用。","分析先进文化、思想观念变化和社会风气，可从物质条件决定作用与先进社会意识促进作用双向作答。","相对独立性不是脱离社会存在独立存在；社会意识反作用性质和大小取决于其内容及掌握群众的程度。",[]],
["my-basic-contradiction","社会基本矛盾及其运动规律",1,"生产力与生产关系、经济基础与上层建筑的矛盾是社会基本矛盾，贯穿社会发展过程。","生产力决定生产关系，生产关系反作用于生产力；经济基础决定上层建筑，上层建筑反作用于经济基础。生产关系一定要适合生产力状况、上层建筑一定要适合经济基础状况，是社会基本规律。","改革的哲学依据是调整不适合生产力和经济基础的环节，使社会主义制度自我完善发展，而不是改变根本制度。","上层建筑包括政治上层建筑和观念上层建筑；先进上层建筑服务的经济基础若阻碍生产力，其反作用也可能表现为阻碍。",["kw-productivity-final","kw-reform-self"]],
["my-social动力","社会发展动力：基本矛盾、阶级斗争、革命与改革",1,"社会基本矛盾是根本动力，不同社会形态中直接动力的具体形式不同，不可张冠李戴。","阶级斗争是阶级社会发展的直接动力；社会革命是社会形态质变的重要手段；改革是同一社会形态内的量变和部分质变，是社会主义社会发展的直接动力；人民群众是历史创造者。","题干限定“根本动力、直接动力、最终决定力量、主体力量”时分别判断，避免把生产力、改革和人民简单互换。","改革不是细枝末节修补，也不是改变社会根本制度；社会主义社会基本矛盾是非对抗性的。",["kw-reform-direct","kw-people-force"]],
["my-technology","科学技术及其社会作用",1,"科学技术是先进生产力的重要标志，是社会发展的重要动力，但其作用受社会制度和利益关系制约。","科学技术推动生产方式、生活方式和思维方式变革；现代科技革命促进经济和社会发展。技术应用也可能带来异化、生态和伦理问题，要合理发挥制度与价值调控。","材料涉及人工智能、科技伦理、创新驱动，可答科技重要作用与双重效应，反对技术决定论和技术悲观论。","科技不是社会发展的唯一决定力量，不能代替社会基本矛盾和人民群众；技术本身与社会使用方式要区分。",[]],
["my-people-history","人民群众与个人在历史上的作用",1,"历史唯物主义从社会存在决定社会意识、生产方式决定社会发展出发，肯定人民主体地位。","人民群众是社会物质财富、精神财富的创造者，是社会变革的决定力量；人民群众创造历史受社会条件制约。杰出人物对历史发展有重要影响，但不能决定历史发展的基本趋势。","分析英雄人物、人民立场和群众路线时，要统一群众史观与正确评价个人作用，反对英雄史观。","人民群众是历史创造者不等于每个人都能任意创造历史，也不等于否定杰出人物作用；历史参与者不都是历史创造者。",["kw-people-force","kw-mass-line"]],
["my-human-value","人的本质、人的价值与自由",2,"人的发展不能脱离社会关系和实践，个人价值与社会价值相互联系。","人的本质不是单个人固有的抽象物，在其现实性上是一切社会关系的总和。人的价值包括社会价值和自我价值，评价根本尺度看是否符合社会发展规律、是否通过实践促进历史进步。自由是对必然的认识和对客观世界的改造。","用于回答个人理想与社会理想、奉献与获得、自由与规律的关系，强调在社会实践中实现人的全面发展。","自由不是摆脱客观规律为所欲为；自我价值不排斥社会价值，社会价值也不能简单抹杀正当个人需要。",["kw-free-development"]]
]);
addFlat("marx","政治经济学：商品、价值与货币","教材主干",[
["my-commodity","商品二因素与劳动二重性",1,"商品是用来交换、能满足人的某种需要的劳动产品，具有使用价值和价值两个因素。","使用价值是商品自然属性，价值是凝结在商品中的无差别一般人类劳动、体现社会属性；具体劳动创造使用价值，抽象劳动形成价值。二者是同一劳动过程的两个方面。","劳动二重性是理解马克思主义政治经济学的枢纽，商品二因素的根源是生产商品劳动的二重性。","使用价值不只有商品才有，价值则是商品特有的历史范畴；具体劳动和抽象劳动不是两次劳动或两类劳动者。",["kw-labor-dual"]],
["my-value-amount","商品价值量与社会必要劳动时间",1,"商品价值量由生产商品的社会必要劳动时间决定，与个别劳动时间无关，但个别劳动时间影响生产者竞争地位。","社会必要劳动时间随社会劳动生产率变化；单位商品价值量与生产该商品的社会劳动生产率成反比，与体现在商品中的社会必要劳动量成正比。同一劳动在同一时间创造的价值量不变。","计算题先分清社会劳动生产率与个别劳动生产率：社会劳动生产率提高会降低单位商品价值量；个别企业提高效率不直接改变社会价值量。","单位商品价值量、单位时间价值总量和使用价值总量是三个不同指标；不能见效率提高就断言所有价值量都减少。",[]],
["my-value-law","价值规律的内容、形式与作用",1,"商品经济基本规律要求商品价值量由社会必要劳动时间决定，交换以价值量为基础实行等价交换。","价格围绕价值自发波动是价值规律作用的表现形式。价值规律自发调节生产资料和劳动力分配、刺激技术进步和劳动生产率提高、促使生产者两极分化。","价格受供求关系影响但不等于供求决定价值；分析市场调节时同时看到积极作用与自发盲目后果。","等价交换是长期平均趋势，不是每次交换价格都等于价值；价格波动没有违背价值规律。",[]],
["my-money","货币本质、职能与流通规律",2,"货币是固定充当一般等价物的特殊商品，体现商品生产者之间的社会经济关系。","货币具有价值尺度、流通手段、贮藏手段、支付手段和世界货币职能，其中价值尺度和流通手段是基本职能。流通中所需要货币量与商品价格总额成正比、与货币流通速度成反比。","价值尺度可用观念货币，流通手段需现实货币；支付手段伴随赊购赊销和清偿债务，不能与一手交钱一手交货混淆。","纸币本身没有价值，纸币发行量超过流通需要可能引发贬值和通胀；不能把货币等同于资本。",[]]
]);
addFlat("marx","政治经济学：资本、剩余价值与危机","教材主干",[
["my-labor-power","劳动力成为商品与货币转化为资本",1,"资本主义雇佣劳动制度形成需要劳动力成为商品，其条件是劳动者有人身自由且丧失生产资料、不得不出卖劳动力。","劳动力商品价值由维持劳动者本人、家属生存及教育训练所需生活资料价值决定，并包含历史和道德因素；使用价值在于劳动中能创造大于自身价值的新价值。","劳动力成为商品是货币转化为资本的前提；剩余价值在生产领域产生，流通实现但不创造剩余价值。","资本总公式矛盾不能靠不等价交换根本解决；劳动力价值与劳动创造的价值不能混同。",["kw-labor-commodity"]],
["my-surplus-process","资本主义生产过程二重性与剩余价值来源",1,"资本主义生产过程是劳动过程和价值增殖过程的统一，工人的劳动分为必要劳动和剩余劳动。","剩余价值是雇佣工人创造的、被资本家无偿占有的超过劳动力价值的那部分价值。资本按在剩余价值生产中的作用分为不变资本和可变资本；剩余价值率＝剩余价值÷可变资本，也＝剩余劳动÷必要劳动。","不变资本转移旧价值，可变资本不仅再生产自身价值还创造剩余价值；计算时不能把全部预付资本作分母。","剩余价值不是由机器、原料或流通创造；剩余价值率不是利润率，二者分母不同。",[]],
["my-surplus-methods","绝对剩余价值、相对剩余价值与超额剩余价值",1,"资本家提高剥削程度的基本方法是绝对剩余价值生产和相对剩余价值生产。","绝对剩余价值是在必要劳动时间不变时延长工作日或提高劳动强度；相对剩余价值是在工作日长度不变时缩短必要劳动时间、相对延长剩余劳动时间，以全社会劳动生产率普遍提高为条件。","超额剩余价值是个别企业提高劳动生产率使商品个别价值低于社会价值形成的差额，具有暂时性；其普遍追逐会推动相对剩余价值形成。","超额剩余价值不是来自抬高售价；相对剩余价值不是单个企业永久独占，而是社会生产率普遍提高的结果。",[]],
["my-accumulation","资本积累、资本有机构成与相对过剩人口",1,"资本积累是剩余价值资本化，剩余价值是资本积累的源泉，资本积累是资本主义扩大再生产的源泉。","资本有机构成由资本技术构成决定并反映其变化的价值构成；资本积累和有机构成提高会导致相对过剩人口，造成两极分化并加深资本主义基本矛盾。","计算有机构成时按不变资本与可变资本比例理解；分析失业要区分相对过剩与绝对人口不足。","资本积累不是剩余价值的源泉；相对过剩人口是资本主义生产方式特有的人口规律，不是人口绝对过多。",["kw-surplus-source","kw-accumulation-source"]],
["my-circulation","资本循环、周转与社会总资本再生产",2,"产业资本循环经历购买、生产、售卖三个阶段，依次采取货币资本、生产资本、商品资本三种职能形式。","连续循环要求三种职能形式在空间上并存、时间上继起；资本周转速度受周转时间和生产资本构成影响。社会总资本再生产核心问题是社会总产品实现，即价值补偿和实物替换。","固定资本与流动资本按价值周转方式划分，不变资本与可变资本按剩余价值生产作用划分，两组标准不同。","流动资本不等于可变资本，固定资本也不等于不变资本的全部；社会资本简单再生产也有实现条件。",[]],
["my-profit","剩余价值转化为利润与平均利润",2,"剩余价值被看作全部预付资本的产物时转化为利润，利润掩盖剩余价值真正来源和剥削关系。","利润率＝剩余价值÷全部预付资本，通常小于剩余价值率。部门竞争和资本转移使利润率平均化，商品价值转化为生产价格，生产价格＝成本价格＋平均利润。","平均利润形成后价值规律作用形式表现为市场价格围绕生产价格波动，但不改变全社会利润总额等于剩余价值总额。","生产价格形成不意味着价值规律失效；个别企业生产价格与价值可不一致，社会总量关系仍成立。",[]],
["my-crisis","资本主义基本矛盾与经济危机",1,"生产社会化和生产资料资本主义私人占有之间的矛盾是资本主义基本矛盾，是经济危机的深刻根源。","经济危机基本特征是生产相对过剩，即相对于劳动人民有支付能力的需求而言过剩；可能性由货币流通手段和支付手段职能发展而来，现实性来自基本矛盾及具体表现。","资本主义危机具有周期性，周期一般包括危机、萧条、复苏、高涨阶段；分析资本主义自我调整不能推出基本矛盾消失。","生产过剩不是社会产品绝对超过所有人需要；科技、金融和国家干预只能缓和不能根除资本主义基本矛盾。",[]],
["my-monopoly","垄断、国家垄断资本主义与金融资本",2,"自由竞争引起生产集中和资本集中，生产集中发展到一定阶段产生垄断；垄断没有消除竞争。","垄断利润主要通过垄断价格获得，垄断价格包括垄断高价和垄断低价；金融资本由工业垄断资本和银行垄断资本融合形成。国家垄断资本主义是国家政权与私人垄断资本融合。","垄断价格总额不创造新价值，全社会垄断价格总额仍受价值总量约束；国家垄断没有改变资本主义性质。","垄断与竞争并存且竞争更复杂；国家垄断资本主义不是社会主义公有制，也不等于克服资本主义基本矛盾。",[]],
["my-global-capital","经济全球化与当代资本主义变化",3,"科技革命、生产力发展、跨国公司与国际分工推动经济全球化，资本主义生产关系也出现新调整。","经济全球化既有促进资源配置、技术传播和生产力发展的积极效应，也会放大发展不平衡、风险传导和治理矛盾。当代资本主义新变化没有改变资本主义本质和基本矛盾。","分析全球化要反对全盘肯定与全盘否定，结合开放合作、风险治理和人类共同利益作答。","新变化不意味着资本主义已经解决危机根源；全球化不是单一国家单向推动，也不等于世界制度同质化。",[]],
["my-capital-two","资本主义历史地位与“两个必然”“两个决不会”",1,"资本主义推动生产力发展又有无法克服的内在矛盾，社会主义代替资本主义是长期历史过程。","资产阶级的灭亡和无产阶级的胜利同样不可避免；无论哪一个社会形态，在它所能容纳的全部生产力发挥出来以前决不会灭亡，新的更高生产关系在其物质存在条件成熟以前决不会出现。","把历史必然性与实现条件、长期性统一起来，反对资本主义永恒论和简单速胜论。","两个必然不是机械时间表，两个决不会也不是否定历史必然性；二者统一于生产关系一定要适合生产力规律。",[]]
]);
addFlat("marx","科学社会主义：实践、规律与理想","教材主干",[
["my-utopian","空想社会主义贡献、局限与科学社会主义创立",1,"空想社会主义批判资本主义并描绘未来社会，但未揭示资本主义必然灭亡的经济根源和实现变革的社会力量。","唯物史观和剩余价值学说使社会主义从空想变为科学；科学社会主义以无产阶级和人类解放为价值目标，以社会化大生产和无产阶级成长为现实条件。","选择题常考两大发现与空想社会主义局限，理解科学社会主义不是道德愿望而是建立在规律和阶级力量分析上。","空想社会主义不是没有价值，而是历史条件限制下未能找到科学道路；《共产党宣言》不是两个发现本身。",["bk-manifesto"]],
["my-proletariat","无产阶级革命与无产阶级政党",2,"无产阶级是最先进最革命的阶级，其历史使命由资本主义基本矛盾及其阶级地位决定。","无产阶级革命是迄今人类历史上最广泛、最彻底、最深刻的革命，根本问题是国家政权问题；无产阶级政党由科学社会主义理论武装，是无产阶级先锋队。","理解党的领导、人民立场和革命彻底性时，注意科学社会主义基本原理与中国具体实践结合。","无产阶级革命不能简单等同暴力唯一形式，具体道路受历史条件制约；共产党不是一般利益集团。",[]],
["my-socialist-path","社会主义发展道路多样性与前进性曲折性",1,"各国生产力、历史文化、阶级关系和国际环境不同，社会主义建设没有放之四海皆准的固定模式。","社会主义发展道路具有多样性，必须坚持科学社会主义一般原则并从本国实际出发；社会主义作为新生事物，发展是前进性与曲折性的统一。","用于说明独立自主探索、中国特色社会主义道路形成和制度优势，反对照抄别国模式及因挫折否定方向。","多样性不否定一般原则，坚持一般原则也不等于照搬经典作家具体结论。",[]],
["my-communism","共产主义社会基本特征",1,"共产主义是社会发展和人类解放的理想形态，其实现以生产力高度发展和社会关系深刻变革为基础。","物质财富极大丰富、消费资料按需分配；社会关系高度和谐、人们精神境界极大提高；每个人自由而全面发展，人类从必然王国向自由王国飞跃。","材料题可把共同理想与远大理想统一，强调脚踏实地推进当前事业而非脱离阶段空谈目标。","按需分配不是按欲望任意索取，自由全面发展不是个人脱离社会；共产主义不是平均主义。",["kw-free-development"]],
["my-ideal-reality","共产主义远大理想与中国特色社会主义共同理想",1,"远大理想规定最终方向，共同理想是现阶段全国人民共同奋斗目标和远大理想在当前历史阶段的具体体现。","坚持和发展中国特色社会主义、实现中华民族伟大复兴，是通向共产主义远大理想的现实道路；二者统一于为中国人民谋幸福、为中华民族谋复兴和推动人类进步的实践。","思修与马原交叉命题时，可用理想层次性、阶段性与长期性说明既胸怀远大目标又做好现实工作。","不能用共同理想取代远大理想，也不能以远大理想否定现阶段路线方针政策；反对渺茫论和速成论。",["kw-free-development","kw-core-values"]]
]);
addFlat("maozhong","导论：中国化时代化与理论成果","教材主干",[
["mz-localization","马克思主义中国化时代化的提出与内涵",1,"中国革命、建设和改革需要把马克思主义基本原理同中国实际结合，党内曾出现教条化和经验神圣化错误。","1938年六届六中全会毛泽东在《论新阶段》中首次明确提出马克思主义中国化命题。其内涵是立足中国国情、总结中国经验、汲取中华优秀传统文化滋养，运用马克思主义立场观点方法解决中国问题并形成中国特色理论成果。","分析理论创新时可写“坚持马克思主义指导但不教条化，立足中国实践并彰显民族特色，回应时代课题”。","提出命题不等于毛泽东思想已经确立指导地位；中国化时代化不是对马克思主义词句作语言翻译。",["pl6-6","mao-stage","c7"]],
["mz-two-combine","“两个结合”与魂脉根脉",1,"推进马克思主义中国化时代化必须回答如何处理基本原理、中国实际和中华优秀传统文化的关系。","把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合；坚守马克思主义这个魂脉、中华优秀传统文化这个根脉。第二个结合是又一次思想解放，巩固文化主体性。","用于说明党的创新理论何以具有中国特色、文化根基和实践生命力，可联系实事求是、民本思想与人民立场等契合点。","两个结合不是复古崇古，也不是用传统文化取代马克思主义指导；魂脉与根脉不可互换。",["doc-20report","cb-two-combine"],"http://www.12371.cn/2025/01/10/ARTI1736473568068938.shtml"],
["mz-theory-system","马克思主义中国化时代化理论成果及其关系",1,"不同历史时期围绕不同时代课题形成相互贯通又与时俱进的理论成果。","毛泽东思想是马克思主义中国化时代化第一次历史性飞跃的理论成果；中国特色社会主义理论体系包括邓小平理论、“三个代表”重要思想、科学发展观以及习近平新时代中国特色社会主义思想，实现新的飞跃。各成果一脉相承、与时俱进。","答题先辨理论主题和时代，再说明共同的思想路线、人民立场和实践品格；不能把中国特色社会主义理论体系与毛泽东思想简单并列包含。","中国特色社会主义理论体系不包括毛泽东思想；习近平新时代中国特色社会主义思想在“新思想”模块单列深化。",["c7","c15","c19"]]
]);
addFlat("maozhong","毛泽东思想：新民主主义革命理论","教材主干",[
["mz-mao-status","毛泽东思想的形成发展与历史地位",1,"十月革命、世界无产阶级社会主义革命和中国革命实践提供时代与实践条件，党领导人民革命的经验教训推动理论成熟。","大革命时期萌芽，土地革命战争前中期开始形成，土地革命后期和抗战时期趋于成熟，解放战争和新中国成立后继续发展。1945年七大确立为党的指导思想。","毛泽东思想是马克思主义中国化时代化第一次历史性飞跃的理论成果，是中国革命和建设的科学指南，是党和人民宝贵精神财富。","毛泽东思想是被实践证明正确的关于中国革命和建设的理论原则和经验总结，不等于毛泽东个人所有言论，更不包括其晚年错误。",["c7","doc-history2","mao-newdem"]],
["mz-newdem-line","新民主主义革命总路线",1,"近代中国半殖民地半封建社会性质和主要矛盾，决定革命对象、任务、动力、领导与前途。","1948年《在晋绥干部会议上的讲话》完整表述：无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。领导权是中心问题，农民问题是基本问题，城市小资产阶级是可靠同盟者，民族资产阶级具有两面性。","材料题可沿“国情→两对主要矛盾→对象→动力→领导→性质与前途”组织，说明革命为何由无产阶级领导。","革命性质是资产阶级民主革命而不是社会主义革命，但属于世界无产阶级社会主义革命一部分，前途是社会主义。",["mao-jinsui","kw-revolution-core","kw-peasant"]],
["mz-newdem-program","新民主主义基本纲领",1,"革命实践需要把总路线转化为政治、经济、文化建设的具体目标。","政治上建立无产阶级领导、以工农联盟为基础、各革命阶级联合专政的新民主主义共和国；经济上没收封建地主土地归农民、没收官僚资本归新民主主义国家、保护民族工商业；文化上建设民族的科学的大众的文化。","可分别对应《新民主主义论》《目前形势和我们的任务》，用于比较资产阶级共和国方案与社会主义方向。","没收官僚资本具有民主革命和社会主义革命双重性质；保护民族工商业不是保护官僚资本。",["mao-newdem","mao-present"]],
["mz-road","农村包围城市、武装夺取政权道路",1,"敌强我弱且敌人长期占据中心城市，农民占人口绝大多数，政治经济发展不平衡为农村根据地存在提供条件。","在党的领导下，把土地革命、武装斗争和农村革命根据地建设结合起来，实现工农武装割据；红色政权存在有客观条件和主观条件。《星星之火，可以燎原》标志道路理论初步形成。","用于说明中国革命必须立足国情、反对城市中心教条，突出农民主力军和党的领导。","工农武装割据三方面内容不是三大法宝；八七会议只是确定土地革命和武装反抗总方针，道路不是一次会议突然完整提出。",["mao-spark","mao-red","mao-jinggang"]],
["mz-magic","新民主主义革命三大法宝及关系",1,"党总结两次胜利、两次失败经验，需要解决联合谁、怎样斗争和由谁领导的问题。","统一战线、武装斗争、党的建设是三大法宝；统一战线和武装斗争是两个基本武器，统一战线是实行武装斗争的统一战线，党的组织是掌握两个武器的英勇战士。","分析题要把党的领导贯穿统一战线与武装斗争，说明原则坚定性、策略灵活性和独立自主。","三大法宝不是三大作风；武装斗争是中国革命特点和优点之一，但不能离开党的领导和人民支持。",["mao-journal","kw-three-magic"]],
["mz-leadership","无产阶级领导权与革命统一战线",1,"新旧民主主义革命的根本区别是领导阶级不同；民族资产阶级软弱妥协，不能领导革命取得彻底胜利。","无产阶级领导权通过其政党实现，关键是建立以工农联盟为基础的广泛统一战线，坚持独立自主、领导同盟者斗争并给予物质利益和政治教育；对资产阶级又联合又斗争。","用于比较五四前后革命、两次国共合作和党的领导经验，注意领导权不是自然拥有而是在斗争中实现。","统一战线不是放弃独立性；无产阶级领导不等于排斥一切非无产阶级力量参加革命。",["sm-kmt1","rm-wayaobao","kw-united-front"]]
]);
addFlat("maozhong","毛泽东思想：改造与建设探索","教材主干",[
["mz-transition-line","过渡时期总路线与社会主义改造必要性",1,"新中国成立后国营经济领导地位确立、土地改革完成、国内主要矛盾变化，工业化要求与个体分散经济和私人资本主义矛盾显现。","1953年正式提出从中华人民共和国成立到社会主义改造基本完成的过渡时期，总路线是逐步实现社会主义工业化，并逐步实现对农业、手工业和资本主义工商业的社会主义改造，即“一化三改”“一体两翼”。","答题说明工业化与改造相互促进，既解放发展生产力又变革生产关系，为社会主义制度建立创造条件。","过渡时期不是从1953年才开始计算，而是从1949年新中国成立开始；总路线主体是工业化，两翼是三大改造。",["e1953-line","e1956-system"]],
["mz-agriculture","农业、手工业社会主义改造道路",1,"个体小农经济分散脆弱，土改后出现分化风险，工业化要求组织起来并发展集体经济。","农业遵循自愿互利、典型示范、国家帮助原则，经互助组、初级农业生产合作社、高级农业生产合作社逐步过渡；手工业也采取由供销小组到供销合作社再到生产合作社的逐步道路。","用于比较土地改革与农业合作化：前者变地主所有为农民个体所有，后者引导个体经济走向集体经济。","互助组具有社会主义萌芽性质，初级社半社会主义性质，高级社完全社会主义性质；不要把性质顺序倒置。",["e1950-land","e1956-system"]],
["mz-capital-reform","资本主义工商业和平改造",1,"民族资产阶级在过渡时期仍有两面性，国家需要利用资本主义工商业积极作用并限制消极作用。","实行利用、限制、改造政策，以和平赎买方式，采取从初级形式国家资本主义到个别企业公私合营再到全行业公私合营的步骤；把企业改造和人的改造结合。","和平赎买是中国社会主义改造创举，减少震动、团结民族资产阶级并服务工业化。","赎买不是按资本价值一次付清购买；全行业公私合营后企业基本成为社会主义国营性质企业。",["e1956-system"]],
["mz-system1956","社会主义基本制度确立及其意义",1,"1956年农业、手工业和资本主义工商业社会主义改造基本完成，生产资料公有制成为社会经济基础。","社会主义基本制度在我国确立，实现中国历史上最广泛最深刻的社会变革，为当代中国一切发展进步奠定根本政治前提和制度基础，为社会主义建设创造条件。","与1949年新中国成立、1954年宪法和1978年改革开放分别对应“革命胜利—制度确立—宪法保障—新时期开启”。","三大改造完成不等于社会主义已经建成或现代化实现；我国仍处于并将长期处于社会主义初级阶段是后来理论判断。",["e1956-system","c8"]],
["mz-ten-relations","《论十大关系》与建设道路初步探索",1,"苏联模式弊端暴露，中国需要把马克思主义同本国社会主义建设实际进行第二次结合。","1956年《论十大关系》以调动国内外一切积极因素为社会主义事业服务为基本方针，讨论重轻农、沿海内地、经济国防、国家集体个人、中央地方等关系，是开始探索中国自己的社会主义建设道路的标志。","材料涉及统筹兼顾、调动积极性、独立自主探索时，可联系其方针和中共八大的正确探索。","《论十大关系》是探索开始的重要标志，不等于中国特色社会主义理论已经形成；改革开放起点仍是十一届三中全会。",["mao-ten","c8"]],
["mz-contradiction1957","社会主义社会矛盾学说与两类矛盾",1,"社会主义制度建立后，需要回答社会主义社会是否存在矛盾以及如何处理大量人民内部问题。","社会主义社会基本矛盾仍是生产力和生产关系、经济基础和上层建筑的矛盾，但具有非对抗性；严格区分敌我矛盾和人民内部矛盾，人民内部矛盾用民主方法，正确处理人民内部矛盾是国家政治生活主题。","可用于改革依据、社会治理和团结—批评—团结方法，说明不同性质矛盾采用不同方法。","基本矛盾非对抗性不等于不存在矛盾；人民内部矛盾也不能都用强制或行政命令处理。",["mao-contradiction","my-basic-contradiction"]],
["mz-live-soul","毛泽东思想活的灵魂",1,"1981年第二个历史决议在科学评价毛泽东思想时概括其贯穿各方面理论的立场观点方法。","实事求是、群众路线、独立自主是毛泽东思想活的灵魂。实事求是是精髓，群众路线是根本工作路线和生命线，独立自主是立足点；三者相互贯通。","分析中国道路和理论创新可分别写从实际出发、依靠人民、把中国发展放在自己力量基点上。","活的灵魂不是“理论联系实际、密切联系群众、批评和自我批评”三大作风，两组不可混。",["pl11-6","doc-history2","kw-mass-line"]]
]);
addFlat("maozhong","邓小平理论：社会主义与改革开放","教材主干",[
["mz-deng-theme","邓小平理论的形成条件与回答主题",1,"和平与发展成为时代主题，社会主义建设正反经验和改革开放新实践推动理论创新。","邓小平理论围绕“什么是社会主义、怎样建设社会主义”这一首要基本理论问题，在十一届三中全会后逐步形成；十五大确立为党的指导思想。","用于说明中国特色社会主义理论体系开篇之作和改革开放行动指南，2024年纪念讲话称其为马克思主义中国化时代化重要里程碑。","十四大不是正式确立邓小平理论指导地位；十二大提出“建设有中国特色的社会主义”命题。",["c12","c15","ev-deng120"]],
["mz-socialist-essence","社会主义本质论",1,"长期从特征和模式理解社会主义，容易忽视生产力与人民生活水平，需要回答社会主义根本任务和目标。","1992年南方谈话概括：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。体现生产力与生产关系、根本任务与奋斗目标统一。","用于论述发展是第一要务、共同富裕和改革目的，说明贫穷不是社会主义、两极分化也不是社会主义。","共同富裕不是同步同等富裕，也不是不发展生产力先平均分配；社会主义本质不等于某一具体体制模式。",["doc-south","kw-common-prosperity"]],
["mz-primary-stage","社会主义初级阶段理论",1,"我国生产力落后、商品经济不发达，进入社会主义的历史前提决定现代化必须经历长期初级阶段。","社会主义初级阶段包括两层含义：我国已经是社会主义社会，必须坚持而不能离开；我国社会主义还处于初级阶段，必须正视而不能超越。十三大系统阐述这一理论。","是制定路线方针政策的基本依据，说明新时代主要矛盾变化仍未改变基本国情和最大发展中国家国际地位。","初级阶段不是泛指任何国家进入社会主义都会经历，而是特指我国在生产力落后、商品经济不发达条件下建设社会主义必经阶段。",["c13","c19"]],
["mz-basic-line","党在社会主义初级阶段基本路线",1,"初级阶段主要矛盾和历史任务要求明确中心工作、立国之本与强国之路。","领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生、艰苦创业，为把我国建设成为富强民主文明的社会主义现代化国家而奋斗，概括为“一个中心、两个基本点”。","经济建设是中心，四项基本原则是立国之本、政治基石，改革开放是强国之路；三者统一于中国特色社会主义实践。","不能把改革开放与四项基本原则对立，也不能把基本路线中心偷换为阶级斗争或高质量发展。",["c13","kw-reform-key"]],
["mz-reform-opening","改革的性质、作用与对外开放",1,"传统高度集中计划经济体制束缚生产力，封闭不能实现现代化，改革成为社会主义发展的迫切要求。","改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力，也是一场深刻革命；开放也是改革，对外开放是基本国策。改革、发展、稳定要统一，判断改革得失坚持“三个有利于”。","大题可写“改体制机制不改根本制度、解放发展生产力、改善人民生活、在稳定中推进”。","“第二次革命”不意味着改变社会主义方向；三个有利于是是否发展生产力、增强综合国力、提高人民生活水平。",["pl11-3","kw-reform-self","kw-reform-direct"]],
["mz-market","社会主义市场经济理论",1,"传统观念把计划经济和市场经济当作社会基本制度属性，束缚改革深化。","计划和市场都是经济手段，不是社会主义与资本主义本质区别；社会主义也可以搞市场经济。十四大明确建立社会主义市场经济体制改革目标，十四届三中全会构筑基本框架。","用于说明社会主义基本制度与市场经济结合，以及新时代使市场起决定性作用、更好发挥政府作用的理论发展。","1992年南方谈话和十四大贡献不同；十八届三中“决定性作用”不能写成早期“基础性作用”。",["doc-south","c14","pl14-3","pl18-3"]],
["mz-strategy-unity","“三步走”、小康社会与“一国两制”",2,"现代化建设需要阶段性目标，祖国统一需要兼顾历史现实与制度差异。","十三大制定“三步走”：解决温饱、达到小康、到21世纪中叶基本实现现代化；邓小平用“小康社会”描述中国式现代化阶段目标。“一国两制”以一个中国为前提，国家主体坚持社会主义，港澳台保持原有资本主义制度和生活方式长期不变。","用于理解现代化战略历史演进和邓小平理论在统一问题上的创造，不要与新时代两步走混写。","一国是实行两制的前提和基础，两制不是两个中国或一中一台；小康不是现代化强国最终目标。",["c13","e1997-hk","e1999-macau"]]
]);
addFlat("maozhong","“三个代表”与科学发展观","教材主干",[
["mz-three-content","“三个代表”重要思想的核心观点",1,"长期执政、改革开放和市场经济条件下，党需要回答建设什么样的党、怎样建设党。","中国共产党始终代表中国先进生产力的发展要求、先进文化的前进方向、最广大人民的根本利益；关键在坚持与时俱进，核心在坚持党的先进性，本质在坚持执政为民。","用于分析党的性质宗旨、先进性和执政能力建设，把发展生产力、文化建设和人民利益统一起来。","关键、核心、本质三个定位不可互换；不是简单把三个代表理解为三项业务工作。",["doc-three","c16"]],
["mz-three-status","“三个代表”重要思想的历史地位",2,"十三届四中全会以来党的理论和实践深化了对社会主义建设与执政党建设规律的认识。","它是中国特色社会主义理论体系的丰富发展，是加强和改进党的建设、推进社会主义自我完善和发展的强大理论武器，十六大确立为党的指导思想。","答题突出“什么是社会主义、怎样建设社会主义”和“建设什么样的党、怎样建设党”的进一步回答。","2000年提出、2002年十六大确立指导地位，不要把形成时间等同写入党章时间。",["c16","doc-three"]],
["mz-science-connotation","科学发展观的科学内涵",1,"新世纪新阶段发展不平衡、不协调、不可持续问题突出，需要回答实现什么样的发展、怎样发展。","第一要义是发展，核心立场是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。十七大写入党章，十八大确立为党的指导思想。","用于比较新发展理念的历史承接，强调发展为了人民、依靠人民、成果由人民共享以及统筹重大关系。","以人为本不是以个人主义为本，全面协调可持续不等于放慢发展；十七大与十八大地位不同。",["c17","c18","pl16-3"]],
["mz-science-method","科学发展观的实践要求与历史地位",2,"把发展观转化为现代化建设路线，需要统筹城乡、区域、经济社会、人与自然、国内发展和对外开放。","坚持全面协调可持续和统筹兼顾，构建社会主义和谐社会，加快转变经济发展方式，推动经济又好又快发展。科学发展观是中国特色社会主义理论体系接续发展。","材料出现区域协调、城乡统筹、民生与生态，可作为理论源流，但新时代规范表述优先用新发展理念和高质量发展。","不要把科学发展观与2003年提出、2007年写入、2012年确立三个节点混为一谈。",["pl16-3","pl16-6","pl18-5"]]
]);
addFlat("xinthought","总论：历史方位与科学体系","教材主干",[
["xs-form","新时代思想的形成与主要创立者",1,"新时代国内外形势新变化和实践新要求，需要回答新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展等重大时代课题。","习近平新时代中国特色社会主义思想是党和人民实践经验和集体智慧的结晶，习近平同志是主要创立者；十九大确立为党的指导思想并写入党章，2018年载入宪法。","用于说明当代中国马克思主义、二十一世纪马克思主义的理论地位，以及党和国家必须长期坚持的指导思想。","主要创立者与集体智慧并不矛盾；不要把2018年宪法载入与2017年党章确立混为同一程序。",["c19","sm-npc2018"],"http://www.12371.cn/2025/01/10/ARTI1736473568068938.shtml"],
["xs-newera","中国特色社会主义进入新时代及其意义",1,"十八大以来党和国家事业取得历史性成就、发生历史性变革，我国发展站到新的历史起点。","十九大作出中国特色社会主义进入新时代的重大政治判断。新时代是承前启后继往开来、决胜全面小康进而建设现代化强国、全体人民共同富裕、民族复兴、我国日益走近世界舞台中央的时代。","意义可从中华民族、科学社会主义、世界现代化道路三个维度作答：迎来强起来伟大飞跃前景、焕发科学社会主义生机、提供中国方案。","十八大是新时代历史起点，十九大作出重大判断；新时代不等于脱离社会主义初级阶段。",["c18","c19"]],
["xs-contradiction","新时代社会主要矛盾与两个没有变",1,"人民需要层次提升，发展不平衡不充分成为满足人民需要的主要制约因素。","主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。","答题由主要矛盾推出高质量发展和以人民为中心，再由两个没有变说明基本路线和发展阶段不能任意改变。","主要矛盾变化不是基本国情变化，也不意味着主要任务是阶级斗争；不平衡不充分是发展层面问题。",["c19","doc-19report"]],
["xs-two-establish","“两个确立”“四个意识”“四个自信”“两个维护”",1,"新时代伟大实践表明，坚强领导核心和科学理论指导是事业发展的根本保证。","两个确立：确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想指导地位。四个意识：政治、大局、核心、看齐；四个自信：道路、理论、制度、文化；两个维护：维护习近平总书记党中央的核心、全党的核心地位，维护党中央权威和集中统一领导。","政治题注意数字组合的层级：两个确立是重大政治成果和决定性意义，两个维护是最高政治原则和根本政治规矩。","两个确立不等于两个维护，四个自信不包括“道路、理论、文化、法治”等错组。",["doc-history3","cb-two-establish"]],
["xs-system","科学体系：十个明确、十四个坚持、十三方面成就、六个必须坚持",1,"十九大、十九届六中全会和二十大从不同层面概括新时代思想，构成内在贯通的科学体系。","十个明确是核心内容，十四个坚持是基本方略，十三个方面成就展示原创性理念和实践成果，六个必须坚持概括世界观方法论及立场观点方法：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。","选择题先辨“内容、方略、成就、方法论”四种功能；大题方法论必须结合材料，不可只列六条标题。","十个明确不等于十个坚持历史经验；六个必须坚持也不同于二十届三中全会改革六个坚持。",["doc-history3","doc-20report","cb-six-method"],"http://www.12371.cn/2025/01/10/ARTI1736473568068938.shtml"]
]);
addFlat("xinthought","总任务：民族复兴与中国式现代化","教材主干",[
["xs-dream","中国梦的本质与实现路径",1,"近代以来中华民族最伟大的梦想是实现中华民族伟大复兴，新时代把个人梦、民族梦与国家发展相统一。","中国梦本质是国家富强、民族振兴、人民幸福；实现中国梦必须走中国道路、弘扬中国精神、凝聚中国力量，坚持党的领导并靠实干奋斗。","用于个人理想与社会理想、人民幸福与民族复兴关系题，落脚到人民是梦的主体和创造者。","中国梦不是少数人的梦，也不是简单恢复古代盛世；国家、民族与个人相互联系但不能忽视人民幸福。",["doc-20report"]],
["xs-center-task","新时代新征程党的中心任务",1,"第一个百年奋斗目标实现后，党和国家事业进入全面建设社会主义现代化国家新征程。","团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。未来五年是开局起步关键时期，“十五五”是夯实基础、全面发力关键时期。","中心任务、首要任务和第一要务要分开：中心任务是强国复兴，首要任务是高质量发展，第一要务是发展。","不能把中心任务简单写成以经济建设为中心；后者属于社会主义初级阶段基本路线。",["c20","pl20-4","kw-highquality-first"]],
["xs-modern-features","中国式现代化的五个中国特色",1,"中国现代化必须立足人口规模、共同富裕目标、文明协调、资源环境和和平发展道路。","人口规模巨大的现代化、全体人民共同富裕的现代化、物质文明和精神文明相协调的现代化、人与自然和谐共生的现代化、走和平发展道路的现代化。","材料涉及人口、分配、文化、生态、外交时分别对应；五个特征共同说明不是西方现代化翻版。","五个中国特色不是五条重大原则；共同富裕不是所有国家现代化共同特征，和平发展也不是西方式对外扩张道路。",["doc-20report","cb-modern-features"]],
["xs-modern-essence","中国式现代化的本质要求",1,"中国式现代化既有各国现代化共同特征，更有基于国情的本质要求。","坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。","九条可从领导与道路、五位一体、世界意义和文明形态分层记忆；答题按材料选取，不必机械堆满九条。","本质要求不是“五个中国特色”；领导与中国特色社会主义两项不能遗漏。",["doc-20report","cb-modern-essence"]],
["xs-modern-principles","推进中国式现代化的五条重大原则",1,"现代化是前无古人的开创性事业，必须应对风险挑战并保证方向、动力和人民立场。","坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。","可按领导—道路—人民—动力—精神记忆，用于解释如何推进现代化和应对重大考验。","与二十届三中全会进一步全面深化改革“六个坚持”不是同一组；斗争精神不是闭关对抗。",["doc-20report","pl20-3"]],
["xs-strategy2035","现代化战略安排与“十五五”历史方位",1,"十九大作出新时代两步走安排，二十大进一步部署，二十届四中全会和2026年规划把战略转化为阶段任务。","2020—2035年基本实现社会主义现代化；2035年至本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。“十五五”规划期为2026—2030年，是基本实现现代化夯实基础、全面发力的关键时期。","用于时间轴和规划题，强调中央《建议》、国务院编制、全国人大批准《纲要》的程序链。","2035是基本实现现代化，本世纪中叶才是建成强国；二十届四中全会通过《建议》而非《纲要》。",["c19","pl20-4","sm-npc2026"]]
]);
addFlat("xinthought","根本保证：党的领导与人民立场","教材主干",[
["xs-party-lead","党的领导的最本质特征、最大优势与最高政治领导力量",1,"中国特色社会主义制度和事业发展的历史逻辑、理论逻辑、实践逻辑都要求坚持党的全面领导。","中国共产党领导是中国特色社会主义最本质的特征和制度最大优势，党是最高政治领导力量；坚持党中央集中统一领导是最高政治原则。","用于制度优势、改革根本保证、中国式现代化领导和全面从严治党题，落脚到把党的领导贯穿各领域各方面各环节。","人民当家作主是社会主义民主政治本质特征，不能替代“中国特色社会主义最本质特征”的答案。",["kw-party-nature","doc-history3"]],
["xs-people-center","以人民为中心的发展思想",1,"人民性是马克思主义本质属性，党的根基、血脉和力量在人民。","坚持人民主体地位，坚持发展为了人民、发展依靠人民、发展成果由人民共享，把人民对美好生活的向往作为奋斗目标；人民是决定党和国家前途命运的根本力量。","分析民生、改革、民主、共同富裕均可从人民立场、人民主体、人民评价三个层次展开。","以人民为中心不是抽象民粹或单纯福利主义，必须同发展生产力和制度建设结合。",["kw-people-position","kw-people-force"]],
["xs-self-revolution","自我革命与全面从严治党",1,"长期执政面临四大考验、四种危险和大党独有难题，需要跳出治乱兴衰历史周期率。","人民监督是第一个答案，自我革命是第二个答案；以党的政治建设为统领，思想建党和制度治党同向发力，以伟大自我革命引领伟大社会革命。全面从严治党是新时代党的自我革命伟大实践。","党建大题可写根本保证、首要建设、思想基础、制度规范、作风纪律、反腐败和人民立场，不宜只列反腐败。","两个答案相互贯通、不能替代；政治建设是根本性建设，思想建设是基础性建设。",["kw-self-revolution","kw-people-supervision","pl20-5"]]
]);
addFlat("xinthought","经济建设：高质量发展与共同富裕","教材主干",[
["xs-highquality","高质量发展与新发展理念",1,"我国经济已由高速增长阶段转向高质量发展阶段，必须解决发展质量、动力和结构问题。","高质量发展是全面建设社会主义现代化国家首要任务；创新、协调、绿色、开放、共享的新发展理念分别解决动力、不平衡、人与自然和谐、内外联动、公平正义问题。","分析题常用“贯彻新理念—建设现代化经济体系—发展实体经济—科技自立自强—改善民生”的结构。","发展是第一要务，高质量发展是首要任务；新发展理念不是五项彼此孤立的政策。",["pl18-5","kw-highquality-first","kw-highquality-five"]],
["xs-new-pattern","新发展阶段、新发展理念、新发展格局",1,"新发展阶段明确历史方位，新发展理念提供行动先导，新发展格局明确路径选择，三者紧密关联。","构建以国内大循环为主体、国内国际双循环相互促进的新发展格局；关键是经济循环畅通无阻，最本质特征是高水平自立自强，战略基点是扩大内需。","用于说明发挥超大规模市场优势、供给侧结构性改革与扩大内需结合、国内国际两个市场两种资源联动。","国内大循环为主体不是封闭内循环；高水平自立自强也不是关起门来搞建设。",["pl19-5","kw-newpattern-key","kw-newpattern-essence"]],
["xs-market-government","有效市场、有为政府与两个毫不动摇",1,"社会主义基本经济制度要求既发挥市场配置资源效率，又发挥党和政府制度优势。","使市场在资源配置中起决定性作用，更好发挥政府作用；坚持公有制为主体、多种所有制经济共同发展，毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展。","材料涉及营商环境、国企改革、民营经济、宏观调控时，可写统一开放竞争有序市场和公平法治保障。","两个毫不动摇不是一大一小或一重一轻；市场决定性作用不等于政府退出，政府也不能直接干预一切微观活动。",["pl18-3","pl20-4"]],
["xs-sci-talent","教育、科技、人才一体推进",1,"现代化建设需要强化基础性、战略性支撑，突破关键核心技术并形成人才竞争优势。","教育优先发展、科技自立自强、人才引领驱动；科技是第一生产力、人才是第一资源、创新是第一动力，统筹实施科教兴国、人才强国、创新驱动发展战略。","答题可把教育培养人才、人才支撑创新、创新驱动发展串成逻辑链，落脚新质生产力和高质量发展。","三个第一不可调换；教育科技人才不是彼此分离的三个板块，而要一体统筹推进。",["doc-20report","kw-science-first","kw-talent-first"]],
["xs-common-prosperity","共同富裕与分配制度",1,"共同富裕是中国特色社会主义本质要求，是人民群众共同期盼，发展不平衡不充分要求完善分配与公共服务。","共同富裕是全体人民共同富裕，是物质和精神生活都富裕，不是少数人和整齐划一平均主义；坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套制度。","大题可从高质量发展做大蛋糕、制度分好蛋糕、基本公共服务、乡村振兴、精神生活和长期过程展开。","共同富裕不是同步同等富裕，第三次分配不是强制摊派；分配制度是促进共同富裕的基础性制度。",["kw-common-prosperity","kw-distribution-base"]]
]);
addFlat("xinthought","五位一体：政治、文化、社会、生态","教材主干",[
["xs-democracy","全过程人民民主与人民当家作主制度体系",1,"人民民主是社会主义生命，全过程人民民主把选举、协商、决策、管理、监督贯通起来。","全过程人民民主是社会主义民主政治本质属性，是最广泛、最真实、最管用的民主；坚持党的领导、人民当家作主、依法治国有机统一，完善人大、政协、基层自治等制度。","分析民主优势可从主体广泛、内容全面、程序完整、参与持续和治理效能作答，结合协商民主独特优势。","人民当家作主是社会主义民主政治本质特征；协商民主不替代选举民主，政协不是国家权力机关。",["kw-democracy-attribute","kw-consultative-advantage","kw-npc-system"]],
["xs-rule-law","习近平法治思想与全面依法治国",1,"国家治理现代化要求发挥法治固根本、稳预期、利长远作用，在法治轨道上推进改革和现代化。","全面依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家；坚持党的领导、人民当家作主、依法治国统一，推进科学立法、严格执法、公正司法、全民守法。","大题可按方向道路—总目标总抓手—共同推进一体建设—立法执法司法守法—人民权益组织。","法治政府是重点任务和主体工程，法治社会是构筑法治国家基础；党的领导是社会主义法治根本保证。",["pl18-4","kw-law-system","kw-law-soul"]],
["xs-culture","文化自信、意识形态与文化强国",1,"文化关乎国本国运，现代化既需要物质力量也需要精神力量，必须巩固共同思想基础。","坚持马克思主义在意识形态领域指导地位的根本制度，坚定文化自信，秉持开放包容、坚持守正创新；推动中华优秀传统文化创造性转化、创新性发展，建设社会主义文化强国。","文化题可写魂脉根脉、核心价值观、两创、公共文化服务与文化产业、国际传播和意识形态安全。","两创不是原样复古或全盘西化；文化自信不是排斥其他文明，意识形态决定文化前进方向和发展道路。",["kw-cultural-confidence","kw-ideology-direction","mz-two-combine"]],
["xs-core-value","社会主义核心价值观与精神力量",1,"价值多元环境中需要凝魂聚气、强基固本，形成全体人民共同价值追求。","富强、民主、文明、和谐是国家层面价值目标；自由、平等、公正、法治是社会层面价值取向；爱国、敬业、诚信、友善是公民个人层面价值准则。核心价值观是当代中国精神集中体现。","与文化、思修结合时，可答落细落小落实、教育引导、实践养成、制度保障和榜样示范。","三个层面不能互换；核心价值观不是只针对个人道德，也涵盖国家和社会价值追求。",["kw-core-values","kw-core-values"]],
["xs-livelihood","保障改善民生与共同奋斗",1,"人民美好生活需要最直接最现实地体现于就业、教育、医疗、养老、住房和社会保障。","坚持在发展中保障和改善民生，尽力而为、量力而行，健全基本公共服务体系和社会保障体系，实施就业优先战略，推进健康中国建设，增进民生福祉。","答题把发展基础、人民需要、公平可持续、政府市场社会责任结合，避免脱离发展阶段承诺高福利。","增进民生福祉是发展根本目的；尽力而为与量力而行不可只写一面，民生改善不等于福利养懒。",["kw-livelihood-goal","kw-livelihood-base"]],
["xs-governance","社会治理与共建共治共享",1,"社会结构、利益诉求和网络环境变化，要求提高公共安全与基层治理效能。","完善党委领导、政府负责、民主协商、社会协同、公众参与、法治保障、科技支撑的社会治理体系，建设人人有责、人人尽责、人人享有的社会治理共同体，坚持和发展新时代枫桥经验。","材料涉及基层、社区、矛盾化解、网络治理时，从源头预防、多元参与、法治科技、服务群众作答。","共建共治共享不是政府包办，也不是把责任全部下推社会；国家安全和社会稳定相互联系。",["doc-20report"]],
["xs-ecology","习近平生态文明思想与美丽中国",1,"生态环境是关系党的使命宗旨的重大政治问题，也是关系民生的重大社会问题，粗放发展方式不可持续。","坚持人与自然和谐共生，绿水青山就是金山银山，良好生态环境是最普惠民生福祉；山水林田湖草沙一体化保护和系统治理，协同推进降碳、减污、扩绿、增长，积极稳妥推进碳达峰碳中和。","生态题可写生命共同体、绿色发展、系统治理、制度法治、全民行动和全球环境治理，体现生产生活方式转型。","两山论不是不要发展，双碳也不是简单一刀切减排；绿色发展是高质量发展鲜明底色。",["kw-ecology-welfare","kw-nature-internal"]]
]);
addFlat("xinthought","改革、安全、军队、统一与外交","教材主干",[
["xs-reform2024","进一步全面深化改革、推进中国式现代化",1,"改革进入攻坚期深水区，中国式现代化需要破除深层次体制机制障碍和结构性矛盾。","总目标是继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化；以经济体制改革为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点，贯彻六个坚持。","大题可写党的领导、人民立场、守正创新、制度主线、法治轨道、系统观念，并落到2029年完成《决定》任务。","六个坚持不是新时代思想六个必须坚持；2029与2035不可互换。",["pl20-3","doc-reform2024"],"https://www.gov.cn/zhengce/202407/content_6963770.htm"],
["xs-security","总体国家安全观与统筹发展安全",1,"安全是发展的前提，发展是安全的保障；百年变局和各类风险联动要求构建大安全格局。","以人民安全为宗旨、政治安全为根本、经济安全为基础、军事科技文化社会安全为保障、促进国际安全为依托；统筹外部与内部、国土与国民、传统与非传统、自身与共同安全。","答题按风险识别—重点领域—体系能力—基层基础—发展安全良性互动展开，体现底线思维和极限思维。","国家安全是民族复兴根基、现代化行稳致远重要基础，不是普通单项工作；五大要素不可换帽子。",["kw-security-elements","kw-national-root"]],
["xs-army","习近平强军思想与新时代强军目标",1,"强国必须强军，军强才能国安，国际军事竞争和国家安全形势要求推进国防军队现代化。","建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建成世界一流军队；听党指挥是灵魂，能打胜仗是核心，作风优良是保证，坚持党对军队绝对领导。","军队题可联系政治建军、改革强军、科技强军、人才强军、依法治军和战斗力唯一根本标准。","党对军队绝对领导是建军之本强军之魂；全心全意为人民服务是人民军队唯一宗旨。",["kw-army-goal","kw-army-leadership"]],
["xs-one-country","“一国两制”与推进祖国完全统一",1,"解决历史遗留问题和台湾问题，关系国家主权、安全、发展利益和民族复兴。","一国是实行两制的前提和基础，两制从属和派生于一国并统一于一国；坚持中央全面管治权与保障特区高度自治权统一。解决台湾问题坚持一个中国原则和九二共识，推动两岸关系和平发展、融合发展。","答题坚持国家统一、民族复兴和反对分裂干涉，强调香港澳门由治及兴和两岸同胞共同利益。","高度自治不是完全自治或分权，台湾问题是中国内政不是国际问题；和平统一不等于放弃必要措施选项。",["kw-peace-unification","kw-taiwan-task"]],
["xs-shared-future","中国特色大国外交与人类命运共同体",1,"世界百年未有之大变局加速演进，和平发展合作共赢潮流与全球性挑战并存。","推动建设新型国际关系，推动构建人类命运共同体，弘扬和平、发展、公平、正义、民主、自由的全人类共同价值；坚持独立自主和平外交，维护世界和平、促进共同发展。","国际题可从世界变局—中国主张—共同价值—全球治理—合作共赢—中国机遇组织，不把中国发展写成零和扩张。","人类命运共同体不是世界大同或一国主导，新型国际关系核心是互相尊重、公平正义、合作共赢。",["kw-shared-future","kw-diplomacy-purpose"]],
["xs-initiatives","“一带一路”与三大全球倡议",2,"全球发展失衡、安全困境和文明隔阂需要中国提供公共产品和合作方案。","共建一带一路坚持共商共建共享，促进政策沟通、设施联通、贸易畅通、资金融通、民心相通；全球发展倡议、全球安全倡议、全球文明倡议从发展、安全、文明维度推动构建人类命运共同体。","用于国际综合题举例，说明开放包容、互联互通、共同安全和文明互鉴，落脚中国为世界提供机遇。","三大倡议不能与三个第一或其他三组混淆；一带一路不是地缘封闭集团，也不输出社会制度。",["e2013-belt","kw-shared-future"]],
["xs-united-front","新时代爱国统一战线与团结奋斗",1,"强国复兴需要正确处理一致性和多样性关系，团结海内外中华儿女共同奋斗。","统一战线是凝聚人心、汇聚力量的强大法宝；坚持大团结大联合，坚持党的领导，完善大统战工作格局，促进政党、民族、宗教、阶层、海内外同胞关系和谐。","用于制度优势和民族宗教材料，突出共同思想政治基础、照顾同盟者利益、尊重包容差异和争取人心。","新时代统一战线定位与革命三大法宝可交叉，但不能漏掉武装斗争和党的建设的历史组合。",["kw-united-front","kw-three-magic"]]
]);
addFlat("history","上编：近代国情与反侵略斗争","教材主干",[
["sg-modern-society","近代中国社会性质、主要矛盾与历史任务",1,"资本—帝国主义侵略和封建统治使近代中国逐步沦为半殖民地半封建社会，社会结构和经济政治发生深刻变化。","主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，前者是最主要矛盾；两大历史任务是争取民族独立人民解放、实现国家繁荣富强人民共同富裕。","史纲大题的总起点：先写国情和矛盾，再说明各阶级救国方案及中国共产党为何成为历史选择。","两大任务相互区别又紧密联系，前一任务为后一任务创造前提；不能把近代革命对象只写封建主义。",["e1840-opium","mz-newdem-line"]],
["sg-invasion","资本—帝国主义侵略的双重影响",1,"西方列强通过军事侵略、政治控制、经济掠夺和文化渗透改变中国社会，主观目的是把中国变成殖民地和商品资本输出场所。","侵略是近代中国贫困落后的总根源，严重破坏主权独立和社会发展；客观上也促使自然经济解体并传播某些技术制度思想，但不能据此美化侵略。","评价题坚持主客观区分和因果边界，重点答民族危机、社会性质变化和人民反抗，不采用“侵略有功论”。","近代化客观变化不能抵消侵略罪责；中国资本主义产生发展的根本不能简单归功于外来侵略。",["e1840-opium","e1895-maguan"]],
["sg-resistance-fail","反侵略战争失败原因与民族意识觉醒",1,"历次反侵略斗争沉重打击列强并展现民族精神，但清政府腐败、经济技术落后和制度腐朽导致失败。","根本原因是社会制度腐败，重要原因是经济技术落后；失败促使先进中国人开眼看世界，甲午战争后民族危机意识普遍觉醒，救亡图存成为时代主题。","分析原因按“制度根本—技术重要—统治集团妥协—人民斗争意义”展开，避免把失败简单归结为武器落后。","义和团等斗争显示人民力量，但笼统排外和落后组织方式存在局限；人民群众是反侵略重要力量。",["e1895-maguan","fg-lin","fg-wei"]],
["sg-taiping","太平天国农民战争与《天朝田亩制度》",1,"鸦片战争后阶级矛盾和社会危机加深，农民负担沉重，洪秀全领导太平天国运动。","《天朝田亩制度》以解决土地问题为中心，追求有田同耕、有饭同食等绝对平均社会，体现农民反封建愿望但具有空想性；天京事变成为由盛转衰分水岭。","意义是沉重打击清王朝和外国侵略、冲击孔子和儒家经典正统权威；失败说明农民阶级不能单独领导中国革命胜利。","《天朝田亩制度》没有真正实施，平均主义不是科学社会主义；太平天国不是资产阶级革命政党领导。",["fg-hong","doc-taiping"]],
["sg-zizheng","《资政新篇》与农民战争新特点",2,"太平天国后期洪仁玕提出改革方案，试图通过学习西方挽救政权。","《资政新篇》是近代中国第一个比较系统的发展资本主义方案，涉及政治、经济、文化和社会改革，但缺乏实现的社会条件与阶级基础，也未解决农民土地问题。","与《天朝田亩制度》对拍：前者发展资本主义，后者平均土地和社会财富；二者均未真正实施。","《资政新篇》不是太平天国前期纲领，也不是地主阶级洋务派文件。",["fg-hongren","doc-taiping"]],
["sg-yangwu","洋务运动的指导思想、内容与失败",1,"第二次鸦片战争后，清朝统治集团内部洋务派为挽救统治危机，主张学习西方器物技术。","指导思想是中学为体、西学为用，口号自强、求富；兴办近代军用和民用企业、建立新式海陆军、创办新式学堂派遣留学。甲午战争失败标志洋务运动以自强求富为目标基本破产。","客观促进中国早期工业和民族资本主义发展、开启近代教育，但根本目的是维护封建统治，具有封建性、依赖性和腐朽性。","洋务运动不是资产阶级性质改革，也没有触动封建制度根本；“中体西用”不等于全面学习西方制度。",["fg-zhang","e1861-western"]],
["sg-wuxu","戊戌维新的性质、意义与教训",1,"甲午战败后民族危机加深，民族资产阶级初步发展，维新派主张变法图强。","康有为、梁启超、谭嗣同等通过上书、办报、设学会宣传变法，1898年光绪帝推行新政，仅103天失败。它是爱国救亡运动、资产阶级性质政治改良运动和思想启蒙运动。","失败源于民族资产阶级软弱、封建守旧势力强大、脱离人民群众并寄希望于无实权皇帝；说明改良道路难以救中国。","维新派主张君主立宪而非民主共和；不能把戊戌变法与辛亥革命的领导阶级和目标混同。",["fg-kang","fg-liang","fg-tan"]],
["sg-xinhai-program","同盟会与三民主义",1,"资产阶级革命团体发展需要统一政党和纲领，孙中山成立中国同盟会并在《民报》发刊词中概括三民主义。","民族主义即驱除鞑虏恢复中华，民权主义即创立民国，民生主义即平均地权；民权主义是三民主义核心。纲领没有明确彻底反帝，也没有彻底解决农民土地问题。","用于说明辛亥革命的纲领指导和历史局限，并与1924年新三民主义反帝、民权平民共有、节制资本和耕者有其田比较。","旧三民主义不是第一次国共合作政治基础，新三民主义才与中共民主革命纲领基本一致。",["sm-tongmenghui","sm-kmt1","fg-sun"]],
["sg-xinhai-meaning","辛亥革命的历史意义与失败原因",1,"清政府统治危机和民族资本主义发展推动资产阶级革命，1911年武昌起义后清王朝覆灭。","推翻清王朝、结束中国两千多年君主专制制度，建立亚洲第一个共和国，使民主共和观念深入人心，推动思想解放和社会变革，促进民族资本主义发展。","失败根本在于资产阶级共和国方案不适合中国，主观上未提出彻底反帝反封建纲领、未充分发动群众、未建立坚强革命政党和武装。","结束的是君主专制制度，不是两千多年封建制度或半殖民地半封建社会；革命果实被袁世凯窃取。",["e1911","e1912-republic"]],
["sg-old-culture","新文化运动与各种救国方案的比较",1,"辛亥革命后袁世凯尊孔复古和北洋军阀黑暗统治，使先进知识分子认识到必须进行思想文化启蒙。","1915年陈独秀创办《青年杂志》，提倡民主科学，反对专制迷信和旧道德旧文学。前期新文化运动是资产阶级民主主义思想启蒙，存在形式主义看问题和脱离群众等局限。","农民、地主、资产阶级改良派和革命派均未完成救国任务，证明需要新的领导阶级、科学理论和革命道路。","新文化运动不是一开始就以马克思主义为指导；五四后马克思主义传播才逐步成为主流。",["fg-chen","fg-hushi","e1915-culture"]]
]);
addFlat("history","中编：新民主主义革命的历史逻辑","教材主干",[
["sg-may4","五四运动的特点与新民主主义革命开端",1,"巴黎和会外交失败直接引发五四运动，民族危机和北洋军阀统治促成广泛爱国斗争。","青年学生起先锋作用，工人阶级以独立姿态登上政治舞台，运动具有彻底反帝反封建革命性、追求救国真理进步性和各族各界广泛参与群众性，促进马克思主义同工人运动结合。","五四运动是中国旧民主主义革命走向新民主主义革命的转折点，在近代以来中华民族追求民族独立和发展进步历史进程中具有里程碑意义。","五四运动不是中国共产党领导的，也不是党的成立标志；新民主主义革命开端与党成立相差两年。",["e1919","c1"]],
["sg-party-found","中国共产党成立的必然性与伟大意义",1,"马克思列宁主义传播并同中国工人运动结合，工人阶级成长、早期组织建立和共产国际帮助共同促成建党。","1921年中共一大宣告中国共产党成立。中国共产党的成立是开天辟地的大事变，使中国革命有坚强领导核心、科学指导思想和新的革命方法，深刻改变中华民族发展方向和进程。","大题可从“历史和人民选择—领导力量—理论武器—革命面貌—三个深刻改变”组织，并联系伟大建党精神。","党成立不等于立即形成完整民主革命纲领，二大才第一次明确提出反帝反封建民主革命纲领。",["c1","c2","sp-founding"]],
["sg-great-rev","大革命的意义、失败原因与教训",1,"第一次国共合作推动工农运动和北伐战争，形成反对帝国主义和北洋军阀的革命高潮。","大革命基本推翻北洋军阀反动统治，教育锻炼各革命阶级并扩大党的影响。失败客观因反革命力量强大和资产阶级动摇，主观因陈独秀右倾机会主义放弃领导权，党处于幼年缺乏经验。","教训是必须坚持无产阶级领导权、掌握革命武装、加强党的建设并正确处理统一战线中的独立自主。","国民党一大标志合作形成；四一二、七一五反革命政变标志合作破裂，大革命失败不等于土地革命道路已形成。",["sm-kmt1","e1927-fail","rm-87"]],
["sg-land-road","革命新道路探索与“左”倾错误教训",1,"大革命失败后城市起义受挫，党把革命力量转向农村，逐步形成农村包围城市、武装夺取政权道路。","土地革命、武装斗争、根据地建设结合，红军和根据地发展；但王明“左”倾教条主义导致第五次反围剿失败，被迫长征，说明脱离中国实际照搬外国经验危害严重。","答题把实践探索、理论著作、遵义会议转折和实事求是思想路线串联，突出独立自主解决中国问题。","革命道路不是放弃党的领导或只要农民不要工人阶级，而是以农村为重心并由无产阶级领导。",["mao-spark","rm-zunyi","e-longmarch"]],
["sg-zunyi","遵义会议与长征胜利的意义",1,"第五次反围剿失败和长征初期严重损失使党和红军面临生死存亡，需要纠正军事和组织错误。","遵义会议集中解决军事和组织问题，事实上确立毛泽东在党中央和红军领导地位，开始确立正确路线领导地位，是生死攸关转折点；长征胜利宣告围追堵截破产，促进革命新局面。","可联系独立自主、理想信念、顾全大局、依靠群众和长征精神，强调从挫折走向成熟。","遵义会议不是确立毛泽东思想为指导思想，也不是长征胜利结束的时间；1936年三大主力会师标志长征胜利结束。",["rm-zunyi","e1936-longend","sp-longmarch"]],
["sg-anti-front","抗日民族统一战线与两个战场",1,"日本侵华使民族矛盾上升为主要矛盾，中国共产党倡导并推动建立抗日民族统一战线。","瓦窑堡会议确定策略，西安事变和平解决成为时局转换枢纽，1937年9月合作宣言和蒋介石谈话标志第二次合作正式形成。国民党正面战场与共产党敌后战场相互配合，敌后战场逐步成为抗战中流砥柱的重要支撑。","分析全民族抗战要既承认正面战场作用，也突出中共倡导组织推动、全面抗战路线、持久战和敌后根据地。","西安事变和平解决不是第二次合作正式形成；片面抗战路线与全面抗战路线不能混。",["rm-wayaobao","rm-luochuan","e-xian"]],
["sg-yanan","延安整风的内容、方针与意义",1,"党内主观主义、宗派主义和党八股影响马克思主义中国化，需要系统总结历史经验。","反对主观主义以整顿学风、反对宗派主义以整顿党风、反对党八股以整顿文风，最主要任务是反对主观主义；方针是惩前毖后、治病救人，达到既弄清思想又团结同志。","整风确立实事求是思想路线，增强全党团结统一，为七大和抗战、新民主主义革命胜利奠定思想政治基础。","整风不是残酷斗争无情打击；第一个历史决议在六届七中全会原则通过，标志整风胜利结束。",["mao-party","pl6-7","doc-history1"]],
["sg-anti-win","抗日战争胜利原因与历史意义",1,"日本军国主义侵略给中华民族带来深重灾难，中国人民以巨大民族牺牲支撑世界反法西斯东方主战场。","胜利原因包括以爱国主义为核心民族精神、中国共产党中流砥柱作用、全民族众志成城奋勇抗战以及世界反法西斯力量支持。是近代以来中国抗击外敌入侵第一次完全胜利，促进民族觉醒团结，为世界反法西斯胜利作重大贡献。","答题先写决定性因素和关键作用，再写国际条件；意义从民族、党和国家、世界三个维度展开。","九一八是抗战起点，七七是全民族抗战起点；8月15日宣布投降、9月2日签署投降书、9月3日胜利纪念日要区分。",["e1945-victory","mao-protracted"]],
["sg-liberation","解放战争胜利与土地改革的作用",1,"国民党坚持独裁内战，中国共产党争取和平民主并领导人民解放战争，解放区土地改革广泛发动农民。","1947年《中国土地法大纲》废除封建半封建土地制度、实行耕者有其田；土地改革调动农民革命生产积极性，为战争胜利提供人力物力支持。三大战役基本摧毁国民党主要军事力量。","用于说明兵民是胜利之本、政策策略和人心向背，联系人民民主统一战线与土地革命路线。","抗战时期是减租减息，解放战争时期是耕者有其田；不要把两种土地政策跨时期使用。",["doc-land1947","e1948-battles","mao-jinsui"]],
["sg-middle-road","第三条道路幻灭与民主党派历史选择",2,"抗战胜利后部分民主党派主张走英美资产阶级共和国道路，但国民党独裁内战和中国经济政治条件使其难以实现。","民族资产阶级软弱性和帝国主义、封建势力阻碍决定中间路线破产；民主党派逐步接受中国共产党领导，参加新政协和新中国筹建，形成多党合作政治格局。","用于说明资产阶级共和国方案在中国行不通，历史和人民选择中国共产党及新型政党制度。","民主党派不是一开始都接受社会主义道路，其政治选择有历史转变过程；新政协标志新型政党制度确立。",["sm-cppcc1946","sm-cppcc1"]],
["sg-seven-two","七届二中全会与“两个务必”",1,"全国胜利在即，党将由农村走向城市、由革命战争转向国家建设并面临执政考验。","规定党的工作重心由乡村转移到城市，提出全国胜利后政治经济外交政策和两个务必：务必使同志们继续地保持谦虚谨慎、不骄不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。","用于赶考、作风和执政能力材料，与新时代三个务必比较：使命初心、谦虚奋斗、敢于斗争。","两个务必不是三大作风，也不是新时代三个务必的简单缩写；会议地点是西柏坡。",["pl7-2","cb-three-must"]],
["sg-founding","中华人民共和国成立的历史意义",1,"人民解放战争基本胜利、新政协召开和《共同纲领》通过，为新中国建立奠定政治制度基础。","结束半殖民地半封建社会历史，结束少数剥削者统治广大劳动人民历史，结束旧中国一盘散沙局面，废除列强强加不平等条约和帝国主义在华特权，实现民族独立人民解放，标志新民主主义革命基本胜利。","意义可写中国历史新纪元、人民成为国家主人、社会主义发展方向、世界被压迫民族解放和社会主义力量壮大。","1949年不等于社会主义基本制度确立，1956年三大改造基本完成才是制度标志；新民主主义革命仍有遗留任务。",["e1949-found","sm-cppcc1"]]
]);
addFlat("history","下编：社会主义建设、改革开放与新时代","教材主干",[
["sg-transition-necessary","过渡时期总路线的历史必然性",1,"社会主义国营经济力量壮大，土地改革后农村需要避免分化，资本主义工商业与工业化目标矛盾显现，国际环境也影响制度选择。","实现国家工业化需要社会主义改造提供制度条件；个体农业手工业需要合作化，资本主义工商业可通过国家资本主义和平改造；社会主义因素已居于领导地位。","大题从国家工业化、经济结构变化、主要矛盾、国际国内条件和党领导能力论证，不写成主观提前改变社会性质。","总路线是一化三改同时并举，不是先完成工业化再改造；和平改造符合中国具体条件。",["mz-transition-line","e1953-line"]],
["sg-explore","社会主义建设初步探索的成果与经验教训",1,"中共八大、《论十大关系》《关于正确处理人民内部矛盾的问题》等形成正确理论成果，但此后出现大跃进、人民公社化和文化大革命严重曲折。","成果包括正确分析主要矛盾、提出调动积极因素、两类矛盾和四个现代化目标；教训是必须认清基本国情、以经济建设为中心、坚持民主集中制和法治、把马克思主义同实际结合。","评价坚持历史分析，不能把探索时期简单全盘否定，也不能掩盖严重错误；改革开放前后两个时期相互联系又有重大区别。","两个时期不能相互否定；改革开放不是对社会主义制度否定，而是自我完善和发展。",["c8","mao-ten","mao-contradiction","doc-history2"]],
["sg-truth1978","真理标准问题大讨论与伟大历史转折",1,"两个凡是束缚思想，党和国家面临向何处去，实践是检验真理唯一标准讨论推动思想解放。","1978年中央工作会议和十一届三中全会重新确立解放思想实事求是思想路线，把中心工作转向经济建设，作出改革开放决策，实现具有深远意义的伟大转折。","大题可从思想先导、政治路线、工作中心、组织保障、历史意义组织，说明改革开放和现代化建设新时期开启。","1978年不是指导思想拨乱反正基本完成，1981年第二个历史决议才是标志。",["e1978-truth","pl11-3","pl11-6"]],
["sg-reform-history","改革开放的历史地位与成功经验",1,"党和人民基于对社会主义革命建设经验总结、时代潮流和人民期盼作出关键抉择。","改革开放是决定当代中国命运的关键一招，是党和人民事业大踏步赶上时代的重要法宝，是坚持和发展中国特色社会主义的必由之路；根本方向是中国特色社会主义，方法是解放思想实事求是、顶层设计与摸着石头过河结合。","答题从解放生产力、制度自我完善、人民生活、综合国力、国际影响和理论创新展开，兼顾改革发展稳定。","改革开放不是改变社会主义根本制度，也不是只有经济领域单项调整；新时代强调全面系统深化。",["pl11-3","pl18-3","kw-reform-key"]],
["sg-newera-history","新时代历史性成就与历史经验",1,"十八大以来党统揽伟大斗争、伟大工程、伟大事业、伟大梦想，战胜风险挑战并实现第一个百年奋斗目标。","第三个历史决议从十三个方面总结新时代历史性成就和变革，从十个方面概括百年奋斗历史经验：党的领导、人民至上、理论创新、独立自主、中国道路、胸怀天下、开拓创新、敢于斗争、统一战线、自我革命。","大题可用事实成就说明两个确立决定性意义，再把十条历史经验转化为继续推进强国复兴的方法论。","十个坚持历史经验不是十个明确，也不是十四个坚持基本方略；三组数字的功能不同。",["doc-history3","cb-ten-experience"]],
["sg-four-history","“四史”视角下的历史和人民选择",2,"党史、新中国史、改革开放史、社会主义发展史共同揭示中国共产党领导和中国特色社会主义形成发展的历史逻辑。","历史和人民选择中国共产党、马克思主义、社会主义道路、改革开放不是偶然，而是各阶级探索比较、革命建设改革实践和世界社会主义发展共同证明的结果。","综合大题可用旧中国各方案失败—党领导革命成功—社会主义制度确立—改革开放发展—新时代飞跃的时间链作答。","避免只罗列年代而没有因果，也不能把选择理解为一次完成、无需坚持发展；道路理论制度必须随实践完善。",["c1","e1949-found","e1956-system","pl11-3","c18"]]
]);
addFlat("lawmoral","人生观：人生目的、价值与选择","教材主干",[
["sf-life-view","人生观的主要内容与世界观关系",1,"人在社会实践中思考为什么活着、怎样活着和什么样的人生有意义，形成对人生目的、态度和价值的稳定看法。","人生目的回答人为什么活着，人生态度回答人应当怎样活着，人生价值回答什么样的人生才有价值；人生目的决定人生道路、态度和价值选择。世界观决定人生观，人生观又反作用于世界观。","材料题先找人物选择和行动，再分析人生目的、态度、价值，不宜只喊奉献口号。","人生价值是人生观一个方面，不是人生目的；世界观、人生观、价值观相互联系但不能完全等同。",[]],
["sf-person-society","个人与社会、个人利益与社会利益",1,"个人与社会是对立统一关系，社会由个人组成又规定人的生存发展条件。","个人与社会最根本的是个人利益与社会利益关系；社会利益体现社会成员共同长远根本利益，不是个人利益简单相加。个人正当利益应受尊重，必要时个人利益应服从社会整体利益。","用于集体主义、志愿奉献、职业选择和公共责任，强调在服务社会中实现个人发展而非抹杀个性。","集体主义不否认个人正当利益，个人主义也不等于一切个人努力；个人离不开具体历史的社会条件。",["kw-morality-core"]],
["sf-life-value","人生价值的评价与实现",1,"人生价值包括社会价值和自我价值，评价要看实践及其对社会和他人的贡献。","评价人生价值既看贡献大小也看尽力程度，既尊重物质贡献也尊重精神贡献，既看社会价值也看自我完善；实现人生价值要从社会客观条件和个体自身条件出发，在实践中创造。","先进人物题可用“把个人理想融入国家人民事业—立足岗位—增长本领—艰苦奋斗—贡献社会”的结构。","不能只用财富、职位、名气评价人生价值，也不能否定个人正当需要和自我价值。",[]],
["sf-attitude","正确人生态度与顺逆、得失、苦乐观",2,"人生充满矛盾，顺境逆境、得失苦乐相互依存并可在一定条件下转化，需要积极进取和理性平和。","树立认真、务实、乐观、进取的人生态度；正确看待顺境不骄、逆境不馁，得而不喜失而不忧，在奋斗中创造幸福并处理好奋斗与享受关系。","材料出现挫折、平凡岗位、长期积累，可联系矛盾转化和实践奋斗，但不能用思法替代马原原理。","乐观不是盲目回避困难，奋斗也不是只强调个人意志而忽视客观条件。",["my-same-struggle"]],
["sf-wrong-life","反对拜金主义、享乐主义、极端个人主义",2,"错误人生观往往把个人欲望、金钱或眼前享受绝对化，忽视人的社会性和精神追求。","拜金主义把金钱作为衡量一切标准，享乐主义把感官快乐作为人生目的，极端个人主义把个人利益置于社会他人之上；应反对错误观念并树立服务人民奉献社会的人生追求。","用于价值辨析时先指出具体错误及危害，再给正确人生目的和实践路径，避免笼统贴标签。","正当消费、追求幸福和尊重个人利益不等于拜金享乐或极端个人主义，关键看价值尺度和行为边界。",[]]
]);
addFlat("lawmoral","理想信念与中国精神","教材主干",[
["sf-ideal-belief","理想与信念的特征、关系及作用",1,"理想是人们在实践中形成、有实现可能性的对未来社会和自身发展的向往追求；信念是认知情感意志统一形成的坚信不疑并身体力行的精神状态。","理想具有超越性、实践性、时代性，信念具有执着性、支撑性、多样性；理想指引方向，信念提供精神支撑，二者相互依存。理想信念昭示目标、催生动力、提供精神支柱、提高精神境界。","材料题写清科学理想源于实践、指导实践，并经艰苦奋斗把可能转化为现实。","理想不同于空想和幻想，有实现可能性；信念也不等于盲目固执，科学信念以正确认知为基础。",["kw-ideal-calcium"]],
["sf-ideal-social","个人理想与社会理想、远大理想与共同理想",1,"个人理想以社会理想为指引，社会理想通过个人理想体现，二者相互联系、相互影响、相互制约。","坚持个人理想同国家前途民族命运结合，把个人奋斗融入社会理想；共产主义远大理想与中国特色社会主义共同理想是阶段性理想与最终理想关系，必须立足当前脚踏实地。","用于青年成长、职业选择和科技报国题，避免只写个人成功或只喊宏大目标。","社会理想不是个人理想机械相加，个人理想也不能无条件脱离社会需要；反对理想渺茫和急于求成。",["my-ideal-reality","xs-dream"]],
["sf-china-spirit","中国精神：民族精神与时代精神",1,"中国精神是民族精神和时代精神的统一，是凝心聚力的兴国之魂强国之魂。","以爱国主义为核心的民族精神包括伟大创造、伟大奋斗、伟大团结、伟大梦想精神；以改革创新为核心的时代精神体现解放思想、实事求是、与时俱进、求真务实和敢为人先。","材料涉及奋斗团结、科技突破、改革攻坚，可分别联系民族精神与时代精神，并说明二者共同提供精神动力。","民族精神核心是爱国主义，时代精神核心是改革创新；中国精神不只等于某一具体精神。",["kw-china-spirit","sp-founding"]],
["sf-patriotism","爱国主义的基本内涵与新时代要求",1,"爱国主义体现个人对祖国依存关系，是调节个人与祖国关系的道德要求、政治原则和法律规范。","基本要求包括爱祖国大好河山、骨肉同胞、灿烂文化和自己的国家；新时代爱国主义本质是坚持爱国和爱党、爱社会主义高度统一，并维护祖国统一民族团结、增强国家安全意识。","答题把情感、理性、行动统一，联系报国行、强国志和维护国家利益，反对狭隘民族主义。","爱国主义不是只爱自然文化而排斥政治制度，也不是盲目排外；经济全球化条件下仍有国家界限和利益。",["kw-patriotism","xs-security"]],
["sf-reform-innovation","改革创新精神与青年责任",2,"改革是社会发展直接动力，创新是引领发展第一动力，时代进步要求突破陈规、勇于创造。","树立突破陈规、大胆探索、敢于创造的思想观念，培养不甘落后、奋勇争先、追求进步的责任感使命感，增强改革创新能力本领，在实践和学习中勇做改革创新生力军。","青年题可写理想信念—学习本领—问题导向—实践创新—服务人民，避免只谈天赋灵感。","改革创新不是否定一切传统，也不是脱离规律和条件的盲目求新；要与守正、诚信和法治统一。",["kw-innovation-first","my-negation"]],
["sf-loyal-patriot","做新时代忠诚爱国者与维护团结统一",2,"爱国必须落实为行动，面对分裂活动、历史虚无主义和国家安全风险要站稳立场。","坚持一个中国原则，推进祖国统一，促进民族团结，增强国家安全意识和国防观念，尊重和传承中华民族历史文化，立足中国又面向世界。","用于分析理性爱国、维护统一和文化自信，落脚具体学习工作及守法行动。","爱国情感不能成为违法暴力或歧视他人的理由；开放交流与维护国家利益并不矛盾。",["kw-taiwan-task","xs-culture"]]
]);
addFlat("lawmoral","核心价值观与道德建设","教材主干",[
["sf-core-values","社会主义核心价值观的内容与意义",1,"核心价值观承载民族国家精神追求，体现社会评判是非曲直价值标准。","国家层面富强民主文明和谐，社会层面自由平等公正法治，个人层面爱国敬业诚信友善；是当代中国精神集中体现，凝结全体人民共同价值追求，是凝魂聚气强基固本的基础工程。","材料题可从国家、社会、个人三个层面定位，并写教育引导、舆论宣传、文化熏陶、实践养成和制度保障。","三个层面不能随意换组；核心价值观与中华优秀传统文化、人类文明有益成果相联系但不是照搬西方价值。",["kw-core-values","xs-core-value"]],
["sf-values-feature","社会主义核心价值观的显著特征",2,"社会主义核心价值观是在社会主义实践和中华优秀传统文化基础上形成的先进价值理念。","反映人类社会发展进步价值理念、体现社会主义本质属性、扎根中华优秀传统文化土壤并吸纳世界文明有益成果；其真实性体现在真实可信和能够通过制度实践逐步实现。","用于比较中西价值观，强调人民性、先进性、真实性和实践性，避免抽象空谈普世价值。","自由民主等词语并非西方专属，关键在其社会制度基础、主体和实现方式；也不能否认人类共同价值。",["xs-shared-future"]],
["sf-morality-origin","道德的起源、本质与功能",1,"道德是社会意识形态之一，以善恶为评价方式，依靠社会舆论、传统习俗和内心信念维系。","劳动是道德起源首要前提，社会关系是客观条件，人的自我意识是主观条件；道德属于上层建筑，由一定社会经济基础决定并为其服务。具有认识、规范、调节等功能。","用于说明道德随经济关系和历史条件变化、又具有能动反作用，不能把道德看作永恒人性抽象产物。","道德不是由法律直接产生，也不只靠国家强制；经济基础决定作用不否认道德历史继承和相对独立。",["my-social-being"]],
["sf-socialist-morality","社会主义道德的核心、原则与显著特征",1,"社会主义经济基础和人民主体地位决定社会主义道德的价值指向。","为人民服务是社会主义道德核心，集体主义是原则；集体主义强调国家利益、社会整体利益和个人利益辩证统一，重视保障个人正当利益。社会主义道德具有科学性、人民性和实践性。","分析志愿服务、职业道德和公共责任时，可从人民立场、集体利益、个人发展和实践层次作答。","为人民服务不是只对党员干部的少数要求，集体主义也不等于无条件牺牲一切个人利益。",["kw-morality-core","kw-morality-core"]],
["sf-tradition","中华传统美德与创造性转化、创新性发展",2,"中华传统美德是中华传统文化重要组成部分，为道德建设提供丰厚资源，但需结合时代条件鉴别吸收。","重视整体利益强调责任奉献、推崇仁爱原则注重以和为贵、提倡人伦价值重视道德义务、追求精神境界向往理想人格、强调道德修养注重道德践履；要坚持古为今用、推陈出新。","材料涉及家风、诚信、义利观时，可引用传统美德并说明现代转化，而非简单复古。","传统美德与封建糟粕要区分，不能全盘继承或全盘否定；两创不是换包装而是赋予时代内涵。",["xs-culture"]],
["sf-revolution-morality","中国革命道德的形成、内容与当代价值",1,"中国革命道德是马克思主义与中国革命建设改革伟大实践相结合的产物，是共产党人人民军队和人民群众革命奋斗的道德结晶。","主要内容包括为实现社会主义共产主义理想奋斗、全心全意为人民服务、始终把革命利益放在首位、树立社会新风建立新型人际关系、修身自律保持节操。","用于传承红色基因、理想信念、初心使命和道德实践，体现革命精神与社会主义核心价值观贯通。","革命道德不只是战争年代特殊要求，其人民立场和奋斗精神具有当代价值；不能把革命利益理解为否定人民利益。",["sp-founding"]],
["sf-public-morality","社会公德、职业道德与网络道德",2,"公共生活、职业生活和网络空间需要共同规范来维护秩序、促进信任与合作。","社会公德要求文明礼貌、助人为乐、爱护公物、保护环境、遵纪守法；职业道德要求爱岗敬业、诚实守信、办事公道、热情服务、奉献社会；网络生活也要遵守道德法律、保护信息、文明互动。","材料先辨生活领域，再对应规范并提出个人自律、行业规范、制度监管和公共参与。","网络不是道德真空，言论自由不意味着造谣侵权；爱岗敬业不等于无条件忍受违法用工。",[]],
["sf-family-personal","家庭美德与个人品德养成",2,"家庭是社会基本细胞，个人品德是道德建设落脚点，需要把认知转化为稳定行为习惯。","家庭美德包括尊老爱幼、男女平等、夫妻和睦、勤俭持家、邻里互助；个人品德修养要掌握正确方法，学思并重、省察克治、慎独自律、知行合一、积善成德，并向道德模范学习。","青年实践题可写学习—反思—自律—小事—坚持—榜样，强调内化于心外化于行。","慎独不是独处时才讲道德的形式，而是无人监督仍坚守原则；家庭关系也要平等尊重而非封建服从。",[]]
]);
addFlat("lawmoral","法治素养：法律、宪法与法治思维","教材主干",[
["sf-law-nature","法律的含义、历史发展与社会主义法律本质",1,"法律是由国家制定或认可并由国家强制力保证实施的规范体系，反映由特定物质生活条件决定的统治阶级意志。","法律不是从来就有，随私有制、阶级和国家产生；社会主义法律体现党的主张和人民共同意志统一，是科学先进制度重要组成，具有规范和社会作用。","用于理解法律阶级性、物质制约性和历史类型，分析我国法律人民性与党的领导统一。","国家强制力是法律重要保证但不等于每次实施都靠强制；法律不是统治阶级个别成员任性意志简单相加。",["my-basic-contradiction"]],
["sf-constitution","宪法的地位、基本原则与实施",1,"宪法规定国家根本制度和根本任务，是国家法律法规和制度总依据。","宪法是国家根本法、治国安邦总章程、党和人民意志集中体现，具有最高法律地位法律权威法律效力；坚持党的领导、人民主权、尊重保障人权、社会主义法治和民主集中制等原则。","答题围绕依宪治国依宪执政、宪法实施监督、宪法教育和维护宪法权威展开，联系国家宪法日。","宪法不是普通法律总和，也不是基本法；全国人大依法行使修宪权，党中央提出修宪建议。",["doc-1982const","kw-constitution"]],
["sf-legal-thinking","法治思维的含义与人治思维区别",1,"法治思维以法治价值和法治精神为指导，运用法律原则规则方法思考处理问题。","法治思维是正当性、规范性、逻辑性、科学性思维；与人治区别在依据、方式、价值和标准：法律为最高权威而非个人意志，强调一般性规则、民主和权力制约。","案例题先找权力是否受法约束、程序是否正当、权利是否保障，再提出依法解决路径。","法治思维不等于只懂法条，也不排斥道德；领导个人意见不能凌驾宪法法律。",["kw-law-path"]],
["sf-law-authority","尊重维护法律权威与信仰法治",1,"法律权威是法律在社会生活中的作用力影响力和公信力，是法治国家重要条件。","人民权益靠法律保障，法律权威靠人民维护；全体社会成员应信仰法律、遵守法律、服从法律、维护法律，国家机关尤其要依法行使权力并保证公正实施。","用于分析守法、执法公信和法治社会，强调内在认同与外在制度共同作用。","法律权威不是单纯依靠严刑峻法形成，也不意味着法律可以脱离人民权益和公正价值。",["kw-law-society"]],
["sf-right-duty","法律权利与法律义务的关系",1,"法律权利与义务是法律关系内容，体现国家对社会主体行为自由和责任的确认。","二者相互依存、目的手段相互补充、具有复合性；法律面前人人平等，权利义务结构相关但具体主体和情形不必然数量对等。行使权利不得损害国家社会集体和他人合法权益。","案例题同时查权利边界和义务履行，反对只要权利不尽义务，也反对以义务为由非法取消权利。","权利义务一致不等于每个具体权利都有同一主体完全相同的一项义务，更不能理解为可以先享受后补义务。",[]],
["sf-right-exercise","依法行使法律权利与权利救济",2,"公民行使权利要符合法定目的、范围、方式和程序，权利受侵害时通过合法途径救济。","权利行使不得滥用，不得破坏公序良俗和公共利益；救济方式包括司法救济、行政救济、政治救济与社会救济、自力救济等，其中司法救济具有重要终局作用。","材料涉及网络言论、消费者权益、劳动权时，可写合法表达、保存证据、协商调解、仲裁诉讼等有序路径。","自力救济不是任意私刑报复，维权也不能以侵害他人权利为代价；具体程序需依法判断。",[]],
["sf-legal-duty","依法履行法律义务与违法责任",2,"法律义务包括作为和不作为，违反法定义务需承担相应法律责任。","基本义务包括维护国家统一民族团结、遵守宪法法律、维护祖国安全荣誉利益、依法服兵役、依法纳税等；应明确义务内容、履行方式并增强责任意识。","用于国家安全、纳税、网络行为等案例，先识别义务来源再分析责任与合法处理。","道德义务不等于法律义务，未履行道德要求不必然承担法律责任；法律责任也不能由道德舆论任意代替。",["xs-security"]],
["sf-fair-justice","公平正义与权利保障",1,"公平正义是社会主义法治价值追求，要求权利公平、机会公平、规则公平和救济公平。","权利保障包括宪法保障、立法保障、行政保护、司法保障；坚持法律面前人人平等，既保障普遍权利又依法保护特殊群体，推进严格规范公正文明执法和公正司法。","材料题可从规则制定、执行程序、司法救济和实质公平四层展开，兼顾平等与合理差别。","公平不等于绝对平均，合理差别不必然构成歧视；公正司法是维护社会公平正义最后一道防线。",["kw-justice-line","kw-law-sixteen"]],
["sf-rule-system","全面依法治国与国家、社会、个人",1,"全面依法治国是国家治理一场深刻革命，需要国家机关依法履职与全民守法共同推进。","坚持科学立法、严格执法、公正司法、全民守法；坚持法治国家、法治政府、法治社会一体建设，坚持依法治国、依法执政、依法行政共同推进，把法治与德治结合。","大题按党的领导—宪法实施—立法执法司法守法—权利保障—德法兼治组织，个人层面落尊法学法守法用法。","法治与德治不是相互替代，依法治国也不等于只依靠法律部门；法治政府是主体工程、法治社会是基础。",["pl18-4","kw-law-government","kw-law-society"]]
]);
addPerson("马克思主义经典作家",[
["fg-marx",1818,"1818—1883","卡尔·马克思",1,"全世界无产阶级和劳动人民的革命导师，马克思主义主要创始人，马克思主义政党缔造者和国际共产主义开创者，近代以来最伟大的思想家。","创立唯物史观和剩余价值学说，揭示人类社会发展规律与资本主义经济运动规律；把社会主义从空想变为科学，追求无产阶级和人类解放。","两个伟大发现、三个理论来源、《共产党宣言》公开问世、《资本论》剩余价值理论是选择题主线。","《共产党宣言》由马克思、恩格斯共同撰写；马克思主义不是马克思全部著作观点的简单汇编，而是科学理论体系。",[
["1844","与恩格斯在巴黎会见","开始共同战斗和理论合作，随后合著《神圣家族》《德意志意识形态》等。"],["1848","《共产党宣言》发表","标志马克思主义公开问世，系统阐述科学社会主义基本原理。"],["1867","《资本论》第一卷出版","深刻分析商品、货币、资本与剩余价值生产，揭示资本主义经济规律。"],["1871","总结巴黎公社经验","《法兰西内战》发展无产阶级革命和国家学说。"]],["my-origin","bk-manifesto","ev-marx200"],"http://www.12371.cn/special/mksdc200zn/"],
["fg-engels",1820,"1820—1895","弗里德里希·恩格斯",1,"马克思亲密战友，马克思主义共同创立者，为马克思主义创立、发展和传播作出卓越贡献。","与马克思共同创立科学世界观，系统研究自然辩证法、家庭私有制国家起源和社会主义理论；马克思逝世后整理出版《资本论》第二、三卷。","常考与马克思合著、独立著作和整理《资本论》的贡献，不能把恩格斯仅作为辅助人物。","《自然辩证法》不是马克思著作；《反杜林论》系统阐述马克思主义三个组成部分。",[
["1845","《英国工人阶级状况》","考察工业革命与工人阶级状况，为共同创立新世界观提供重要基础。"],["1848","共同发表《共产党宣言》","与马克思共同完成科学社会主义纲领性文献。"],["1878","《反杜林论》出版","系统阐述哲学、政治经济学和科学社会主义，被誉为马克思主义百科全书式著作。"],["1884","《家庭、私有制和国家的起源》","运用唯物史观分析家庭、私有制与国家演进。"]],["bk-anti1878","bk-origin1884","bk-manifesto"]],
["fg-lenin",1870,"1870—1924","弗拉基米尔·伊里奇·列宁",1,"伟大的无产阶级革命家、政治家、理论家，布尔什维克党和苏维埃国家主要创立者，列宁主义创立者。","把马克思主义同俄国实际和帝国主义时代结合，提出一国或数国首先胜利理论、新型无产阶级政党学说和帝国主义理论，发展马克思主义国家与革命学说。","重点掌握《帝国主义是资本主义的最高阶段》《国家与革命》及十月革命对马克思主义传播的推动。","列宁物质定义强调客观实在性；新经济政策不是恢复资本主义制度，而是在苏维埃政权下利用市场商品关系。",[
["1902","《怎么办？》出版","阐述无产阶级政党建设和革命理论重要性。"],["1916","《帝国主义是资本主义的最高阶段》写成","分析垄断、金融资本、资本输出和瓜分世界等帝国主义特征。"],["1917","《国家与革命》与十月革命","发展国家学说，领导建立世界上第一个社会主义国家。"],["1921","实施新经济政策","从俄国国情出发探索向社会主义过渡道路。"]],["bk-imperial1916","bk-state1917","my-matter-motion"]]
]);
addPerson("近代开眼看世界与农民探索",[
["fg-lin",1785,"1785—1850","林则徐",1,"近代中国开眼看世界的第一人之一，坚决维护国家主权和民族利益的爱国官员。","主张严禁鸦片、抵抗侵略，同时了解西方、组织翻译外国资料，支持编成《四洲志》，体现开眼看世界和经世致用思想。","人物题抓虎门销烟、四洲志和开眼看世界；不要把《海国图志》作者写成林则徐。","《四洲志》与《海国图志》不同；林则徐了解西方不等于主张全面学习西方政治制度。",[
["1838","赴广东查禁鸦片","以钦差大臣身份开展禁烟斗争。"],["1839","领导虎门销烟","显示中华民族反抗外来侵略、维护民族尊严的坚定立场。"],["1840前后","组织翻译西方资料","为魏源编《海国图志》提供重要资料基础。"]],["sg-resistance-fail","fg-wei","e1840-opium"]],
["fg-wei",1794,"1794—1857","魏源",1,"近代早期思想家、史学家，开眼看世界思潮的重要代表。","在《四洲志》等基础上编成《海国图志》，系统介绍世界地理历史和西方技术，提出“师夷长技以制夷”，主张学习西方先进技术以抵抗侵略。","“师夷长技以制夷”对应《海国图志》，体现由闭目塞听到主动了解世界，但学习重点仍在器物技术。","不是洋务派“中体西用”的完整理论，也不是维新派君主立宪主张；《海国图志》不是《四洲志》。",[

["fg-hong",1814,"1814—1864","洪秀全",1,"太平天国运动主要领导人，农民阶级反封建反侵略斗争的代表人物。","发动金田起义、建立太平天国，借助拜上帝教组织农民，《天朝田亩制度》反映平均土地和绝对平均社会理想，但无法突破农民阶级局限。","评价要统一反封建反侵略意义、农民战争高峰与宗教色彩、绝对平均和政权蜕化等局限。","《资政新篇》主要由洪仁玕提出，不是洪秀全的代表著作；天京事变是由盛转衰分水岭。",[
["1851","发动金田起义","建号太平天国，揭开农民战争序幕。"],["1853","定都天京并颁布《天朝田亩制度》","形成与清政府对峙政权，提出平均分配土地设想。"],["1856","天京事变","领导集团内讧使太平天国由盛转衰。"],["1864","天京陷落前后运动失败","说明旧式农民战争不能独立完成救国任务。"]],["sg-taiping","doc-taiping"]],
["fg-hongren",1822,"1822—1864","洪仁玕",2,"太平天国后期领导人之一，近代较早提出系统发展资本主义设想的思想家。","提出《资政新篇》，主张学习西方政治、经济、文化和科技，发展近代工商业，是先进中国人最早提出的发展资本主义方案之一，但未解决农民土地问题。","常考《资政新篇》与《天朝田亩制度》对照，体现太平天国农民战争的新特点。","《资政新篇》缺乏实施条件且未真正实行，不能说太平天国已建立资本主义制度。",[
["1859","到达天京并受封干王","参与太平天国后期朝政。"],["1859","提出《资政新篇》","系统阐述发展资本主义改革方案。"],["1864","太平天国失败","方案因战争环境、阶级局限等未能实施。"]],["sg-zizheng","fg-hong"]]
]);
addPerson("地主阶级改良与资产阶级探索",[
["fg-zhang",1837,"1837—1909","张之洞",2,"晚清洋务派重要代表，主张在维护封建纲常制度前提下学习西方技术。","在《劝学篇》中系统阐发“中学为体，西学为用”，兴办近代工业、教育和交通事业，体现洋务派自强求富与维护封建统治的双重性。","张之洞与中体西用、汉阳铁厂、湖北新式教育常相连；不要误作资产阶级维新派。","中体西用不是学习西方资本主义政治制度，洋务企业近代化也不等于政治制度近代化。",[
["19世纪60—90年代","兴办洋务事业","创办汉阳铁厂、湖北织布局等，推动近代工业教育发展。"],["1898","撰《劝学篇》","系统表述中学为体、西学为用。"],["甲午战争后","洋务自强目标破产","证明仅学器物而不改革腐朽制度不能救中国。"]],["sg-yangwu","e1861-western"]],
["fg-kang",1858,"1858—1927","康有为",1,"资产阶级维新派主要代表，戊戌变法重要领导者。","以《新学伪经考》《孔子改制考》为变法提供理论依据，借托古改制宣传资产阶级改良思想；主张君主立宪、发展资本主义，组织公车上书并推动百日维新。","其思想反映民族资产阶级救亡和改良要求，也体现借助儒家权威、脱离群众的局限。","《孔子改制考》不是梁启超作品；康有为后来坚持保皇，与资产阶级革命派民主共和道路不同。",[
["1895","参与领导公车上书","反对议和，请求变法，推动维新思潮发展为政治运动。"],["1898","推动戊戌变法","通过光绪帝推行政治经济文化教育新政。"],["变法失败后","流亡海外并坚持保皇立宪","与革命派围绕改良和革命展开论战。"]],["sg-wuxu","fg-liang","fg-tan"]],
["fg-liang",1873,"1873—1929","梁启超",1,"资产阶级维新派代表、启蒙思想家和宣传家，戊戌变法重要人物。","通过《时务报》等宣传变法维新，《变法通议》系统论述变法必要性；后提出新民说，强调改造国民性、培养现代公民意识。","掌握报刊启蒙、变法通议和新民思想，理解维新派在思想启蒙方面的作用。","《天演论》是严复译述，《革命军》是邹容著作，不要因同属近代思想家而混配。",[
["1896","主笔《时务报》","发表《变法通议》等文章，扩大维新思想影响。"],["1898","参加戊戌变法","协助宣传和组织维新活动。"],["20世纪初","提出新民说","关注国民素质、公德与现代国家建设。"]],["sg-wuxu","fg-kang"]],
["fg-tan",1865,"1865—1898","谭嗣同",1,"戊戌维新运动激进代表和为变法献身的爱国志士。","著《仁学》批判封建纲常名教，主张冲破君主专制和伦理束缚，参与变法新政；变法失败后拒绝出走，以死唤起国人觉醒。","常考《仁学》、戊戌六君子和变法失败的悲壮意义，注意与康有为托古改制方式的区别。","谭嗣同不是辛亥革命烈士，其牺牲发生于1898年戊戌政变。",[
["1897—1898","参与湖南维新活动","创办时务学堂、南学会等，推动地方新政。"],["1898","入京参与变法","任军机章京，参与新政事务。"],["1898.9","戊戌政变后就义","为戊戌六君子之一，体现救亡担当。"]],["sg-wuxu","fg-kang"]],
["fg-yan",1854,"1854—1921","严复",1,"近代著名启蒙思想家、翻译家，系统介绍西方社会科学的重要代表。","译述《天演论》，以“物竞天择、适者生存”激发救亡图存意识；翻译《原富》《法意》《群己权界论》等，宣传西方资产阶级政治经济思想。","严复的定位重在系统译介西学和启蒙，不仅是介绍器物技术；但也不能把社会进化论机械当作科学历史观。","《天演论》是严复译述赫胥黎著作，不是严复原创生物学著作，也不是达尔文《物种起源》全译本。",[
["1895后","发表政论并译介西学","在民族危机中宣传变法维新和救亡图存。"],["1898","《天演论》正式出版","产生广泛思想启蒙影响。"],["其后","翻译多部西方社会科学名著","推动近代中国认识西方政治经济制度。"]],["sg-wuxu","sg-old-culture"]],
["fg-sun",1866,"1866—1925","孙中山",1,"伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱。","创立兴中会、同盟会，提出三民主义，领导辛亥革命；晚年重新解释三民主义，确立联俄联共扶助农工政策，推动第一次国共合作。","评价其振兴中华、天下为公、维护统一和愈挫愈奋精神，同时分析旧三民主义反帝和土地纲领局限。","旧三民主义不是第一次国共合作政治基础；1924年新三民主义与中共民主革命纲领基本一致。",[
["1894","创立兴中会","提出振兴中华，开始资产阶级革命实践。"],["1905","成立中国同盟会并提出三民主义","建立近代中国第一个统一资产阶级革命政党。"],["1911—1912","领导辛亥革命并任临时大总统","推翻清王朝、结束君主专制，建立中华民国。"],["1924","主持召开国民党一大","重新解释三民主义，推动国共合作和国民革命。"]],["sm-tongmenghui","sm-kmt1","ev-sun150"],"https://news.12371.cn/2016/11/11/VIDE1478865001658454.shtml"]
]);
addPerson("资产阶级革命宣传家",[
["fg-zhangtaiyan",1869,"1869—1936","章太炎（章炳麟）",2,"资产阶级革命派思想家和宣传家，积极批驳保皇改良主张。","《驳康有为论革命书》直指光绪皇帝和保皇论调，论证革命必要，强调用革命手段推翻清王朝，具有鲜明民主革命色彩。","革命派与改良派论战主要围绕要不要革命、要不要民主共和、要不要社会革命，人物著作常作选择题。","《驳康有为论革命书》不是陈天华作品；章太炎不等于同盟会唯一创立者。",[
["1903","发表《驳康有为论革命书》","批驳保皇主张，产生广泛革命宣传影响。"],["1903","因苏报案入狱","反映清政府对革命舆论的镇压。"],["其后","参加革命和国学研究","革命思想与民族主义学术相互交织。"]],["fg-sun","sg-xinhai-program"]],
["fg-zou",1885,"1885—1905","邹容",2,"青年资产阶级革命宣传家，以通俗激烈文字宣传反清革命。","著《革命军》，号召推翻清朝统治、建立中华共和国，讴歌革命并宣传天赋人权、自由平等思想，是辛亥革命前重要革命读物。","《革命军》与《警世钟》《猛回头》《驳康有为论革命书》经常混配，要按作者记忆。","邹容著《革命军》，陈天华著《警世钟》《猛回头》，不能互换。",[
["1903","出版《革命军》","系统宣传反清革命和建立共和国主张。"],["1903","苏报案被捕入狱","章太炎、邹容因革命宣传遭清政府迫害。"],["1905","病逝狱中","其革命著作继续推动民主革命思想传播。"]],["fg-zhangtaiyan","fg-chentianhua"]],
["fg-chentianhua",1875,"1875—1905","陈天华",2,"资产阶级民主革命宣传家，以通俗白话唤醒民众救亡意识。","著《警世钟》《猛回头》，揭露帝国主义侵略和清政府卖国，号召反帝反清、救亡图存，语言通俗、感染力强。","人物题重在革命宣传与民族危机，不要把他写成《革命军》作者。","《警世钟》《猛回头》均属陈天华；《天朝田亩制度》和《资政新篇》属于太平天国。",[
["1903","发表《警世钟》《猛回头》","广泛传播反帝反清革命思想。"],["1905","参与同盟会革命活动","支持统一资产阶级革命政党和革命纲领。"],["1905","去世","其著作继续激发民众救亡意识。"]],["fg-zou","sm-tongmenghui"]]

addPerson("新文化运动与建党先驱",[
["fg-chen",1879,"1879—1942","陈独秀",1,"新文化运动主要倡导者、五四运动重要领导人、中国共产党主要创始人之一和早期主要领导人。","1915年创办《青年杂志》，高举民主与科学旗帜，批判封建专制、旧道德和旧文学；后接受马克思主义并参与创建中国共产党。大革命后期犯有右倾机会主义错误。","评价要分阶段，既肯定思想启蒙和建党贡献，也认识其在大革命中放弃革命领导权的错误及历史教训。","《青年杂志》后改名《新青年》；陈独秀不是《我的马克思主义观》作者，也不能把其一生简单全盘肯定或否定。",[
["1915","创办《青年杂志》","标志新文化运动兴起，后更名《新青年》。"],["1920","参与建立上海共产党早期组织","推动马克思主义传播和建党准备。"],["1921","出席党内早期领导工作","中共一大后任中央局书记，成为早期主要领导人。"],["1927","大革命失败中的右倾错误","放弃革命领导权的教训推动党探索独立领导革命。"]],["sg-old-culture","c1","sg-great-rev"]],
["fg-lidazhao",1889,"1889—1927","李大钊",1,"中国共产主义运动先驱、伟大马克思主义者、杰出无产阶级革命家、中国共产党主要创始人之一。","在中国率先举起马克思主义旗帜，发表《法俄革命之比较观》《庶民的胜利》《Bolshevism的胜利》《我的马克思主义观》等，推动马克思主义同工人运动结合。","“南陈北李，相约建党”；重点辨李大钊传播马克思主义的著作与陈独秀创办《新青年》的不同贡献。","《我的马克思主义观》系统介绍马克思主义，不是毛泽东著作；李大钊不是《共产党宣言》首个中文全译本译者。",[
["1918","发表多篇介绍十月革命文章","热情讴歌十月革命，预见世界革命潮流。"],["1919","发表《我的马克思主义观》","较系统介绍唯物史观、政治经济学和科学社会主义。"],["1920","参与建立北京共产党早期组织","推动北方工人运动和马克思主义传播。"],["1927","英勇就义","坚定共产主义信仰和革命气节。"]],["fg-chen","fg-chenwangdao","c1"]],
["fg-cai",1868,"1868—1940","蔡元培",2,"近代著名教育家、革命家，北京大学改革的重要推动者。","任北京大学校长期间倡导思想自由、兼容并包，支持新文化传播和学术研究，推动中国现代大学制度建设；重视美育和人格教育。","人物题常与北大、新文化运动阵地、兼容并包相联，不宜把其教育主张等同马克思主义指导思想。","兼容并包不是没有价值立场的思想放任，而是在学术教育和人才培养中兼收并蓄。",[
["1917","出任北京大学校长","推行教育和学术改革，延揽陈独秀、胡适、李大钊等。"],["新文化运动时期","支持北大成为重要阵地","促进新思想传播和学术自由。"],["其后","推动教育、美育与学术研究","对近代中国教育制度产生深远影响。"]],["fg-chen","fg-hushi","sg-old-culture"]],
["fg-hushi",1891,"1891—1962","胡适",2,"新文化运动重要人物、文学革命倡导者，在白话文和学术方法方面影响显著。","发表《文学改良刍议》，主张以白话文代替文言文，提倡文学改良和国语运动；宣传实验主义，强调多研究些问题、少谈些主义。","既要看到文学革命和启蒙贡献，也要理解其资产阶级改良主义立场与马克思主义传播之间的分歧。","《文学改良刍议》不是陈独秀《文学革命论》；胡适不是中国共产党创始人。",[
["1917","发表《文学改良刍议》","推动文学革命和白话文发展。"],["新文化运动时期","参与《新青年》活动","倡导科学方法和个性解放。"],["1919前后","问题与主义之争","反映不同救国思想道路的分歧。"]],["sg-old-culture","fg-chen"]],
["fg-chenwangdao",1891,"1891—1977","陈望道",1,"《共产党宣言》首个中文全译本译者，早期马克思主义传播者和语言教育家。","1920年翻译出版《共产党宣言》中文全译本，为先进知识分子系统学习马克思主义提供重要文本；真理的味道非常甜的故事体现对真理的专注追求。","掌握首个中文全译本、时间1920年及建党思想准备作用，不要与李大钊传播著作混淆。","陈望道不是《共产党宣言》原作者，也不是《我的马克思主义观》作者。",[
["1920","翻译《共产党宣言》","在故乡柴屋专注翻译，留下真理味道非常甜的佳话。"],["1920.8","首个中文全译本出版","促进马克思主义在中国传播和党的创建。"],["其后","从事教育、语言和学术工作","继续推动文化教育事业。"]],["bk-manifesto","fg-lidazhao","c1"]],
["fg-caihe",1895,"1895—1931","蔡和森",2,"中国共产党早期重要领导人、马克思主义理论宣传家，系统提出建党主张的重要先驱。","留法勤工俭学期间研究马克思主义，1920年在给毛泽东信中明确提出组织中国共产党，并主张无产阶级专政和国际主义；后参与党中央领导与宣传工作。","高频是“第一个明确提出中国共产党名称的人之一”和《向导》周报，避免与党的一大正式定名相混。","蔡和森提出建党主张不等于中共一大已召开；陈独秀、李大钊与蔡和森贡献角度不同。",[
["1918","参与组织新民学会","与毛泽东等探索改造中国与世界道路。"],["1920","留法期间致信毛泽东","明确提出建立中国共产党及建党思想。"],["1922后","参与党中央工作和主编《向导》","宣传党的纲领和反帝反封建主张。"],["1931","英勇牺牲","为革命事业献出生命。"]],["c1","c2","fg-lidazhao"]]
]);
addPerson("中国共产党主要领导人",[
["fg-maozedong",1893,"1893—1976","毛泽东",1,"伟大的马克思主义者，伟大的无产阶级革命家、战略家、理论家，马克思主义中国化伟大开拓者，中国社会主义现代化建设事业伟大奠基者。","把马克思主义基本原理同中国具体实际结合，创立农村包围城市道路，系统形成新民主主义理论，领导建立新中国和社会主义基本制度；实事求是、群众路线、独立自主是毛泽东思想活的灵魂。","130周年讲话新增和强化“马克思主义中国化伟大开拓者、中国社会主义现代化建设事业伟大奠基者”等定位，须与七大和历史决议区分。","毛泽东思想不等于毛泽东个人所有言论；遵义会议、七大和第二个历史决议分别解决领导地位、指导思想和科学评价。",[

["fg-liu",1898,"1898—1969","刘少奇",1,"伟大的马克思主义者，伟大的无产阶级革命家、政治家、理论家，党和国家主要领导人之一，中华人民共和国开国元勋。","在工人运动、白区工作、党的建设和社会主义建设中建立卓著功勋；《论共产党员的修养》系统论述党员党性修养，强调理论学习和实践锻炼。","120周年讲话强调不忘初心对党忠诚、坚持真理实事求是、敢于担当勇于创造、勤于学习知行合一、心系人民廉洁奉公。","《论共产党员的修养》不是周恩来著作；刘少奇在党的七大作修改党章报告，与毛泽东政治报告不同。",[

["fg-zhu",1886,"1886—1976","朱德",1,"伟大的马克思主义者，伟大的无产阶级革命家、政治家、军事家，中国人民解放军主要缔造者之一，中华人民共和国开国元勋。","参与领导南昌起义、湘南起义和井冈山会师，长期担任人民军队主要领导人，为人民军队建设、革命战争胜利和国防现代化作出卓越贡献。","人物题抓人民军队缔造者、井冈山会师、红军和八路军总司令，突出忠于党和人民、实事求是、艰苦朴素。","三湾改编和古田会议不是朱德个人完成；井冈山会师也不能替代党对军队绝对领导的制度原则。",[

["fg-deng",1904,"1904—1997","邓小平",1,"全党全军全国各族人民公认的享有崇高威望的卓越领导人，党的第二代中央领导集体核心，改革开放和现代化建设总设计师，中国特色社会主义道路开创者，邓小平理论主要创立者。","回答什么是社会主义、怎样建设社会主义，提出社会主义本质、初级阶段、基本路线、改革开放、社会主义市场经济和一国两制等重要思想；精髓是解放思想、实事求是。","2024年120周年讲话强调其历史功勋全方位开创性，邓小平理论是马克思主义中国化时代化重要里程碑、中国特色社会主义理论体系奠基之作。","十二大提出中国特色社会主义命题，十五大确立邓小平理论指导地位；改革开放伟大转折不是南方谈话才开启。",[

["fg-chenyun",1905,"1905—1995","陈云",1,"伟大的无产阶级革命家、政治家，杰出的马克思主义者，中国社会主义经济建设开创者和奠基人之一，党和国家久经考验的卓越领导人。","提出三个主体三个补充，重视综合平衡、按比例发展和调查研究；总结“不唯上、不唯书、只唯实，交换、比较、反复”十五字诀，体现实事求是思想方法。","2025年120周年讲话概括学习崇高精神风范、丰富领导经验、科学思想方法和工作方法，是最新人物评价高频点。","三个主体三个补充不是社会主义市场经济体制；十五字诀不能只背前九字而漏交换比较反复。",[

addPerson("新时代思想与先锋模范",[
["fg-xi",1953,"1953—","习近平",1,"中国共产党中央委员会总书记、国家主席、中央军委主席，习近平新时代中国特色社会主义思想主要创立者。","围绕新时代坚持和发展中国特色社会主义提出一系列原创性治国理政新理念新思想新战略，系统阐述中国式现代化、两个结合、新发展理念、全过程人民民主、人类命运共同体和党的自我革命等。","重点掌握主要创立者定位、两个确立、新时代思想科学体系和新时代历史性成就，避免把集体智慧结晶与主要创立者对立。","十九大确立新时代思想为党的指导思想，2018年载入宪法；十个明确、十四个坚持、十三方面成就和六个必须坚持功能不同。",[
