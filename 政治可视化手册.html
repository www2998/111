addFlat("question","主要形式（14条）","主要形式",[
["qt-form-value","价值规律发生作用的表现形式",1,"马原政治经济学｜题干常问“价值规律的表现形式是什么”，不是问基本内容。","价格围绕价值自发波动，是价值规律发生作用的表现形式；商品价值量由社会必要劳动时间决定、交换以价值量为基础实行等价交换，是价值规律的基本内容。","用“内容管决定和交换，形式管价格波动”对拍；平均利润形成后，市场价格围绕生产价格波动。","供求影响价格但不决定价值；价格波动不是对价值规律的否定。",["my-value-law","my-profit"]],
["qt-form-wage","资本主义工资的主要形式",2,"马原政治经济学｜工资本质与工资形式常混合设问。","资本主义工资主要有计时工资和计件工资两种形式；其本质是劳动力的价值或价格，不是劳动的价值或价格。","先答本质再辨形式：计时按劳动时间，计件按产品数量，二者都不改变对剩余劳动的占有。","“劳动的价值或价格”是工资造成的假象；不能把工资说成工人全部劳动的报酬。",["my-surplus-process"]],
["qt-form-monopoly","垄断组织的主要形式",1,"马原垄断资本主义｜问稳定、常见的垄断组织形式。","常见形式包括卡特尔、辛迪加、托拉斯、康采恩。卡特尔侧重销售或采购等协定，辛迪加统一购销，托拉斯把相关企业合并为统一企业，康采恩是跨部门大企业联合。","选择题主要认名称和组织程度，不要求把某一形式机械对应唯一国家；当代垄断组织形式还会发展变化。","垄断组织形式不等于国家垄断资本主义形式，也不等于金融资本统治方式。",[],"https://xgszb.xatu.edu.cn/info/12337/120618_1.htm"],
["qt-form-state-monopoly","国家垄断资本主义的主要形式",1,"马原垄断资本主义｜国家与垄断资本结合的不同方式。","教材常按五方面归纳：国家所有并直接经营企业；国家与私人共有、合营企业；国家通过多种形式参与私人垄断资本再生产过程；宏观调节；微观规制。","前三方面侧重国家和私人资本的结合及再生产参与，后两方面侧重国家调节和规制；不同资料拆分项目略有差异，以教材层次作答。","不要把卡特尔等私人垄断组织形式填到这里；也不要把财政政策、反托拉斯法上升为与国家垄断资本主义并列的形式。",[],"https://xgszb.xatu.edu.cn/info/12750/120707_4.htm"],
["qt-form-surplus","剩余价值生产的基本方法",1,"马原政治经济学｜“两种基本方法”与“超额剩余价值”高频辨析。","绝对剩余价值生产和相对剩余价值生产是资本家提高剥削程度的两种基本方法；超额剩余价值是个别企业提高劳动生产率形成的暂时差额。","绝对方法看工作日或劳动强度，相对方法看全社会劳动生产率提高和必要劳动时间缩短。","超额剩余价值不是与二者并列的第三种基本方法；相对剩余价值也不是单个企业永久独占。",["my-surplus-methods"]],
["qt-form-revolution","中国革命的主要形式",1,"毛中特新民主主义革命理论｜中国革命道路中三个固定定位之一。","武装斗争是中国革命的主要形式；土地革命是民主革命的基本内容，农村革命根据地是中国革命的战略阵地，是进行武装斗争和开展土地革命的依托。","背成“土地革命—基本内容；武装斗争—主要形式；农村根据地—战略阵地和依托”，三项不可换位。","主要形式不是唯一形式；中国革命还需要其他斗争形式配合，武装斗争也必须在党的领导下进行。",["mz-magic","mz-newdem-line"],"https://xgszb.xatu.edu.cn/info/12662/120418.htm"],
["qt-form-agri","农业社会主义改造的具体形式",1,"毛中特社会主义改造理论｜由低到高的互助合作道路。","互助组、初级农业生产合作社、高级农业生产合作社，是由社会主义萌芽到半社会主义再到完全社会主义的逐步过渡形式。","用“组—初社—高社”记顺序，同时联系自愿互利、典型示范、国家帮助原则。","土改后的农民土地所有制不是高级社；人民公社不属于三大改造中农业改造的三步形式。",["e1956-system"]],
["qt-form-handicraft","手工业社会主义改造的具体形式",2,"毛中特社会主义改造理论｜与农业改造步骤相似但名称不同。","手工业生产小组、手工业供销合作社、手工业生产合作社，是由小到大、由低级到高级的过渡形式。","抓“生产小组—供销合作社—生产合作社”，不要直接照搬农业的互助组、初级社、高级社名称。","供销合作社不等于农业生产合作社；手工业改造目标也是社会主义集体所有制。",["e1956-system"]],
["qt-form-capitalist","资本主义工商业社会主义改造的形式",1,"毛中特社会主义改造理论｜和平赎买通过国家资本主义逐步实现。","实行从初级形式到高级形式的国家资本主义：初级形式包括加工订货、统购包销、经销代销等；高级形式是个别企业公私合营和全行业公私合营。","记“初级国家资本主义→个别合营→全行业合营”，并把和平赎买与四马分肥、定息联系起来。","和平赎买是政策，国家资本主义是改造形式；全行业公私合营基本完成标志资本主义工商业改造基本完成。",["e1956-system"]],
["qt-form-democracy","中国社会主义民主的两种重要形式",1,"新思想政治建设｜选举和协商共同体现人民当家作主。","人民通过选举、投票行使权利，同人民内部各方面在重大决策之前进行充分协商，尽可能就共同性问题取得一致意见，是中国社会主义民主的两种重要形式。","可简称选举民主和协商民主，但答题要把“选举投票＋决策前充分协商”完整写出。","协商民主不替代选举民主；人民政协是协商民主重要渠道和专门协商机构，不是国家权力机关。",["xs-democracy"],"https://www.gov.cn/xinwen/2014-09/21/content_2753772.htm"],
["qt-form-consultation","社会主义协商民主的主要渠道",2,"新思想政治建设｜问“协商民主有哪些渠道”，不是只答政党协商或政协协商。","包括政党协商、人大协商、政府协商、政协协商、人民团体协商、基层协商、社会组织协商；要统筹推进各类协商渠道。","七类协商按主体和领域识别；人民政协是重要渠道和专门协商机构，但不是全部协商民主。","不要把政党协商与政协协商合并漏项，也不要把政协说成统一战线组织以外的国家机关。",["xs-democracy"]],
["qt-form-nonpublic","非公有制经济的主要形式",2,"毛中特与新思想经济建设｜基本经济制度中的所有制成分识别。","非公有制经济主要包括个体经济、私营经济、外资经济等；公有制为主体、多种所有制经济共同发展是社会主义初级阶段基本经济制度的重要内容。","看到个体工商户、私营企业、外商投资企业可对应非公有制经济，并联系“两个毫不动摇”。","非公有制经济是社会主义市场经济的重要组成部分，不等于社会主义经济的主体；混合所有制经济不能整体简单判为公有或非公有。",["xs-new-pattern"]],
["qt-form-morality","道德维系和发挥作用的主要方式",1,"思法道德总论｜道德与法律的强制方式不同。","道德以善恶为评价方式，主要依靠社会舆论、传统习俗和内心信念来维系；法律则由国家制定或认可并依靠国家强制力保证实施。","用“舆论—习俗—信念”识别德治的软性约束，再与国家强制对拍。","道德并非没有任何约束力，但其约束不主要依赖国家强制；法律实施也需要教育和社会认同。",["sf-morality-origin"]],
["qt-form-law-roles","法律规范作用的主要表现",1,"思法法治总论｜法律作用的五种类型。","法律的规范作用包括指引作用、预测作用、评价作用、强制作用和教育作用；不同作用的直接对象和实现方式不同。","指引看自己行为，预测看相互行为，评价看合法与否，强制看制裁违法，教育看对一般人的影响。","五种规范作用不是“立法、执法、司法、守法”，也不能把教育作用只理解为处罚。",["sf-rule-system"]]
]);
addFlat("question","基本内容（16条）","基本内容",[
["qt-content-commodity","商品二因素的基本内容",1,"马原政治经济学｜商品是使用价值和价值的矛盾统一体。","使用价值是商品能满足人的某种需要的属性，是价值的物质承担者；价值是凝结在商品中的无差别的一般人类劳动，是商品的社会属性。","商品生产者让渡使用价值才能实现价值，购买者付出价值才能取得使用价值；分析商品先辨自然属性和社会属性。","有使用价值不必然有价值，如非劳动产品和自用品；价值也不等于价格。",["my-value-amount"]],
["qt-content-labor","劳动二重性的基本内容",1,"马原政治经济学｜理解商品二因素和剩余价值理论的枢纽。","具体劳动创造商品使用价值，抽象劳动形成商品价值；二者是生产商品的同一劳动过程的两个方面，不是两次劳动或两种独立劳动。","用“具体—使用价值；抽象—价值”对拍，并联系私人劳动与社会劳动的矛盾。","抽象劳动不是脑力劳动，具体劳动也不是只指体力劳动；二者不能割裂成两个过程。",["my-value-amount","my-surplus-process"]],
["qt-content-value-law","价值规律的基本内容",1,"马原政治经济学｜与“价格围绕价值波动”的表现形式对拍。","商品的价值量由生产商品的社会必要劳动时间决定；商品交换以价值量为基础，按照等价交换的原则进行。","基本内容答“决定＋交换”，表现形式才答价格波动；计算题还要区分社会必要劳动时间与个别劳动时间。","等价交换是长期平均趋势，不是每次交换价格完全等于价值；个别劳动时间不决定单位商品社会价值。",["my-value-law","my-value-amount"]],
["qt-content-practice","实践的基本结构",2,"马原认识论｜实践活动不是主体单方面的心理活动。","实践由实践主体、实践客体和实践中介三项基本要素构成，并通过一定中介形成主体与客体相互作用的现实过程。","主体是从事实践认识活动的人，客体是实践活动指向的对象，中介包括工具、手段及运用方法。","实践客体不等于整个客观世界；主体也不等于抽象精神或任何被动存在。",["my-practice"]],
["qt-content-two-leaps","认识过程两次飞跃的基本内容",1,"马原认识论｜实践与认识的辩证运动过程。","第一次飞跃是从实践到认识，即在实践基础上由感性认识能动地上升到理性认识；第二次飞跃是从认识到实践，即用理性认识指导实践并接受检验。","第二次飞跃意义更重大，因为认识目的在于改造世界，也只有实践才能检验和发展认识。","感性认识不必然低级错误，理性认识也不必然正确；认识发展不是一次飞跃后终止。",["my-two-leaps","my-cognition-process"]],
["qt-content-social-being","社会存在的基本内容",1,"马原唯物史观｜社会存在与社会意识关系的前置知识。","社会存在主要包括自然地理环境、人口因素和物质生产方式；其中物质生产方式是社会历史发展的决定力量。","记“三要素＋一个决定力量”，再分析生产方式如何制约社会结构、性质和变化。","地理环境和人口因素影响发展但不能单独决定社会性质；社会意识不属于社会存在。",["my-social-being"]],
["qt-content-newdem-line","新民主主义革命总路线的基本内容",1,"毛中特新民主主义革命理论｜1948年晋绥讲话完整表述。","无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命；要从领导、动力、对象、性质和前途整体理解。","题干给总路线必须完整写“三座大山”，并由半殖民地半封建社会性质解释革命对象。","革命性质仍是资产阶级民主革命，领导阶级是无产阶级，前途是社会主义，不能因领导阶级而改判为社会主义革命。",["mz-newdem-line","mao-jinsui"]],
["qt-content-newdem-econ","新民主主义经济纲领的基本内容",1,"毛中特新民主主义革命理论｜三大经济纲领。","没收封建地主阶级的土地归农民所有，没收官僚资产阶级的垄断资本归新民主主义国家所有，保护民族工商业。","用“土地归农民、官僚资本归国家、保护民族工商业”记三项，并理解没收官僚资本的双重性质。","保护民族工商业不是保护官僚资本；土地归农民不是立即实行土地集体所有。",["mz-newdem-program","mao-present"]],
["qt-content-armed","工农武装割据思想的基本内容",1,"毛中特革命道路理论｜土地革命、武装斗争、根据地建设三者统一。","在中国共产党领导下，把土地革命、武装斗争和农村革命根据地建设结合起来：土地革命是基本内容，武装斗争是主要形式，农村革命根据地是战略阵地和依托。","用于解释农村包围城市、武装夺取政权道路何以可能，答题时强调三者相互依存而非简单并列。","不能只写武装斗争而漏土地革命和根据地，也不能把“工农武装割据”理解为脱离党的领导的军事割据。",["mz-newdem-line"],"https://xgszb.xatu.edu.cn/info/12662/120418.htm"],
["qt-content-transition","过渡时期总路线的基本内容",1,"毛中特社会主义改造理论｜“一化三改”“一体两翼”。","逐步实现国家的社会主义工业化，并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造；工业化是主体，三大改造是两翼。","总路线体现社会主义工业化和社会主义改造同时并举，发展生产力与变革生产关系统一。","三大改造不包含商业、交通运输业整体；社会主义基本制度确立是在1956年三大改造基本完成，不是1949年。",["e1956-system"]],
["qt-content-mao-soul","毛泽东思想活的灵魂的基本内容",1,"毛中特毛泽东思想总论｜贯穿毛泽东思想各方面的立场观点方法。","实事求是、群众路线、独立自主是毛泽东思想活的灵魂；实事求是是精髓，群众路线是根本工作路线，独立自主是重要立足点。","三者既是理论品格也是实践方法，可分别联系一切从实际出发、一切为了群众依靠群众、走自己的路。","活的灵魂不是“统一战线、武装斗争、党的建设”，后者是新民主主义革命三大法宝。",["mz-two-combine","kw-three-magic"]],
["qt-content-dream","中国梦的基本内涵",1,"新思想总任务｜中华民族伟大复兴的中国梦。","中国梦的本质是国家富强、民族振兴、人民幸福；实现中国梦必须走中国道路、弘扬中国精神、凝聚中国力量。","国家、民族、人民三个层面相互联系，最终落脚人民幸福；实现路径与基本内涵分开记。","中国梦不是少数人的梦，也不是简单复制西方现代化道路；国家富强不能替代人民幸福。",["c20"]],
["qt-content-core-values","社会主义核心价值观的基本内容",1,"思法与新思想文化建设｜国家、社会、公民个人三个层面。","国家层面：富强、民主、文明、和谐；社会层面：自由、平等、公正、法治；公民个人层面：爱国、敬业、诚信、友善。","按“4＋4＋4”记忆，并在材料中判断对应层面；三个层面共同构成不可分割整体。","公正、法治属于社会层面，诚信、友善属于个人层面；不要把国家层面的文明与和谐混到个人层面。",["sf-core-values","xs-core-value"]],
["qt-content-china-spirit","中国精神的基本内容",1,"思法中国精神｜民族精神和时代精神统一。","中国精神包括以爱国主义为核心的民族精神和以改革创新为核心的时代精神，是凝心聚力的兴国之魂、强国之魂。","用“民族—爱国主义；时代—改革创新”对拍，可联系精神谱系、历史传统和新时代实践。","两个核心不可互换；中国精神不只属于古代传统，也不只指某一项具体精神。",["sf-values-feature","sp-founding"]],
["qt-content-revolution-morality","中国革命道德的主要内容",2,"思法道德建设｜革命道德不是单一“艰苦奋斗”。","主要包括为实现社会主义和共产主义理想而奋斗，全心全意为人民服务，始终把革命利益放在首位，树立社会新风、建立新型人际关系，修身自律、保持节操。","答题按理想信念、人民立场、革命利益、社会新风、个人修养五方面组织，可联系红色基因。","革命利益与人民根本利益一致，不等于否定正当个人利益；革命道德在和平建设时期仍有当代价值。",["sf-revolution-morality"]],
["qt-content-law-thinking","法治思维的基本内容",1,"思法新版教材口径｜五项固定内容。","法治思维的基本内容包括法律至上、权力制约、公平正义、权利保障、程序正当；案例题要识别具体是哪一项要求。","法律至上管权威，权力制约管公权，公平正义管价值，权利保障管权利，程序正当管过程。","旧资料常写“人权保障、正当程序”，新版教材和课程多写“权利保障、程序正当”；按题干教材版本作答，不把两组词混成六项。",["sf-legal-thinking","sf-fair-justice"],"https://sz.hbzy.edu.cn/__local/5/54/40/49D8AD49163033AFC68B8E58A99_8C44C984_CFC15D.pdf"]
]);
addFlat("question","根本任务与任务层级（10条）","任务层级",[
["qt-task-history","近代中国两大历史任务",1,"史纲总线索｜两大历史任务决定近代以来中国人民的奋斗方向。","一是求得民族独立和人民解放，二是实现国家繁荣富强和人民共同富裕；前一任务为后一任务扫清障碍、创造前提，后一任务是前一任务的继续和必然要求。","分析历史事件时先判断它主要服务于哪一任务，再说明两项任务不是彼此割裂或可以颠倒。","两大历史任务不是“反帝反封建”的同义重复；1949年主要解决前一任务，不等于后一任务已经完成。",["sg-four-history","sg-founding"]],
["qt-task-revolution","近代中国革命的根本任务",1,"毛中特与史纲｜由近代社会性质和主要矛盾决定。","推翻帝国主义、封建主义和官僚资本主义的统治，从根本上推翻反动腐朽的政治上层建筑，变革阻碍生产力发展的生产关系，为国家发展和人民幸福扫清障碍、创造前提。","根本任务对应革命对象“三座大山”，要与社会主义建设时期发展生产力的任务区分。","反帝反封建是民主革命基本任务，新民主主义革命还要反对官僚资本主义；不能写成千篇一律的“发展生产力”。",["mz-newdem-line","sg-four-history"]],
["qt-task-socialism","社会主义的根本任务",1,"邓小平理论与社会主义本质理论｜由社会主义本质和初级阶段主要矛盾决定。","社会主义的根本任务是发展生产力，特别是发展先进生产力；社会主义本质是解放生产力、发展生产力，消灭剥削、消除两极分化，最终达到共同富裕。","把“根本任务—发展生产力”同“根本目的—共同富裕、人民幸福”对拍，说明发展是解决问题的基础。","共同富裕是社会主义本质要求和目标，不替代“发展生产力”这一根本任务；也不能只讲生产力而忽略生产关系和人民共享。",["mz-deng-theme","xs-common-prosperity"]],
["qt-task-eight","中共八大提出的主要任务",1,"史纲社会主义建设探索｜社会主义基本制度建立后的任务转向。","八大指出党和全国人民的主要任务是集中力量发展社会生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要。","先对应八大关于国内主要矛盾的正确分析，再理解工作重点转向经济建设。","八大主要矛盾不能用1981年或2017年表述替换；主要任务也不是继续进行大规模阶级斗争。",["c8","mao-ten"]],
["qt-task-new-era","新时代新征程中国共产党的中心任务",1,"新思想与二十大报告｜注意是“中心任务”而非“社会主义根本任务”。","团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","中心任务可拆成“强国目标＋百年目标＋实现路径”；与高质量发展这一全面建设社会主义现代化国家首要任务配套记。","不能把中心任务简化为“以经济建设为中心”，也不能把2035基本实现现代化与本世纪中叶全面建成强国混同。",["c20","cb-two-steps"]],
["qt-task-education","我国教育的根本任务",1,"新思想教育科技人才｜教育的根本问题与根本任务分开。","教育的根本任务是立德树人，培养德智体美劳全面发展的社会主义建设者和接班人；“培养什么人、怎样培养人、为谁培养人”是教育的根本问题。","答题先写价值方向，再写全面发展；教育、科技、人才一体推进中，教育发挥基础性、战略性支撑作用。","“立德树人”是根本任务，“三个培养”是根本问题；思政课是落实立德树人根本任务的关键课程，二者不能互换。",["xs-sci-talent"],"http://www.moe.gov.cn/jyb_xwfb/xw_zt/moe_357/s7865/s8417/?ver=0.0.1"],
["qt-task-political","党的政治建设的首要任务",1,"新思想全面从严治党｜政治建设是党的根本性建设。","保证全党服从中央，坚持党中央权威和集中统一领导，是党的政治建设的首要任务；要深刻领悟“两个确立”的决定性意义，做到“两个维护”。","用“政治建设—党中央权威和集中统一领导”对拍，并联系政治方向、政治立场和政治纪律。","不要把坚定理想信念填入政治建设首要任务；政治建设是根本性建设，思想建设是党的基础性建设。",["xs-party-lead","xs-self-revolution"],"https://www.12371.cn/2017/10/27/ARTI1509103656574313.shtml"],
["qt-task-ideological","党的思想建设的首要任务",1,"新思想全面从严治党｜思想建设是党的基础性建设。","坚定理想信念是党的思想建设的首要任务；要用党的创新理论武装全党，教育引导党员补足精神之钙、把稳思想之舵。","与政治建设对拍：“思想—理想信念；政治—党中央权威和集中统一领导”。","理论武装是重要途径和要求，不替代“坚定理想信念”这一首要任务；思想建设也不是党的根本性建设。",["xs-self-revolution"],"https://www.gov.cn/xinwen/2017-10/27/content_5234876.htm"],
["qt-task-publicity","宣传思想文化工作的首要政治任务",2,"新思想文化建设｜2023年全国宣传思想文化工作会议相关规范表述。","用党的创新理论武装全党、教育人民，是宣传思想文化工作的首要政治任务；同时围绕在新的历史起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明这一新的文化使命。","首要政治任务重理论武装，新的文化使命重文化繁荣、文化强国和现代文明，按问法选择。","不要把“立德树人”或“坚定文化自信”直接替换为这里的首要政治任务；不同层级可相关但不是同一句。",["xs-culture"],"https://www.gov.cn/yaowen/liebiao/202310/content_6907766.htm?jump=true"],
["qt-task-first","发展是党执政兴国的第一要务",1,"新思想发展理论｜“第一要务”与“首要任务”“第一动力”辨析。","发展是党执政兴国的第一要务；高质量发展是全面建设社会主义现代化国家的首要任务；科技是第一生产力、人才是第一资源、创新是第一动力。","把主语和帽子一起背：发展—第一要务，高质量发展—首要任务，科技人才创新—三个第一。","不能把“创新”写成第一要务，也不能把“高质量发展”写成党执政兴国第一要务的完整规范替换。",["xs-highquality","xs-sci-talent"]]
]);
addFlat("question","基本途径与必由之路（10条）","途径与道路",[
["qt-path-knowledge","获得认识的两条基本途径",1,"马原认识论｜直接经验与间接经验都归根到底来源于实践。","人们获得认识的途径包括直接经验和间接经验：亲身实践获得直接经验，通过学习和他人经验获得间接经验；实践是认识的唯一来源。","“来源唯一”与“途径两条”并不矛盾：间接经验对他人而言仍来自实践，个人不必事事亲身实践。","不能把间接经验说成与实践无关，也不能把获得认识的两条途径写成实践有两个来源。",["my-practice","my-two-leaps"]],
["qt-path-two-combine","推进马克思主义中国化时代化的根本途径",1,"毛中特与新思想总论｜“两个结合”的方法论地位。","把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，是推进马克思主义中国化时代化的根本途径。","第一个结合重实际和时代问题，第二个结合重文化根基和文明传承；二者统一于党的理论创新实践。","两个结合不是把马克思主义与传统文化简单拼接，也不是用其中一结合取代另一结合；魂脉和根脉不可换。",["mz-two-combine","cb-two-combine"],"http://www.12371.cn/2025/01/10/ARTI1736473568068938.shtml"],
["qt-path-ideal","把理想变为现实的根本途径",1,"思法理想信念｜理想与现实通过实践联结。","实践是把理想变为现实的根本途径，是联系理想与现实的桥梁；艰苦奋斗是实现理想的重要条件，要把个人理想融入社会理想并立足实际行动。","题干出现“根本途径”答实践，出现“重要条件”答艰苦奋斗，材料题再写本领、担当和长期坚持。","理想不会自动实现，也不能把“坚定信念”单独写成根本途径；信念指导实践但不能替代实践。",["sf-ideal-social","sf-life-value"]],
["qt-path-life","实现人生价值的必由之路",1,"思法人生价值｜人生价值在社会实践中形成和实现。","社会实践是实现人生价值的必由之路；要在服务人民、奉献社会的实践中创造有价值的人生，正确处理个人与社会的关系。","先进人物材料可按“社会需要—实践行动—实际贡献—价值评价”组织，不把个人成功等同于社会价值。","个人幸福是自我价值的重要内容，但人生社会价值不能只用财富、地位或主观满足衡量。",["sf-life-value","sf-person-society"],"https://www.mmpt.edu.cn/sxddjc/info/1035/1032.htm"],
["qt-path-law-literacy","大学生提升法治素养的基本途径",1,"思法新版教材口径｜由“培养法治思维”旧版五点向“尊法学法守法用法”综合要求理解。","新版课程通常从尊重和维护法律权威、学习法律知识、养成守法习惯、提高用法能力展开，概括为自觉尊法、学法、守法、用法。","答新版“提升法治素养”优先用尊法学法守法用法，并在具体要点中写信仰法律、规则意识、守住底线和参与法律实践。","旧版“学习法律知识、掌握法律方法、参与法律实践、养成守法习惯、守住法律底线”是另一组表述，做题先看题干版本和问法，不随意拼接。",["sf-legal-thinking"],"https://sz.hbzy.edu.cn/__local/5/54/40/49D8AD49163033AFC68B8E58A99_8C44C984_CFC15D.pdf"],
["qt-path-law-implementation","法律实施和实现的基本途径",1,"思法社会主义法律运行｜全民守法在法治运行中的地位。","守法是法律实施和实现的基本途径；我国社会主义法律运行主要包括法律制定、法律执行、法律适用、法律遵守等环节。","“法律运行四环节”与“全面依法治国基本格局”相互对应但问法不同；守法要求一切组织和个人依法行使权利履行义务。","不要把守法理解为只有普通老百姓义务，国家机关及其工作人员也必须依法办事；立法不属于法律实施环节。",["sf-rule-system"],"https://yz.chsi.com.cn/kyzx/politics/201511/20151125/1511355081.html"],
["qt-path-rule-pattern","全面依法治国的基本格局",1,"思法与习近平法治思想｜新时代法治建设十六字方针。","科学立法、严格执法、公正司法、全民守法，是全面依法治国的基本格局；分别对应立法、执法、司法、守法关键环节。","材料题先辨主体：人大等立法、行政机关执法、审判检察机关司法、全体社会成员守法，再写对应要求。","十六字顺序和主体不能混；政协不是国家权力机关，执法也不等于司法机关审判。",["sf-rule-system","sf-fair-justice"]],
["qt-path-right-relief","法律权利救济的主要途径",2,"思法依法行使权利｜权利受到侵害后的合法救济。","权利救济主要包括司法救济、行政救济、政治救济与社会救济、自力救济；自力救济也必须在法律允许范围内进行。","案例题优先考虑依法协商、调解、仲裁、行政复议和诉讼等具体方式，并说明程序合法。","自力救济不是私刑或任意报复；不能把所有纠纷都写成只能诉讼，也不能用网络曝光替代法定程序。",["sf-right-exercise","ans-sf-rights"]],
["qt-path-dream","实现中国梦的基本路径",1,"新思想总任务｜中国梦的实现必须立足中国实际、依靠中国人民。","实现中国梦必须走中国道路，即中国特色社会主义道路；弘扬中国精神，即以爱国主义为核心的民族精神和以改革创新为核心的时代精神；凝聚中国力量，即全国各族人民大团结的力量。","用“道路—精神—力量”记三项，并与“国家富强、民族振兴、人民幸福”的中国梦本质分开。","中国道路不是封闭僵化或改旗易帜的路；中国力量不是只依靠少数精英，中国精神两个核心不能互换。",["c20","qt-content-dream","qt-content-china-spirit"]],
["qt-path-revolution-road","中国革命取得胜利的正确道路",1,"毛中特与史纲｜农村包围城市、武装夺取政权。","中国共产党把马克思主义基本原理同中国具体实际结合，开辟农村包围城市、武装夺取政权的正确革命道路；工农武装割据是这一道路的重要实践和理论内容。","从国情、敌人城市统治强、农村群众基础和红军根据地条件理解道路形成，不只背一句结论。","不能写成“城市中心、武装起义”作为完整正确道路，也不能把武装斗争与土地革命、根据地建设割裂。",["mao-spark","mz-newdem-line"],"https://xgszb.xatu.edu.cn/info/12662/120418.htm"]
]);
addFlat("question","本质要求与本质属性（12条）","本质与属性",[
["qt-essence-common","共同富裕是中国特色社会主义的本质要求",1,"新思想共同富裕｜与“中国式现代化的重要特征”对拍。","共同富裕是中国特色社会主义的本质要求，也是一个长期的历史过程；中国式现代化是全体人民共同富裕的现代化，共同富裕是中国式现代化的重要特征。","题干主语为中国特色社会主义答本质要求，主语为中国式现代化答重要特征；实践上在高质量发展中促进共同富裕。","共同富裕不是同步富裕、同等富裕或整齐划一平均主义，也不是少数人的富裕和单纯物质富裕。",["xs-common-prosperity","xs-modern-features"],"https://www.gov.cn/yaowen/liebiao/202406/content_6960268.htm"],
["qt-essence-people","人民当家作主是社会主义民主政治的本质特征",1,"新思想政治建设｜党的领导、人民当家作主、依法治国有机统一。","党的领导是人民当家作主和依法治国的根本保证，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式，三者统一于社会主义民主政治伟大实践。","用“党—根本保证；人民—本质特征；法治—基本方式”完整记忆，不把三个定位互换。","人民当家作主不是全过程人民民主的“本质属性”这一题干答案；全过程人民民主才是社会主义民主政治的本质属性。",["xs-democracy"],"https://www.gov.cn/xinwen/2017-10/27/content_5234876.htm"],
["qt-essence-rule","全面依法治国是中国特色社会主义的本质要求和重要保障",1,"新思想全面依法治国｜同时具有本质要求和重要保障双重定位。","全面依法治国是中国特色社会主义的本质要求和重要保障，是国家治理的一场深刻革命；依法治国是党领导人民治理国家的基本方式。","题干出现“本质要求和重要保障”答全面依法治国，出现“基本方式”则按党治国理政、执政方式的具体问法判断。","不要把全面依法治国写成社会主义民主政治的本质属性，也不要把依法治国与以德治国对立起来。",["sf-rule-system","xs-democracy"],"https://www.gov.cn/xinwen/2017-10/27/content_5234876.htm"],
["qt-essence-share","共享是中国特色社会主义的本质要求",1,"新思想新发展理念｜五大发展理念各有固定定位。","创新是引领发展的第一动力，协调是持续健康发展的内在要求，绿色是永续发展的必要条件，开放是国家繁荣发展的必由之路，共享是中国特色社会主义的本质要求。","共享强调全民共享、全面共享、共建共享、渐进共享，体现以人民为中心的发展思想。","共享不等于平均分配；创新是第一动力，开放是必由之路，不能把五顶帽子串换。",["xs-highquality","xs-common-prosperity"]],
["qt-essence-modern","中国式现代化的本质要求",1,"新思想中国式现代化｜九项固定内容，常与五个中国特色和五条重大原则混考。","坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。","九项可按领导道路、五位一体、世界意义组织：前两项管方向，中间六项管国内建设，后两项管世界贡献。","五个中国特色是人口规模巨大、共同富裕、物质精神文明协调、人与自然和谐、和平发展；九项本质要求不能与五特征混答。",["xs-modern-essence","xs-modern-features"],"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"],
["qt-essence-democracy","全过程人民民主是社会主义民主政治的本质属性",1,"新思想政治建设｜二十大报告固定表述。","全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主；发展全过程人民民主是中国式现代化本质要求之一。","先区分“本质属性—全过程人民民主”“本质特征—人民当家作主”，再联系全链条、全方位、全覆盖。","不能把全过程人民民主只理解为选举时投票，也不能把政协单独等同于全过程人民民主。",["xs-democracy","kw-democracy-attribute"],"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"],
["qt-essence-democracy-core","全过程人民民主的本质要求",2,"新思想政治建设｜问“全过程人民民主自身的本质要求”时作答。","保证人民当家作主是全过程人民民主的本质要求；要把人民依法实行民主选举、民主协商、民主决策、民主管理、民主监督贯通于国家政治生活和社会生活。","看到“全过程人民民主是……”答社会主义民主政治本质属性，看到“全过程人民民主的本质要求是……”答保证人民当家作主。","主语层级不同，不能循环答成“全过程人民民主的本质要求是全过程人民民主”，也不能与本质属性混写。",["xs-democracy"],"http://www.legaldaily.com.cn/army/content/2022-05/16/content_8717880.html"],
["qt-essence-party","中国共产党领导是中国特色社会主义最本质的特征",1,"新思想党的领导｜宪法和党的创新理论中的根本定位。","中国共产党领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势；中国共产党是最高政治领导力量。","分析中国制度优势、现代化方向和事业成败时，首先明确党的领导，并结合性质宗旨、组织体系和总揽全局协调各方。","“最本质特征”不能写成人民民主或依法治国；党的领导也要通过制度、法治和具体领导方式实现。",["xs-party-lead"],"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"],
["qt-essence-system","中国共产党领导是中国特色社会主义制度的最大优势",1,"新思想制度优势｜与“最本质特征”同主体、不同帽子。","中国共产党领导是中国特色社会主义制度的最大优势，党的领导制度是我国的根本领导制度；坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。","制度题突出组织动员、人民立场、总揽全局协调各方，把优势转化为治理效能。","根本政治制度是人民代表大会制度，根本领导制度是党的领导制度，二者不能互换。",["xs-party-lead","kw-npc-system"]],
["qt-essence-fair","公平正义是中国特色社会主义的内在要求",2,"新思想社会建设与法治建设｜公平正义的制度价值。","公平正义是中国特色社会主义的内在要求；要在发展中保障和改善民生，促进权利公平、机会公平、规则公平，并通过法治保障社会公平正义。","经济材料可联系分配制度和公共服务，法治材料可联系科学立法、严格执法、公正司法和权利救济。","内在要求不等于“本质属性”；公平也不是平均主义，公正司法是维护社会公平正义的最后一道防线。",["sf-fair-justice","xs-livelihood"]],
["qt-essence-consult","协商民主是中国社会主义民主政治的特有形式和独特优势",1,"新思想政治建设｜协商民主的制度定位。","社会主义协商民主是中国社会主义民主政治的特有形式和独特优势，是中国共产党的群众路线在政治领域的重要体现；协商民主是实践全过程人民民主的重要形式。","用“特有形式、独特优势、群众路线重要体现”记定位，再联系七种协商渠道和政协专门协商机构作用。","协商民主不是我国独有的所有协商活动，但“社会主义协商民主”的制度定位有特定主体；也不能说成替代选举民主。",["xs-democracy","qt-form-consultation"],"https://www.gov.cn/yaowen/liebiao/202402/content_6935030.htm?id=10378"],
["qt-essence-socialism","社会主义本质的科学概括",1,"邓小平理论｜1992年南方谈话对社会主义本质作出科学总结。","社会主义的本质是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕；体现生产力与生产关系、社会主义根本任务与根本目标统一。","按“解放发展生产力—消灭剥削消除两极分化—最终共同富裕”记层次，理解发展为了人民。","共同富裕是最终目标但不是同步同等富裕；社会主义本质不等于只发展生产力，也不能把手段和目标割裂。",["mz-deng-theme","xs-common-prosperity"]]
]);
addFlat("question","实现方式与实施载体（11条）","实现方式",[
["qt-way-rule-law","法治发挥作用的主要实现方式",1,"思法治国与德治关系｜法治和德治的实现方式和实施载体不同。","法治主要依靠制定和实施法律规范来推进和实施，以国家强制力为后盾，对全体社会成员具有普遍约束力。","案例题从立法、执法、司法、守法及权利义务规范分析，不能只写“靠处罚”。","法治不等于只靠刑罚或强制；法律实施还包括执法、司法、守法，法治也包含价值引导和程序保障。",["sf-rule-system","sf-legal-thinking"],"https://kaoyan.koolearn.com/20161115/966852.html"],
["qt-way-rule-morality","德治发挥作用的主要实现方式",2,"思法道德与法治关系｜与法治的实现方式对拍。","德治主要依靠培育和弘扬道德来推进和实施，通过社会舆论、传统习俗、内心信念以及道德教育、价值引导发挥作用。","从价值认同、道德自觉和社会评价分析德治，说明道德滋养法治精神、强化内心自律。","德治不是用个人道德替代法律，也不是没有约束；国家治理需要法治和德治相结合。",["sf-morality-origin","sf-socialist-morality"],"https://kaoyan.koolearn.com/20161115/966852.html"],
["qt-way-law-education","法律教育作用的实现方式",2,"思法法律规范作用｜教育作用不是只有课堂教育。","主要通过法治宣传教育，引导人们尊法学法守法用法；通过制裁违法犯罪，使违法犯罪者和社会成员受到警示；通过表彰法治先进，弘扬法治精神、营造法治环境。","用“宣传教育—制裁警示—表彰示范”记三种方式，结合材料判断直接机制。","制裁违法在教育作用中发挥警示作用，但其直接强制作用仍应区分；教育作用不等于只对学生宣传。",["sf-rule-system"],"https://kaoyan.koolearn.com/20161115/966851.html"],
["qt-way-law-guidance","法律指引作用的实现方式",1,"思法法律规范作用｜通过不同法律规范指引行为。","主要通过授权性规范、禁止性规范和义务性规范实现：授权性规范指引可以或有权做什么，禁止性规范指引不得做什么，义务性规范指引应当或必须做什么。","记“可以做—不得做—应当做”，案例题先找规范类型，再分析行为边界。","授权不等于可以滥用权利，义务性规范不等于道德倡议；禁止与义务不能简单混为同一类型。",["sf-right-exercise","sf-legal-duty"]],
["qt-way-macro","国家宏观调节的主要实现方式",1,"马原国家垄断资本主义｜宏观调节的手段与目标。","国家主要运用财政政策、货币政策等经济手段，对社会总供给和社会总需求进行调节，以实现经济增长、充分就业、物价稳定和国际收支平衡等目标。","宏观调节重经济总量和经济手段，与微观规制的法律手段、市场秩序区分。","宏观调节不等于国家直接经营所有企业，也不等于微观规制；财政和货币政策属于实现手段而非五种并列形式。",["qt-form-state-monopoly"],"https://xgszb.xatu.edu.cn/info/12750/120707_4.htm"],
["qt-way-micro","国家微观规制的主要类型",2,"马原国家垄断资本主义｜运用法律手段规范市场秩序。","微观规制主要有反托拉斯法、公共事业规制、社会经济规制等类型，目的在于规范市场秩序、限制垄断、保护竞争、维护社会公众合法权益。","反托拉斯法重竞争秩序，公共事业规制重自然垄断行业，社会经济规制重安全、健康、环境等社会目标。","微观规制不是运用财政货币政策调节总需求；它属于国家垄断资本主义形式中的规制层面。",["qt-form-state-monopoly"],"https://xgszb.xatu.edu.cn/info/12750/120707_4.htm"],
["qt-way-law-operation","我国社会主义法律运行的主要环节",1,"思法社会主义法律运行｜从制定到遵守的实施链条。","法律运行主要包括法律制定、法律执行、法律适用、法律遵守等环节；法律制定是有立法权机关依法创制规范，执法通常指行政机关执行法律，司法是司法机关适用法律，守法是一切组织和个人遵守法律。","材料题先辨主体和行为，再对应立法、执法、司法、守法，不把法律运行只理解为法院审判。","法律制定属于法律运行全过程，但不属于狭义法律实施；司法与执法主体不能互换。",["sf-rule-system","qt-path-rule-pattern"]],
["qt-way-party-lead","党的领导的主要方式",2,"毛中特与新思想党的建设｜政治、思想、组织领导统一。","党的领导主要是政治领导、思想领导和组织领导：政治领导管方向道路和重大原则，思想领导管科学理论武装和共同思想基础，组织领导管组织体系、干部和党员作用。","三者相互贯通，服务于党的全面领导；材料出现路线方针、理论武装、组织体系时分别对应。","领导方式不等于执政方式，不能把政治领导、思想领导、组织领导写成科学执政、民主执政、依法执政。",["xs-party-lead"],"https://www.12371.cn/special/zggcdzc/zggcdzcqw/?jump=true"],
["qt-way-govern","党的执政方式",1,"毛中特与新思想党的建设｜科学执政、民主执政、依法执政。","党坚持科学执政、民主执政、依法执政；依法执政是党执政的基本方式，要依照宪法法律和党内法规推进治国理政与管党治党。","科学执政重规律，民主执政重人民，依法执政重法治；依法执政与依法治国相互贯通。","依法执政不是唯一执政方式，但它是基本方式；依规治党是管党治党基本方式，不能与党领导人民治理国家的基本方式混写。",["xs-party-lead","sf-rule-system"],"https://djyj.12371.cn/2023/07/13/ARTI1689235396142703.shtml"],
["qt-way-core-values","培育和践行社会主义核心价值观的实现途径",1,"思法与新思想文化建设｜把价值要求转化为社会共识和自觉行动。","通过教育引导、舆论宣传、文化熏陶、实践养成、制度保障等，把社会主义核心价值观融入法治建设、社会发展、日常生活和国民教育全过程，做到落细、落小、落实。","大题可从学校教育、社会宣传、文化产品、志愿实践、制度约束和榜样示范选点，必须结合材料。","不能只背24字而不写实践养成，也不能把核心价值观培育理解为一次性宣传活动。",["sf-core-values","xs-core-value"]],
["qt-way-democracy-chain","全过程人民民主的参与实现链条",1,"新思想政治建设｜人民依法参与国家政治生活和社会生活的完整过程。","全体人民依法实行民主选举、民主协商、民主决策、民主管理、民主监督，依法通过各种途径和形式管理国家事务、经济和文化事业、社会事务。","五个民主环节体现全链条参与，可与两种重要民主形式、七种协商渠道交叉检索。","五个环节不是“五个民主形式”的简单并列口号；民主协商只是其中一环，不能替代民主选举或民主监督。",["xs-democracy","qt-form-democracy"],"https://www.gov.cn/yaowen/liebiao/202402/content_6935030.htm?id=10378"]
]);
/* 新增：思想理论回答的问题 */
addFlat("theoryq","马克思主义中国化时代化理论成果（10条）","理论课题",[
["tq-marxism","马克思主义：资本主义和人类社会发展向何处去",2,"马克思主义创立的时代背景｜不是某一中国化理论成果的固定“三问”。","马克思主义回答资本主义向何处去、人类社会向何处去的时代问题，揭示人类社会发展规律、资本主义运行规律，为无产阶级和人类解放提供科学世界观和方法论。","从资本主义矛盾、工人运动和无产阶级解放理解理论产生，不把马克思主义简化成现成结论汇编。","马克思主义提供科学理论指导而不是各国革命建设的具体方案；中国化时代化理论成果是在不同历史条件下继续回答中国问题。",["bk-manifesto","my-practice"]],
["tq-maozedong","毛泽东思想：围绕中国革命和建设回答什么问题",1,"毛泽东思想形成发展的实践基础｜按问题域理解，不硬套后续理论的句式。","围绕中国革命和建设，系统回答中国革命的对象、任务、动力、领导、道路、性质和前途等根本问题，并在新中国成立后继续探索社会主义革命和社会主义建设。","用“新民主主义革命理论—社会主义改造理论—社会主义建设道路初步探索”串起主要内容，联系农村包围城市道路。","“什么是社会主义、怎样建设社会主义”是邓小平理论首要基本理论问题，不能原样前移为毛泽东思想的唯一课题。",["mz-newdem-line","mao-newdem","mao-ten"]],
["tq-deng","邓小平理论：首要的基本理论问题",1,"改革开放和社会主义现代化建设新时期｜“什么是社会主义、怎样建设社会主义”。","邓小平理论第一次比较系统地初步回答了在中国这样经济文化比较落后的国家如何建设社会主义、如何巩固和发展社会主义的一系列基本问题，首要的基本理论问题是“什么是社会主义、怎样建设社会主义”。","围绕社会主义本质、初级阶段、基本路线、改革开放、市场经济和三步走理解对这一问题的回答。","“第一次比较系统地初步回答”程度词不能丢；不是第一次提出社会主义概念，也不是已经完成所有社会主义理论问题。",["mz-deng-theme","c15"]],
["tq-three","“三个代表”重要思想：进一步回答与创造性回答",1,"世纪之交党的建设新的伟大工程｜两组设问及程度词必须完整。","进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性地回答了建设什么样的党、怎样建设党的问题；核心内容是中国共产党始终代表中国先进生产力的发展要求、先进文化的前进方向、最广大人民的根本利益。","用“社会主义问题—进一步回答；党建问题—创造性回答”对拍，联系立党为公、执政为民。","不能只写后一问而漏“进一步回答”；“建设什么样的党”不是“建设什么样的现代化强国”。",["mz-three-content","doc-three","c16"]],
["tq-science","科学发展观：实现什么样的发展、怎样发展",1,"新世纪新阶段发展问题｜在继承基础上创造性回答发展课题。","科学发展观继续回答什么是社会主义、怎样建设社会主义和建设什么样的党、怎样建设党的问题，创造性回答了新形势下实现什么样的发展、怎样发展等重大问题。","以第一要义是发展、核心立场是以人为本、基本要求是全面协调可持续、根本方法是统筹兼顾理解回答。","发展课题对应科学发展观，不要与“三个代表”的党建课题互换；十七大写入党章、十八大确立指导地位。",["mz-science-connotation","c17","c18"]],
["tq-system","中国特色社会主义理论体系：共同回答的基本问题",1,"毛中特理论体系总论｜邓小平理论、“三个代表”、科学发展观一脉相承又与时俱进。","围绕什么是社会主义、怎样建设社会主义，建设什么样的党、怎样建设党，实现什么样的发展、怎样发展等基本问题不断展开；不同理论成果各有侧重、层层深化。","先记三大基本问题，再对应“邓小平—社会主义；三个代表—党建；科学发展观—发展”，同时保留继承关系。","中国特色社会主义理论体系不包括毛泽东思想；新时代思想又进一步提出并回答新的重大时代课题。",["mz-theory-system","tq-deng","tq-three","tq-science"]],
["tq-xi","习近平新时代中国特色社会主义思想：三个重大时代课题",1,"新时代党的创新理论总纲｜系统回答三组“建设／坚持和发展什么样、怎样”。","系统回答新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","三问分别对应中国特色社会主义、社会主义现代化强国、长期执政的马克思主义政党；十个明确是核心内容，六个必须坚持是世界观方法论。","三组主语和动词不可删减混写，尤其第三问是“长期执政的马克思主义政党”，不是一般政党或单纯“强党”。",["cb-three-questions","xs-form","c19"],"http://www.12371.cn/2025/01/10/ARTI1736473568068938.shtml"],
["tq-xi-socialism","时代课题①：坚持和发展什么样的中国特色社会主义、怎样坚持和发展",1,"习近平新时代中国特色社会主义思想的第一组时代课题。","回答新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，明确总目标、总任务、总体布局、战略布局以及方向道路、制度、文化等基本问题。","可联系十个明确、十四个坚持和中国式现代化部署，理解理论主题与实践展开。","不能只答“什么是社会主义、怎样建设社会主义”而忽略“新时代坚持和发展”的新限定。",["cb-three-questions","xs-form"]],
["tq-xi-modern","时代课题②：建设什么样的社会主义现代化强国、怎样建设",1,"习近平新时代中国特色社会主义思想的第二组时代课题。","回答建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，明确以中国式现代化全面推进中华民族伟大复兴，系统阐明中国特色、本质要求、重大原则和战略安排。","与中心任务、五个中国特色、九项本质要求、两步走战略安排交叉复习。","第二问不是“建设什么样的社会主义现代化国家”这一简化替代，规范记忆要保留“强国”和“怎样建设”。",["xs-modern-essence","cb-two-steps"]],
["tq-xi-party","时代课题③：建设什么样的长期执政的马克思主义政党、怎样建设",1,"习近平新时代中国特色社会主义思想的第三组时代课题。","回答建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党，强调党的全面领导、自我革命、全面从严治党和长期执政能力建设。","联系两个答案、九个以、政治建设统领和党的领导制度，理解强党与强国相互促进。","不要把第三问缩减为“建设什么样的党、怎样建设党”，那是“三个代表”创造性回答的问题；新时代课题有“长期执政的马克思主义政党”限定。",["xs-self-revolution","cb-two-answers"]]
]);
addFlat("theoryq","各领域思想回答的重大问题（7条）","领域思想",[
["tq-law","习近平法治思想：为什么实行、怎样实行全面依法治国",1,"全面依法治国｜新时代法治建设的根本遵循和行动指南。","深刻回答新时代为什么实行全面依法治国、怎样实行全面依法治国等一系列重大理论和实践问题；核心要义集中体现为“十一个坚持”。","原因题从国家治理、人民权益、制度优势和复兴保障展开，措施题从党的领导、人民立场、中国特色社会主义法治道路和具体部署展开。","不能把所有问题只写成“怎样依法治国”而漏“为什么”，也不能把十一个坚持与十个明确、十四个坚持混组。",["sf-rule-system","sf-constitution"]],
["tq-ecology","习近平生态文明思想：为什么、建设什么样、怎样建设生态文明",1,"新时代生态文明建设｜“四个一”等战略定位与“三问”结合。","系统回答为什么建设生态文明、建设什么样的生态文明、怎样建设生态文明等重大理论和实践问题，强调人与自然和谐共生、绿水青山就是金山银山和系统治理。","原因写人与自然生命共同体和永续发展，目标写美丽中国，路径写绿色发展、系统保护、制度法治和全民行动。","生态文明不是单纯污染治理，也不能把“两山论”理解为不要发展；要实现高质量发展和高水平保护统一。",["xs-ecology"]],
["tq-military","习近平强军思想：建设什么样的强大人民军队、怎样建设",1,"新时代国防和军队建设｜强军目标与强军实践。","系统回答新时代建设一支什么样的强大人民军队、怎样建设强大人民军队的时代课题；强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。","用“党对军队绝对领导—强军目标—练兵备战—改革强军科技强军人才强军依法治军”组织要点。","强军目标三项不可换序混写；党对军队绝对领导是人民军队建军之本、强军之魂。",["c19"]],
["tq-diplomacy","习近平外交思想：建设什么样世界、国际关系和怎样办外交",1,"新时代中国特色大国外交｜世界之问与中国外交实践统一。","系统回答新时代中国应当推动建设什么样的世界、构建什么样的国际关系，中国需要什么样的外交、怎样办好新时代外交等重大理论和实践问题。","以推动构建人类命运共同体为总目标，以新型国际关系、真正多边主义、三大全球倡议和高质量共建“一带一路”展开。","不能把中国外交写成一国主导世界或输出制度；人类命运共同体与全人类共同价值、新型国际关系相互联系但层次不同。",["xs-shared-future","xs-initiatives"]],
["tq-economy","习近平经济思想：新时代我国经济发展怎么看、怎么干",1,"新时代经济建设｜发展新阶段的经济理论和实践指南。","系统回答新时代我国经济发展怎么看、怎么干等重大理论和实践问题，围绕新发展理念、高质量发展、新发展格局、发展新质生产力、统筹发展和安全等展开。","“怎么看”重形势、阶段、规律和主要矛盾，“怎么干”重理念、目标、路径、制度和政策方法。","不能把经济思想只等同于增长速度或单一产业政策；高质量发展是新时代的硬道理和首要任务。",["xs-highquality","xs-new-pattern","xs-sci-talent"]],
["tq-culture","习近平文化思想：新时代文化建设的理论和实践问题",1,"新时代宣传思想文化工作｜2023年正式提出，明体达用、体用贯通。","系统回答新时代文化建设的一系列重大理论和实践问题，重点围绕举什么旗、走什么路、坚持什么原则、实现什么目标展开，明确新的文化使命和“七个着力”等实践要求。","从党的领导、文化自信、两个结合、意识形态、核心价值观、中华优秀传统文化两创和国际传播理解。","这一模块不强行套成固定“三问”；新的文化使命是继续推动文化繁荣、建设文化强国、建设中华民族现代文明。",["xs-culture","mz-two-combine"],"https://www.gov.cn/yaowen/liebiao/202310/content_6907945.htm"],
["tq-self-revolution","习近平总书记关于党的自我革命的重要思想：三个重大问题",1,"新时代全面从严治党｜为什么要、为什么能、怎样推进自我革命。","深刻回答我们党为什么要自我革命、为什么能自我革命、怎样推进自我革命等重大问题；实践要求可联系“九个以”，目标是跳出治乱兴衰历史周期率、确保党长期执政。","“为什么要”讲性质宗旨和考验危险，“为什么能”讲人民立场、制度优势和勇气能力，“怎样推进”讲九个以和全面从严治党。","自我革命是跳出历史周期率的第二个答案，人民监督是第一个答案；不要把三组设问与新时代思想三个时代课题混为一组。",["xs-self-revolution","cb-two-answers"]]
]);
/* 桌面政治资料补充：口诀只作索引，规范句用于作答 */
addFlat("mnemonic","马原｜哲学、政经与科社","课件口诀",[
["mn-ma-three","经科哲＝马克思主义三个组成部分",1,"口诀课05｜马克思主义导论·考点2","【口诀】经科哲（经得起苛责）。【还原】马克思主义由马克思主义哲学、马克思主义政治经济学和科学社会主义三个部分组成。","先记“经—科—哲”，再完整说出三个组成部分；答题不写谐音。","三者是相互联系的有机整体，不能把“科”误解为一般自然科学。",[]],
["mn-ma-natural","胞能生＝马克思主义产生的自然科学前提",1,"口诀课05｜马克思主义导论·考点4","【口诀】胞能生（包能生）。【还原】19世纪三大自然科学发现是细胞学说、能量守恒与转化定律、生物进化论。","按“细胞—能量—生物”顺序复诵，并同三大理论来源区分。","细胞学说、生物进化论不是马克思、恩格斯的理论创造。",[]],
["mn-ma-philosophy","哲学基本问题＝第一性＋同一性",1,"口诀课06｜唯物论与辩证法·考点13","【口诀】一本原，二认识。【还原】思维和存在何者第一性划分唯物主义与唯心主义；思维能否正确认识存在划分可知论与不可知论。","先判断问“世界本原”还是“能否认识”，再选派别。","可知论不等于唯物主义，不可知论也不等于唯心主义。",[]],
["mn-ma-matter","物质唯一特性与运动根本属性",1,"口诀课06｜唯物论与辩证法·考点16—17","【口诀】客观唯一，运动根本。【还原】物质的唯一特性是客观实在性；运动是物质的根本属性和存在方式，静止是有条件、暂时、相对的。","把“唯一特性”和“根本属性”分别贴到物质与运动上。","运动不是物质的唯一特性；相对静止不是绝对不动。",[]],
["mn-ma-spacetime","时空＝一维时间＋三维空间",2,"口诀课06｜唯物论与辩证法·考点18","【口诀】时一、空三、都客观。【还原】时间具有持续性、顺序性和一维性；空间具有广延性、伸张性和三维性；时空具有客观性。","遇到时空相对性，先承认客观性，再分析具体物质运动状态。","具体时空特性会变化，不等于时空是主观感觉。",[]],
["mn-ma-consciousness","意识＝人脑机能＋客观世界主观映象",1,"口诀课06｜唯物论与辩证法·考点19—20","【口诀】人脑是机能，内容是客观，形式是主观。【还原】意识是人脑的机能和属性，是客观世界的主观映象；能动作用通过指导实践改造世界。","材料出现规划、理念、精神力量时，写出能动作用与实践中介。","正确意识也不能不通过实践直接改变客观世界。",[]],
["mn-ma-law","规律与能动性＝尊重前提＋实践实现",1,"口诀课06｜唯物论与辩证法·考点21","【口诀】规律不能造，条件可以创。【还原】尊重客观规律是正确发挥主观能动性的前提；人们通过实践认识和利用规律，把尊重规律与发挥能动性统一起来。","分析题按“从实际出发—认识规律—创造条件—实践转化”展开。","人能利用规律，但不能创造、消灭或改变规律本身。",[]],
["mn-ma-connection","客普多条＝联系的四个特征",1,"口诀课06｜唯物论与辩证法·考点22","【口诀】客普多条。【还原】联系具有客观性、普遍性、多样性和条件性；要用联系观点看问题，分析具体联系与条件。","四字对应四项，随后补整体与部分、系统优化方法。","并非任何两个事物都有直接联系，联系普遍不等于联系无条件。",[]],
["mn-ma-development","发展＝前进上升＋新事物代替旧事物",1,"口诀课06｜唯物论与辩证法·考点23","【口诀】发展看方向，新旧看规律。【还原】发展的实质是事物的前进和上升，是新事物产生和旧事物灭亡；发展是前进性与曲折性的统一。","判断新事物看是否符合规律、是否具有生命力和前途。","新出现的事物不一定是新事物，一切运动变化也不都是发展。",[]],
["mn-ma-contradiction","同一相对、斗争绝对＋条件转化",1,"口诀课06｜唯物论与辩证法·考点24","【口诀】同一有条件，斗争无条件；转化靠条件。【还原】同一性是有条件的、相对的，斗争性是无条件的、绝对的；矛盾双方在一定条件下相互转化。","危与机、压力与动力材料必须补“创造条件”。","和谐不排斥矛盾，斗争性也不等于只有对抗形式。",[]],
["mn-ma-universal","共性寓于个性＋具体问题具体分析",1,"口诀课06｜唯物论与辩证法·考点25","【口诀】共性寓个性，个性联共性。【还原】矛盾普遍性寓于特殊性之中并通过特殊性表现，特殊性也离不开普遍性；要坚持具体问题具体分析。","试点推广、中国特色与一般经验材料优先对应此原理。","不是普遍性包含特殊性，也不是特殊性寓于普遍性。",[]],
["mn-ma-primary","主次矛盾管重点＋主次方面管性质",1,"口诀课06｜唯物论与辩证法·考点26","【口诀】办事情抓主矛，看性质抓主面。【还原】主要矛盾在复杂事物发展中处于支配地位；事物性质主要由主要矛盾的主要方面决定。","中心工作、突破口与主流支流要分别定位原理。","主次矛盾和矛盾主次方面不能混用。",[]],
["mn-ma-quality","准透果＋量变达到一定程度才质变",1,"口诀课06｜唯物论与辩证法·考点27","【口诀】准透果。【还原】量变是质变的必要准备，质变是量变的必然结果，量变和质变相互渗透；量变达到一定程度、超出度才引起质变。","“准—透—果”只负责回忆三项关系，规范答案必须保留程度条件。","不能简化成“任何量变必然立即质变”；质变也不必然是发展。",[]],
["mn-ma-negation","否定之否定＝扬弃＋两次否定三个阶段",1,"口诀课06｜唯物论与辩证法·考点28","【口诀】辩证否定是扬弃，两次否定三阶段。【还原】辩证否定是事物自身否定，是发展环节和联系环节的统一，实质是扬弃；事物发展呈前进性与曲折性统一。","用于说明改革继承、创新发展和螺旋式上升。","辩证否定不是全盘抛弃，也不是简单循环回复。",[]],
["mn-ma-thinking","抽分逻归＝四大辩证思维方法",2,"口诀课06｜唯物论与辩证法·考点30","【口诀】抽分逻归。【还原】归纳与演绎、分析与综合、抽象与具体、逻辑与历史相统一，是辩证思维的重要方法。","四字作组别索引，答题时写完整成对名称。","“抽象与具体”中的具体是思维具体，不是感性直观简单重复。",[]],
["mn-ma-practice","实践决定认识＝来源、动力、目的、标准",1,"口诀课01｜认识论·实践与认识","【口诀】来动目检。【还原】实践是认识的来源、认识发展的动力、认识的目的和检验认识真理性的唯一标准。","看到调查研究、政策试点、理论修正，按四项逐一筛选材料对应点。","认识来源是实践，不等于每一点知识都必须由个人直接经验获得。",[]],
["mn-ma-perception","感性三形式＋理性三形式",1,"口诀课01｜认识论·感性认识与理性认识","【口诀】感觉知觉表象；概念判断推理。【还原】感性认识包括感觉、知觉、表象；理性认识包括概念、判断、推理，二者相互渗透并在实践基础上统一。","先判材料是现象材料还是本质规律，再写两次飞跃。","感性认识不一定错误，理性认识也不一定天然正确。",[]],
["mn-ma-leap","两次飞跃＋第二次飞跃更重要",1,"口诀课01｜认识论·认识运动规律","【口诀】实践到认识，认识回实践；第二次更重要。【还原】从感性认识到理性认识是第一次飞跃，从理性认识回到实践是第二次飞跃；后者意义更重要。","政策形成后回到实践检验、指导改造世界，是第二次飞跃。","认识运动不是一次完成，也不是简单循环。",[]],
["mn-ma-truth","真理＝客观性＋绝对性相对性",1,"口诀课01｜认识论·真理与价值","【口诀】真理客观，绝相统一。【还原】真理具有客观性，又是绝对性和相对性的统一；实践检验标准具有确定性和不确定性。","相对性用于说明认识需发展，绝对性用于说明真理包含客观内容。","相对真理不是包含谬误的真理，真理与谬误有原则界限。",[]],
["mn-ma-socialbeing","社会存在三要素＋社会意识相对独立",1,"口诀课01｜唯物史观·社会存在与社会意识","【口诀】地理人口生产式；不同步、能反作。【还原】社会存在包括自然地理环境、人口因素和物质生产方式；社会意识由社会存在决定，又具有相对独立性和反作用。","分析文化、观念、制度作用时既写物质基础，也写反作用。","相对独立不等于可以脱离社会存在而独立存在。",[]],
["mn-ma-basiccontradiction","两对社会基本矛盾＝生产力关系＋经济基础上层",1,"口诀课01｜唯物史观·社会基本矛盾","【口诀】生产力配关系，经济基础上层建筑。【还原】生产力与生产关系、经济基础与上层建筑的矛盾是社会基本矛盾；生产关系要适合生产力，上层建筑要适合经济基础。","体制机制改革材料可写改革是社会主义社会发展的直接动力。","改革不是改变社会主义根本制度，而是调整不适合的体制机制。",[]],
["mn-ma-masses","群众创造历史＋个人不决定基本趋势",1,"口诀课01｜唯物史观·人民群众与个人","【口诀】人民是主体，个人有条件。【还原】人民群众是社会历史的主体和历史创造者；杰出人物能影响历史进程，但其作用受社会历史条件制约。","英雄人物与人民共同出现的材料，避免只答个人作用。","既反对英雄史观，也不能否认个人的重要作用。",[]],
["mn-ma-commodity","商品二因素＋劳动二重性",1,"口诀课01｜政治经济学·商品与劳动","【口诀】使用价值配具体劳动，价值配抽象劳动。【还原】商品具有使用价值和价值二因素；具体劳动创造使用价值，抽象劳动形成价值。","计算和辨析先看问使用价值、价值还是价值量。","具体劳动不是只创造价值的劳动，抽象劳动也不是脑力劳动同义词。",[]],
["mn-ma-value","价值量＝社必时正比＋社劳率反比",1,"口诀课01｜政治经济学·价值量","【口诀】时长值大，社率升值小；个别不直接。【还原】单位商品价值量与社会必要劳动时间成正比，与社会劳动生产率成反比；个别企业效率变化不直接决定社会价值量。","计算题先区分社会劳动生产率与个别劳动生产率。","个别企业提效可形成超额剩余价值，但不必然直接降低社会价值量。",[]],
["mn-ma-money","货币五职能＝价流贮支世",2,"口诀课01｜政治经济学·货币职能","【口诀】价流贮支世。【还原】货币具有价值尺度、流通手段、贮藏手段、支付手段和世界货币五种职能，前两种是基本职能。","看到标价选价值尺度，看到一手交钱一手交货选流通手段。","赊购赊销、工资、税款等通常体现支付手段，不要混作流通手段。",[]],
["mn-ma-laborpower","劳动力商品＋使用价值创造更大价值",1,"口诀课01｜政治经济学·劳动力成为商品","【口诀】价值看生活资料，使用能造新价值。【还原】劳动力价值由维持劳动者及其家属、教育培训所需生活资料价值决定；劳动力使用价值能创造大于自身价值的新价值。","剩余价值来源题先区分劳动力价值与劳动创造的价值。","资本家购买的是劳动力，不是把劳动者本人作为商品永久买断。",[]],
["mn-ma-surplusrate","剩余价值率＝m/v＋剩余劳动/必要劳动",1,"口诀课01｜政治经济学·剩余价值率","【口诀】m除以v，剩余劳动除必要劳动。【还原】剩余价值率 m'=m/v，也等于剩余劳动时间与必要劳动时间之比，反映资本家对工人的剥削程度。","计算时不要把不变资本c加入分母，也不要把剩余价值率当利润率。","利润率是m/(c+v)，与剩余价值率公式不同。",[]],
["mn-ma-threesurplus","绝对、相对、超额剩余价值三条路径",1,"口诀课01｜政治经济学·剩余价值生产方法","【口诀】绝对延强度，相对缩必要，超额靠个别低。【还原】绝对剩余价值靠延长工作日或提高劳动强度；相对剩余价值靠缩短必要劳动时间；超额剩余价值来自个别价值低于社会价值。","先用题干条件判断工作日、社会生产率还是个别企业差异。","超额剩余价值具有暂时性，不是单纯抬高售价取得。",[]],
["mn-ma-capital","有机构成c/v＋产业资本循环购产售",2,"口诀课01｜政治经济学·资本积累与循环","【口诀】构成c比v；循环购产售，形态货生商。【还原】资本有机构成用c:v表示；产业资本循环依次经过购买、生产、售卖阶段，采取货币资本、生产资本、商品资本三种职能形式。","公式题看c、v含义，循环题同时写阶段与资本形态。","不要把商品资本误解为普通商品，也不要把三个阶段顺序颠倒。",[]],
["mn-ma-monopoly","金融寡头＝经济参与制＋政治个人联合",2,"口诀课02｜垄断资本主义","【口诀】经济参与，政治联合。【还原】金融寡头在经济领域主要通过“参与制”实现统治，在政治领域主要通过同政府的“个人联合”实现统治。","垄断组织、金融资本和国家垄断资本主义要分层判断。","垄断没有消除竞争，国家垄断资本主义也没有改变资本主义本质。",[]],
["mn-ma-soviet","战时共产主义与新经济政策对拍",2,"口诀课02｜科学社会主义·苏俄实践","【口诀】战时余粮征集，新经济粮食税并利用商品货币。【还原】战时共产主义实行余粮收集制等非常措施；新经济政策以粮食税代替余粮收集制，允许一定商品货币关系和多种经济成分。","按“战争非常措施—战后恢复探索”理解政策背景。","新经济政策不是放弃社会主义方向，也不能与战时共产主义混为一谈。",[]],
["mn-ma-twodiscoveries","两个伟大发现＝空想社会主义变科学",1,"口诀课02｜科学社会主义·理论基础","【口诀】唯物史观＋剩余价值学说。【还原】唯物史观和剩余价值学说是马克思一生的两个伟大发现，为科学社会主义创立奠定理论基础，使社会主义由空想变为科学。","著作题再关联《共产党宣言》公开问世标志。","两个发现不是辩证唯物主义与历史唯物主义的简单并列。",[]]
]);

addFlat("mnemonic","史纲｜探索、革命与建设","课件口诀",[
["mn-hi-semi","半殖民地半封建社会形成四节点",1,"口诀课07｜近代中国社会性质","【口诀】南京开始，二鸦加深，马关大大加深，辛丑完全形成。【还原】第一次鸦片战争后开始沦为半殖民地半封建社会；第二次鸦片战争后加深；《马关条约》后大大加深；《辛丑条约》后完全形成。","按战争—条约—程度三步对应，不孤立背条约。","“开始沦为”“大大加深”“完全形成”不可互换。",[]],
["mn-hi-tasks","两对矛盾＋两大历史任务",1,"口诀课07｜近代中国矛盾与任务","【口诀】帝中、封人；民族独立人民解放，国家富强人民幸福。【还原】近代主要矛盾是帝国主义和中华民族、封建主义和人民大众的矛盾；由此产生两大历史任务。","前一任务解决生产关系和民族独立，后一任务解决发展问题。","两对矛盾在不同时期突出程度不同，前一任务为后一任务创造前提。",[]],
["mn-hi-explorations","四种救国方案＝农民、地主、维新、革命",1,"口诀课07｜各阶级早期探索","【口诀】农地维革，方案不同，均未成功。【还原】农民阶级太平天国、地主阶级洋务派、资产阶级维新派和革命派分别探索救国道路，但都未能改变旧中国社会性质。","比较题按阶级、纲领、依靠力量、结果同维度展开。","不能因失败而否认其历史作用，也不能把失败原因都归结为同一项。",[]],
["mn-hi-taiping","太平天国两文献＝天朝田亩＋资政新篇",1,"口诀课07｜太平天国","【口诀】天朝平均分土地，资政发展资本主义。【还原】《天朝田亩制度》体现平均社会理想；《资政新篇》是先进中国人较早提出的发展资本主义方案。","两文献分别对应农民土地要求与学习西方方案。","二者均未真正实施，《资政新篇》不是农民平均主义纲领。",[]],
["mn-hi-westernization","洋务运动＝中体西用＋自强求富",1,"口诀课07｜洋务运动","【口诀】中体西用，自强求富，官办官督。【还原】洋务派以“中学为体、西学为用”为指导，以自强、求富为目标，兴办军事和民用工业、建立新式海陆军、发展新式教育。","评价时同时写近代化作用与维护封建统治的目的。","洋务运动不是资产阶级政治革命，也没有使中国走上资本主义道路。",[]],
["mn-hi-reform1898","维新变法＝君主立宪＋思想启蒙",1,"口诀课07｜戊戌维新","【口诀】变法图强、君主立宪、兴学启蒙。【还原】维新派主张变法维新、设议院、实行君主立宪，发展资本主义并改革教育文化，是爱国救亡运动和思想启蒙运动。","与革命派比较时抓住改良还是革命、君主立宪还是民主共和。","维新派与革命派分歧焦点之一是要不要以革命手段推翻清政府。",[]],
["mn-hi-threeprinciples","三民主义＝民族、民权、民生",1,"口诀课07｜三民主义","【口诀】民族驱除鞑虏恢复中华，民权创立民国，民生平均地权。【还原】孙中山将同盟会纲领概括为民族主义、民权主义、民生主义，指导资产阶级民主革命。","新旧三民主义要另表对拍，1924新三民增加反帝等内容。","旧民生主义没有彻底满足农民土地要求，旧民族主义未明确提出反帝。",[]],
["mn-hi-1911","辛亥革命＝终结君主专制而非终结封建制度",1,"口诀课07｜辛亥革命","【口诀】推翻帝制、建立共和、解放思想；纲领不彻、群众不足、组织不强。【还原】辛亥革命推翻清王朝，结束两千多年君主专制制度，建立资产阶级共和国，推动思想解放和社会变革，但未改变半殖民地半封建社会性质。","意义与局限必须成组回答，历史评价不能只有成败二元判断。","结束的是君主专制制度，不是整个封建制度。",[]],
["mn-hi-newculture","新文化运动＝民主科学＋思想解放",1,"口诀课07｜新文化运动","【口诀】德先生、赛先生，反礼教、倡新文。【还原】新文化运动提倡民主与科学，反对专制和迷信盲从，抨击旧道德旧文学，促进思想解放，为马克思主义传播创造条件。","与五四运动、建党按“思想启蒙—爱国运动—组织创建”衔接。","早期新文化运动并非一开始就以马克思主义为统一指导思想。",[]],
["mn-hi-may4","五四运动＝新民主主义革命开端",1,"口诀课07｜五四运动","【口诀】彻底反帝反封、广大群众参加、工人登上舞台、传播马克思主义。【还原】五四运动是彻底反帝反封建的伟大爱国革命运动，促进马克思主义同中国工人运动结合，为建党作准备，是新民主主义革命开端。","回答意义时补社会革命、思想启蒙、干部组织准备等角度。","五四运动不是在中国共产党直接领导下爆发，党成立于1921年。",[]],
["mn-hi-congress4","一大建党、二大立章、三大合作、四大领导工农",1,"口诀课07｜中共一大至四大","【口诀】一建党、二立章定纲领、三定合作、四抓领导权与工农联盟。【还原】一大宣告建党；二大制定最高最低纲领并通过首部党章；三大决定党内合作；四大明确无产阶级领导权和工农联盟问题。","按会议逐项对应，不用一个会议的成就覆盖其他会议。","第一次国共合作正式形成在1924年国民党一大，不是中共三大。",[]],
["mn-hi-87sanwan","八七定总方针＋三湾建支部",1,"口诀课07｜土地革命战争转折","【口诀】八七“土武”，三湾“支部建在连上”。【还原】八七会议确定土地革命和武装反抗国民党反动派总方针；三湾改编把党支部建在连上，加强党对军队领导。","一个解决革命转向，一个解决军队组织建设。","八七会议没有完整提出农村包围城市道路理论，三湾改编也不是古田会议。",[]],
["mn-hi-gutian","古田会议＝思想建党、政治建军",1,"口诀课07｜古田会议","【口诀】思想建党，政治建军。【还原】古田会议确立思想建党、政治建军原则，规定红军性质、宗旨和任务，加强党对军队绝对领导。","与三湾改编、遵义会议分别按组织原则、领导转折区分。","古田会议不是单纯军事训练会议，也不是确立毛泽东思想指导地位。",[]],
["mn-hi-zunyi","遵义会议＝生死攸关转折＋走向成熟",1,"口诀课07｜遵义会议","【口诀】独立自主解危局，事实上确立领导地位。【还原】遵义会议集中解决军事和组织问题，事实上确立毛泽东在党中央和红军的领导地位，是党的历史上生死攸关的转折点，标志党在政治上走向成熟。","前置通道、黎平、猴场会议可作背景，正式指导思想仍在七大。","不能写“正式确立毛泽东思想为党的指导思想”。",[]],
["mn-hi-unitedfront","瓦窑堡管联合＋洛川管全面抗战",1,"口诀课09｜抗日民族统一战线与抗战路线","【口诀】瓦窑堡定统战，洛川定全面抗战、十大纲领、山地游击。【还原】瓦窑堡会议确立抗日民族统一战线策略；洛川会议制定全面全民族抗战路线，通过《抗日救国十大纲领》，强调独立自主山地游击战争。","先判题干问“联合谁”还是“怎样抗战”。","西安事变和平解决是时局转换枢纽，不等于第二次国共合作正式形成。",[]],
["mn-hi-weapons","三大法宝＋两个基本武器",1,"口诀课09｜《〈共产党人〉发刊词》","【口诀】统武党三法宝，统武两武器。【还原】统一战线、武装斗争、党的建设是三大法宝；统一战线和武装斗争是战胜敌人的两个基本武器。","《〈共产党人〉发刊词》对应法宝，《论联合政府》对应三大作风。","三大法宝不是理论联系实际、密切联系群众、批评和自我批评。",[]],
["mn-hi-styles","三大作风＝理群批",1,"口诀课09｜党的三大优良作风","【口诀】理群批。【还原】理论联系实际、密切联系群众、批评和自我批评，是中国共产党区别于其他政党的显著标志。","先记“理论—群众—批评”，再写完整名称。","实事求是、群众路线、独立自主是毛泽东思想活的灵魂，不是三大作风。",[]],
["mn-hi-yananrectification","延安整风＝主宗党＋惩前毖后治病救人",1,"口诀课09｜延安整风","【口诀】反主观、反宗派、反党八股；惩前毖后、治病救人。【还原】整风主要反对主观主义以整顿学风、宗派主义以整顿党风、党八股以整顿文风，其中反对主观主义是中心内容。","《改造我们的学习》《整顿党的作风》《反对党八股》可作著作线索。","整风不是残酷斗争、无情打击，也不是只在延安文艺界开展。",[]],
["mn-hi-victory","抗战胜利意义＝完全胜利、民族觉醒、世界贡献、精神财富",1,"口诀课09｜抗日战争胜利","【口诀】近代首胜、民族觉醒、国际地位、精神动力。【还原】抗战胜利是近代以来中国反抗外敌入侵第一次取得完全胜利的民族解放斗争，促进民族觉醒团结，提高国际地位，为世界反法西斯胜利作出重大贡献。","分析题还要答中国共产党的中流砥柱作用和人民战争伟力。","九一八是抗战起点，七七是全民族抗战起点，二者不可互换。",[]],
["mn-hi-72plenum","七届二中＝工作重心转移＋两个务必",1,"口诀课09｜党的七届二中全会","【口诀】乡村转城市，两个务必防糖衣。【还原】全会提出党的工作重心由乡村转移到城市，规定全国胜利后的基本政策，毛泽东提出“两个务必”，警惕糖衣炮弹。","与新中国成立、七届三中不要混；两个务必不是三个务必。","两个务必是谦虚谨慎不骄不躁、艰苦奋斗，不含“不忘初心、牢记使命”。",[]],
["mn-hi-cppcc","新政协＝共同纲领＋新型政党制度",1,"口诀课09｜中国人民政治协商会议第一届全体会议","【口诀】共同纲领临时宪法，人民政协建国筹备。【还原】会议通过《共同纲领》等文件，完成创建新中国的重要筹备工作；《共同纲领》在新中国成立初期起临时宪法作用，标志中国共产党领导的多党合作和政治协商制度正式确立。","与1946年旧政协、1954年全国人大分层比较。","新政协不是国家权力机关，《共同纲领》不是1954年正式宪法。",[]],
["mn-hi-earlyprc","建国初期巩固政权＝土改、镇反、抗美援朝",2,"口诀课09｜新中国成立初期","【口诀】土地改革、镇压反革命、抗美援朝，恢复国民经济。【还原】新中国成立初期通过土地改革、镇压反革命、抗美援朝和恢复国民经济等斗争，巩固新生人民政权。","原因意义题可联系完成民主革命遗留任务、保家卫国和社会稳定。","1950年土改后仍是农民土地所有制，不是立即建立集体所有制。",[]],
["mn-hi-transition","过渡时期总路线＝一化三改",1,"口诀课09｜社会主义改造","【口诀】一化为主体，三改为两翼。【还原】逐步实现社会主义工业化，并逐步实现对农业、手工业和资本主义工商业的社会主义改造，简称“一化三改”。","工业化是发展生产力，三大改造是变革生产关系，二者相互促进。","过渡时期不是从社会主义建成到共产主义，而是新中国成立到社会主义改造基本完成。",[]],
["mn-hi-agriculture","助初高＝农业社会主义改造三阶段",1,"口诀课09｜农业社会主义改造","【口诀】助初高：互助组萌芽、初级社半社会主义、高级社完全社会主义。【还原】农业改造经历互助组、初级农业生产合作社、高级农业生产合作社，由互助合作逐步走向集体化。","每阶段同时记组织名称和社会主义性质程度。","初级社不是完全社会主义性质，互助组也不是高级集体所有制。",[]],
["mn-hi-handicraft","手工业改造＝供销小组到生产合作社",2,"口诀课09｜手工业社会主义改造","【口诀】供销小组—供销合作社—生产合作社。【还原】手工业改造由手工业生产合作小组、手工业供销合作社到手工业生产合作社，逐步实现合作化。","与农业“助初高”区分，不把两种步骤混写。","手工业生产合作社不是资本主义工商业的全行业公私合营。",[]],
["mn-hi-capitalist","资本主义工商业改造＝加工订货到公私合营",1,"口诀课09｜资本主义工商业社会主义改造","【口诀】加工订货、统购包销、经销代销→个别公私合营→全行业公私合营；和平赎买、四马分肥、定息。【还原】采取国家资本主义多种形式和和平赎买政策，逐步把资本主义工商业改造为社会主义国营经济。","初级与高级国家资本主义形式、利润分配方式要配套记忆。","和平赎买不是无偿没收，也不是保留资本主义私有制不变。",[]],
["mn-hi-eight","中共八大＝主要矛盾＋稳步前进＋三个主体三个补充",1,"口诀课09｜中共八大与建设探索","【口诀】发展生产力，综合平衡稳步前进；陈云“三主三补”。【还原】八大正确分析国内主要矛盾，确定集中力量发展社会生产力；经济建设坚持既反保守又反冒进、在综合平衡中稳步前进。","与1981、2017主要矛盾分开，不能跨时期替换。","“三个主体、三个补充”不是社会主义市场经济体制。",[]],
["mn-hi-explorationdocs","十大关系开端＋正处两类矛盾",1,"口诀课09｜社会主义建设道路初步探索","【口诀】十大关系开始探索中国道路，正处区分敌我与人民内部。【还原】《论十大关系》标志开始探索中国自己的社会主义建设道路；《关于正确处理人民内部矛盾的问题》系统阐述两类不同性质矛盾学说。","两篇文章分别对应建设方针与矛盾学说。","《论十大关系》不是创立社会主义改造理论的著作。",[]],
["mn-hi-1978","真理标准讨论＋十一届三中全会",1,"口诀课09｜伟大历史转折","【口诀】真理标准解放思想，三中全会伟大转折。【还原】真理标准问题大讨论为十一届三中全会作思想理论准备；全会实现工作中心转移和改革开放决策，开启改革开放和社会主义现代化建设新时期。","1978转折与1981指导思想拨乱反正基本完成要分开。","《实践是检验真理的唯一标准》不是《人民日报》社论，首发于《理论动态》。",[]],
["mn-hi-reformcongress","十二大命题、十三大阶段、十四大市场、十五大指导",1,"口诀课09｜改革开放会议阶梯","【口诀】十二中特、十三初级三步走、十四市场、十五邓理论指导。【还原】十二大提出建设有中国特色的社会主义；十三大系统阐述初级阶段理论和三步走；十四大明确市场经济体制改革目标；十五大确立邓小平理论指导地位。","再补十四届三中全会建框架、十一届六中全会完成指导思想拨乱反正。","“提出命题—确立目标—建立框架—确立指导地位”不能互换。",[]]
]);

addFlat("mnemonic","毛中特｜革命、改造与改革理论","课件口诀",[
["mn-mz-soul","毛泽东思想活的灵魂＝实群独",1,"口诀课14｜毛泽东思想及其历史地位","【口诀】实群独。【还原】实事求是、群众路线、独立自主是毛泽东思想活的灵魂，是贯穿其科学体系的立场、观点和方法。","与三大法宝“统武党”、三大作风“理群批”分开。","毛泽东思想是被实践证明正确的理论原则和经验总结，不等于个人全部言论。",[]],
["mn-mz-general-line","新民主主义革命总路线＝领导、动力、对象",1,"口诀课12｜新民主主义革命理论","【口诀】无领导、人民大众、反帝反封反官僚。【还原】新民主主义革命是无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。","完整表述要保留领导阶级、革命动力和革命对象三层。","新民主主义革命属于资产阶级民主革命范畴，但由无产阶级领导。",[]],
["mn-mz-economic","两没收一保护＝新民主主义三大经济纲领",1,"口诀课12｜新民主主义经济纲领","【口诀】两没收，一保护。【还原】没收封建地主阶级土地归农民所有，没收官僚资产阶级的垄断资本归新民主主义国家所有，保护民族工商业。","两没收分别对应民主革命任务与建立国营经济，保护民族工商业体现经济政策。","不包含没收民族资本；没收官僚资本兼具民主革命和社会主义革命性质。",[]],
["mn-mz-peasant","农民基本问题＋领导权中心核心问题",1,"口诀课12｜新民主主义革命基本问题","【口诀】农民是基本，领导权是中心和理论核心。【还原】农民问题是中国革命的基本问题；无产阶级领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题。","题干出现“基本、中心、核心”先圈程度词再选。","基本问题与中心问题不可互换，工农联盟也不能替代无产阶级领导。",[]],
["mn-mz-twosteps","中国革命两步走＝民主革命＋社会主义革命",1,"口诀课12｜新民主主义革命前途","【口诀】先民主、后社会主义，两步衔接不混同。【还原】中国革命必须分两步走，第一步完成新民主主义革命，第二步进行社会主义革命；前者是后者的必要准备，后者是前者的必然趋势。","反对“一次革命论”和“二次革命论”两种错误。","新民主主义革命不是以建立资本主义社会为最终前途。",[]],
["mn-mz-road","工农武装割据三方面＝土地革命、武装斗争、根据地",1,"口诀课12｜中国革命道路","【口诀】土地是内容，武装是形式，根据地是阵地。【还原】土地革命是民主革命基本内容，武装斗争是中国革命主要形式，农村革命根据地是战略阵地，三者构成工农武装割据基本内容。","道路题还要写农村包围城市、武装夺取政权及其国情依据。","三者不是三大法宝“统一战线、武装斗争、党的建设”。",[]],
["mn-mz-threekeys","三大法宝＝统武党",1,"口诀课12｜新民主主义革命三大法宝","【口诀】统武党：统一战线、武装斗争、党的建设。【还原】三大法宝相互联系，统一战线是实行武装斗争的统一战线，武装斗争是统一战线中心支柱，党的建设是根本保证。","出处关联《〈共产党人〉发刊词》，再与两个基本武器对拍。","不能把三大法宝写成实事求是、群众路线、独立自主。",[]],
["mn-mz-partybuilding","新民主主义党建＝思想建设放首位",1,"口诀课12｜党的建设","【口诀】思想首位，组织民主集中，作风理群批。【还原】半殖民地半封建社会农民和其他小资产阶级成分占多数条件下，党把思想建设放在首位，同时加强组织建设和作风建设。","分析“思想入党”与保持先进性时可用该线索。","思想建设首位不等于忽视组织、作风和纪律建设。",[]],
["mn-mz-fiveeconomies","新民主主义社会五种经济成分",2,"口诀课11｜新民主主义社会性质","【口诀】国营、合作社、个体、私人资本主义、国家资本主义。【还原】新民主主义社会存在五种经济成分，其中国营经济居领导地位，个体经济占较大比重，社会性质属于过渡性质。","先记五种成分，再判断领导力量与过渡方向。","新民主主义社会不是独立社会形态，也不是社会主义社会已经建立。",[]],
["mn-mz-one-three","过渡时期总路线＝一化三改、主体两翼",1,"口诀课11｜过渡时期总路线","【口诀】一化三改，一体两翼。【还原】社会主义工业化是主体，对农业、手工业和资本主义工商业的社会主义改造是两翼，发展生产力与变革生产关系相统一。","可联系1953提出、1956基本完成及社会主义制度确立。","不能把“一化”解释为单一农业合作化，也不能把三改漏掉手工业。",[]],
["mn-mz-agri-nature","农业改造性质＝萌芽、半社会主义、完全社会主义",1,"口诀课11｜农业社会主义改造","【口诀】互助萌芽、初级半社、高级全社。【还原】互助组具有社会主义萌芽性质，初级农业生产合作社具有半社会主义性质，高级农业生产合作社具有完全社会主义性质。","组织名称与性质程度一一对应。","高级社完全社会主义性质不等于当时已实现共产主义。",[]],
["mn-mz-buyout","和平赎买＋四马分肥＋定息",1,"口诀课11｜资本主义工商业改造","【口诀】和平赎买，先四马分肥，后定息。【还原】对资本主义工商业实行和平赎买；个别企业公私合营阶段利润按国家所得税、企业公积金、工人福利费、资方红利分配，全行业公私合营后实行定息制度。","按改造阶段记利润分配方式，理解利用限制改造政策。","四马分肥不是土改分配方式，定息也不是资本自由分红。",[]],
["mn-mz-tenrelations","《论十大关系》＝开始探索自己的建设道路",1,"口诀课11｜社会主义建设道路初步探索","【口诀】十大关系开探索，调动一切积极因素。【还原】《论十大关系》围绕把国内外一切积极因素调动起来为社会主义服务，标志党开始探索中国自己的社会主义建设道路。","与《正确处理人民内部矛盾》共同作为建设探索理论成果。","《论十大关系》不是社会主义改造理论创立标志。",[]],
["mn-mz-contradictions","《正处》＝两类不同性质矛盾",1,"口诀课11｜社会主义社会矛盾学说","【口诀】敌我对抗，人民内部非对抗；团结—批评—团结。【还原】社会主义社会存在敌我矛盾和人民内部矛盾，正确处理人民内部矛盾成为国家政治生活主题，采用民主方法处理人民内部矛盾。","先判矛盾性质，再选解决方法，不能把两类矛盾混同。","人民内部矛盾在特定条件下也可能激化，不能说完全没有对抗性表现。",[]],
["mn-mz-dengquestion","邓小平首要基本理论问题＝什么是社会主义、怎样建设",1,"口诀课13｜邓小平理论","【口诀】什么是社会主义，怎样建设社会主义。【还原】邓小平理论围绕这一首要基本理论问题，系统回答中国社会主义发展道路、阶段、任务、动力、条件等基本问题。","与“三个代表”回答建设什么样的党、怎样建设党区分。","不要写成新时代思想三个重大时代课题。",[]],
["mn-mz-essence","社会主义本质＝解发消消共富",1,"口诀课13｜社会主义本质论","【口诀】解放生产力、发展生产力，消灭剥削、消除两极分化，最终共同富裕。【还原】社会主义本质把生产力目标与生产关系、价值目标统一起来，最终指向共同富裕。","按“生产力—生产关系—价值目标”三层复述。","共同富裕不是同步富裕、同等富裕，也不等于单纯平均分配。",[]],
["mn-mz-threebenefits","三个有利于＝生产力、综合国力、人民生活",1,"口诀课13｜南方谈话","【口诀】生产力、综合国力、人民生活。【还原】判断改革和各方面工作是非得失，主要看是否有利于发展社会主义社会生产力、增强社会主义国家综合国力、提高人民生活水平。","标准既讲发展也讲国家实力与人民利益，不能只看短期经济指标。","三个有利于不是判断姓资姓社的抽象标签。",[]],
["mn-mz-planmarket","计划和市场都是经济手段",1,"口诀课13｜社会主义市场经济理论","【口诀】计划不是社会主义专利，市场不是资本主义专利。【还原】计划和市场都是经济手段，不是社会主义与资本主义的本质区别；社会主义也可以搞市场经济。","南方谈话破题，十四大确立改革目标，十四届三中全会建框架。","不能把计划经济等同社会主义、市场经济等同资本主义。",[]],
["mn-mz-basicline","初级阶段基本路线＝一个中心、两个基本点",1,"口诀课13｜社会主义初级阶段","【口诀】一个中心，两个基本点。【还原】以经济建设为中心，坚持四项基本原则、坚持改革开放；基本路线服务于把我国建设成为富强民主文明和谐美丽的社会主义现代化强国。","中心与两个基本点是统一整体，不能相互替代。","改革开放是强国之路，四项基本原则是立国之本。",[]],
["mn-mz-threesteps","三步走＝温饱、小康、基本实现现代化",1,"口诀课13｜发展战略","【口诀】温饱—小康—基本现代化。【还原】第一步解决温饱，第二步到20世纪末达到小康，第三步到21世纪中叶基本实现现代化。","与十九大新时代两步走分开，时间范围不同。","第三步不是到21世纪中叶已经建成社会主义现代化强国的同一表述。",[]],
["mn-mz-reformnature","改革性质＝社会主义制度自我完善和发展",1,"口诀课13｜改革开放理论","【口诀】改革不是改向，完善而不改制。【还原】改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力，必须坚持正确方向、立场和原则。","马原可联系社会基本矛盾，毛中特可联系改革开放关键一招。","改革不是改变社会主义根本制度，也不是修补一切旧体制而不动体制机制。",[]],
["mn-mz-representatives","“三个代表”＝生产力、文化、根本利益",1,"口诀课13｜“三个代表”重要思想","【口诀】先进生产力、先进文化、最广大人民根本利益。【还原】始终代表中国先进社会生产力发展要求、先进文化前进方向、最广大人民根本利益。","记清每一项的方向词，不能只写“经济、文化、人民”。","“三个代表”回答建设什么样的党、怎样建设党，不是回答什么是社会主义这一问题本身。",[]],
["mn-mz-rep-key","贯彻“三个代表”＝关键、核心、本质",1,"口诀课13｜贯彻“三个代表”要求","【口诀】关键与时俱进，核心党的先进性，本质执政为民。【还原】贯彻“三个代表”重要思想，关键在坚持与时俱进，核心在坚持党的先进性，本质在坚持执政为民。","三顶帽子必须与三项内容一一对应。","本质是执政为民，不是与时俱进；核心是先进性，不是发展。",[]],
["mn-mz-scientific","科学发展观＝第一要义、核心、基本要求、根本方法",1,"口诀课13｜科学发展观","【口诀】发展是第一要义，以人为本是核心，全面协调可持续是基本要求，统筹兼顾是根本方法。【还原】科学发展观形成中国特色社会主义理论体系在新世纪新阶段的新发展。","四层帽子先背顺序，再联系经济社会全面协调可持续发展。","第一要义不是以人为本，核心也不是发展。",[]],
["mn-mz-harmony","和谐社会六特征＝民关公诚安友人自",2,"口诀课13｜社会主义和谐社会","【口诀】民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处。【还原】六项特征共同构成社会主义和谐社会的基本特征。","六组词成对记忆，注意“公平正义”与“民主法治”不可漏。","和谐社会不是没有矛盾，而是能够正确协调和化解矛盾。",[]],
["mn-mz-theorythemes","邓三科各自回答的问题",1,"口诀课13｜中国特色社会主义理论体系","【口诀】邓答社会主义，三答建设党，科答实现发展。【还原】邓小平理论回答什么是社会主义、怎样建设社会主义；“三个代表”回答建设什么样的党、怎样建设党；科学发展观回答实现什么样的发展、怎样发展。","与新时代思想三个时代课题组成完整理论问题链。","各理论既有一脉相承的共同主题，也有进一步回答的特定重大问题。",[]],
["mn-mz-mao-stages","毛泽东思想发展＝萌芽、形成、成熟、继续发展",1,"口诀课14｜毛泽东著作与理论发展","【口诀】大革命萌芽，土地革命前中期形成，土地革命后期和抗战成熟，解放战争及新中国成立后发展。【还原】代表著作分别包括阶级分析、农民考察；红色政权、井冈山、星星之火、反对本本主义；实践论、矛盾论、新民主主义论等；论人民民主专政、论十大关系、正处等。","按时期和理论贡献双证据判断，不只背篇名。","《反对本本主义》属于道路理论形成时期，不是新民主主义理论体系成熟标志。",[]],
["mn-mz-constitution","毛泽东思想确立指导地位＝中共七大",1,"口诀课14｜毛泽东思想历史地位","【口诀】六届六中提中国化，七大确立指导思想。【还原】1938年六届六中全会明确提出马克思主义中国化命题；1945年中共七大把毛泽东思想确立为党的指导思想并写入党章。","会议、著作、理论地位三者交叉验证。","遵义会议不是毛泽东思想写入党章的会议。",[]]
]);

addFlat("mnemonic","新思想｜布局、改革与保障","课件口诀",[
["mn-xs-threequestions","新时代思想＝三个重大时代课题",1,"口诀课16｜习近平新时代中国特色社会主义思想科学体系","【口诀】中特、强国、长期执政党，各问“什么样＋怎样”。【还原】系统回答新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设，建设什么样的长期执政的马克思主义政党、怎样建设。","三组主语分别对应道路方向、强国建设、执政党建设。","不是邓小平理论首要基本理论问题的简单重复，也不是各领域思想“三问”。",[]],
["mn-xs-system","十个明确＋十四个坚持＋十三成就＋六个必须",1,"口诀课16｜新时代思想科学体系","【口诀】十明核心，十四方略，十三成就，六必方法。【还原】十个明确是核心内容，十四个坚持是基本方略，十三个方面成就展示实践成果，六个必须坚持是世界观和方法论的重要体现。","四组数字按“理论—实践—成就—方法”分层。","十四个坚持不是核心内容，百年十个坚持也不是六个必须坚持。",[]],
["mn-xs-sixmust","人信正导观天下＝六个必须坚持",1,"口诀课16｜新时代思想世界观方法论","【口诀】人信正导观天下。【还原】必须坚持人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。","六字对应六项，答题写全称，可用于分析理论创新方法。","不要与进一步全面深化改革“六个坚持”混组，后者含制度建设主线、全面依法治国。",[]],
["mn-xs-twocombinations","两个结合＝中国具体实际＋中华优秀传统文化",1,"口诀课16｜马克思主义中国化时代化","【口诀】实际＋传统，两个结合。【还原】把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，是推进马克思主义中国化时代化的根本途径。","第一结合重实践国情，第二结合重文化根脉与文明创新。","两个结合不是马克思主义与中国传统文化简单拼接，更不是复古。",[]],
["mn-xs-chinesedream","中国梦＝国家富强、民族振兴、人民幸福",1,"口诀课16｜新时代历史使命","【口诀】国家、民族、人民三层梦。【还原】实现中华民族伟大复兴是近代以来中华民族最伟大梦想，本质是国家富强、民族振兴、人民幸福。","答题把个人梦想同国家民族前途联系起来。","中国梦不是少数人的梦，也不是单纯经济总量目标。",[]],
["mn-xs-modern-features","中国式现代化五个中国特色",1,"口诀课16｜中国式现代化","【口诀】人口共富两文明，人与自然和平路。【还原】中国式现代化是人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路的现代化。","“五个中国特色”回答是什么样的现代化，与五条重大原则分开。","不要把党的领导、改革开放等推进原则写进五个中国特色。",[]],
["mn-xs-modern-essence","中国式现代化九条本质要求",1,"口诀课16｜中国式现代化本质要求","【口诀】领导道路＋五位一体＋共同体＋文明形态。【还原】坚持中国共产党领导、坚持中国特色社会主义，实现高质量发展、发展全过程人民民主、丰富人民精神世界、实现全体人民共同富裕、促进人与自然和谐共生，推动构建人类命运共同体、创造人类文明新形态。","前两项管方向，中间五项对应布局，后两项管世界意义与文明成果。","九条本质要求不是五个中国特色，也不是五条重大原则。",[]],
["mn-xs-modern-principles","推进中国式现代化五条重大原则",1,"口诀课16｜中国式现代化重大原则","【口诀】党领导、中特路、人民中心、深化改革、发扬斗争。【还原】坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。","原则回答“怎样推进”，答题可逐条转化为实践要求。","人口规模巨大等特征不属于五条重大原则。",[]],
["mn-xs-twosteps","新时代两步走＝2035基本＋中叶强国",1,"口诀课16｜社会主义现代化战略安排","【口诀】2035基本现代化，本世纪中叶强国。【还原】从2020到2035基本实现社会主义现代化，从2035到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。","与十三大三步走、十五五规划期2026—2030分层。","全面建成小康社会不是基本实现现代化，建成与基本建成不能混。",[]],
["mn-xs-highquality","发展第一要务＋高质量发展首要任务",1,"口诀课16｜高质量发展","【口诀】发展是第一要务，高质量是首要任务。【还原】发展是党执政兴国的第一要务；高质量发展是全面建设社会主义现代化国家的首要任务。","两个完整主语和限定范围必须同时保留。","不能改写成“高质量发展是第一要务”或“发展是首要任务”。",[]],
["mn-xs-threefirst","科技第一生产力＋人才第一资源＋创新第一动力",1,"口诀课03｜教育科技人才战略","【口诀】科技生产力，人才是资源，创新是动力。【还原】科技是第一生产力、人才是第一资源、创新是第一动力，三者共同支撑科教兴国、人才强国、创新驱动发展战略。","真题常把前两项互换，先圈主语再选。","人才不是第一生产力，科技也不是第一资源。",[]],
["mn-xs-education","教育根本＋科技关键＋人才基础",1,"口诀课03｜教育科技人才战略","【口诀】教育根本、科技关键、人才基础。【还原】教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑；相关重要论述强调教育是根本、科技是关键、人才是基础。","与立德树人是教育根本任务配套记忆。","“教育是根本”不等于“教育是根本任务”；教育根本任务是立德树人。",[]],
["mn-xs-newquality","新质生产力＝创新主导、质优关键、先进本质",1,"口诀课03｜新质生产力","【口诀】创新起主导，关键在质优，本质是先进生产力；特征高科技、高效能、高质量。【还原】新质生产力由技术革命性突破、生产要素创新性配置、产业深度转型升级催生，以全要素生产率大幅提升为核心标志。","再记劳动者、劳动资料、劳动对象及其优化组合跃升。","新质生产力不是单纯新增产业名称，也不等于只追求高技术而忽视质优。",[]],
["mn-xs-innovationforms","原成放＝科技创新三种重要形式",2,"口诀课03｜科技创新","【口诀】原成放。【还原】原始创新、集成创新、开放创新是科技创新的重要形式；基础研究是科技创新源头，企业是科技创新主体。","“原—成—放”对应三种形式，勿与三个“第一”混淆。","开放创新不等于依赖外部技术，自立自强与开放合作可以统一。",[]],
["mn-xs-newpattern","新发展格局＝关键循环、本质自立、基点内需",1,"口诀课15｜构建新发展格局","【口诀】关键经济循环畅通，本质高水平自立自强，基点扩大内需。【还原】构建以国内大循环为主体、国内国际双循环相互促进的新发展格局。","三个定位连同新发展格局完整内涵一起记。","以国内大循环为主体不是封闭运行，关键与最本质特征不可互换。",[]],
["mn-xs-marketgov","市场决定性作用＋更好发挥政府作用",1,"口诀课15｜社会主义市场经济体制","【口诀】市场决定配置，政府更好作用。【还原】使市场在资源配置中起决定性作用，更好发挥政府作用，推动有效市场和有为政府更好结合。","十八届三中全会是“决定性作用”，不是过去的“基础性作用”。","市场决定性作用不等于政府退出，政府作用也不等于代替市场配置一切。",[]],
["mn-xs-layouts","五位一体＋四个全面",1,"口诀课16｜总体布局与战略布局","【口诀】经政文社生五布局；现代化、改革、法治、党建四全面。【还原】五位一体是总体布局；四个全面是战略布局，当前首项是全面建设社会主义现代化国家。","一组管建设领域，一组管战略推进。","四个全面首项不再是“全面建成小康社会”，不能沿用旧表述。",[]],
["mn-xs-reformgoal","全面深化改革总目标＋2029任务",1,"口诀课16｜全面深化改革","【口诀】完善发展中特制度，推进治理现代化；2029完成决定任务。【还原】全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化；二十届三中全会《决定》任务到2029年完成。","二十届三中主题是进一步全面深化改革、推进中国式现代化。","2029与2035阶段目标不可混，改革不是改变社会主义根本制度。",[]],
["mn-xs-reformkey","改革开放＝关键一招＋重要法宝＋必由之路",1,"口诀课16｜改革开放重要定位","【口诀】关键一招、重要法宝、强国之路、必由之路。【还原】改革开放是决定当代中国命运的关键一招，是党和人民事业大踏步赶上时代的重要法宝，是坚持和发展中国特色社会主义的必由之路。","同一主语可有多个正确帽子，题干限定文献时按原文。","进一步全面深化改革、推进中国式现代化的根本保证是党的领导。",[]],
["mn-xs-democracy","民主政治三组本质定位",1,"口诀课04｜全过程人民民主","【口诀】中特最本质看党的领导，民主政治本质特征看人民当家作主，民主政治本质属性看全过程民主。【还原】三组定位分别对应不同主语和范围。","先圈“中国特色社会主义”还是“社会主义民主政治”，再选答案。","三个“本质”不能只看词面互换。",[]],
["mn-xs-cppcc-role","人民政协＝协商民主重要渠道＋专门协商机构",1,"口诀课04｜人民政协","【口诀】重要渠道、专门协商机构；爱国统一战线组织。【还原】人民政协是中国人民爱国统一战线组织，是中国共产党领导的多党合作和政治协商的重要机构，是社会主义协商民主的重要渠道和专门协商机构。","政协围绕团结和民主两大主题履行政治协商、民主监督、参政议政职能。","政协不是国家权力机关，人大才是国家权力机关。",[]],
["mn-xs-lawgoal","全面依法治国＝总目标＋总抓手",1,"口诀课04｜全面依法治国","【口诀】总目标法治体系＋法治国家，总抓手法治体系。【还原】总目标是建设中国特色社会主义法治体系、建设社会主义法治国家；建设中国特色社会主义法治体系是全面依法治国总抓手。","再记科学立法、严格执法、公正司法、全民守法。","法治国家是目标组成，法治体系兼具目标与总抓手，不能漏项。",[]],
["mn-xs-lawsystem","规实保监党＋法治体系五方面",1,"口诀课04｜中国特色社会主义法治体系","【口诀】规实保监党。【还原】形成完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系，形成完善的党内法规体系。","五字对应五体系，“党”指党内法规体系。","监督与保障不可互换，党内法规体系也是法治体系重要组成。",[]],
["mn-xs-lawfour","法治四环节＋政府社会司法定位",1,"口诀课04｜全面依法治国基本格局","【口诀】科学立法前提、严格执法关键、公正司法重点、全民守法基础；政府主体工程，社会基础，公正司法最后防线。【还原】不同表述分别对应不同教材层级，要按题干完整设问判断。","“法治政府—主体工程”“法治社会—基础”“公正司法—最后防线”一一对应。","严格执法是“关键”而非这里的“重点”；构筑法治国家基础是法治社会。",[]],
["mn-xs-culturemission","新文化使命＋首要政治任务",1,"口诀课10｜宣传思想文化工作","【口诀】首要任务创新理论武装全党教育人民；新的文化使命继续推动文化繁荣、建设文化强国、建设中华民族现代文明。【还原】宣传思想文化工作首要政治任务是用党的创新理论武装全党、教育人民。","首要任务与新的文化使命属于不同层级，不可混写。","意识形态工作是“为国家立心、为民族立魂”的工作。",[]],
["mn-xs-confidence","文化自信两组规范表述",1,"口诀课10｜文化自信","【口诀】更基础更广泛更深厚；最基本最深沉最持久。【还原】文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。","两组形容词分别整组记忆，避免交叉拼接。","不要写成“更基本、最广泛、最深厚”等混搭句。",[]],
["mn-xs-livelihood","民生两组定位＝幸福之基＋发展根本目的",1,"口诀课10｜保障和改善民生","【口诀】民生是人民幸福之基、社会和谐之本；增进民生福祉是发展的根本目的。【还原】民生工作要抓住人民最关心最直接最现实的利益问题，坚持发展成果由人民共享。","“民生”“增进民生福祉”主语不同，帽子也不同。","发展的根本目的不是单纯追求GDP增长。",[]],
["mn-xs-commonprosperity","共同富裕＝本质要求＋长期历史过程",1,"口诀课10｜共同富裕","【口诀】中特本质要求，人民共同期盼，长期历史过程。【还原】共同富裕是中国特色社会主义的本质要求，是人民群众的共同期盼，要尽力而为、量力而行，循序渐进推进。","分配制度可联系初次分配、再分配、第三次分配协调配套。","共同富裕不是同步、同等、同时富裕，也不是平均主义。",[]],
["mn-xs-ecology","生态文明＝根本大计＋普惠民生＋两山理念",1,"口诀课10｜生态文明建设","【口诀】根本大计、最普惠民生福祉、绿水青山就是金山银山。【还原】生态文明建设关系中华民族永续发展；良好生态环境是最普惠的民生福祉；坚持生态优先、绿色低碳发展。","分析题可写生产发展、生活富裕、生态良好的文明发展道路。","生态保护不是停止发展，而是推动发展方式和生活方式绿色转型。",[]],
["mn-xs-carbon","双碳＝广泛而深刻的经济社会系统性变革",2,"口诀课10｜碳达峰碳中和","【口诀】双碳不是单一减排，而是系统性变革。【还原】实现碳达峰碳中和是一场广泛而深刻的经济社会系统性变革，要调整能源结构、产业结构和生活方式，坚持先立后破。","与高质量发展、新质生产力、绿色转型联动作答。","不能把双碳理解为不顾能源安全和经济发展的简单关停。",[]],
["mn-xs-security","国家安全三组定位",1,"口诀课17｜总体国家安全观","【口诀】安邦定国重要基石，民族复兴根基，行稳致远重要基础。【还原】三组表述分别见不同权威文献，均指向国家安全在现代化和民族复兴中的基础地位。","题干限定十九大、二十大或三中全会《决定》时按原文。","三中全会《决定》中的“重要保障”另对应法治等，不随意换给国家安全。",[]],
["mn-xs-securitycore","总体国家安全观＝人民宗旨、政治根本、经济基础",1,"口诀课17｜政治安全四大属性","【口诀】人民安全是宗旨，政治安全是根本，经济安全是基础。【还原】政治安全具有根本性、人民性、复杂性、全局性，核心是政权安全和制度安全；统筹各领域安全。","“宗旨—根本—基础”分别对应人民、政治、经济。","政治安全核心不是经济安全，人民安全也不能改作“根本”。",[]],
["mn-xs-army","强军目标＝灵魂、核心、保证",1,"口诀课17｜国防和军队建设","【口诀】听党指挥是灵魂，能打胜仗是核心，作风优良是保证。【还原】党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。","人民军队唯一宗旨是全心全意为人民服务，另作一条记忆。","能打胜仗不是唯一宗旨，听党指挥也不能换成作风优良。",[]],
["mn-xs-onecountry","一国两制＝一国根本＋两制和谐",1,"口诀课17｜“一国两制”与祖国统一","【口诀】一国是根是本，两制从属派生并统一于内；全面管治权与高度自治权相统一。【还原】“一国两制”首先确保国家主权、安全、发展利益，落实爱国者治港、爱国者治澳，推进祖国完全统一。","构想始于解决台湾问题，实践先用于香港、澳门，二者不能混。","高度自治不是完全自治，更不是独立政治实体。",[]],
["mn-xs-diplomacy","外交宗旨＋人类命运共同体",1,"口诀课17｜中国特色大国外交","【口诀】外交宗旨维护世界和平、促进共同发展；命运共同体是世界各国人民前途所在。【还原】坚持独立自主和平外交政策，弘扬全人类共同价值，推动构建新型国际关系和人类命运共同体。","与和平、发展、公平、正义、民主、自由全人类共同价值配套。","命运共同体不是同质化世界或由某一国家主导世界。",[]],
["mn-xs-party-political","党的建设＝政治统领＋思想基础＋组织路线",1,"口诀课17｜全面从严治党","【口诀】政治建设是统领和根本性建设，思想建设是基础性建设，组织建设重在严密组织体系和干部队伍。【还原】以政治建设为统领全面推进党的建设，把制度建设贯穿其中，深入推进反腐败斗争。","政治建设首要任务保证全党服从中央、坚持党中央权威和集中统一领导。","思想建设不是根本性建设，政治建设也不是一般性建设。",[]],
["mn-xs-selfrevolution","自我革命＝第二个答案＋两个永远在路上",1,"口诀课17｜党的自我革命","【口诀】人民监督第一答案，自我革命第二答案；全面从严治党、党的自我革命永远在路上。【还原】勇于自我革命是党区别于其他政党的显著标志，要以伟大自我革命引领伟大社会革命。","与“九个以”实践要求、四大考验和四大危险联动。","两个答案顺序不可颠倒，也不能把自我革命写成唯一答案。",[]],
["mn-xs-testsdangers","四大考验＋四大危险",1,"口诀课17｜长期执政条件","【口诀】考验：执政、改革开放、市场经济、外部环境；危险：精神懈怠、能力不足、脱离群众、消极腐败。【还原】新时代党的建设必须面对四大考验、克服四大危险，保持解决大党独有难题的清醒和坚定。","考验多来自长期执政环境与任务，危险侧重党内自身状态。","“脱离群众”属于危险，“外部环境”属于考验，不可对调。",[]],
["mn-xs-twoestablish","两个确立＋两个维护",1,"口诀课16｜新时代政治成果与政治要求","【口诀】确立核心地位＋指导地位；维护核心地位＋党中央权威集中统一领导。【还原】两个确立是新时代重大政治成果，两个维护是党的最高政治原则和根本政治规矩的重要要求。","一个强调理论与实践领导地位，一个强调政治维护责任。","两组“两个”不是同义重复，不可只写其中一半。",[]],
["mn-xs-threemust","三个务必＝使命、作风、斗争",1,"口诀课16｜新征程赶考要求","【口诀】不忘初心牢记使命；谦虚谨慎艰苦奋斗；敢于斗争善于斗争。【还原】三个务必对应理想信念、优良传统和斗争精神，是新时代新征程对全党的要求。","与1949年七届二中全会两个务必按时代和项目数区分。","两个务必不含“不忘初心、牢记使命”，三个务必不是两个务必简单加一句。",[]]
]);

addFlat("mnemonic","思法｜手册自编助记","手册助记",[
["mn-lm-life","人生观＝目的、态度、价值",1,"手册自编助记｜非口诀课原文，依据思法教材主干整理","【助记】目的定方向，态度定状态，价值定意义。【还原】人生观主要包括人生目的、人生态度和人生价值，人生目的回答人为什么活着，是人生观核心。","先进人物材料按目的—态度—价值实践三层展开。","人生价值评价重在社会贡献，不以个人获得多少为唯一尺度。",[]],
["mn-lm-value","人生价值＝自我价值＋社会价值",1,"手册自编助记｜人生价值","【助记】自我满足看自我，社会贡献看社会。【还原】自我价值是个体生存发展需要得到满足，社会价值是个体实践活动对社会和他人的意义；评价人生价值根本看对社会的贡献。","实现人生价值要从社会客观条件和自身条件出发，参加社会实践。","自我价值与社会价值不是互相排斥，个人正当需要不能被否定。",[]],
["mn-lm-ideal","理想信念＝理想三性＋信念三性",1,"手册自编助记｜理想信念","【助记】理想超越、实践、时代；信念执着、支撑、多样。【还原】理想具有超越性、实践性、时代性；信念具有执着性、支撑性、多样性，理想信念相互依存。","分析理想信念作用时写提供方向、动力和支柱。","理想不是脱离现实的空想，信念也不是盲目固执。",[]],
["mn-lm-spirit","中国精神＝民族精神＋时代精神",1,"手册自编助记｜中国精神","【助记】民族精神核心爱国主义，时代精神核心改革创新。【还原】以爱国主义为核心的民族精神和以改革创新为核心的时代精神共同构成中国精神。","两个核心分别对应历史传统与时代发展，不可互换。","新时代爱国主义本质是坚持爱国、爱党、爱社会主义高度统一。",[]],
["mn-lm-corevalues","核心价值观＝国家、社会、公民三层",1,"手册自编助记｜社会主义核心价值观","【助记】国家富民文和，社会自平公法，公民爱敬诚友。【还原】国家层面富强、民主、文明、和谐；社会层面自由、平等、公正、法治；公民层面爱国、敬业、诚信、友善。","三层十二词按领域复述，不能与全社会共同价值要求混淆层级。","核心价值观不是只针对个人品德，也包含国家和社会价值目标。",[]],
["mn-lm-morality","道德功能＝认识、规范、调节",1,"手册自编助记｜道德及其功能","【助记】认识善恶、规范行为、调节关系。【还原】道德具有认识功能、规范功能和调节功能，并服务于一定社会经济关系和阶级利益。","道德案例先判断价值评价，再写行为导向与关系协调。","道德不是超历史、超阶级的永恒规范。",[]],
["mn-lm-socialistmorality","社会主义道德＝为人民服务核心＋集体主义原则",1,"手册自编助记｜社会主义道德","【助记】核心为人民服务，原则集体主义。【还原】社会主义道德以为人民服务为核心、以集体主义为原则，集体主义重视和保障个人正当利益。","先进人物、志愿服务和公共责任题可直接调用。","集体主义不是否定一切个人利益和个人发展。",[]],
["mn-lm-law","法律产生＝私有制、阶级、国家＋物质制约",1,"手册自编助记｜法律的本质与历史","【助记】私有阶级国家生，物质生活条件定。【还原】法律是历史现象，随私有制、阶级和国家产生，体现由特定物质生活条件决定的统治阶级意志。","先写历史性，再写阶级性与物质制约性。","法律不是自人类社会产生就始终存在的规范。",[]],
["mn-lm-constitution","宪法＝根本法＋最高法律效力",1,"手册自编助记｜宪法地位","【助记】根本内容、最高效力、严格程序。【还原】宪法是国家根本法，规定国家根本制度和根本任务，具有最高法律地位、法律权威和法律效力。","宪法题可写治国安邦总章程、党和人民意志集中体现。","普通法律不得同宪法相抵触，宪法不是一般法律的简单相加。",[]],
["mn-lm-rulethinking","法治思维＝法律至上、权力制约、公平正义、权利保障、程序正当",1,"手册自编助记｜新版思法教材口径","【助记】上至、权制、公正、权保、程正。【还原】法治思维主要包括法律至上、权力制约、公平正义、权利保障、程序正当。","本组按新版教材用语整理；旧资料“人权保障、正当程序”等说法要作版本区分。","不能把旧版表达不加说明地覆盖新版固定术语。",[]],
["mn-lm-rightduty","权利义务＝相互依存＋目的手段互补＋复合性",1,"手册自编助记｜法律权利与法律义务","【助记】相依存、互补充、有复合。【还原】法律权利与法律义务相互依存，目的与手段相互补充，有些行为同时具有权利和义务复合属性。","案例题同时查主体、权限、义务、程序和救济。","权利义务一致不等于每个主体权利义务在数量上完全相等。",[]],
["mn-lm-lawmorality","法治德治＋相辅相成、相得益彰",1,"手册自编助记｜依法治国与以德治国","【助记】法治强约束，德治重教化，两者相结合。【还原】坚持依法治国和以德治国相结合，法治和德治相辅相成、相得益彰，共同推进国家治理。","道德案例要区分道德义务与法律义务，再说明二者协同。","依法治国不排斥德治，以德治国也不能替代法治。",[]]
]);

addFlat("exam","原卷复核真题｜题干信号与正确搭配","真题考法",[
["ex-2015-22","2015多选22｜人才的三个正确定位",1,"真题两册交叉核对｜2015年多选第22题","正确答案：ACD。人才是国家竞争力的重要体现，是第一资源和国家战略资源，也是推进中国特色社会主义事业的关键因素。","检索关键词：2015 多选22 人才 第一资源 国家战略资源 国家竞争力。","科学技术是先进生产力的集中体现和主要标志，不能把这一直接定位移植给人才。",[]],
["ex-2024-1","2024单选1｜理论创新的魂脉与根脉",1,"真题两册交叉核对｜2024年单选第1题","正确答案：A。中国化时代化的马克思主义以马克思主义为魂脉，以中华优秀传统文化为根脉。","检索关键词：2024 单选1 魂脉 根脉 两个结合 理论创新。","魂脉是马克思主义，根脉是中华优秀传统文化；不能用共同理想、共同价值等相近概念替换。",[]],
["ex-2024-2","2024单选2｜偶然因素不可忽视",1,"真题两册交叉核对｜2024年单选第2题","正确答案：C。厄尔尼诺现象说明偶然因素是事物发展中不可忽视的影响因素。","检索关键词：2024 单选2 偶然性 必然性 厄尔尼诺 影响因素。","偶然性会影响具体进程，但不决定事物发展的根本趋势；可有可无和确定不移均错误。",[]],
["ex-2024-3","2024单选3｜社会实践需要推动技术进步",1,"真题两册交叉核对｜2024年单选第3题","正确答案：D。北斗系统在发展中应用、在应用中发展，表明技术进步的根本动力是社会实践的需要。","检索关键词：2024 单选3 北斗 实践 认识发展动力 技术进步。","科研规范、主体意志和兴趣都能影响研究，但不能取代社会实践需要的根本动力地位。",[]],
["ex-2024-4","2024单选4｜科学预见不描绘历史细节",1,"真题两册交叉核对｜2024年单选第4题","正确答案：D。列宁展望未来社会时揭示方向和一般特征，而不对历史发展的各种细节作具体描绘。","检索关键词：2024 单选4 列宁 未来社会 科学预见 具体细节。","不描绘细节不等于否认社会规律，也不等于没有提出未来社会的发展方向和基本特征。",[]],
["ex-2024-5","2024单选5｜正确处理人民内部矛盾的根本着眼点",1,"真题两册交叉核对｜2024年单选第5题","正确答案：A。把正确处理人民内部矛盾作为政治生活主题，根本着眼点是调动一切积极因素为社会主义建设服务。","检索关键词：2024 单选5 人民内部矛盾 根本着眼点 积极因素。","民主法制是保障，稳定是环境；社会主义社会仍存在矛盾，不能表述为消除一切社会矛盾。",[]],
["ex-2024-6","2024单选6｜改革开放的鲜明特征和首要任务",1,"真题两册交叉核对｜2024年单选第6题","正确答案：A。改革开放的鲜明特征和首要任务是解放和发展社会生产力。","检索关键词：2024 单选6 改革开放 首要任务 解放发展生产力。","政府与市场关系是经济体制改革核心问题；促进公平正义、增进人民福祉是全面深化改革出发点和落脚点。",[]],
["ex-2024-11","2024单选11｜兴中会与振兴中华",1,"真题两册交叉核对｜2024年单选第11题","正确答案：A。1894年《兴中会章程》提出“振兴中华”的口号。","检索关键词：2024 单选11 兴中会 章程 孙中山 振兴中华。","建立民国、反帝反封和民主自由不能替代题干指定文献中的原句。",[]],
["ex-2024-12","2024单选12｜卢沟桥事变的历史定位",1,"真题两册交叉核对｜2024年单选第12题","正确答案：C。卢沟桥事变标志着中国进入全民族抗战阶段。","检索关键词：2024 单选12 卢沟桥事变 全民族抗战 九一八。","九一八事变揭开中国人民抗日战争序幕；1942年《联合国家宣言》标志世界反法西斯同盟正式形成。",[]],
["ex-2024-17","2024多选17｜人工智能与成功的实践",1,"真题两册交叉核对｜2024年多选第17题","正确答案：ABD。技术进步以维护人民根本利益为最高标准，人类活动能够实现合目的性与合规律性统一，成功实践是真理尺度与价值尺度的统一。","检索关键词：2024 多选17 人工智能 真理尺度 价值尺度 合规律性 合目的性。","科技活动具有目的性，但不受主观意志任意决定；有能动性是客观物质活动，不是意志决定论。",[]],
["ex-2024-20","2024多选20｜简单商品经济的基础",1,"真题两册交叉核对｜2024年多选第20题","正确答案：BC。简单商品经济以生产资料私有制和个体劳动为基础。","检索关键词：2024 多选20 简单商品经济 私有制 个体劳动 雇佣劳动。","雇佣劳动是资本主义商品生产的基本关系，不是简单商品经济的基础。",[]],
["ex-2024-28","2024多选28｜1956年社会主义建设方针",1,"真题两册交叉核对｜2024年多选第28题","正确答案：ACD。既反保守又反冒进、百花齐放百家争鸣、长期共存互相监督，均属于1956年前后社会主义建设的重要方针。","检索关键词：2024 多选28 1956 八大 双百方针 长期共存 互相监督。","“一边倒”是新中国成立前后提出的外交方针，不属于本题限定的1956年建设方针。",[]],
["ex-2024-29","2024多选29｜党的自我革命",1,"真题两册交叉核对｜2024年多选第29题","正确答案：ABD。勇于自我革命是党区别于其他政党的显著标志，自我革命精神是党永葆青春活力的强大支撑，自我革命是跳出历史周期率的第二个答案。","检索关键词：2024 多选29 自我革命 显著标志 第二个答案 青春活力。","不能把中国共产党自我革命的性质和经验泛化为所有政党形成发展的共同规律。",[]],
["ex-2024-30","2024多选30｜中华传统美德创造性转化创新性发展",1,"真题两册交叉核对｜2024年多选第30题","正确答案：ABC。挖掘具有当代价值的道德精神、赋予新的时代内涵、用传统美德滋养社会主义道德建设，均符合“两创”要求。","检索关键词：2024 多选30 中华传统美德 创造性转化 创新性发展 社会主义道德。","传统美德是重要资源，但不能由此形成以中国传统文化为主体的社会主义道德体系。",[]],
["ex-2023-22","2023多选22｜毛泽东对马克思主义中国化的贡献",1,"真题两册交叉核对｜2023年多选第22题","正确答案：ABC。毛泽东第一次明确提出马克思主义中国化的科学命题和重大任务，深刻论证其必要性和重要性，并系统阐述其科学内涵。","检索关键词：2023 多选22 毛泽东 马克思主义中国化 科学命题 科学内涵。","“全面清除认识上的各种障碍”表述绝对，不符合认识发展和历史实际的复杂过程。",[]],
["ex-2022-9","2022单选9｜维新派的政治制度主张",1,"真题两册交叉核对｜2022年单选第9题","正确答案：A。维新派突破“中体西用”局限，主张用君主立宪制取代君主专制制度。","检索关键词：2022 单选9 维新派 中体西用 君主立宪 君主专制。","民主共和、总统共和、议会共和都属于革命派或共和政体语境，不能写成维新派保留君主条件下的立宪主张。",[]],
["ex-2021-11","2021单选11｜人民政协召开与新型政党制度",1,"真题两册交叉核对｜2021年单选第11题","正确答案：D。中国人民政治协商会议第一届全体会议召开，标志着中国共产党领导的多党合作和政治协商制度这一新型政党制度的确立。","检索关键词：2021 单选11 人民政协 新型政党制度 多党合作 政治协商。","《共同纲领》起临时宪法作用，但本题问人民政协召开的制度标志，不能改答民族区域自治或工农兵代表大会制度。",[]],
["ex-2020-5","2020单选5｜搞清楚社会主义首要基本理论问题的关键",1,"真题两册交叉核对｜2020年单选第5题","正确答案：C。搞清楚“什么是社会主义、怎样建设社会主义”，关键是在坚持社会主义基本制度基础上进一步认清社会主义本质。","检索关键词：2020 单选5 邓小平 首要基本理论问题 社会主义本质 关键。","基本国情、主要矛盾和根本任务都重要，但本题问“关键”，固定搭配是坚持基本制度基础上认清本质。",[]],
["ex-2018-28","2018多选28｜抗日民主根据地政权建设举措",1,"真题两册交叉核对｜2018年多选第28题","正确答案：ABD。主要举措包括工作人员分配实行“三三制”、政权机构领导人经人民选举产生、在少数民族聚居地区试行民族区域自治。","检索关键词：2018 多选28 抗日民主根据地 三三制 人民选举 民族区域自治。","工农兵代表大会制度主要属于土地革命时期苏维埃政权，不能直接套入抗日民主根据地建设举措。",[]],
["ex-2015-12","2015单选12｜古田会议决议的中心思想",1,"真题两册交叉核对｜2015年单选第12题","正确答案：C。古田会议决议的中心思想是用无产阶级思想进行军队和党的建设。","检索关键词：2015 单选12 古田会议 中心思想 无产阶级思想 建党建军。","规范概括可记思想建党、政治建军；本题选项答案字母为C，不能只背字母而忽略题干所问中心思想。",[]],
["ex-2013-25","2013多选25｜社会主义本质概括的理论突破",1,"真题两册交叉核对｜2013年多选第25题","正确答案：ACD。社会主义本质概括破除脱离生产力抽象谈社会主义、摆脱忽视根本目的和目标、纠正把本质等同于具体做法的认识。","检索关键词：2013 多选25 南方谈话 社会主义本质 理论突破 共同富裕。","社会主义本质论没有否定公有制和按劳分配原则；区分本质与具体做法不等于放弃基本制度。",[]],

{q:"改革开放是决定当代中国命运的关键一招，也是党和人民事业大踏步赶上时代的重要法宝。",a:"正确。",n:"“关键一招”和“重要法宝”都可对应改革开放。"},
{q:"构建新发展格局的关键在于高水平自立自强，最本质特征在于经济循环畅通无阻。",a:"错误。关键在于经济循环畅通无阻，最本质特征是实现高水平自立自强。",n:"另记：扩大内需是战略基点。"},
{q:"国家安全是中国式现代化行稳致远的重要保障。",a:"按二十届三中全会《决定》应判错误：国家安全是重要基础；法治和高水平社会主义市场经济体制才是该《决定》中的“重要保障”。",n:"同词不同主语，先看题干问的是国家安全、法治还是市场经济体制。"},
{q:"物质的唯一特性是运动，运动是物质的客观实在性。",a:"错误。物质的唯一特性是客观实在性；运动是物质的根本属性和存在方式。",n:"客观实在性管“唯一特性”，运动管“根本属性”。"},
{q:"联系和发展是唯物辩证法的总特征，对立统一规律是唯物辩证法的实质和核心。",a:"正确。",n:"总特征与实质核心不可互换。"},
{q:"中国革命的基本问题是无产阶级领导权，中心问题是农民问题。",a:"错误。农民问题是中国革命的基本问题；无产阶级领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题。",n:"基本问题看农民，中心核心看领导权。"},
{q:"法治政府建设是构筑法治国家的基础，法治社会是全面依法治国的主体工程。",a:"错误。法治政府建设是全面依法治国的重点任务和主体工程；法治社会是构筑法治国家的基础。",n:"政府抓主体工程，社会抓基础，公正司法抓最后防线。"}
);
CONFUSIONS.push(
{q:"运动是物质的唯一特性。",a:"错误。物质的唯一特性是客观实在性，运动是物质的根本属性和存在方式。",n:"“唯一特性”与“根本属性”不可互换。"},
{q:"正确意识能够不通过实践直接改变客观世界。",a:"错误。意识具有能动作用，但指导实践才能改造客观世界；意识本身不能直接创造或改变物质。",n:"意识反作用有“通过实践”这一中介。"},
{q:"任何量变都会立即引起质变，而且任何质变都是发展。",a:"错误。量变达到一定程度才引起质变；只有前进、上升的质变才构成发展。",n:"量变的“程度”与发展的“方向”都要检查。"},
{q:"矛盾普遍性包含特殊性，特殊性寓于普遍性之中。",a:"错误。普遍性寓于特殊性之中并通过特殊性表现，特殊性也离不开普遍性。",n:"正确口诀：共性寓于个性。"},
{q:"事物的性质主要由主要矛盾决定。",a:"错误。事物性质主要由主要矛盾的主要方面决定；主要矛盾在复杂事物发展过程中处于支配地位。",n:"主次矛盾管发展重点，主次方面管性质评价。"},
{q:"相对真理就是包含谬误的真理。",a:"错误。真理相对性指具体真理在广度、深度和进程上有限，不意味着真理中包含谬误。",n:"真理相对性不是对错混合。"},
{q:"实践是检验真理的唯一标准，同时实践标准具有确定性和不确定性。",a:"正确。实践是唯一标准，但具体实践受历史条件制约，需要不断发展。",n:"不确定性不否认唯一标准。"},
{q:"社会意识具有相对独立性，说明社会意识可以脱离社会存在而独立存在。",a:"错误。相对独立性表现为不同步、不平衡、继承性、相互影响和反作用，仍以社会存在为基础。",n:"相对独立不等于绝对独立。"},
{q:"个别企业提高劳动生产率，必然直接降低该商品的社会价值量。",a:"错误。单位商品价值量与社会必要劳动时间及社会劳动生产率相关；个别企业效率提高不直接改变社会价值量。",n:"计算题先分社会与个别。"},
{q:"超额剩余价值是个别企业通过抬高商品售价获得的。",a:"错误。超额剩余价值来自商品个别价值低于社会价值而形成的差额，具有暂时性。",n:"不是高价售卖，而是个别价值较低。"},
{q:"中国特色社会主义理论体系包括毛泽东思想。",a:"错误。毛泽东思想是第一次历史性飞跃理论成果；中国特色社会主义理论体系包括邓小平理论、“三个代表”重要思想、科学发展观和习近平新时代中国特色社会主义思想。",n:"两大理论成果一脉相承但不互相包含。"},
{q:"新时代社会主要矛盾变化，说明我国已经超越社会主义初级阶段。",a:"错误。主要矛盾变化没有改变基本国情和世界最大发展中国家国际地位。",n:"一变与两个没有变同时掌握。"},
{q:"改革是对社会主义根本制度的根本改变。",a:"错误。改革是社会主义制度的自我完善和发展，改变的是不适合生产力的体制机制。",n:"改革有方向、有立场、有原则。"},
{q:"计划经济等于社会主义，市场经济等于资本主义。",a:"错误。计划和市场都是经济手段，不是社会主义与资本主义的本质区别。",n:"南方谈话和十四大是高频背景。"},
{q:"以国内大循环为主体，就是关起门来搞封闭运行。",a:"错误。新发展格局是国内大循环为主体、国内国际双循环相互促进，不是封闭内循环。",n:"自立自强与开放合作不矛盾。"},
{q:"“两个确立”与“两个维护”是完全相同的数字组合。",a:"错误。两个确立强调核心地位和指导地位，两个维护强调维护核心地位及党中央权威集中统一领导。",n:"一个是重大政治成果，一个是政治责任和规矩。"},
{q:"“十个明确”与“十四个坚持”都是新时代思想的基本方略，功能相同。",a:"错误。十个明确是核心内容，十四个坚持是基本方略；十三个方面成就展示实践成果。",n:"内容—方略—成就分层记。"},
{q:"二十届三中全会的改革“六个坚持”就是二十大的“六个必须坚持”。",a:"错误。改革六坚持包括党的全面领导、人民中心、守正创新、制度建设主线、全面依法治国、系统观念。",n:"改革组特有“制度建设主线、全面依法治国”。"},
{q:"辛亥革命结束了中国两千多年的封建制度。",a:"错误。辛亥革命结束的是两千多年君主专制制度，没有改变半殖民地半封建社会性质。",n:"君主专制制度不等于整个封建制度。"},
{q:"《天朝田亩制度》和《资政新篇》都在太平天国得到真正实施。",a:"错误。前者具有绝对平均空想性，后者缺乏实现条件，二者均未真正实施。",n:"一个平均土地，一个发展资本主义。"},
{q:"林则徐在《海国图志》中提出“师夷长技以制夷”。",a:"错误。魏源在《海国图志》中提出；林则徐组织翻译资料并支持《四洲志》。",n:"林则徐《四洲志》，魏源《海国图志》。"},
{q:"李大钊发表《我的马克思主义观》，较系统地介绍马克思主义。",a:"正确。李大钊在中国率先举起马克思主义旗帜，并推动马克思主义传播。",n:"《我的马克思主义观》不是陈望道或陈独秀著作。"},
{q:"五四运动是在中国共产党直接领导下爆发的。",a:"错误。五四运动发生于1919年，中国共产党1921年成立；五四运动促进马克思主义同工人运动结合并为建党作准备。",n:"五四开端与党成立相隔两年。"},
{q:"1949年新中国成立标志社会主义基本制度在我国确立。",a:"错误。1949年标志新民主主义革命基本胜利；1956年三大改造基本完成标志社会主义基本制度确立。",n:"1949与1956是最常见时间帽。"},
{q:"毛泽东思想就是毛泽东个人所有言论的总和。",a:"错误。毛泽东思想是被实践证明正确的关于中国革命和建设的理论原则和经验总结，是党集体智慧结晶。",n:"毛泽东个人晚年错误不属于毛泽东思想科学体系。"},
{q:"中共十五大把邓小平理论确立为党的指导思想并写入党章。",a:"正确。十二大提出建设有中国特色的社会主义命题，十五大确立邓小平理论指导地位。",n:"命题提出与理论确立分开。"},
{q:"陈望道翻译出版了《共产党宣言》首个中文全译本。",a:"正确。1920年出版，为马克思主义传播和党的创建提供重要文本。",n:"陈望道是译者，不是原作者。"},
{q:"第一次国共合作的政治基础是孙中山重新解释的新三民主义。",a:"正确。新三民主义与中共民主革命纲领基本一致，1924年国民党一大标志合作形成。",n:"旧三民主义不是合作政治基础。"},
{q:"集体主义要求否定一切个人利益和个人发展。",a:"错误。集体主义重视和保障个人正当利益，强调国家、社会整体利益与个人利益辩证统一。",n:"集体主义不是抹杀正当个人利益。"},
{q:"新时代爱国主义的本质是坚持爱国和爱党、爱社会主义高度统一。",a:"正确。爱国还要落实为维护统一团结、国家安全和报国行动。",n:"爱国主义不是狭隘排外。"},
{q:"法律是随着人类社会产生就始终存在的规范。",a:"错误。法律是历史现象，随私有制、阶级和国家产生，反映特定物质生活条件决定的统治阶级意志。",n:"法律具有历史性和物质制约性。"},
{q:"权利义务一致意味着每个主体享有的权利和承担的义务在数量上完全相等。",a:"错误。二者相互依存、目的手段相互补充并具有复合性，不意味着具体数量机械对等。",n:"统一关系不是数字一一对应。"},
{q:"全面依法治国意味着道德在社会治理中不再发挥作用。",a:"错误。坚持依法治国和以德治国相结合，法治与德治相辅相成、相得益彰。",n:"法治不排斥德治，德治也不能替代法治。"},
{q:"第一批46种伟大精神之外，还应把“铁人精神”另拆为第47种。",a:"错误。本手册按第一批46种收录，大庆精神与铁人精神合并理解，不另拆计数。",n:"名录项目与相关精神称谓要区分。"},
{q:"抗美援朝精神只包括爱国主义和革命英雄主义，不包含国际主义。",a:"错误。抗美援朝精神包括爱国主义、革命英雄主义、革命乐观主义、革命忠诚和国际主义。",n:"五层内涵不可漏国际主义。"},
{q:"雷锋精神就是单纯帮助他人，与敬业创新无关。",a:"错误。雷锋精神还包括理想信念、敬业、创新、创业等丰富内容。",n:"信念、奉献、敬业、创新、创业五层记。"},
{q:"抗疫精神（伟大抗疫精神）与抗击“非典”精神的规范内涵完全相同。",a:"错误。伟大抗疫精神是生命至上、举国同心、舍生忘死、尊重科学、命运与共；抗击“非典”精神另有规范表述。",n:"抗疫五句与抗击“非典”三句不可混；原始名录分别列项，不合并计数。"},
{q:"“三牛”精神中的拓荒牛对应创新发展。",a:"正确。孺子牛对应为民服务，拓荒牛对应创新发展，老黄牛对应艰苦奋斗。",n:"三个形象与三种要求一一对应。"},
{q:"选择题只要出现“唯一、完全、任何”等绝对词，该选项就一定错误。",a:"错误。教材明确的唯一标准、唯一宗旨等可以正确；要判断选项是否删除条件或夸大关系。",n:"绝对词需要回教材，不可机械排除。"},
{q:"考研政治多选题最多只能选三项，四项全选一定错误。",a:"错误。多选题可能存在四项全选，必须逐项独立判断，不能凭选项数量猜答案。",n:"题项数量不是判分规律。"},
{q:"掌握答题模板后，大题可以不再阅读材料，直接默写万能段落。",a:"错误。模板只组织得分点，必须根据设问选原理并用材料同义转述完成分析。",n:"原理＋材料对应才是有效得分段。"},
{q:"比较类大题只需分别介绍两个对象，不需要同维度对拍。",a:"错误。比较题应按领导阶级、纲领、力量、结果等同一维度逐项比较并得结论。",n:"分别叙述不等于比较。"}
);
CONFUSIONS.push(
{q:"“经科哲”说明马克思主义哲学、政治经济学和科学社会主义可以彼此割裂理解。",a:"错误。三者构成相互联系的有机整体，口诀只用于回忆组成，不能否定体系整体性。",n:"先记组成，再理解世界观方法、经济分析与科学目标的贯通。"},
{q:"“客普多条”中的普遍性意味着世界上任何两个事物之间都存在直接联系。",a:"错误。联系具有普遍性，也具有条件性和多样性，具体联系需要具体分析。",n:"普遍联系不等于无条件直接联系。"},
{q:"“准透果”可以简化为任何量变都必然立即引起质变。",a:"错误。量变达到一定程度、超出度才引起质变；前进上升的质变才构成发展。",n:"口诀不能删掉“达到一定程度”这一条件。"},
{q:"矛盾双方相互转化是无条件自动发生的。",a:"错误。矛盾双方在一定条件下相互转化，分析题要写出创造条件。",n:"同一性有条件、相对，斗争性无条件、绝对。"},
{q:"个别企业提高劳动生产率，必然直接降低单位商品的社会价值量。",a:"错误。单位商品社会价值量与社会必要劳动时间和社会劳动生产率相关，个别效率不直接决定社会价值量。",n:"个别效率可带来超额剩余价值。"},
{q:"剩余价值率的分母是全部预付资本c+v。",a:"错误。剩余价值率m'=m/v，分母为可变资本；m/(c+v)是利润率。",n:"两个公式先分剥削程度与资本增殖表现。"},
{q:"“两没收一保护”包括没收民族资本归新民主主义国家所有。",a:"错误。两没收是地主土地和官僚资本，民族工商业属于保护对象。",n:"没收官僚资本与保护民族工商业不可混。"},
{q:"“助初高”中的初级农业生产合作社已经具有完全社会主义性质。",a:"错误。互助组具有社会主义萌芽性质，初级社具有半社会主义性质，高级社具有完全社会主义性质。",n:"组织名与性质程度一起背。"},
{q:"毛泽东思想就是毛泽东个人所有言论的总和。",a:"错误。毛泽东思想是被实践证明正确的理论原则和经验总结，是党的集体智慧结晶。",n:"个人晚年错误不属于科学体系。"},
{q:"邓小平理论、“三个代表”重要思想和科学发展观回答的重大问题完全相同。",a:"错误。邓答什么是社会主义、怎样建设社会主义；三代表答建设什么样的党、怎样建设党；科学发展观答实现什么样的发展、怎样发展。",n:"一脉相承不等于时代课题完全相同。"},
{q:"科学发展观的核心是发展，第一要义是以人为本。",a:"错误。第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。",n:"四层帽子不可换。"},
{q:"教育、科技、人才的固定搭配可以写成科技是根本、人才是关键、教育是基础。",a:"错误。按课件所依据的重要论述，教育是根本、科技是关键、人才是基础；教育根本任务另为立德树人。",n:"主语与帽子一一对应，同时区分“根本”与“根本任务”。"},
{q:"新质生产力只要具有高科技特征即可，不需要关注质优和先进生产力本质。",a:"错误。新质生产力以创新起主导作用，关键在质优，本质是先进生产力，具有高科技、高效能、高质量特征。",n:"创新、质优、先进生产力三层不可漏。"},
{q:"“人信正导观天下”与进一步全面深化改革六个坚持是同一组内容。",a:"错误。前者是六个必须坚持；改革六坚持含党的全面领导、人民中心、守正创新、制度建设主线、全面依法治国、系统观念。",n:"两组都有守正创新、系统观念，但整体不同。"},
