<script>
/* ===== AI 问答页（后加模块）：API 直连 · 本地线索注入 ===== */
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var CFG_KEY="politicsAI_cfg",SESS_KEY="politicsAI_sessions",OLD_KEY="politicsAI_chat",MAX_SESS=30;
  var PRESETS={
    deepseek:{label:"DeepSeek",base:"https://api.deepseek.com",model:"deepseek-flash"},
    ark:{label:"火山方舟 · 豆包",base:"https://ark.cn-beijing.volces.com/api/v3",model:"doubao-seed-2-1-pro-260915"},
    dashscope:{label:"阿里百炼 · 通义",base:"https://dashscope.aliyuncs.com/compatible-mode/v1",model:"qwen-plus"},
    custom:{label:"自定义（OpenAI 兼容）",base:"",model:""}
  };
  var cfg={provider:"deepseek",key:"",base:"",model:"",len:"brief"};
  try{
    var raw=JSON.parse(localStorage.getItem(CFG_KEY)||"{}");
    ["provider","key","base","model","len"].forEach(function(k){if(raw&&typeof raw[k]==="string")cfg[k]=raw[k]});
    if(!PRESETS[cfg.provider])cfg.provider="deepseek";
    if(cfg.len!=="brief"&&cfg.len!=="full")cfg.len="brief";
  }catch(e){}
  var chat=[],sid="",sessions=[];
  function newId(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function saveSessions(){try{localStorage.setItem(SESS_KEY,JSON.stringify(sessions))}catch(e){}}
  function readSessions(){
    var out=[];
    try{
      var arr=JSON.parse(localStorage.getItem(SESS_KEY)||"[]");
      if(Object.prototype.toString.call(arr)==="[object Array]"){
        arr.forEach(function(s){
          if(!s||typeof s.id!=="string")return;
          var msgs=(Object.prototype.toString.call(s.msgs)==="[object Array]")?s.msgs.filter(function(m){return m&&(m.role==="user"||m.role==="assistant")&&typeof m.content==="string"}):[];
          if(!msgs.length)return;
          out.push({id:s.id,title:typeof s.title==="string"?s.title:"",ts:s.ts||0,msgs:msgs.slice(-40)});
        });
      }
    }catch(e){}
    return out.slice(0,MAX_SESS);
  }
  sessions=readSessions();
  /* 旧版单条对话记录迁移成一次会话 */
  try{
    var oldRaw=localStorage.getItem(OLD_KEY);
    if(oldRaw){
      var oldArr=JSON.parse(oldRaw);
      if(Object.prototype.toString.call(oldArr)==="[object Array]"){
        var mm=oldArr.filter(function(m){return m&&(m.role==="user"||m.role==="assistant")&&typeof m.content==="string"});
        if(mm.length){
          var firstU=mm.filter(function(m){return m.role==="user"})[0];
          sessions.unshift({id:newId(),title:firstU?firstU.content.replace(/\s+/g," ").slice(0,30):"早前对话",ts:Date.now()-1,msgs:mm.slice(-40)});
          saveSessions();
        }
      }
      localStorage.removeItem(OLD_KEY);
    }
  }catch(e){}
  var pendingQ="",pendingAuto=false,busy=false,ctl=null;

  function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg))}catch(e){}}
  var gen=0;
  function stale(my){return my!==gen}
  function newChat(){gen++;sid="";chat=[]}
  function persistCurrent(){
    if(!chat.length)return;
    if(!sid)sid=newId();
    var rec=null,i;
    for(i=0;i<sessions.length;i++)if(sessions[i].id===sid){rec=sessions[i];break}
    if(!rec)rec={id:sid,title:"",ts:0,msgs:[]};
    rec.msgs=chat.slice(-40);rec.ts=Date.now();
    if(!rec.title){
      var f=chat.filter(function(m){return m.role==="user"})[0];
      rec.title=f?f.content.replace(/\s+/g," ").slice(0,30):"新会话";
    }
    sessions=[rec].concat(sessions.filter(function(s){return s.id!==rec.id})).slice(0,MAX_SESS);
    saveSessions();
  }
  function pre(){return PRESETS[cfg.provider]||PRESETS.custom}
  function modelName(){return (cfg.model||pre().model||"").trim()}
  function endpoint(){
    var b=(cfg.base||pre().base||"").trim().replace(/\/+$/,"");
    if(!b)return "";
    return /\/chat\/completions$/.test(b)?b:b+"/chat/completions";
  }

  /* ---------- 取手册数据（脚本一里的词法声明） ---------- */
  function safe(name,fallback){try{var v=eval(name);return v==null?fallback:v}catch(e){return fallback}}
  function terms(q){
    var out=[],seen={};
    var han=String(q||"").replace(/[^\u4e00-\u9fa5A-Za-z0-9]+/g," ").trim();
    han.split(/\s+/).forEach(function(w){if(w.length>1&&!seen[w]){seen[w]=1;out.push(w)}});
    var h=String(q||"").replace(/[^\u4e00-\u9fa5]/g,"");
    for(var i=0;i<h.length-1;i++){
      var b=h.substr(i,2);
      if(!seen[b]){seen[b]=1;out.push(b)}
    }
    return out.slice(0,24);
  }
  function context(q){
    var D=safe("D",[]),CAT=safe("CAT",{});
    if(!D||!D.length)return "";
    var ts=terms(q);
    if(!ts.length)return "";
    var hits=[];
    D.forEach(function(it){
      var hay=[it.t,it.b,it.c,it.m,it.x,it.l,it.d,(it.tags||[]).join(" ")].join(" ").toLowerCase();
      var sc=0;
      ts.forEach(function(t){if(hay.indexOf(t.toLowerCase())>=0)sc+=2});
      if(sc>=2)hits.push({it:it,sc:sc});
    });
    if(!hits.length)return "";
    hits.sort(function(a,b){return b.sc-a.sc||(a.it.p||2)-(b.it.p||2)});
    var cut=function(s,n){s=String(s||"").replace(/\s+/g," ");return s.length>n?s.slice(0,n)+"…":s};
    var lines=hits.slice(0,4).map(function(h){
      var it=h.it,cat=(CAT[it.cat]&&CAT[it.cat].short)||it.cat;
      return "· ["+cat+"] "+it.t+"｜核心："+cut(it.c,90)+"｜考点："+cut(it.m,80)+(it.x?"｜易错："+cut(it.x,70):"");
    });
    return "【手册本地线索（口径参考）】\n"+lines.join("\n");
  }

  /* ---------- markdown ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function inline(s){
    return s.replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  }
  function md(src){
    var blocks=[];
    var s=String(src==null?"":src).replace(/\r\n?/g,"\n");
    s=s.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g,function(m,code){blocks.push(code);return "\u0000"+(blocks.length-1)+"\u0000"});
    s=esc(s);
    var lines=s.split("\n"),out=[],i=0,list=null;
    function closeList(){if(list){out.push("</"+list+">");list=null}}
    while(i<lines.length){
      var ln=lines[i],m;
      if(/^\s*$/.test(ln)){closeList();i++;continue}
      if(m=ln.match(/^\s*(#{1,4})\s+(.*)$/)){closeList();var lv=Math.min(m[1].length+1,4);out.push("<h"+lv+">"+inline(m[2])+"</h"+lv+">");i++;continue}
      if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){closeList();out.push("<hr>");i++;continue}
      if(/^\s*&gt;\s?/.test(ln)){closeList();var q=[];while(i<lines.length&&/^\s*&gt;\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*&gt;\s?/,""));i++}out.push("<blockquote>"+inline(q.join("<br>"))+"</blockquote>");continue}
      if(m=ln.match(/^\s*[*+-]\s+(.*)$/)){if(list!=="ul"){closeList();out.push("<ul>");list="ul"}out.push("<li>"+inline(m[1])+"</li>");i++;continue}
      if(m=ln.match(/^\s*\d+[.)]\s+(.*)$/)){if(list!=="ol"){closeList();out.push("<ol>");list="ol"}out.push("<li>"+inline(m[1])+"</li>");i++;continue}
      closeList();
      var buf=[ln];i++;
      while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^\s*#{1,4}\s/.test(lines[i])&&!/^\s*[*+-]\s/.test(lines[i])&&!/^\s*\d+[.)]\s/.test(lines[i])&&!/^\s*&gt;/.test(lines[i])&&!/^\s*([-*_])\1{2,}\s*$/.test(lines[i])){buf.push(lines[i]);i++}
      out.push("<p>"+inline(buf.join("<br>"))+"</p>");
    }
    closeList();
    return out.join("").replace(/\u0000(\d+)\u0000/g,function(m,n){return "<pre>"+esc(blocks[+n])+"</pre>"});
  }

  /* ---------- 知识卡片 ---------- */
  var CARD_KEY="politicsCards";
  function readCards(){
    try{
      var a=JSON.parse(localStorage.getItem(CARD_KEY)||"[]");
      if(Object.prototype.toString.call(a)!=="[object Array]")return [];
      return a.filter(function(c){return c&&typeof c.id==="string"&&typeof c.text==="string"});
    }catch(e){return []}
  }
  function saveCards(list){
    try{localStorage.setItem(CARD_KEY,JSON.stringify(list.slice(0,300)))}catch(e){}
    paintCardCount();
  }
  function paintCardCount(){
    var el=document.getElementById("cardCount");
    if(el){var n=readCards().length;el.textContent=n?n:""}
  }
  function markRaw(b,text){
    if(!b||!b.parentNode)return;
    b.parentNode.__raw=text||"";
    var ax=b.parentNode.querySelector(".ai-acts");
    if(ax)ax.removeAttribute("data-pending");
  }
  function makeTitle(s){
    var line=String(s||"").split(/\n/)[0].replace(/[#>*_`]/g,"").replace(/^[—\-·\s]+/,"").trim();
    if(line.length>30)line=line.slice(0,30);
    return line||"知识卡片";
  }
  function copyText(t){
    if(!t)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toastx("已复制")},function(){fallbackCopy(t)});
    }else fallbackCopy(t);
  }
  function fallbackCopy(t){
    var ta=document.createElement("textarea");
    ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy")}catch(e){}
    document.body.removeChild(ta);
    toastx("已复制");
  }
  function toastx(msg){
    var t=safe("toast",null);
    if(typeof t==="function")t(msg);
  }
  function catOptions(){
    var CAT=safe("CAT",{}),names=[];
    Object.keys(CAT).forEach(function(k){if(CAT[k]&&CAT[k].name)names.push(CAT[k].name)});
    var opts=['<option value="未分类">未分类</option>'];
    names.forEach(function(n){opts.push('<option value="'+esc(n)+'">'+esc(n)+'</option>')});
    return opts.join("");
  }
  var cardTarget=null;
  var cardEditId="";
  function ensureCardMask(){
    if($("cardMask"))return;
    var host=document.createElement("div");
    host.className="card-mask";host.id="cardMask";host.hidden=true;
    host.innerHTML='<div class="card-box" role="dialog" aria-modal="true">'
      +'<div class="card-h"><b id="cardHt">存为知识卡片</b><span>存在这台电脑的浏览器里，可随时回看</span></div>'
      +'<label class="ai-f"><span>标题</span><input id="cardTitle" maxlength="60" spellcheck="false"></label>'
      +'<label class="ai-f"><span>分类</span><select id="cardCat">'+catOptions()+'</select></label>'
      +'<label class="ai-f"><span>内容（可删改，支持 Markdown）</span><textarea id="cardText" rows="7"></textarea></label>'
      +'<div class="card-foot"><span class="ai-hint" id="cardHint"></span><button class="card-btn" id="cardCancel" type="button">取消</button><button class="card-btn primary" id="cardSave" type="button">保存</button></div>'
      +'</div>';
    document.body.appendChild(host);
    host.addEventListener("click",function(e){if(e.target===host)closeCard()});
    $("cardCancel").onclick=closeCard;
    $("cardSave").onclick=commitCard;
  }
  function openCardEditor(wrap){
    if(!wrap)return;
    ensureCardMask();
    cardEditId="";
    var b=wrap.querySelector(".ai-bubble");
    var raw=wrap.__raw||"";
    var selTxt="";
    try{
      var sel=window.getSelection();
      if(sel&&sel.toString().trim()&&b&&b.contains(sel.anchorNode))selTxt=sel.toString().trim();
    }catch(e){}
    var text=selTxt||raw||(b?String(b.innerText||"").trim():"");
    if(!text)return;
    cardTarget=wrap;
    var hint=$("cardHint");if(hint)hint.textContent=selTxt?"只保存你选中的这段":"保存整段回答，可自行删改";
    $("cardSave").textContent="保存";
    $("cardHt").textContent="存为知识卡片";
    $("cardTitle").value=makeTitle(selTxt||text);
    $("cardCat").value="未分类";
    $("cardText").value=text;
    $("cardMask").hidden=false;
    $("cardTitle").focus();$("cardTitle").select();
  }
  function openCardEdit(id){
    var c=readCards().filter(function(x){return x.id===id})[0];
    if(!c)return;
    ensureCardMask();
    cardTarget=null;cardEditId=id;
    var hint=$("cardHint");if(hint)hint.textContent="改完点「保存修改」，只动这一张卡片";
    $("cardSave").textContent="保存修改";
    $("cardHt").textContent="修改知识卡片";
    $("cardTitle").value=c.t;
    var sel=$("cardCat");
    if(c.cat&&Array.prototype.some.call(sel.options,function(o){return o.value===c.cat}))sel.value=c.cat;
    else{sel.value="未分类";}
    $("cardText").value=c.text;
    $("cardMask").hidden=false;
    $("cardTitle").focus();$("cardTitle").select();
  }
  function closeCard(){
    var m=$("cardMask");if(m)m.hidden=true;
    cardTarget=null;cardEditId="";
    var sv=$("cardSave");if(sv)sv.textContent="保存";
    var h=$("cardHint");if(h)h.textContent="";
  }
  function commitCard(){
    var t=$("cardTitle").value.trim()||"知识卡片";
    var cat=$("cardCat").value||"未分类";
    var text=$("cardText").value.trim();
    if(!text){$("cardHint").textContent="内容不能为空";return}
    var list=readCards(),editing=!!cardEditId,found=false;
    if(editing){
      list.forEach(function(c){
        if(c.id===cardEditId){c.t=t;c.cat=cat;c.text=text;c.up=Date.now();found=true}
      });
    }
    if(!editing||!found)list.unshift({id:newId(),t:t,cat:cat,text:text,ts:Date.now()});
    saveCards(list);
    closeCard();
    toastx(editing&&found?"卡片已更新":"已存入知识卡片");
    if(location.hash==="#cards")window.CardsPage();
  }
  function cardHTML(c){
    return '<article class="ncard"><div class="ncard-top"><span class="ncard-cat">'+esc(c.cat||"未分类")+'</span>'
      +'<h3>'+esc(c.t)+'</h3>'
      +'<button class="ncard-del" type="button" data-cdel="'+esc(c.id)+'" title="删除这张卡片">✕</button></div>'
      +'<div class="ncard-body">'+md(c.text)+'</div>'
      +'<div class="ncard-foot"><span>'+esc(fmtTime(c.ts))+(c.up?" · 改于"+esc(fmtTime(c.up)):"")+'</span>'
      +'<div class="ncard-tools"><button type="button" data-cedit="'+esc(c.id)+'">编辑</button><button type="button" data-ccopy="'+esc(c.id)+'">复制</button></div></div>'
      +'</article>';
  }

  /* ---------- 页面 ---------- */
  function pageHTML(){
    var opts=Object.keys(PRESETS).map(function(k){return '<option value="'+k+'">'+PRESETS[k].label+'</option>'}).join("");
    return '<div class="ai-page">'
      +'<div class="ai-top"><div class="ai-title">AI 问答</div>'
        +'<div class="ai-topr">'
          +'<button class="ai-gear" id="aiHistBtn" type="button">历史</button>'
          +'<button class="ai-gear" id="aiGear" type="button">⚙ 模型</button>'
          +'<div class="ai-hist" id="aiHist" hidden></div>'
        +'</div>'
      +'</div>'
      +'<div class="ai-setup" id="aiSetup" hidden>'
        +'<div class="ai-grid">'
          +'<label class="ai-f"><span>服务商</span><select id="aiProvider">'+opts+'</select></label>'
          +'<label class="ai-f"><span>模型</span><input id="aiModel" spellcheck="false" autocomplete="off"></label>'
        +'</div>'
        +'<label class="ai-f"><span>API Key</span><input id="aiKey" type="password" spellcheck="false" autocomplete="off" placeholder="sk-…"></label>'
        +'<label class="ai-f"><span>Base URL</span><input id="aiBase" spellcheck="false" autocomplete="off"></label>'
        +'<div class="ai-setup-foot"><span class="ai-hint" id="aiHint"></span></div>'
      +'</div>'
      +'<div class="ai-feed" id="aiFeed"></div>'
      +'<div class="ai-compose"><div class="ai-len" id="aiLen"><button type="button" data-len="brief">精简</button><button type="button" data-len="full">详细</button></div><div class="ai-box"><textarea id="aiInput" rows="1" placeholder="问点什么…"></textarea><button class="ai-send" id="aiSend" type="button">发送</button></div></div>'
      +'<button class="ai-down" id="aiDown" type="button" title="回到底部">↓</button>'
    +'</div>';
  }

  function grow(){
    var t=$("aiInput");if(!t)return;
    t.style.height="auto";
    t.style.height=Math.min(t.scrollHeight||28,170)+"px";
  }
  function nearBottom(){return window.innerHeight+window.scrollY>=document.body.scrollHeight-160}
  function toBottom(){window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
  function toBottomNow(){window.scrollTo(0,document.body.scrollHeight)}
  function updateDown(){
    var b=$("aiDown");if(!b)return;
    var gap=document.body.scrollHeight-window.innerHeight-window.scrollY;
    b.classList.toggle("on",gap>260);
  }

  /* ---------- 会话历史 ---------- */
  function fmtTime(ts){
    var d=new Date(ts||Date.now());
    var p=function(n){return n<10?"0"+n:""+n};
    var same=(new Date()).toDateString()===d.toDateString();
    return (same?"今天 ":((d.getMonth()+1)+"月"+d.getDate()+"日 "))+p(d.getHours())+":"+p(d.getMinutes());
  }
  function renderHist(){
    var box=$("aiHist");if(!box)return;
    var h='<button class="ai-hist-new" type="button" data-new="1">＋ 新对话</button>';
    if(!sessions.length)h+='<div class="ai-hist-empty">还没有历史会话</div>';
    else sessions.forEach(function(s){
      h+='<div class="ai-hist-item" data-sess="'+esc(s.id)+'">'
        +'<b>'+esc(s.title||"未命名会话")+'</b>'
        +'<i>'+esc(fmtTime(s.ts))+'</i>'
        +'<button class="ai-hist-del" type="button" data-del="'+esc(s.id)+'" title="删除">✕</button>'
        +'</div>';
    });
    box.innerHTML=h;
  }
  function openHist(open){
    var box=$("aiHist");if(!box)return;
    if(open)renderHist();
    box.hidden=!open;
  }
  function loadSession(id){
    var rec=null;
    for(var i=0;i<sessions.length;i++)if(sessions[i].id===id){rec=sessions[i];break}
    if(!rec)return;
    gen++;
    sid=rec.id;
    chat=rec.msgs.map(function(m){return {role:m.role,content:m.content}});
    paint();
    openHist(false);
  }

  function bubble(role,html){
    var feed=$("aiFeed");if(!feed)return null;
    var wrap=document.createElement("div");
    wrap.className="ai-msg "+(role==="user"?"user":"bot");
    var b=document.createElement("div");
    b.className="ai-bubble";
    b.innerHTML=html;
    wrap.appendChild(b);
    if(role!=="user"){
      var acts=document.createElement("div");
      acts.className="ai-acts";
      acts.setAttribute("data-pending","1");
      acts.innerHTML='<button type="button" data-save>＋ 存为卡片</button><button type="button" data-copy>复制</button>';
      wrap.appendChild(acts);
      wrap.__raw="";
    }
    feed.appendChild(wrap);
    return b;
  }
  function paint(){
    var feed=$("aiFeed");if(!feed)return;
    feed.innerHTML="";
    chat.forEach(function(m){
      var el=bubble(m.role==="user"?"user":"bot",m.role==="user"?esc(m.content).replace(/\n/g,"<br>"):md(m.content));
      if(el&&m.role!=="user"&&el.parentNode){
        el.parentNode.__raw=m.content;
        var ax=el.parentNode.querySelector(".ai-acts");
        if(ax)ax.removeAttribute("data-pending");
      }
    });
    if(chat.length){
      toBottomNow();
      requestAnimationFrame(function(){toBottomNow();updateDown()});
      setTimeout(updateDown,120);
    }else{
      updateDown();
    }
  }

  function setup(open,hint){
    var box=$("aiSetup");if(!box)return;
    box.hidden=!open;
    var h=$("aiHint");if(h)h.textContent=hint||"";
    if(open&&hint&&$("aiKey"))$("aiKey").focus();
  }

  function syncFields(){
    var p=$("aiProvider"),k=$("aiKey"),b=$("aiBase"),m=$("aiModel");
    if(!p)return;
    p.value=cfg.provider;k.value=cfg.key;b.value=cfg.base||pre().base;m.value=cfg.model||pre().model;
    markLen();
  }
  function markLen(){
    var box=$("aiLen");if(!box)return;
    [].forEach.call(box.querySelectorAll("[data-len]"),function(b){b.classList.toggle("on",b.getAttribute("data-len")===cfg.len)});
  }

  function bind(){
    var gear=$("aiGear"),box=$("aiSetup"),input=$("aiInput"),sendBtn=$("aiSend");
    gear.addEventListener("click",function(){box.hidden=!box.hidden;if(!box.hidden){var h=$("aiHint");if(h)h.textContent=""}});
    $("aiProvider").addEventListener("change",function(e){
      var old=PRESETS[cfg.provider],nw=PRESETS[e.target.value]||PRESETS.custom;
      var b=$("aiBase"),m=$("aiModel");
      if(b.value.trim()===""||b.value.trim()===(old.base||""))b.value=nw.base;
      if(m.value.trim()===""||m.value.trim()===(old.model||""))m.value=nw.model;
      cfg.provider=e.target.value;cfg.base=b.value.trim();cfg.model=m.value.trim();
      saveCfg();
    });
    [["aiKey","key"],["aiBase","base"],["aiModel","model"]].forEach(function(pair){
      $(pair[0]).addEventListener("input",function(e){cfg[pair[1]]=e.target.value;saveCfg();if(pair[1]==="key"){var h=$("aiHint");if(h)h.textContent=""}});
    });
    input.addEventListener("input",grow);
    input.addEventListener("keydown",function(e){
      if(e.key==="Enter"&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.isComposing){e.preventDefault();submit()}
    });
    sendBtn.addEventListener("click",function(){
      if(busy){if(ctl)ctl.abort();return}
      submit();
    });
    $("aiLen").addEventListener("click",function(e){
      var b=e.target.closest?e.target.closest("[data-len]"):null;
      if(!b)return;
      cfg.len=b.getAttribute("data-len");saveCfg();markLen();
    });
    var histBtn=$("aiHistBtn"),hist=$("aiHist");
    histBtn.addEventListener("click",function(e){
      e.stopPropagation();
      var willOpen=hist.hidden;
      if(willOpen)box.hidden=true;
      openHist(willOpen);
    });
    hist.addEventListener("click",function(e){
      e.stopPropagation();
      var del=e.target.closest?e.target.closest("[data-del]"):null;
      if(del){
        var did=del.getAttribute("data-del");
        sessions=sessions.filter(function(s){return s.id!==did});
        saveSessions();
        if(did===sid){newChat();paint()}
        renderHist();
        return;
      }
      if(e.target.closest("[data-new]")){persistCurrent();newChat();paint();openHist(false);return}
      var row=e.target.closest?e.target.closest("[data-sess]"):null;
      if(row)loadSession(row.getAttribute("data-sess"));
    });
    var down=$("aiDown");
    down.addEventListener("click",function(){toBottom();updateDown()});
    var feed=$("aiFeed");
    feed.addEventListener("click",function(e){
      var sv=e.target.closest?e.target.closest("[data-save]"):null;
      if(sv){openCardEditor(sv.closest(".ai-msg"));return}
      var cp=e.target.closest?e.target.closest("[data-copy]"):null;
      if(cp){
        var w=cp.closest(".ai-msg");
        var raw=w&&w.__raw?w.__raw:(w&&w.querySelector(".ai-bubble")?w.querySelector(".ai-bubble").innerText:"");
        copyText(raw);
      }
    });
  }

  function submit(){
    var t=$("aiInput");if(!t)return;
    var q=t.value.trim();
    if(!q)return;
    if(!cfg.key||!cfg.key.trim()){setup(true,"先填 API Key");return}
    if(!modelName()){setup(true,"先填模型名");return}
    if(!endpoint()){setup(true,"先填 Base URL");return}
    t.value="";grow();
    send(q);
  }

  function httpMsg(status,body){
    var detail="";
    try{
      var o=JSON.parse(body);
      detail=(o&&o.error&&(o.error.message||o.error.code))||o.message||o.msg||"";
    }catch(e){detail=String(body||"").replace(/\s+/g," ").slice(0,140)}
    detail=String(detail||"").slice(0,200);
    var base;
    if(status===401)base="Key 无效或已过期（401）";
    else if(status===403)base="没有访问权限，可能没开通该模型或联网组件（403）";
    else if(status===404)base="模型名或 Base URL 不对（404）";
    else if(status===429)base="请求太频繁或额度用尽（429）";
    else if(status===402)base="账户余额不足（402）";
    else if(status===400)base=/content\s*exists\s*risk/i.test(detail)?"内容触发了审核（400）":"请求参数有问题（400）";
    else if(status>=500)base="服务端出错，稍后再试（"+status+"）";
    else base="请求失败（"+status+"）";
    return detail?base+"："+detail:base;
  }

  function build(q){
    var brief=cfg.len!=="full";
    var rule=brief
      ?"5. 篇幅：极简。全文不超过 120 字，只给一句结论加 2~3 条要点，每条一行，不展开、不举例、不写套话。"
      :"5. 篇幅：详细。全文不超过 350 字，给结论后分 3~5 点展开，每点一两句，不写套话、不重复。";
    var body={model:modelName(),stream:true,temperature:0.5,max_tokens:brief?520:1300,messages:[
      {role:"system",content:"你是考研政治的答题助手，服务对象是备考 2027 年的学生，口径以马工程教材和最新官方文件为准。"+
        "回答要求：1. 先用一句话给结论，再分点展开，可以直接背；2. 用教材原话表述，并点明属于马原/毛中特/新思想/史纲/思法哪一块；"+
        "3. 涉及最新会议、文件、提法时，按核对后的事实写，并说明可能怎么考；4. 不寒暄、不复述问题、不输出参考文献或来源链接。"+rule}
    ]};
    chat.slice(-8).forEach(function(m){body.messages.push({role:m.role,content:m.content})});
    var ctx=context(q);
    body.messages.push({role:"user",content:ctx?q+"\n\n"+ctx:q});
    if(cfg.provider==="deepseek")body.tools=[{type:"deepseek_web_search"},{type:"deepseek_read_url"}];
    else if(cfg.provider==="ark")body.web_search_options={};
    else if(cfg.provider==="dashscope")body.enable_search=true;
    return body;
  }

  function send(q){
    busy=true;
    var my=gen;
    ctl=(typeof AbortController!=="undefined")?new AbortController():null;
    var sendBtn=$("aiSend");
    if(sendBtn){sendBtn.textContent="停止";sendBtn.classList.add("stop")}
    var payload=build(q);
    bubble("user",esc(q).replace(/\n/g,"<br>"));
    chat.push({role:"user",content:q});persistCurrent();
    if(nearBottom())toBottom();
    var b=bubble("bot",'<span class="ai-typing"><i></i><i></i><i></i></span>');
    var acc="";
    var hitLimit=false;
    var url=endpoint();
    fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+(cfg.key||"").trim()},
      body:JSON.stringify(payload),
      signal:ctl?ctl.signal:undefined
    }).then(function(res){
      if(stale(my))return;
      if(!res.ok)return res.text().then(function(t){throw new Error(httpMsg(res.status,t))});
      if(!res.body||!res.body.getReader)throw new Error("这个浏览器不支持流式输出，换 Chrome 或 Edge 试试");
      var reader=res.body.getReader(),dec=new TextDecoder("utf-8"),buf="";
      function pump(){
        return reader.read().then(function(r){
          if(r.done)return;
          if(stale(my))return;
          buf+=dec.decode(r.value,{stream:true});
          var idx;
          while((idx=buf.indexOf("\n"))>=0){
            var line=buf.slice(0,idx).replace(/\r$/,"").trim();
            buf=buf.slice(idx+1);
            if(line.indexOf("data:")!==0)continue;
            var payload=line.slice(5).trim();
            if(payload==="[DONE]"){buf="";break}
            var obj;try{obj=JSON.parse(payload)}catch(e){continue}
            var ch=obj.choices&&obj.choices[0];
            if(ch&&ch.finish_reason==="length")hitLimit=true;
            var d=ch&&ch.delta;
            if(d&&d.content){acc+=d.content;b.innerHTML=md(acc);if(nearBottom())toBottom()}
          }
          return pump();
        });
      }
      return pump();
    }).then(function(){
      if(stale(my))return;
      if(!acc.trim())throw new Error("模型没有返回内容：检查模型名是否可用，或换个说法再试");
      b.innerHTML=md(acc)+(hitLimit?'<div class="ai-hint" style="margin-top:8px">（已到字数上限，需要更完整可以切到「详细」再问一次）</div>':"");
      markRaw(b,acc);
      chat.push({role:"assistant",content:acc});persistCurrent();
      if(nearBottom())toBottom();
    }).catch(function(e){
      if(stale(my))return;
      var msg;
      if(e&&e.name==="AbortError"){
        if(acc.trim()){b.innerHTML=md(acc);markRaw(b,acc);chat.push({role:"assistant",content:acc});persistCurrent()}
        else b.innerHTML='<div class="ai-err">已停止</div>';
        return;
      }
      if(e&&/Failed to fetch|NetworkError|Load failed/i.test(e.message||""))msg="连不上这个接口：检查网络，或确认该地址允许网页直接调用（跨域）。";
      else msg=(e&&e.message)?e.message:"请求失败";
      if(acc.trim()){b.innerHTML=md(acc)+'<div class="ai-err" style="margin-top:10px">'+esc(msg)+"</div>";markRaw(b,acc);chat.push({role:"assistant",content:acc});persistCurrent()}
      else b.innerHTML='<div class="ai-err">'+esc(msg)+"</div>";
    }).then(function(){
      if(stale(my))return;
      busy=false;ctl=null;
      if(sendBtn){sendBtn.textContent="发送";sendBtn.classList.remove("stop")}
    });
  }

  window.CardsPage=function(){
    var host=$("content");if(!host)return;
    var list=readCards();
    var headH='<div class="cards-page"><div class="cards-head"><div class="cards-t"><div class="eyebrow">KNOWLEDGE CARDS</div><h2>知识卡片</h2>'
      +'<p>AI 回答下面点「＋ 存为卡片」就能收藏；先在回答里划选一段再点，就只存选中的那几句。卡片只存在这台电脑的浏览器里。</p></div>'
      +'<div class="cards-stat"><b>'+list.length+'</b><span>张卡片</span></div></div>';
    var body=list.length?list.map(cardHTML).join(""):'<div class="empty"><b>还没有知识卡片</b>去「AI 问答」问一个问题，回答下面点「＋ 存为卡片」；划选一段再点，只存选中的部分。</div>';
    host.innerHTML=headH+body+'</div>';
    paintCardCount();
  };

  document.addEventListener("click",function(e){
    var del=e.target.closest?e.target.closest("[data-cdel]"):null;
    if(del){
      var id=del.getAttribute("data-cdel");
      if(!window.confirm("删除这张知识卡片？"))return;
      saveCards(readCards().filter(function(c){return c.id!==id}));
      if(location.hash==="#cards")window.CardsPage();else paintCardCount();
      return;
    }
    var ed=e.target.closest?e.target.closest("[data-cedit]"):null;
    if(ed){openCardEdit(ed.getAttribute("data-cedit"));return}
    var cp=e.target.closest?e.target.closest("[data-ccopy]"):null;
    if(cp){
      var cid=cp.getAttribute("data-ccopy");
      var one=readCards().filter(function(x){return x.id===cid})[0];
      if(one)copyText(one.text);
    }
  });

  window.AIPage=function mount(){
    var host=$("content");if(!host)return;
    if(ctl){try{ctl.abort()}catch(e){}}
    ctl=null;busy=false;
    host.innerHTML=pageHTML();
    newChat();                     /* 每次进入都开一个新会话 */
    syncFields();
    bind();
    paint();
    var pq=pendingQ;pendingQ="";
    var pa=pendingAuto;pendingAuto=false;
    if(pq){var i=$("aiInput");i.value=pq;grow();i.focus()}
    else{$("aiInput").focus()}
    if(pa&&pq)setTimeout(function(){if(!busy)submit()},80);
  };

  function goAI(q,auto){
    if(q)pendingQ=q;
    if(auto)pendingAuto=true;
    if(location.hash==="#ai"){window.AIPage()}
    else location.hash="ai";
  }

  document.addEventListener("click",function(e){
    var btn=e.target.closest?e.target.closest("#aiBtn"):null;
    if(btn){e.preventDefault();goAI();return}
    var ask=e.target.closest?e.target.closest("[data-ai-item]"):null;
    if(ask){
      var id=ask.getAttribute("data-ai-item");
      var byId=safe("byId",null),item=(typeof byId==="function")?byId(id):null;
      var close=document.querySelector("#modalBox [data-close]");
      if(close)close.click();else{$("modal").classList.add("hidden")}
      goAI(item?("请把「"+item.t+"」讲透：核心内容、命题角度、易混点，再联网核对最新表述。"):"");
      return;
    }
    /* 普通搜索没找到 / 不满意：把搜索词直接带到 AI 并开始回答 */
    var aq=e.target.closest?e.target.closest("[data-ai-q]"):null;
    if(aq){
      e.preventDefault();
      var qq=(aq.getAttribute("data-ai-q")||"").trim();
      goAI(qq?("「"+qq+"」在考研政治里怎么考？给结论、教材口径要点和易混点。"):"",true);
      return;
    }
    /* 点面板以外的地方收起历史列表 */
    var hb=$("aiHist");
    if(hb&&!hb.hidden&&!(e.target.closest&&e.target.closest(".ai-topr")))hb.hidden=true;
  });

  window.addEventListener("scroll",function(){updateDown()},{passive:true});
  window.addEventListener("resize",function(){updateDown()});

  document.addEventListener("keydown",function(e){
    if(e.altKey&&(e.key==="a"||e.key==="A")){e.preventDefault();goAI()}
    if(e.key==="Escape"&&$("cardMask")&&!$("cardMask").hidden){e.preventDefault();closeCard()}
  });

  /* 直接以 #ai 打开或刷新时，脚本一已先渲染过一轮，这里补一次挂载 */
  if(location.hash==="#ai"&&!document.querySelector(".ai-page"))window.AIPage();
  /* 直接以 #cards 打开或刷新时同理 */
  if(location.hash==="#cards"&&!document.querySelector(".cards-page"))window.CardsPage();
  paintCardCount();
})();
</script>
</body>
</html>
