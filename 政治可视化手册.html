add("event","旧民主主义革命：侵略与早期探索",[
{id:"e1840-opium",y:1840,d:"1840.6—1842.8",t:"第一次鸦片战争",p:1,b:"英国为维护鸦片贸易和打开中国市场发动侵略战争，清政府腐败落后、抵抗失败。",c:"战争以清政府战败告终，随后签订近代中国第一个不平等条约《南京条约》，中国领土、关税、贸易等主权遭到破坏。",m:"中国开始沦为半殖民地半封建社会，鸦片战争成为中国近代史起点，社会主要矛盾和革命任务随之发生变化。",x:"近代史起点是1840年鸦片战争；半殖民地半封建社会完全形成常以《辛丑条约》签订为标志，两个程度不可混。",r:["e1842-nanjing","doc-haiguo"]},
{id:"e1842-nanjing",y:1842,d:"1842.8.29",t:"《南京条约》签订",p:1,b:"清政府在第一次鸦片战争中战败，被迫与英国议和。",c:"割香港岛给英国，赔款，开放广州、厦门、福州、宁波、上海五口通商，协定关税等。",m:"中国主权和领土完整遭到破坏，开始被卷入资本主义世界市场，半殖民地化程度加深。",x:"《南京条约》是近代中国第一个不平等条约；割让台湾全岛及附属岛屿、澎湖列岛对应1895年《马关条约》。",r:["e1840-opium","e1895-maguan"]},
{id:"e1851-taiping",y:1851,d:"1851.1—1864.7",t:"太平天国运动",p:1,b:"鸦片战争后阶级矛盾和社会危机加深，广大农民负担沉重，洪秀全等发动反清起义。",c:"金田起义后建立太平天国，颁布《天朝田亩制度》，后期洪仁玕提出《资政新篇》，最终在清政府与外国侵略者联合镇压下失败。",m:"沉重打击清王朝统治和外国侵略势力，是旧式农民战争最高峰；失败说明单纯农民战争不能完成争取民族独立和人民解放的任务。",x:"《天朝田亩制度》体现绝对平均主义空想；《资政新篇》具有资本主义色彩但不是农民战争实践产物。",r:["doc-taiping","doc-zizheng","e1861-western"]},
{id:"e1856-opium2",y:1856,d:"1856.10—1860.10",t:"第二次鸦片战争",p:2,b:"英法为进一步打开中国市场、扩大侵略权益，借口发动战争。",c:"英法联军侵华并迫使清政府签订《天津条约》《北京条约》等，俄国趁机强迫清政府割占中国大片领土。",m:"中国半殖民地化程度进一步加深，清政府统治危机加剧，也刺激洋务派开展自救。",x:"火烧圆明园发生在第二次鸦片战争期间，不是八国联军侵华期间。",r:["e1842-nanjing","e1861-western"]},
{id:"e1861-western",y:1861,d:"19世纪60—90年代",t:"洋务运动",p:1,b:"第二次鸦片战争后，清政府内部分官员为挽救统治危机，主张学习西方先进技术实现自强求富。",c:"以“中学为体，西学为用”为指导，兴办近代军事工业、民用企业、新式海陆军和新式学堂，派遣留学生。",m:"客观上促进中国早期工业和民族资本主义发展、传播近代知识，是近代化探索的重要一步；但未触动封建制度，甲午战败标志其破产。",x:"洋务运动是地主阶级自救，不是资产阶级维新；根本目的是维护清朝封建统治。",r:["e1856-opium2","e1894-sino","doc-haiguo"]}
]);
add("event","旧民主主义革命：民族危机与制度探索",[
{id:"e1894-sino",y:1894,d:"1894.7—1895.4",t:"中日甲午战争",p:1,b:"日本蓄意对外扩张，清政府腐败且军备废弛，朝鲜问题成为战争导火索。",c:"清军战败，北洋海军全军覆没，清政府被迫签订《马关条约》。",m:"中国半殖民地化程度大大加深，列强掀起瓜分中国狂潮；战争失败也宣告洋务运动破产，激发新的救亡觉醒。",x:"“师夷长技以制夷”早已提出，甲午战争后更突出“救亡图存”“振兴中华”的时代强音。",r:["e1861-western","e1895-maguan","e1898-reform"]},
{id:"e1895-maguan",y:1895,d:"1895.4.17",t:"《马关条约》与公车上书",p:1,b:"甲午战败后清政府被迫议和；条约消息传来，民族危机空前加深。",c:"《马关条约》割台湾全岛及附属岛屿、澎湖列岛给日本，赔偿巨款并允许日本在通商口岸设厂；康有为、梁启超等联合举人公车上书，请求变法。",m:"列强资本输出和瓜分狂潮加剧，公车上书标志维新变法思潮发展为政治运动。",x:"允许外国在华设厂体现资本输出要求；不要把割台湾写成《南京条约》内容。",r:["e1894-sino","e1898-reform","e1945-taiwan"]},
{id:"e1898-reform",y:1898,d:"1898.6.11—9.21",t:"戊戌变法（百日维新）",p:1,b:"甲午战后民族危机严重，资产阶级维新派希望通过自上而下的制度变革实现救亡图存。",c:"光绪帝颁布变法诏令，在政治、经济、军事、文化教育等方面推行改革，遭守旧势力镇压，历时103天。",m:"是爱国救亡运动、资产阶级性质政治改良运动和思想启蒙运动；失败说明在半殖民地半封建中国，自上而下的改良道路行不通。",x:"维新派主张君主立宪，不是民主共和；其失败不等于辛亥革命也必然因同一原因失败。",r:["e1895-maguan","doc-tianyan","e1911"]},
{id:"e1900-eight",y:1900,d:"1900—1901",t:"义和团运动与八国联军侵华",p:2,b:"民族危机和外国教会势力欺压激起群众反抗；列强借口镇压义和团扩大侵略。",c:"义和团以“扶清灭洋”为口号展开反帝斗争，八国联军侵华并占领北京，清政府被迫签订《辛丑条约》。",m:"义和团显示中国人民反抗精神但具有笼统排外和落后性；《辛丑条约》使清政府成为列强统治中国工具。",x:"义和团是农民群众反帝爱国运动，不是资产阶级革命；其口号既有反帝性也有封建忠君和笼统排外局限。",r:["e1901-xinchou","e1851-taiping"]},
{id:"e1901-xinchou",y:1901,d:"1901.9.7",t:"《辛丑条约》签订",p:1,b:"八国联军侵华后，清政府完全屈服于列强。",c:"清政府与十一国签订条约，巨额赔款、划定使馆界、拆毁炮台、允许驻军，并保证严禁人民参加反帝活动。",m:"清政府成为“洋人的朝廷”，中国完全沦为半殖民地半封建社会，民族危机和社会革命形势进一步发展。",x:"近代史“开始沦为”对应鸦片战争及《南京条约》，“完全沦为”对应《辛丑条约》。",r:["e1900-eight","sm-tongmenghui"]},
{id:"e1905-abolish",y:1905,d:"1905",t:"废除科举与革命团体联合",p:2,b:"清末新政和近代教育发展冲击旧选官制度，革命团体也需要联合。",c:"清政府宣布自1906年起停止科举考试；同年中国同盟会在东京成立，资产阶级革命力量实现联合。",m:"废科举促进新式教育和社会流动；同盟会成立推动民主革命进入新阶段。",x:"1905年既有废科举又有同盟会成立；三民主义在同盟会机关报《民报》发刊词中被概括。",r:["sm-tongmenghui","doc-minbao"]},
{id:"e1911",y:1911,d:"1911.10.10—1912",t:"辛亥革命（武昌起义）",p:1,b:"民族危机、清政府统治腐朽和清末新政预备立宪骗局使社会矛盾激化，资产阶级革命派长期宣传组织起义。",c:"武昌起义爆发，各省纷纷响应，清王朝统治迅速瓦解；1912年中华民国成立、清帝退位。",m:"推翻清王朝，结束中国两千多年君主专制制度，建立亚洲第一个共和制国家，推动思想解放和社会变革；但未完成反帝反封建任务，未改变社会性质。",x:"结束的是“君主专制制度”，不能说结束“封建制度”或“封建土地制度”；后者需结合土地改革理解。",r:["sm-tongmenghui","e1912-republic","e1912-provisional"]},
{id:"e1912-republic",y:1912,d:"1912.1.1—2.12",t:"中华民国成立与清帝退位",p:1,b:"武昌起义后独立各省筹建中央政权，南北议和推动清帝退位。",c:"孙中山在南京就任临时大总统，中华民国临时政府成立；2月12日清帝退位，随后革命果实被袁世凯窃取。",m:"宣告资产阶级共和国制度建立，但北洋军阀统治随即开始，说明资产阶级共和国方案未能在中国真正成功。",x:"民国成立和清帝退位是辛亥革命成果；袁世凯窃取果实说明革命具有不彻底性。",r:["e1911","e1912-provisional","e1915-culture"]},
{id:"e1912-provisional",y:1912,d:"1912.3.11",t:"《中华民国临时约法》颁布",p:1,b:"革命派试图以法律限制袁世凯权力并维护共和制度。",c:"规定中华民国主权属于国民全体，确立行政、立法、司法三权分立和责任内阁等原则。",m:"是中国历史上第一部具有资产阶级共和国宪法性质的重要法典，以法律形式否定君主专制。",x:"《临时约法》是资产阶级共和国宪法性质；《共同纲领》是临时宪法；1954年宪法是社会主义类型宪法。",r:["e1912-republic","doc-common","doc-1954const"]}
]);
add("event","新民主主义革命开端与建党准备",[
{id:"e1915-culture",y:1915,d:"1915.9起",t:"新文化运动",p:1,b:"北洋军阀统治下尊孔复古逆流泛滥，先进知识分子认为仅有政治制度变革不够，还需改造国民性。",c:"陈独秀在上海创办《青年杂志》（后改名《新青年》），提倡民主与科学，反对专制和愚昧，提倡新道德、新文学，反对旧道德、旧文学。",m:"是一次深刻思想启蒙和解放运动，为五四运动和马克思主义传播创造有利条件；前期对东西方文化存在绝对化倾向。",x:"新文化运动开始标志是《青年杂志》创刊；五四前主要宣传资产阶级民主主义，五四后马克思主义逐步成为主流。",r:["doc-xinqingnian","doc-marxli","e1919"]},
{id:"e1917-october",y:1917,d:"1917.11.7",t:"俄国十月革命",p:1,b:"帝国主义战争加深俄国社会矛盾，无产阶级政党和人民革命力量发展。",c:"布尔什维克领导彼得格勒武装起义，建立世界上第一个社会主义国家。",m:"开辟人类历史新纪元，给中国送来马克思列宁主义，为中国人民提供新的解放道路和思想启示。",x:"十月革命不是五四运动爆发的直接导火索；五四运动直接导火索是巴黎和会上中国外交失败。",r:["bk-state1917","doc-marxli","e1919"]},
{id:"e1919",y:1919,d:"1919.5.4起",t:"五四运动",p:1,b:"巴黎和会拒绝中国正义要求，将德国在山东权益转交日本，民族危机和新文化运动推动群众觉醒。",c:"北京学生发起爱国运动，随后上海工人罢工、商人罢市，运动扩展到全国，迫使北洋政府释放学生、罢免卖国贼职务并拒绝在和约上签字。",m:"是彻底反帝反封建的伟大爱国革命运动、伟大社会革命运动和伟大思想启蒙运动；促进马克思主义同工人运动结合，是中国新民主主义革命开端。",x:"五四运动标志新民主主义革命开端，不标志中国共产党成立；6月5日后工人阶级登上政治舞台并发挥主力军作用。",r:["e1917-october","e1921","doc-marxli"]},
{id:"e1920-org",y:1920,d:"1920起",t:"共产党早期组织建立与马克思主义传播",p:2,b:"五四运动后马克思主义同工人运动进一步结合，建党需要思想、干部和组织准备。",c:"上海、北京、武汉、长沙、济南、广州及旅日、旅法等地建立共产党早期组织，开展宣传、工人运动和建党建团准备；《共产党宣言》中文全译本出版。",m:"为中国共产党正式成立奠定思想基础、阶级基础和组织基础。",x:"1920年最早共产党早期组织在上海成立，不等于1921年全国性中国共产党正式成立。",r:["doc-declaration-1920","e1921","c1"]}
]);
add("event","大革命与土地革命战争兴起",[
{id:"e1921",y:1921,d:"1921.7",t:"中国共产党成立",p:1,b:"马克思主义传播、工人阶级成长、五四运动和早期组织建立共同准备建党条件。",c:"中共一大召开，确定党的名称、第一个纲领和中央领导机构，全国性无产阶级政党正式诞生。",m:"中国革命有了坚强领导核心和新的科学理论指导，是开天辟地的大事变，深刻改变中华民族发展方向和进程。",x:"党的成立使中国革命面貌焕然一新，但不等于新民主主义革命胜利或社会主义制度建立。",r:["c1","e1919","c2"]},
{id:"e1923",y:1923,d:"1923.2.7",t:"京汉铁路工人大罢工",p:2,b:"党成立后领导工人运动，京汉铁路总工会成立遭到军阀吴佩孚武力阻挠。",c:"全路工人举行总同盟罢工，遭到血腥镇压，林祥谦、施洋等英勇牺牲。",m:"显示中国工人阶级力量，也使党认识到仅靠工人阶级单枪匹马不能胜利，必须联合其他革命力量、建立统一战线。",x:"这次罢工是第一次工人运动高潮顶点；中共三大建立统一战线的决策与这一教训相关。",r:["c3","sm-kmt1"]},
{id:"e1925",y:1925,d:"1925.5.30起",t:"五卅运动",p:2,b:"帝国主义压迫和资本家剥削引发上海工人、学生抗议，英国巡捕开枪制造五卅惨案。",c:"上海工人罢工、学生罢课、商人罢市，反帝爱国运动迅速扩展全国。",m:"掀起全国范围大革命高潮，显示工人阶级和广大人民群众反帝力量。",x:"五四运动是新民主主义革命开端；五卅运动是大革命高潮的重要标志，不要混淆。",r:["c4","e1926-north"]},
{id:"e1926-north",y:1926,d:"1926.7起",t:"北伐战争",p:1,b:"第一次国共合作建立，广东革命根据地巩固，人民要求推翻北洋军阀统治。",c:"国民革命军出师北伐，主要打击吴佩孚、孙传芳、张作霖三派军阀，工农群众运动配合推进。",m:"基本推翻北洋军阀反动统治，推动工农运动发展；后因国民党右派叛变和党的主要领导人右倾错误，大革命最终失败。",x:"北伐基本推翻北洋军阀统治不等于全国统一或新民主主义革命完成。",r:["sm-kmt1","e1925","e1927-fail"]},
{id:"e1927-fail",y:1927,d:"1927.4—7",t:"四一二、七一五与大革命失败",p:1,b:"国民党右派在帝国主义和大地主大资产阶级支持下叛变革命，党内右倾机会主义放弃革命领导权。",c:"蒋介石、汪精卫先后发动反革命政变，大肆屠杀共产党员和革命群众，第一次国共合作破裂。",m:"大革命由高潮转向失败，教训是必须坚持无产阶级领导权、掌握革命武装并建立巩固工农联盟。",x:"大革命失败不是由于建立了统一战线，而是右倾错误、敌强我弱等多重因素；八七会议实现历史性转变。",r:["e1926-north","rm-87","e-nanchang"]},
{id:"e-nanchang",y:1927,d:"1927.8.1",t:"南昌起义",p:1,b:"大革命失败后，中国共产党必须独立领导武装斗争反抗国民党反动派屠杀。",c:"周恩来、贺龙、叶挺、朱德、刘伯承等领导起义，占领南昌后南下转移。",m:"打响武装反抗国民党反动派第一枪，标志中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。",x:"南昌起义是“开端”，八七会议是“总方针和历史性转变”，三湾改编是“党领导军队的重要开端”，古田会议是“定型”。",r:["rm-87","rm-sanwan","rm-gutian"]},
{id:"e-autumn",y:1927,d:"1927.9.9起",t:"湘赣边界秋收起义",p:1,b:"八七会议后，毛泽东回湖南领导工农革命军举行武装起义。",c:"起义军公开打出中国共产党旗帜，进攻长沙受挫后向农村转移，经三湾改编后向井冈山进军。",m:"为保存革命力量、转向农村建立根据地和探索新革命道路创造实践条件。",x:"秋收起义公开打出共产党旗帜；南昌起义沿用国民革命军番号，不要混。",r:["rm-sanwan","e-jinggang","mao-spark"]},
{id:"e-jinggang",y:1927,d:"1927.10起",t:"井冈山革命根据地创建",p:1,b:"城市武装起义受挫，中国政治经济发展不平衡和敌人农村统治薄弱，为农村割据提供可能。",c:"毛泽东率部到达井冈山，开展土地革命、武装斗争和根据地建设，1928年朱德、陈毅率部与毛泽东部会师，成立红四军。",m:"创建第一个农村革命根据地，点燃工农武装割据星星之火，为农村包围城市、武装夺取政权道路奠定实践基础。",x:"井冈山根据地是第一个农村革命根据地；中央革命根据地后来以瑞金为中心，二者不完全等同。",r:["mao-jinggang","mao-red","sm-soviet1931"]}
]);
add("event","土地革命、长征与抗日救亡",[
{id:"e1931-918",y:1931,d:"1931.9.18",t:"九一八事变",p:1,b:"日本军国主义推行侵华政策，制造柳条湖事件并嫁祸中国军队。",c:"日军进攻沈阳，随后由于国民政府采取不抵抗政策，东北三省迅速沦陷。",m:"中国人民抗日战争的起点，揭开世界反法西斯战争序幕；此后中国人民局部抗战开始。",x:"九一八是抗战起点，七七事变是全民族抗战起点；十四年抗战从1931年算起。",r:["e1937-war","e1935-huabei"]},
{id:"e-longmarch",y:1934,d:"1934.10—1936.10",t:"红军长征",p:1,b:"第五次反“围剿”失败，中央红军被迫实行战略转移，其他主力红军也先后长征。",c:"中央红军突破封锁、召开遵义会议、四渡赤水、巧渡金沙江、强渡大渡河、翻雪山过草地，1935年到陕北；1936年红一、二、四方面军在甘肃会宁、静宁将台堡等地会师。",m:"长征胜利实现革命力量战略转移，保存党和红军基干力量，打开中国革命新局面，铸就伟大长征精神。",x:"长征胜利结束标志是1936年三大主力会师，不是1935年中央红军到陕北。",r:["rm-zunyi","e1936-longend","rm-pre-zunyi"]},
{id:"e1935-huabei",y:1935,d:"1935下半年",t:"华北事变",p:1,b:"日本占领东北后继续向华北扩张，国民政府妥协退让。",c:"日本通过一系列侵略和胁迫活动，控制华北部分政治、经济和军事权益，策动“华北自治”。",m:"中日民族矛盾进一步上升为主要矛盾，中华民族危机空前严重，推动国内阶级关系和党的统一战线策略调整。",x:"华北事变是瓦窑堡会议和一二九运动的重要背景，不要与九一八、七七混为同一节点。",r:["e1935-129","rm-wayaobao","doc-81"]},
{id:"e1935-129",y:1935,d:"1935.12.9",t:"一二九运动",p:1,b:"华北事变后民族危机加深，国民党当局继续压制抗日救亡活动。",c:"北平学生举行抗日救国示威游行，提出反对华北自治、停止内战一致抗日等主张，运动迅速扩展。",m:"揭露日本吞并华北阴谋，打击国民政府妥协政策，促进中华民族觉醒，掀起全国抗日救亡运动新高潮。",x:"五四运动标志新民主主义革命开端；一二九运动标志全国抗日救亡运动新高潮。",r:["e1935-huabei","rm-wayaobao","e-xian"]},
{id:"e1936-longend",y:1936,d:"1936.10",t:"红军三大主力会师与长征胜利",p:1,b:"各路红军经过长期战略转移，在西北实现会合。",c:"红二、红四方面军同红一方面军在甘肃会宁、静宁等地会师，长征胜利结束。",m:"保存革命骨干，宣告国民党围追堵截破产，实现党和革命事业从挫折走向胜利的伟大转折。",x:"遵义会议是生死攸关转折点；三大主力会师是长征胜利结束标志，两种地位不同。",r:["e-longmarch","rm-zunyi"]},
{id:"e-xian",y:1936,d:"1936.12.12—25",t:"西安事变及其和平解决",p:1,b:"民族危机日益严重，张学良、杨虎城要求停止内战、联共抗日，但蒋介石坚持“攘外必先安内”。",c:"张学良、杨虎城发动兵谏，扣留蒋介石；中国共产党从民族大义出发主张和平解决，各方努力后蒋介石接受停止内战、联共抗日等主张。",m:"西安事变和平解决成为时局转换的枢纽，十年内战基本结束，国内和平初步实现，为抗日民族统一战线建立创造条件。",x:"西安事变和平解决不等于第二次国共合作正式形成；正式形成是1937年9月宣言和谈话发表。",r:["e1937-cooperation","rm-wayaobao","e1935-129"]},
{id:"e1937-war",y:1937,d:"1937.7.7起",t:"七七事变（卢沟桥事变）",p:1,b:"日本为实现全面侵华，在卢沟桥附近制造军事冲突。",c:"日军炮轰宛平城，中国守军奋起抵抗，全国抗战由此开始。",m:"标志日本全面侵华战争开始和中国全民族抗战爆发，中国开辟世界反法西斯战争东方主战场。",x:"九一八＝抗战起点；七七＝全民族抗战起点；八一三事变后日军进攻上海。",r:["e1931-918","e1937-cooperation","rm-luochuan"]},
{id:"e1937-cooperation",y:1937,d:"1937.9",t:"第二次国共合作正式形成",p:1,b:"全民族抗战爆发和民族危机加深，国共双方需要在抗日民族统一战线中共同抗敌。",c:"9月22日国民党中央通讯社发表《中共中央为公布国共合作宣言》，23日蒋介石发表谈话，实际上承认中国共产党合法地位。",m:"标志以国共两党第二次合作为基础的抗日民族统一战线正式形成，为全民族抗战胜利提供重要政治保证。",x:"第一次合作正式形成是1924年国民党一大；第二次是1937年9月宣言和谈话，不是西安事变和平解决。",r:["sm-kmt1","e-xian","rm-luochuan"]},
{id:"e1937-pingxing",y:1937,d:"1937.9.25",t:"平型关大捷",p:2,b:"全民族抗战初期日军进攻山西，八路军需要在敌侧后配合正面战场并打击其气焰。",c:"八路军第一一五师在平型关东北伏击日军，取得大捷。",m:"是全民族抗战爆发后中国军队主动对日作战取得的第一个重大胜利，打破日军“不可战胜”神话，振奋全国军民。",x:"平型关大捷对应八路军伏击战；台儿庄大捷是国民党正面战场重大胜利，百团大战在1940年。",r:["e1938-taierzhuang","e1940-baituan"]},
{id:"e1937-nanjing",y:1937,d:"1937.12.13起",t:"南京大屠杀",p:2,b:"日军攻陷南京后，在侵略者战争暴行和军国主义驱使下实施大规模屠杀。",c:"侵华日军在南京及附近地区进行有组织、有计划、有预谋的大屠杀和暴行，大量中国平民和战俘遇害。",m:"充分暴露日本军国主义凶残本质，警示铭记历史、珍爱和平；12月13日为南京大屠杀死难者国家公祭日。",x:"国家公祭日是12月13日，中国人民抗日战争胜利纪念日是9月3日。",r:["e1937-war","e1945-victory"]}
]);
add("event","全民族抗战与党的建设",[
{id:"e1938-stalemate",y:1938,d:"1938.10",t:"广州、武汉失守与抗战进入战略相持阶段",p:1,b:"日军虽占领大片中国领土，但战线延长、兵力不足，中国坚持持久抗战，敌我力量对比开始变化。",c:"广州、武汉失守后，日军被迫停止大规模战略进攻，中国抗日战争进入战略相持阶段。",m:"印证《论持久战》对战争阶段的科学判断；敌后战场逐渐上升为抗战重要战场，中国共产党成为全民族抗战中流砥柱。",x:"战略相持不是抗战结束或战略反攻；相持阶段是持久战转到最后胜利的枢纽。",r:["mao-protracted","e1940-baituan"]},
{id:"e1938-taierzhuang",y:1938,d:"1938.3—4",t:"台儿庄大捷",p:2,b:"日军向徐州推进，中国第五战区部队组织防御和反击。",c:"李宗仁等指挥中国军队在台儿庄一带重创日军，取得重大胜利。",m:"是全民族抗战以来中国正面战场取得的最大一场胜仗，振奋全国抗战信心。",x:"平型关大捷是八路军主动对日作战第一个重大胜利；台儿庄大捷是正面战场重大胜利。",r:["e1937-pingxing","e1938-stalemate"]},
{id:"e1940-baituan",y:1940,d:"1940.8—12",t:"百团大战",p:1,b:"战略相持阶段日军对敌后根据地实行“囚笼政策”，国内妥协投降危险增加。",c:"八路军在华北组织100多个团，对日军交通线和据点发动大规模进攻和反“扫荡”作战。",m:"沉重打击日军侵略气焰，振奋全国军民抗战信心，提高共产党和八路军声望，显示敌后战场重要作用。",x:"百团大战是敌后战场大规模进攻战役，不是国民党正面战场战役。",r:["e1938-stalemate","rm-luochuan"]},
{id:"e1941-wannan",y:1941,d:"1941.1",t:"皖南事变",p:2,b:"抗战相持阶段国民党顽固派推行消极抗日、积极反共政策，制造第二次反共高潮。",c:"国民党军队在皖南伏击奉命北移的新四军军部及所属部队，新四军遭受重大损失；中国共产党坚持抗战团结进步并重建新四军军部。",m:"揭露国民党顽固派破坏抗战行径，中国共产党以斗争求团结，维护抗日民族统一战线大局。",x:"处理统一战线中顽固势力坚持有理、有利、有节，不是无原则退让或主动破裂统一战线。",r:["pl6-6","e-yananrectify"]},
{id:"e-yananrectify",y:1941,d:"1941.5—1945.4",t:"延安整风运动",p:1,b:"党内主观主义、宗派主义和党八股仍有影响，需要总结历史经验、端正思想路线。",c:"主要内容是反对主观主义以整顿学风、反对宗派主义以整顿党风、反对党八股以整顿文风；方针是惩前毖后、治病救人；1945年六届七中全会通过历史决议后胜利结束。",m:"是一次全党范围马克思主义思想教育运动，确立实事求是思想路线，实现全党空前团结统一，为抗战和新民主主义革命胜利奠定思想政治基础。",x:"整风首先从高级干部开始，1942年在全党普遍展开；不要只写成1942—1945而忽略前期准备。",r:["mao-study","mao-party","pl6-7","doc-history1"],s:"https://www.12371.cn/2022/08/08/ARTI1659935177946775.shtml"},
{id:"e1945-victory",y:1945,d:"1945.8.15—9.3",t:"中国人民抗日战争胜利",p:1,b:"世界反法西斯战争胜利推进，中国军民长期全民族抗战并展开全面反攻，日本最终无条件投降。",c:"8月15日日本天皇发布终战诏书，9月2日日本代表签署投降书，9月3日成为中国人民抗日战争胜利纪念日。",m:"是近代以来中国反抗外敌入侵第一次取得完全胜利的民族解放斗争，确立中华民族由深重危机走向伟大复兴的历史转折点；中国共产党发挥中流砥柱作用，中国战场是世界反法西斯战争东方主战场。",x:"胜利原因要答全民族抗战、党的领导、国际反法西斯力量支持等，不能只归因于外部力量。",r:["c7","e1945-taiwan","sm-potsdam"]},
{id:"e1945-taiwan",y:1945,d:"1945.10.25",t:"台湾光复",p:1,b:"日本战败投降，依据《开罗宣言》《波茨坦公告》等国际文件和中国人民抗战胜利，台湾回归祖国。",c:"中国政府在台北举行受降仪式，恢复对台湾行使主权。",m:"标志被日本强占50年的台湾及澎湖列岛重归中国主权管辖，是中国人民抗日战争胜利的重要成果。",x:"台湾于1895年《马关条约》被割让，1945年光复；10月25日不是抗战胜利纪念日。",r:["e1895-maguan","sm-cairo","e1945-victory"]}
]);
add("event","人民解放战争与新中国成立",[
{id:"e1946-civil",y:1946,d:"1946.6.26",t:"全面内战爆发",p:1,b:"国民党坚持独裁内战方针，在军事力量准备完成后撕毁停战协定和政协协议。",c:"国民党军队大举围攻中原解放区，全面内战由此爆发；中国共产党领导解放区军民进行自卫战争。",m:"战争性质是人民解放战争，目标是推翻国民党反动统治、解放全中国并建立人民民主的新中国。",x:"全面内战爆发标志是国民党围攻中原解放区，不是刘邓大军挺进大别山。",r:["sm-chongqing","sm-cppcc1946","e1947-offensive"]},
{id:"e1947-offensive",y:1947,d:"1947.6.30起",t:"刘邓大军挺进大别山与战略进攻",p:1,b:"解放军经过一年作战粉碎国民党全面进攻和重点进攻，敌我力量对比发生变化。",c:"刘伯承、邓小平率晋冀鲁豫野战军主力强渡黄河、千里跃进大别山，陈赓谢富治、陈毅粟裕等部队配合作战。",m:"揭开人民解放战争战略进攻序幕，迫使国民党由战略进攻转为战略防御。",x:"战略进攻对应挺进大别山；战略决战对应三大战役；渡江战役摧毁南京国民党政权。",r:["e1946-civil","mao-present","e1948-battles"]},
{id:"e1948-battles",y:1948,d:"1948.9—1949.1",t:"辽沈、淮海、平津三大战役",p:1,b:"战略决战时机成熟，人民解放军兵力、装备和人民支持显著增强。",c:"东北野战军发起辽沈战役，华东和中原野战军等进行淮海战役，东北和华北解放军进行平津战役。",m:"国民党赖以维持反动统治的主要军事力量基本被摧毁，为中国革命在全国胜利奠定基础。",x:"三大战役顺序和空间要准确；淮海战役被陈毅形容为人民群众用小车推出来的胜利，突出人民支持。",r:["e1947-offensive","e1949-crossing","rm-sep1948"]},
{id:"e1949-crossing",y:1949,d:"1949.4.20—23",t:"渡江战役与南京解放",p:1,b:"国民党拒绝在国内和平协定最后修正案上签字，人民解放军奉命向全国进军。",c:"人民解放军百万雄师强渡长江，4月23日解放南京。",m:"宣告延续22年的国民党反动统治覆灭，为新政协召开和新中国成立创造条件。",x:"南京解放是国民党反动统治覆灭标志，不等于全国所有地区已经解放。",r:["e1948-battles","sm-cppcc1","e1949-found"]},
{id:"e1949-found",y:1949,d:"1949.10.1",t:"中华人民共和国成立",p:1,b:"新民主主义革命取得基本胜利，新政协完成建国筹备，中央人民政府成立。",c:"开国大典在北京举行，毛泽东宣告中华人民共和国中央人民政府成立。",m:"结束半殖民地半封建社会历史，实现民族独立和人民解放，人民成为国家、社会和自己命运主人；为实现由新民主主义向社会主义过渡创造前提，开辟中国历史新纪元。",x:"新中国成立标志新民主主义革命基本胜利，不标志社会主义基本制度建立；后者在1956年三大改造基本完成。",r:["sm-cppcc1","mao-peopledem","e1956-system"]}
]);
add("event","巩固新生政权与恢复国民经济",[
{id:"e1950-land",y:1950,d:"1950.6—1952年底",t:"土地改革运动",p:1,b:"新解放区封建土地制度仍严重束缚农村生产力和农民生活，巩固工农联盟要求实现农民土地所有制。",c:"依据《中华人民共和国土地改革法》，在新解放区分批开展土地改革，废除地主阶级封建剥削土地所有制，实行农民土地所有制。",m:"到1952年底基本完成，摧毁我国两千多年封建土地制度，农民真正成为土地主人，解放农村生产力并巩固人民政权。",x:"土地改革后仍是农民个体私有制，不等于农业集体化；农业社会主义改造随后逐步完成。",r:["doc-land1950","e1953-line","e1952-recover"]},
{id:"e1950-korea",y:1950,d:"1950.10—1953.7",t:"抗美援朝战争",p:1,b:"朝鲜内战爆发后美国武装干涉并把战火烧到中朝边境，严重威胁新中国安全。",c:"中国人民志愿军于1950年10月19日入朝作战，经过艰苦战斗迫使对方于1953年7月27日在停战协定上签字。",m:"伟大胜利抵御帝国主义侵略扩张、捍卫新中国安全、保卫人民和平生活，维护亚洲和世界和平，是中华民族伟大复兴历史进程中的重要里程碑。",x:"抗美援朝与土地改革、镇压反革命共同巩固新生人民政权；出国作战不等于主动扩张，而是保家卫国。",r:["e1949-found","e1952-recover"]},
{id:"e1951-tibet",y:1951,d:"1951.5.23起",t:"西藏和平解放",p:2,b:"实现祖国大陆统一和维护民族团结是新中国成立后的重要任务。",c:"中央人民政府与西藏地方政府签订关于和平解放西藏办法的协议，人民解放军随后进驻拉萨。",m:"标志西藏和平解放，祖国大陆获得统一，各族人民实现大团结，为西藏社会发展进步奠定基础。",x:"“祖国大陆获得统一”不等于港澳已经全部回归；香港、澳门分别于1997、1999年回归。",r:["e1949-found","e1997-hk"]},
{id:"e1952-recover",y:1952,d:"1949—1952",t:"国民经济恢复任务完成",p:1,b:"新中国成立初期面临生产萎缩、交通梗阻、物价飞涨和财政困难。",c:"在土地改革、抗美援朝、镇压反革命和各项经济政策配合下，国家财政经济状况实现根本好转，工农业生产超过历史最高水平。",m:"为有计划经济建设和社会主义改造创造有利条件，巩固新生人民政权。",x:"七届三中全会提出的中心任务是争取财政经济状况基本好转；到1952年底恢复任务完成。",r:["pl7-3","e1950-land","e1953-line"]}
]);
add("event","过渡时期与社会主义制度确立",[
{id:"e1953-line",y:1953,d:"1953",t:"党在过渡时期总路线提出",p:1,b:"国民经济恢复后，实现国家工业化和改变多种经济成分并存状况成为新的历史任务。",c:"从中华人民共和国成立到社会主义改造基本完成是过渡时期；总路线和总任务概括为“一化三改”：逐步实现社会主义工业化，并逐步实现对农业、手工业和资本主义工商业的社会主义改造。",m:"把社会主义建设与社会主义改造同时并举，为建立社会主义基本制度和推进工业化指明方向。",x:"“一化”是主体，“三改”是两翼；社会主义工业化与三大改造不是先后截然分开的两个阶段。",r:["e1953-plan","e1956-system","pl7-6"]},
{id:"e1953-plan",y:1953,d:"1953—1957",t:"第一个五年计划",p:1,b:"我国工业基础十分薄弱，实现社会主义工业化需要有计划地开展经济建设。",c:"集中主要力量发展重工业，建立国家工业化和国防现代化初步基础，同时发展交通运输业、轻工业、农业和商业，培养建设人才。",m:"1957年超额完成，开始改变我国工业落后面貌，为社会主义工业化奠定初步基础。",x:"一五计划不等于已经实现工业化；其作用是奠定初步基础。",r:["e1953-line","e1956-system"]},
{id:"e1953-five",y:1953,d:"1953.12.31",t:"和平共处五项原则首次完整提出",p:1,b:"新中国奉行独立自主和平外交，需要处理不同社会制度国家之间关系。",c:"周恩来在会见印度政府代表团时首次完整提出互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。",m:"成为处理国与国关系的基本准则，为建立公正合理国际政治经济新秩序贡献中国智慧。",x:"和平共处五项原则在1953年提出；万隆会议“求同存异”在1955年，二者不可混。",r:["sm-geneva","sm-bandung"]},
{id:"e1956-system",y:1956,d:"1956年底",t:"三大改造基本完成与社会主义基本制度确立",p:1,b:"过渡时期总路线推动农业、手工业合作化和资本主义工商业全行业公私合营。",c:"对农业、手工业和资本主义工商业的社会主义改造基本完成，社会主义公有制成为社会经济基础，社会主义基本制度在我国确立。",m:"实现中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定根本制度基础，中国从此进入社会主义社会。",x:"1956年才是社会主义基本制度确立；1949年新中国成立是新民主主义社会起点，不是社会主义社会起点。",r:["e1953-line","c8","mao-ten"]},
{id:"e1957-rectify",y:1957,d:"1957",t:"全党整风与反右派斗争扩大化",p:3,b:"社会主义制度建立后，党希望整顿官僚主义、宗派主义和主观主义，正确处理人民内部矛盾。",c:"全党开展整风运动，随后进行反右派斗争，但斗争被严重扩大化。",m:"反映社会主义建设探索中的曲折，影响民主法制和社会主义建设进程。",x:"不要把1957年整风与1942年延安整风混同；延安整风的核心内容和意义是高频重点。",r:["mao-contradiction","e-yananrectify"]},
{id:"e1958-leap",y:1958,d:"1958起",t:"“大跃进”和人民公社化运动",p:2,b:"社会主义建设中急于求成，对经济发展规律和国情认识不足，片面追求高速度和公有化程度。",c:"在总路线提出后发动“大跃进”和人民公社化运动，出现高指标、瞎指挥、浮夸风和“共产风”等错误。",m:"使国民经济比例严重失调并造成严重困难，说明社会主义建设必须尊重客观经济规律、从国情出发。",x:"这一探索失误不能与中共八大正确探索混为一谈；1961年八字方针开始大规模调整。",r:["pl8-9","rm-7000","e1961-adjust"]}
]);
add("event","建设探索、科技外交与历史转折",[
{id:"e1961-adjust",y:1961,d:"1961—1965",t:"国民经济调整",p:2,b:"“大跃进”等导致严重经济困难，必须调整比例关系并纠正经济工作中的错误。",c:"贯彻“调整、巩固、充实、提高”八字方针，调整农轻重比例、精简职工、压缩基本建设规模，七千人大会进一步统一思想。",m:"国民经济逐步恢复和发展，为社会主义建设提供纠正错误、尊重规律的经验。",x:"1961年八字方针与1979年新八字方针不同，后者为“调整、改革、整顿、提高”。",r:["pl8-9","rm-7000","e1958-leap"]},
{id:"e-twobombs",y:1964,d:"1964—1970",t:"“两弹一星”重大成就",p:1,b:"面对复杂国际环境和外部核威胁，新中国必须增强国防实力、打破超级大国的核垄断和核讹诈。",c:"1964年第一颗原子弹爆炸成功，1967年第一颗氢弹爆炸成功，1970年第一颗人造地球卫星“东方红一号”发射成功。",m:"增强国防和科技实力，提高国际地位，振奋民族精神，孕育“热爱祖国、无私奉献，自力更生、艰苦奋斗，大力协同、勇于登攀”的“两弹一星”精神。",x:"“两弹一星”通常指核弹（原子弹、氢弹）、导弹和人造卫星，不要只理解为两颗炸弹加一颗星。",r:["sm-npc1964","e1971-un"]},
{id:"e-cultural",y:1966,d:"1966—1976",t:"“文化大革命”",p:2,b:"社会主义建设探索中对阶级斗争形势作出错误估计，指导思想发生严重“左”倾错误。",c:"持续十年的“文化大革命”使党、国家和人民遭受严重挫折和损失，民主法制和国民经济受到严重破坏。",m:"是社会主义建设探索中的严重曲折，为坚持实事求是、健全民主法制和以经济建设为中心提供深刻历史教训。",x:"九大、十大和十一大等低频定位即可；1976年结束文革不等于1978年已经完成思想路线拨乱反正。",r:["c9","c11","e1976-end"]},
{id:"e1971-un",y:1971,d:"1971.10.25",t:"中华人民共和国恢复联合国合法席位",p:1,b:"中国国际地位提高和广大发展中国家支持，长期阻挠中国恢复合法席位的图谋失败。",c:"第二十六届联合国大会通过第2758号决议，恢复中华人民共和国在联合国的一切合法权利，并立即把台湾当局代表从联合国及其所属一切机构中驱逐出去。",m:"是中国外交重大胜利，有利于中国在国际事务中发挥更大作用，维护发展中国家正当权益。",x:"是“恢复”合法席位，不是“加入”联合国；中国加入世界贸易组织是2001年。",r:["e1972-nixon","e2001-wto"]},
{id:"e1972-nixon",y:1972,d:"1972.2.21—28",t:"尼克松访华与中美《上海公报》",p:2,b:"国际战略格局变化，中美双方都有改善关系、反对霸权主义的战略需要。",c:"美国总统尼克松访华，中美发表《上海公报》，承认中美两国社会制度和外交政策有本质区别，同时强调共同利益与和平共处原则。",m:"开启中美关系正常化进程，推动国际战略格局变化；同年中日实现邦交正常化。",x:"1972年是关系开始正常化，1979年1月1日中美正式建交，不可混写。",r:["e1971-un","e1979-us"]},
{id:"e1976-end",y:1976,d:"1976.10",t:"“文化大革命”结束",p:2,b:"党和人民同“左”倾错误及反革命集团进行长期斗争，纠正错误的条件逐步成熟。",c:"中央政治局执行党和人民意志，粉碎“四人帮”，结束“文化大革命”。",m:"从危难中挽救党、挽救社会主义事业，为随后拨乱反正和历史转折创造条件。",x:"结束文革≠完成拨乱反正；1978年三中全会实现伟大转折，1981年历史决议标志指导思想拨乱反正基本完成。",r:["e-cultural","pl11-3","pl11-6"]},
{id:"e1978-truth",y:1978,d:"1978.5起",t:"真理标准问题大讨论",p:1,b:"“两个凡是”仍束缚思想，拨乱反正需要首先解决思想路线问题。",c:"《光明日报》发表特约评论员文章《实践是检验真理的唯一标准》，引发全国讨论，强调实践在社会实践基础上检验真理的根本作用，批判教条主义和个人崇拜。",m:"是一场深刻而广泛的马克思主义思想解放运动，为党的十一届三中全会实现历史转折作重要思想准备。",x:"考试用规范表述“实践是检验真理的唯一标准”；大讨论是思想准备，不是改革开放正式开启标志。",r:["pl11-3","doc-emancipate","mao-practice"]}
]);
add("event","改革开放与现代化建设",[
{id:"e1978-xiaogang",y:1978,d:"1978.11起",t:"小岗村包产到户与农村改革",p:1,b:"人民公社体制下生产积极性受到制约，农民要求改革生产经营方式。",c:"安徽凤阳小岗村18户农民按下红手印实行大包干，家庭联产承包责任制逐步在全国推广。",m:"调动农民生产积极性，解放农村生产力，成为我国经济体制改革率先在农村取得突破的重要实践。",x:"农村改革不是土地私有化；土地集体所有制不变，经营方式改为家庭承包经营为基础、统分结合的双层经营体制。",r:["pl12-3","pl17-3","doc-land1950"]},
{id:"e1979-us",y:1979,d:"1979.1.1",t:"中美正式建交",p:2,b:"1972年中美关系开始正常化后，双方继续谈判解决建交问题。",c:"中华人民共和国和美利坚合众国正式建立外交关系，美国承认中华人民共和国政府是中国唯一合法政府。",m:"为两国关系发展和我国改革开放外部环境的改善创造条件。",x:"1972年尼克松访华＝开始正常化；1979年＝正式建交。",r:["e1972-nixon","e1980-sez"]},
{id:"e1980-sez",y:1980,d:"1980.8",t:"经济特区设立",p:1,b:"对外开放需要先行试验窗口，利用特殊政策吸收外资、技术和管理经验。",c:"全国人大常委会批准在深圳、珠海、汕头、厦门设置经济特区，实行特殊经济政策和经济管理体制。",m:"经济特区成为对外开放窗口和改革试验田，发挥示范、辐射和带动作用。",x:"首批四个经济特区不包括海南；海南经济特区于1988年设立。",r:["e1984-city","e1990-pudong"]},
{id:"e1984-city",y:1984,d:"1984",t:"城市经济体制改革与沿海开放扩大",p:1,b:"农村改革突破后，增强企业活力和扩大开放成为改革重点。",c:"十二届三中全会通过经济体制改革决定，改革重点转向城市；同年开放大连、天津、上海、广州等14个沿海港口城市。",m:"推动改革从农村到城市、从沿海到内地逐步展开，形成对外开放新格局的重要步骤。",x:"1984年有“有计划的商品经济”和14个沿海港口城市两条线，不要与1992年市场经济目标混淆。",r:["pl12-3","e1980-sez","c14"]},
{id:"e1990-pudong",y:1990,d:"1990.4",t:"浦东开发开放",p:1,b:"进一步扩大开放需要新的战略支点，带动长江流域和全国经济发展。",c:"中共中央、国务院作出开发开放上海浦东的战略决策，随后建设国家级新区和各类开放功能区。",m:"成为我国进一步改革开放的重要标志和上海现代化建设缩影，带动长三角及长江流域开放发展。",x:"浦东开发开放在1990年，不是1980年首批经济特区。",r:["e1980-sez","e1984-city","doc-south"]},
{id:"e1997-hk",y:1997,d:"1997.7.1",t:"香港回归祖国",p:1,b:"“一国两制”科学构想为解决历史遗留的香港问题提供可行方案，中英通过谈判签署联合声明。",c:"中国政府对香港恢复行使主权，中华人民共和国香港特别行政区成立。",m:"洗雪中华民族百年耻辱，是“一国两制”由科学构想变为成功实践的重要标志，为解决澳门问题提供示范。",x:"香港回归1997年7月1日，澳门回归1999年12月20日；“一国两制”首先针对台湾问题提出，首先成功运用于香港。",r:["e1999-macau","c15"]},
{id:"e1999-macau",y:1999,d:"1999.12.20",t:"澳门回归祖国",p:1,b:"中葡通过谈判解决澳门问题，“一国两制”方针继续推进祖国统一。",c:"中国政府对澳门恢复行使主权，澳门特别行政区成立。",m:"推进祖国统一大业，再次证明“一国两制”具有强大生命力。",x:"香港、澳门回归后保持原有资本主义制度和生活方式长期不变，并依法享有高度自治权。",r:["e1997-hk","c15"]},
{id:"e2001-wto",y:2001,d:"2001.12.11",t:"中国加入世界贸易组织",p:1,b:"改革开放深入和经济全球化发展要求中国更广泛参与国际经济合作与竞争。",c:"经过长期谈判，中国正式成为世界贸易组织成员。",m:"标志我国对外开放进入新阶段，有利于利用两个市场、两种资源，同时也对国内产业和宏观管理提出新挑战。",x:"加入WTO是2001年，恢复联合国合法席位是1971年；两者动词和年份常组合设错。",r:["e1971-un","e1990-pudong"]}
]);
add("event","中国特色社会主义新时代",[
{id:"e2012",y:2012,d:"2012.11起",t:"中国特色社会主义进入新时代的历史起点",p:1,b:"十八大后，我国发展站在新的历史起点，改革发展稳定、内政外交国防、治党治国治军面临新任务。",c:"以习近平同志为核心的党中央统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局，推动党和国家事业取得历史性成就、发生历史性变革。",m:"党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。",x:"历史起点在十八大；十九大作出进入新时代的重大政治判断并系统阐述其内涵。",r:["c18","c19","pl18-3"]},
{id:"e2013-belt",y:2013,d:"2013.9—10",t:"共建“一带一路”倡议提出",p:1,b:"经济全球化深入发展，各国互联互通和互利合作需求增强，中国需要推动更高水平开放。",c:"先后提出共建“丝绸之路经济带”和“21世纪海上丝绸之路”，坚持共商共建共享，推动政策沟通、设施联通、贸易畅通、资金融通、民心相通。",m:"成为深受欢迎的国际公共产品和国际合作平台，为构建人类命运共同体提供重要实践平台。",x:"“一带一路”不是封闭排他的地缘联盟，也不是中国单向援助，而是开放包容、互利合作倡议。",r:["pl18-3","e2023-belt10"]},
{id:"e2017",y:2017,d:"2017.10",t:"社会主要矛盾转化与新时代指导思想确立",p:1,b:"我国社会生产力水平总体提高，人民美好生活需要日益广泛，不平衡不充分发展更加突出。",c:"十九大明确社会主要矛盾转化，把习近平新时代中国特色社会主义思想确立为党的指导思想并写入党章，提出新时代“两步走”战略安排。",m:"为党和国家事业发展提供新的理论指导、历史方位判断和战略目标。",x:"主要矛盾变化没有改变社会主义初级阶段基本国情，也没有改变我国世界最大发展中国家国际地位。",r:["c19","doc-19report","e2012"]},
{id:"e2018-reform40",y:2018,d:"2018.12.18",t:"庆祝改革开放40周年",p:2,b:"改革开放40年需要总结历史成就和经验，回应新时代继续推进改革的要求。",c:"庆祝大会系统总结改革开放伟大成就和宝贵经验，强调将改革开放进行到底。",m:"进一步阐明改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。",x:"改革开放只有进行时、没有完成时；不能把新时代改革理解为另起炉灶，而是接续推进和全面深化。",r:["pl11-3","pl18-3","pl20-3"]},
{id:"e2019-70",y:2019,d:"2019.10.1",t:"中华人民共和国成立70周年",p:2,b:"新中国成立70年，需要总结革命、建设、改革和新时代发展的历史经验。",c:"举行庆祝大会、阅兵和群众游行等活动，回顾新中国70年奋斗历程。",m:"展示国家发展成就，凝聚爱国力量，坚定中国特色社会主义道路自信、理论自信、制度自信、文化自信。",x:"70周年与十九届四中全会同在2019年，可将国家发展成就同制度优势、治理效能联系起来复习。",r:["e1949-found","pl19-4"]},
{id:"e2021-modern",y:2021,d:"2021.2—7",t:"脱贫攻坚全面胜利与全面建成小康社会",p:1,b:"党的十八大以来实施精准扶贫、精准脱贫，全党全国全社会共同攻坚，解决绝对贫困问题。",c:"全国现行标准下农村贫困人口全部脱贫、贫困县全部摘帽、贫困村全部出列；7月1日庄严宣告在中华大地上全面建成小康社会。",m:"历史性地解决绝对贫困问题，实现第一个百年奋斗目标，为全面建设社会主义现代化国家奠定坚实基础。",x:"消除的是现行标准下绝对贫困，不等于消除一切相对贫困或已经实现共同富裕。",r:["doc-centenary","c20","pl19-5"]},
{id:"e2022",y:2022,d:"2022.10",t:"党的二十大与新时代新征程中心任务",p:1,b:"实现第一个百年奋斗目标后，需要科学谋划未来五年乃至更长时期党和国家事业发展。",c:"明确以中国式现代化全面推进中华民族伟大复兴的中心任务，对未来五年战略任务和重大举措作出部署。",m:"开启全面建设社会主义现代化国家、向第二个百年奋斗目标进军的新征程。",x:"全面建设社会主义现代化国家首要任务是高质量发展；发展是党执政兴国第一要务，两者不可混。",r:["c20","doc-20report","pl20-3"]},
{id:"e2023-belt10",y:2023,d:"2023.10.17—18",t:"第三届“一带一路”国际合作高峰论坛",p:2,b:"共建“一带一路”提出10周年，需要总结成果并规划高质量共建新阶段。",c:"论坛宣布中国支持高质量共建“一带一路”的八项行动，推动互联互通、开放经济、务实合作、绿色发展和科技创新等。",m:"推动共建“一带一路”进入高质量发展新阶段，为国际合作和共同发展注入动力。",x:"高峰论坛是合作平台，不是加入某个国际组织；坚持共商共建共享。",r:["e2013-belt","pl20-3"]},
{id:"e2024-anniversaries",y:2024,d:"2024",t:"新中国成立75周年等制度史周年",p:2,b:"2024年是新中国成立75周年、全国人大成立70周年、人民政协成立75周年，也是澳门回归25周年。",c:"分别对应1949年开国大典、1954年一届全国人大一次会议、1949年新政协、1999年澳门回归，可串联国家制度和“一国两制”考点。",m:"把周年节点与人民代表大会制度、中国新型政党制度、全过程人民民主和国家统一相联系，是材料题常用切入点。",x:"人大70周年从1954年算起，政协75周年从1949年算起，不能把两个制度的起点混淆。",r:["sm-npc1954","sm-cppcc1","e1999-macau","pl20-3"]},
{id:"e2025-80",y:2025,d:"2025.9.3",t:"纪念中国人民抗日战争暨世界反法西斯战争胜利80周年",p:1,b:"铭记历史、缅怀先烈、珍爱和平、开创未来，需要弘扬伟大抗战精神并维护二战胜利成果。",c:"举行纪念活动，回顾全民族抗战和世界反法西斯战争历程，强调中国人民为拯救人类文明、保卫世界和平作出重大贡献。",m:"弘扬天下兴亡、匹夫有责的爱国情怀等伟大抗战精神，增强民族凝聚力，坚定维护和平发展。",x:"周年纪念与历史事实要对应：1945年胜利，2025年80周年；抗战起点仍为1931年九一八事变。",r:["e1945-victory","e1931-918","pl20-4"]},
{id:"e2026-start",y:2026,d:"2026",t:"建党105周年与“十五五”开局",p:1,b:"“十四五”圆满收官后进入2026—2030年规划期，同时迎来中国共产党成立105周年。",c:"全国两会批准“十五五”规划纲要；二十届五中全会专题部署持之以恒推进全面从严治党，推动“十五五”良好开局。",m:"把发展规划与党的建设结合，为基本实现社会主义现代化夯实基础、全面发力提供行动纲领和政治保证。",x:"年度复习时区分三件大事的时间：规划《建议》在2025年二十届四中，规划《纲要》在2026年全国人大会议，全面从严治党《决定》在2026年二十届五中。",r:["sm-npc2026","pl20-4","pl20-5","c1"]}
]);

add("keyword","法宝·传家宝·作风",[
{id:"kw-three-magic",y:0,d:"固定搭配",t:"三大法宝｜统一战线、武装斗争、党的建设",p:1,b:"毛泽东《〈共产党人〉发刊词》，适用对象是中国共产党领导中国革命。",c:"统一战线、武装斗争、党的建设，是中国共产党在中国革命中战胜敌人的三个法宝、三个主要的法宝。",m:"答题必须三者同时对应，不可只写统一战线；党的建设关系两个基本武器能否被正确掌握和运用。",x:"三大法宝不是三大作风；也不是“土地革命、武装斗争、根据地建设”。",r:["mao-journal","mao-united"],s:"http://www.12371.cn/2024/11/25/ARTI1732507261343287.shtml"},
{id:"kw-two-weapons",y:0,d:"固定搭配",t:"两个基本武器｜统一战线和武装斗争",p:1,b:"毛泽东在总结三大法宝相互关系时使用，适用对象仍是中国革命。",c:"统一战线和武装斗争是战胜敌人的两个基本武器；统一战线是实行武装斗争的统一战线，党的组织是掌握这两个武器以实行对敌冲锋陷阵的英勇战士。",m:"用于理解三大法宝的内部关系，不能把三者理解为互不相干的三项工作。",x:"问“两个基本武器”不写党的建设；问“三个法宝”必须加上党的建设。",r:["mao-journal","kw-three-magic"]},
{id:"kw-three-styles",y:0,d:"固定搭配",t:"三大作风｜理论联系实际、密切联系群众、批评和自我批评",p:1,b:"毛泽东《论联合政府》，是党的建设和中国共产党政治品格的重要考点。",c:"理论和实践相结合、和人民群众紧密地联系在一起以及自我批评，是中国共产党区别于其他任何政党的显著标志。",m:"通常按“理论联系实际、密切联系群众、批评和自我批评”概括记忆。",x:"《〈共产党人〉发刊词》记三大法宝，《论联合政府》记三大作风。",r:["mao-united","c7","kw-three-magic"]},
{id:"kw-united-front",y:0,d:"固定搭配",t:"统一战线｜重要法宝＋强大法宝",p:1,b:"革命时期和新时代均有统一战线的法宝定位，但完整表述随文献而不同。",c:"统一战线是党克敌制胜、执政兴国的重要法宝，是团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝；二十大报告强调，统一战线是凝聚人心、汇聚力量的强大法宝。",m:"既可用于史纲三大法宝，也可用于新时代爱国统一战线；答题看题干限定的文献和时期。",x:"“三大法宝”是统一战线、武装斗争、党的建设；不能因新时代只强调统一战线就漏掉历史题中的另外两项。",r:["kw-three-magic","doc-history3","doc-20report"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-reform-magic",y:0,d:"固定搭配",t:"改革开放｜党和人民事业大踏步赶上时代的重要法宝",p:1,b:"二十届三中全会《决定》在论述进一步全面深化改革的重要性和必要性时使用。",c:"改革开放是党和人民事业大踏步赶上时代的重要法宝。",m:"说明改革开放对赶上时代、推进中国特色社会主义事业和现代化建设的重要作用。",x:"主语是“改革开放”，不是“创新”或“统一战线”；二十届三中全会原文是“党和人民事业”。",r:["pl20-3","pl11-3","kw-reform-key"],s:"https://www.gov.cn/zhengce/202407/content_6963770.htm"},
{id:"kw-reform-key",y:0,d:"固定搭配",t:"改革开放｜决定当代中国命运的关键一招",p:1,b:"庆祝改革开放40周年大会的重要论断，适用于改革开放的历史地位。",c:"改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。",m:"常与“重要法宝”“强国之路”“必由之路”组合考查，强调改革开放在当代中国发展中的关键作用。",x:"“关键一招”对应改革开放；“关键在党”对应全面建设社会主义现代化国家、全面推进中华民族伟大复兴。",r:["e2018-reform40","pl11-3","kw-reform-magic"]},
{id:"kw-mass-line",y:0,d:"固定搭配",t:"群众路线｜生命线、根本工作路线、重要传家宝",p:1,b:"群众路线是毛泽东思想活的灵魂之一，也是党的根本工作路线。",c:"群众路线是我们党的生命线和根本工作路线，是我们党永葆青春活力和战斗力的重要传家宝；基本内容是一切为了群众，一切依靠群众，从群众中来，到群众中去。",m:"回答党的根本工作路线、群众观点和群众方法时优先使用；不要把“生命线”误配给统一战线。",x:"党的基本路线也被称为党和国家的生命线、人民的幸福线；题干有“基本路线”与“群众路线”时要分开。",r:["mao-book","doc-history3"]},
{id:"kw-research",y:0,d:"固定搭配",t:"调查研究｜传家宝＋做好各项工作的基本功",p:1,b:"调查研究是谋事之基、成事之道，是坚持实事求是和走好群众路线的基本要求。",c:"调查研究是我们党的传家宝，是做好各项工作的基本功。",m:"常与主题教育、群众路线、实事求是结合，强调没有调查就没有发言权、没有调查就没有决策权。",x:"“传家宝”并非只有群众路线；需按题干中的“调查研究”或“根本工作路线”精确定位。",r:["mao-book","kw-mass-line"]},
{id:"kw-self-revolution",y:0,d:"固定搭配",t:"自我革命｜显著标志＋跳出历史周期率的第二个答案",p:1,b:"新时代全面从严治党和党的长期执政能力建设的重要论断。",c:"勇于自我革命是中国共产党区别于其他政党的显著标志；自我革命是党跳出治乱兴衰历史周期率的第二个答案。",m:"用于说明党依靠自身力量发现问题、修正错误、保持先进性和纯洁性。",x:"第一个答案是让人民来监督政府；第二个答案是自我革命，顺序不能倒。",r:["doc-centenary","c20","pl20-5"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-people-supervision",y:0,d:"固定搭配",t:"人民监督｜跳出历史周期率的第一个答案",p:1,b:"1945年毛泽东同黄炎培在延安“窑洞对”中讨论如何跳出治乱兴衰历史周期率。",c:"让人民来监督政府，政府才不敢松懈；这是党给出的跳出历史周期率的第一个答案。",m:"体现人民监督和人民民主对党和国家长期健康发展的重要作用。",x:"不要把“人民监督”写成第二个答案，也不要把两个答案理解为相互替代。",r:["kw-self-revolution","doc-history3"]}
]);
add("keyword","核心·本质·根本立场",[
{id:"kw-party-nature",y:0,d:"固定搭配",t:"中国共产党领导｜最本质特征＋最大优势",p:1,b:"坚持和发展中国特色社会主义、理解党的领导地位的核心定位。",c:"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量。",m:"两个“最”与一个“最高”通常连用；也可联系坚持党中央集中统一领导是最高政治原则。",x:"最本质特征不是“人民当家作主”；人民当家作主是社会主义民主政治的本质特征。",r:["doc-20report","doc-history3","kw-people-master"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-marx-guide",y:0,d:"固定搭配",t:"马克思主义｜立党立国、兴党兴国的根本指导思想",p:1,b:"二十大报告关于马克思主义指导地位和推进理论创新的论述。",c:"马克思主义是我们立党立国、兴党兴国的根本指导思想；拥有马克思主义科学理论指导，是党坚定信仰信念、把握历史主动的根本所在。",m:"常与“中国共产党为什么能、中国特色社会主义为什么好，归根到底是马克思主义行，是中国化时代化的马克思主义行”一起掌握。",x:"根本指导思想是马克思主义；不能把中华优秀传统文化或某种具体经验写成根本指导思想。",r:["doc-20report","bk-manifesto"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-people-position",y:0,d:"固定搭配",t:"人民立场｜马克思主义政党的根本政治立场",p:1,b:"中国共产党根本宗旨和马克思主义人民性的集中体现。",c:"人民立场是马克思主义政党的根本政治立场；全心全意为人民服务是党的根本宗旨。",m:"分析以人民为中心、群众路线、为民造福时都可回到这一根本立场。",x:"“根本政治立场”是人民立场；“根本工作路线”是群众路线，二者不可互换。",r:["kw-mass-line","doc-centenary"]},
{id:"kw-people-force",y:0,d:"固定搭配",t:"人民｜历史创造者＋决定党和国家前途命运的根本力量",p:1,b:"唯物史观的群众史观与新时代以人民为中心的发展思想相互贯通。",c:"人民是历史的创造者，是决定党和国家前途命运的根本力量。",m:"是坚持人民主体地位、依靠人民创造历史伟业的理论依据。",x:"不是把历史人物或少数英雄看作历史发展的最终决定力量；人民群众才是历史创造者。",r:["doc-19report","kw-people-position"]},
{id:"kw-marx-people",y:0,d:"固定搭配",t:"人民性｜马克思主义的本质属性",p:1,b:"二十大报告论述把握新时代中国特色社会主义思想世界观和方法论时提出。",c:"人民性是马克思主义的本质属性；党的理论是来自人民、为了人民、造福人民的理论。",m:"解释马克思主义理论价值立场，常与“人民至上”作为“六个必须坚持”之首结合。",x:"不要与实践性、科学性等特征混用；题干明确问“本质属性”时选人民性。",r:["doc-20report","kw-people-position"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-socialism-essence",y:0,d:"固定搭配",t:"社会主义本质｜解放和发展生产力，最终共同富裕",p:1,b:"邓小平在1992年南方谈话中对“什么是社会主义”作出科学概括。",c:"社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。",m:"把生产力目标与生产关系、价值目标统一起来，是邓小平理论回答首要基本理论问题的重要内容。",x:"“最终达到共同富裕”不等于同步富裕、同等富裕；也不能只写发展生产力而漏掉共同富裕。",r:["doc-south","c14"]},
{id:"kw-common-prosperity",y:0,d:"固定搭配",t:"共同富裕｜中国特色社会主义的本质要求",p:1,b:"中国式现代化是全体人民共同富裕的现代化，共同富裕同时是长期历史过程。",c:"共同富裕是中国特色社会主义的本质要求，也是一个长期的历史过程。",m:"用于连接社会主义本质、共享发展和中国式现代化中国特色。",x:"共享是中国特色社会主义的本质要求，共同富裕也有相同定位；答题要结合题干主语，不把共同富裕写成短期内整齐划一。",r:["doc-20report","kw-socialism-essence"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-people-benefit",y:0,d:"固定搭配",t:"为民造福｜立党为公、执政为民的本质要求",p:1,b:"二十大报告“增进民生福祉，提高人民生活品质”部分的重要定位。",c:"为民造福是立党为公、执政为民的本质要求。",m:"民生题可用作总起句，后接实现好、维护好、发展好最广大人民根本利益。",x:"主语限定为“立党为公、执政为民”，不要与“共同富裕是中国特色社会主义的本质要求”混配。",r:["doc-20report","kw-people-position"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-democracy-attribute",y:0,d:"固定搭配",t:"全过程人民民主｜社会主义民主政治的本质属性",p:1,b:"二十大报告对全过程人民民主性质和优势的规范表述。",c:"全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。",m:"回答全过程人民民主的地位和三个“最”时使用；人民民主是社会主义的生命。",x:"“本质属性”对应全过程人民民主；“本质特征”通常对应人民当家作主。",r:["doc-20report","kw-people-master"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-people-master",y:0,d:"固定搭配",t:"人民当家作主｜社会主义民主政治的本质特征",p:1,b:"十九大报告关于党的领导、人民当家作主、依法治国有机统一的论述。",c:"党的领导是人民当家作主和依法治国的根本保证，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式。",m:"三者统一于我国社会主义民主政治伟大实践，适合直接作答三者关系。",x:"不要与“中国共产党领导是中国特色社会主义最本质特征”中的“最本质特征”混为一谈；限定语不同。",r:["doc-19report","kw-party-nature","kw-democracy-attribute"]},
{id:"kw-revolution-core",y:0,d:"固定搭配",t:"无产阶级领导权｜中国革命中心问题＋新民主主义革命理论核心问题",p:1,b:"新民主主义革命总路线和革命领导权理论的高频定位。",c:"无产阶级领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题。",m:"中共四大第一次明确提出无产阶级在民主革命中的领导权问题；领导权问题是理解新民主主义革命性质和前途的关键。",x:"中国革命的基本问题是农民问题；中心问题和核心问题则指无产阶级领导权。",r:["c4","mao-chinarev","kw-peasant"]},
{id:"kw-old-new-mark",y:0,d:"固定搭配",t:"新旧民主主义革命的根本区别｜革命领导权不同",p:1,b:"五四运动后中国革命由旧民主主义革命转向新民主主义革命。",c:"区别新旧两种不同范畴民主主义革命的根本标志，是革命的领导权掌握在无产阶级手中还是掌握在资产阶级手中。",m:"新民主主义革命仍属资产阶级民主革命性质，但由无产阶级领导，前途是社会主义而不是资本主义。",x:"根本区别不是革命对象、革命性质或是否反帝反封建，而是领导阶级。",r:["e1919","kw-revolution-core"]},
{id:"kw-peasant",y:0,d:"固定搭配",t:"农民问题｜中国革命基本问题；农民是中国革命主力军",p:1,b:"近代中国社会结构和革命力量分析中的重要定位。",c:"农民是中国革命的主力军，是无产阶级最可靠的同盟军；农民问题是中国革命的基本问题，新民主主义革命实质上就是党领导下的农民革命。",m:"用于理解土地革命、工农联盟和农村包围城市道路为何成为中国革命的关键。",x:"基本问题不是无产阶级领导权；领导权是中心问题和理论核心问题。",r:["mao-class","c4","kw-revolution-core"]}
]);
add("keyword","首要任务·第一定位·关键",[
{id:"kw-highquality-first",y:0,d:"固定搭配",t:"高质量发展｜全面建设社会主义现代化国家的首要任务",p:1,b:"二十大报告和二十届三中全会《决定》反复强调。",c:"高质量发展是全面建设社会主义现代化国家的首要任务。",m:"回答新时代现代化建设如何发展的首要任务，后接完整、准确、全面贯彻新发展理念。",x:"“首要任务”是高质量发展；“第一要务”是发展，多一个字也不能换。",r:["doc-20report","pl20-3","kw-development-first"],s:"https://www.gov.cn/zhengce/202407/content_6963770.htm"},
{id:"kw-development-first",y:0,d:"固定搭配",t:"发展｜党执政兴国的第一要务",p:1,b:"二十大报告在部署高质量发展时与首要任务同时提出。",c:"发展是党执政兴国的第一要务。",m:"发展是解决我国一切问题的基础和关键；必须坚持以经济建设为中心，推动高质量发展。",x:"不要写成“高质量发展是第一要务”或“发展是首要任务”；规范搭配是“发展—第一要务”“高质量发展—首要任务”。",r:["doc-20report","kw-highquality-first"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-science-first",y:0,d:"固定搭配",t:"科技｜第一生产力",p:1,b:"二十大报告实施科教兴国战略、强化现代化建设人才支撑部分。",c:"必须坚持科技是第一生产力、人才是第一资源、创新是第一动力。",m:"科技对应第一生产力，服务于高水平科技自立自强和现代化建设。",x:"“第一生产力”不是人才或创新；三者常通过调换主语设错。",r:["doc-20report","kw-talent-first","kw-innovation-first"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-talent-first",y:0,d:"固定搭配",t:"人才｜第一资源",p:1,b:"科教兴国、人才强国、创新驱动发展战略中的固定定位。",c:"人才是第一资源，要坚持人才引领驱动，加快建设人才强国。",m:"强调人才在创新发展和国家竞争中的基础性、战略性作用。",x:"第一资源是人才，第一生产力是科技，第一动力是创新。",r:["doc-20report","kw-science-first","kw-innovation-first"]},
{id:"kw-innovation-first",y:0,d:"固定搭配",t:"创新｜第一动力",p:1,b:"新发展理念与科教兴国战略共同使用的高频定位。",c:"创新是引领发展的第一动力，也是二十大报告强调的“第一动力”。",m:"在新发展理念中解决发展动力问题；在科教人才战略中与科技、人才共同构成三个“第一”。",x:"不要把“创新是第一动力”与“改革开放是关键一招”混配。",r:["doc-20report","pl18-5","kw-science-first"]},
{id:"kw-edu-sci-talent",y:0,d:"固定搭配",t:"教育、科技、人才｜基础性、战略性支撑",p:1,b:"二十大报告和二十届三中全会《决定》均有明确表述，限定语略有不同。",c:"二十大报告：教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑；二十届三中全会《决定》：教育、科技、人才是中国式现代化的基础性、战略性支撑。",m:"三者一体部署、一体推进，是理解教育科技人才体制机制一体改革的依据。",x:"题干限定哪份文件就使用哪个宾语；不要把“支撑”写成“根本保证”。",r:["doc-20report","pl20-3"],s:"https://www.gov.cn/zhengce/202407/content_6963770.htm"},
{id:"kw-moral-education",y:0,d:"固定搭配",t:"立德树人｜教育的根本任务",p:1,b:"党的教育方针和教育强国建设的核心要求。",c:"落实立德树人根本任务，培养德智体美劳全面发展的社会主义建设者和接班人；培养什么人、怎样培养人、为谁培养人是教育的根本问题。",m:"教育题先区分“根本问题”和“根本任务”，再联系为党育人、为国育才。",x:"根本任务是立德树人，不是单纯传授知识或提高升学率。",r:["doc-20report","kw-edu-sci-talent"]},
{id:"kw-innovation-core",y:0,d:"固定搭配",t:"创新｜我国现代化建设全局中的核心地位",p:1,b:"实施创新驱动发展战略、实现高水平科技自立自强的战略定位。",c:"坚持创新在我国现代化建设全局中的核心地位。",m:"与“创新是引领发展的第一动力”配套记忆，前者讲全局地位，后者讲发展动力。",x:"“核心地位”是创新；“领导核心”是中国共产党，主语和限定范围不同。",r:["pl19-5","kw-innovation-first"]},
{id:"kw-development-key",y:0,d:"固定搭配",t:"发展｜解决我国一切问题的基础和关键",p:1,b:"十九大报告在论述社会主义初级阶段和发展重要性时提出。",c:"发展是解决我国一切问题的基础和关键。",m:"说明必须牢牢立足社会主义初级阶段这个最大实际，通过发展解决前进中的问题。",x:"不要与“改革开放是关键一招”混淆；一个强调发展基础性作用，一个强调改革开放的关键历史作用。",r:["doc-19report","kw-development-first","kw-reform-key"]},
{id:"kw-entity-economy",y:0,d:"固定搭配",t:"实体经济｜立身之本＋发展经济着力点",p:1,b:"建设现代化产业体系和现代化经济体系的重要定位。",c:"实体经济是一国经济的立身之本，是财富创造的根本源泉，是国家强盛的重要支柱；建设现代化产业体系，坚持把发展经济的着力点放在实体经济上。",m:"常与制造业、新型工业化、现代化产业体系联合考查。",x:"着力点不是虚拟经济、金融业或房地产；现代化产业体系不等于只发展新兴产业。",r:["doc-20report","doc-19report"]},
{id:"kw-rural-priority",y:0,d:"固定搭配",t:"“三农”问题｜全党工作重中之重",p:1,b:"十九大报告关于实施乡村振兴战略的基本判断。",c:"农业农村农民问题是关系国计民生的根本性问题，必须始终把解决好“三农”问题作为全党工作重中之重。",m:"用于说明全面推进乡村振兴、加快农业农村现代化的战略地位。",x:"“重中之重”对应“三农”问题；不要与高质量发展的“首要任务”混配。",r:["doc-19report","kw-rural-revitalization"]},
{id:"kw-rural-revitalization",y:0,d:"固定搭配",t:"乡村振兴｜新时代新征程“三农”工作总抓手",p:1,b:"脱贫攻坚取得胜利后，“三农”工作重心历史性转向全面推进乡村振兴。",c:"全面推进乡村振兴是新时代新征程“三农”工作的总抓手。",m:"可联系产业、人才、文化、生态、组织振兴和农业农村现代化。",x:"不是把脱贫攻坚与乡村振兴割裂；二者需要有效衔接。",r:["kw-rural-priority","e2021-modern"]},
{id:"kw-modern-economy",y:0,d:"固定搭配",t:"建设现代化经济体系｜跨越关口的迫切要求＋我国发展战略目标",p:1,b:"十九大报告针对我国经济由高速增长阶段转向高质量发展阶段提出。",c:"建设现代化经济体系是跨越关口的迫切要求和我国发展的战略目标。",m:"建设现代化经济体系要贯彻新发展理念，推动经济发展质量变革、效率变革、动力变革。",x:"题干限定十九大时用此定位；二十大进一步把发展经济的着力点放在实体经济上。",r:["doc-19report","kw-entity-economy"]}
]);
add("keyword","动力·支撑·保障·基础",[
{id:"kw-reform-direct",y:0,d:"固定搭配",t:"改革｜社会主义社会发展的直接动力",p:1,b:"社会主义社会基本矛盾运动和社会主义制度自我完善的理论要求。",c:"改革是社会主义社会发展的直接动力。",m:"用于说明通过改革调整生产关系和上层建筑中不适应生产力发展的环节，解放和发展社会生产力。",x:"阶级斗争是阶级社会发展的直接动力；改革是社会主义社会发展的直接动力，主语和社会形态不能混。",r:["pl11-3","kw-reform-self"]},
{id:"kw-reform-self",y:0,d:"固定搭配",t:"社会主义改革｜社会主义制度的自我完善和发展",p:1,b:"社会主义改革的性质，是邓小平改革理论的重要内容。",c:"改革是社会主义制度的自我完善和发展，不是改变社会主义制度的根本性质。",m:"改革作为一场深刻革命，改变的是体制机制，而不是社会主义根本制度。",x:"“第二次革命”强调深刻性，不等于改变社会主义方向；改革也不是对原有体制的细枝末节修补。",r:["pl11-3","kw-reform-direct"]},
{id:"kw-market-guarantee",y:0,d:"固定搭配",t:"高水平社会主义市场经济体制｜中国式现代化的重要保障",p:1,b:"二十届三中全会《决定》第二部分的总起定位。",c:"高水平社会主义市场经济体制是中国式现代化的重要保障。",m:"要更好发挥市场机制作用，既“放得活”又“管得住”，实现资源配置效率最优化和效益最大化。",x:"不要与“法治是中国式现代化的重要保障”混淆，两者都正确，需看题干主语。",r:["pl20-3","kw-law-guarantee"],s:"https://www.gov.cn/zhengce/202407/content_6963770.htm"},
{id:"kw-law-guarantee",y:0,d:"固定搭配",t:"法治｜中国式现代化的重要保障",p:1,b:"二十届三中全会《决定》完善中国特色社会主义法治体系部分。",c:"法治是中国式现代化的重要保障。",m:"强调在法治轨道上深化改革、推进中国式现代化，推进国家各方面工作法治化。",x:"重要保障是法治；根本保证是党的领导；重要基础是国家安全。",r:["pl20-3","kw-national-base","kw-party-reform"],s:"https://www.gov.cn/zhengce/202407/content_6963770.htm"},
{id:"kw-rule-law-essential",y:0,d:"固定搭配",t:"全面依法治国｜中国特色社会主义的本质要求和重要保障",p:1,b:"十九大报告对全面依法治国在中国特色社会主义事业中的地位作出概括。",c:"全面依法治国是中国特色社会主义的本质要求和重要保障。",m:"可与“全面依法治国是国家治理的一场深刻革命”结合，理解其在“四个全面”战略布局中的地位。",x:"“本质要求和重要保障”对应全面依法治国；“本质属性”对应全过程人民民主。",r:["doc-19report","kw-democracy-attribute","kw-law-guarantee"]},
{id:"kw-national-root",y:0,d:"固定搭配",t:"国家安全｜民族复兴的根基",p:1,b:"二十大报告推进国家安全体系和能力现代化部分。",c:"国家安全是民族复兴的根基，社会稳定是国家强盛的前提。",m:"要求坚定不移贯彻总体国家安全观，把维护国家安全贯穿党和国家工作各方面全过程。",x:"“根基”是国家安全；“重要保障”通常对应法治或高水平社会主义市场经济体制。",r:["doc-20report","kw-stability-premise","kw-national-base"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-national-base",y:0,d:"固定搭配",t:"国家安全｜中国式现代化行稳致远的重要基础",p:1,b:"二十届三中全会《决定》推进国家安全体系和能力现代化部分。",c:"国家安全是中国式现代化行稳致远的重要基础。",m:"强调实现高质量发展和高水平安全良性互动，切实保障国家长治久安。",x:"同是国家安全，二十大报告有“民族复兴的根基”，三中全会《决定》有“行稳致远的重要基础”，按题干文献作答。",r:["pl20-3","kw-national-root"],s:"https://www.gov.cn/zhengce/202407/content_6963770.htm"},
{id:"kw-stability-premise",y:0,d:"固定搭配",t:"社会稳定｜国家强盛的前提",p:1,b:"二十大报告与“国家安全是民族复兴的根基”连续提出。",c:"社会稳定是国家强盛的前提。",m:"用于理解统筹发展和安全、建设更高水平平安中国。",x:"前提不是“高质量发展”或“改革开放”；按二十大报告固定搭配识记。",r:["doc-20report","kw-national-root"]},
{id:"kw-macro-internal",y:0,d:"固定搭配",t:"科学宏观调控、有效政府治理｜发挥社会主义市场经济体制优势的内在要求",p:1,b:"二十届三中全会《决定》健全宏观经济治理体系部分。",c:"科学的宏观调控、有效的政府治理是发挥社会主义市场经济体制优势的内在要求。",m:"说明既要发挥市场在资源配置中的决定性作用，也要更好发挥政府作用。",x:"主语包括“科学宏观调控”和“有效政府治理”两项，不能只截取宏观调控。",r:["pl20-3","kw-market-guarantee"],s:"https://www.gov.cn/zhengce/202407/content_6963770.htm"},
{id:"kw-party-reform",y:0,d:"固定搭配",t:"党的领导｜进一步全面深化改革、推进中国式现代化的根本保证",p:1,b:"二十届三中全会《决定》第十五部分的根本定位。",c:"党的领导是进一步全面深化改革、推进中国式现代化的根本保证。",m:"要把党的领导贯穿改革各方面全过程，确保改革始终沿着正确政治方向前进。",x:"“根本保证”是党的领导，不是法治；法治是重要保障。",r:["pl20-3","kw-law-guarantee","kw-party-nature"],s:"https://www.gov.cn/zhengce/202407/content_6963770.htm"},
{id:"kw-basic-system-foundation",y:0,d:"固定搭配",t:"社会主义基本制度｜当代中国一切发展进步的制度基础",p:1,b:"1956年社会主义改造基本完成、社会主义基本制度确立的历史意义。",c:"社会主义基本制度的确立，为当代中国一切发展进步奠定了制度基础。",m:"是理解1956年历史转折和社会主义建设展开的制度前提。",x:"1949年新中国成立不是社会主义基本制度确立；1956年才是对应节点。",r:["e1956-system","c8"]},
{id:"kw-system-guarantee",y:0,d:"固定搭配",t:"中国特色社会主义制度｜当代中国发展进步的根本制度保障",p:1,b:"中国特色社会主义制度自信和国家治理现代化的重要定位。",c:"中国特色社会主义制度是当代中国发展进步的根本制度保障。",m:"常与“中国特色社会主义最本质特征和最大制度优势都是中国共产党领导”结合考查。",x:"“制度基础”常用于社会主义基本制度确立的历史意义；“根本制度保障”对应中国特色社会主义制度。",r:["pl19-4","kw-basic-system-foundation","kw-party-nature"]},
{id:"kw-social-security",y:0,d:"固定搭配",t:"社会保障体系｜人民生活的安全网＋社会运行的稳定器",p:1,b:"二十大报告健全社会保障体系部分。",c:"社会保障体系是人民生活的安全网和社会运行的稳定器。",m:"用于说明社会保障在保障基本生活、维护社会公平和稳定中的双重作用。",x:"安全网和稳定器的对象不同：人民生活、社会运行，不要颠倒或漏写。",r:["doc-20report","kw-distribution-base"],s:"https://www.gov.cn/xinwen/2022-10/25/content_5721685.htm"},
{id:"kw-distribution-base",y:0,d:"固定搭配",t:"分配制度｜促进共同富裕的基础性制度",p:1,b:"二十大报告完善分配制度部分。",c:"分配制度是促进共同富裕的基础性制度。",m:"要坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系。",x:"不是“按生产要素分配为主体”；我国分配制度主体是按劳分配。",r:["doc-20report","kw-common-prosperity"]}
]);

{id:"kw-path-struggle",y:0,d:"固定搭配",t:"团结奋斗｜中国人民创造历史伟业的必由之路",p:1,b:"二十大报告五个“必由之路”之一。",c:"团结奋斗是中国人民创造历史伟业的必由之路。",m:"与二十大报告主题中的“团结奋斗”和党的百年奋斗历史经验相互呼应。",x:"不是“改革创新是中国人民创造历史伟业的必由之路”。",r:["doc-20report","doc-history3"]},

{id:"kw-urban-rural",y:0,d:"固定搭配",t:"城乡融合发展｜中国式现代化的必然要求",p:1,b:"二十届三中全会《决定》完善城乡融合发展体制机制部分。",c:"城乡融合发展是中国式现代化的必然要求。",m:"要统筹新型工业化、新型城镇化和乡村全面振兴，缩小城乡差别，促进城乡共同繁荣。",x:"不要与“解决台湾问题、实现祖国完全统一是民族复兴的必然要求”混配。",r:["pl20-3","kw-rural-revitalization"]},

{id:"kw-green-key",y:0,d:"固定搭配",t:"绿色化、低碳化｜实现高质量发展的关键环节",p:1,b:"二十大报告关于加快发展方式绿色转型的定位。",c:"推动经济社会发展绿色化、低碳化是实现高质量发展的关键环节。",m:"强调发展方式绿色转型，而不是把生态保护理解为停止发展。",x:"“关键环节”对应绿色化、低碳化；“首要任务”对应高质量发展。",r:["doc-20report","kw-highquality-first","kw-nature-internal"]},

{id:"kw-one-country-two",y:0,d:"固定搭配",t:"“一国两制”｜香港、澳门回归后保持长期繁荣稳定的最佳制度安排",p:1,b:"二十大报告对“一国两制”伟大创举和港澳实践的概括。",c:"“一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的最佳制度安排。",m:"用于香港、澳门制度安排和“一国两制”行稳致远相关考点。",x:"“最佳制度安排”限定港澳回归后的繁荣稳定；解决台湾问题的基本方针与最佳方式要另记。",r:["doc-20report","kw-peace-unification"]},

add("keyword","新发展理念·新发展格局",[
{id:"kw-concept-innovation",y:0,d:"固定搭配",t:"创新发展｜解决发展动力问题",p:1,b:"十八届五中全会提出的新发展理念第一项。",c:"创新是引领发展的第一动力，创新发展注重解决发展动力问题。",m:"把创新摆在国家发展全局的核心位置，让创新贯穿党和国家一切工作。",x:"与协调、绿色、开放、共享分别解决的问题不可调换。",r:["pl18-5","kw-innovation-first"]},
{id:"kw-concept-coordinate",y:0,d:"固定搭配",t:"协调发展｜持续健康发展的内在要求",p:1,b:"新发展理念第二项，针对发展不平衡问题。",c:"协调是持续健康发展的内在要求，协调发展注重解决发展不平衡问题。",m:"要求正确处理发展中的重大关系，增强发展整体性、协调性。",x:"“内在要求”在此对应协调；“绿色”是永续发展的必要条件。",r:["pl18-5","kw-concept-green"]},

{id:"kw-open-path",y:0,d:"固定搭配",t:"开放发展｜国家繁荣发展的必由之路",p:1,b:"十八届五中全会对开放发展理念的定位。",c:"开放是国家繁荣发展的必由之路，开放发展注重解决发展内外联动问题。",m:"要求顺应经济全球化潮流，发展更高层次开放型经济。",x:"与二十届三中全会“开放是中国式现代化的鲜明标识”可以并存，题干限定哪份文献就答哪种表述。",r:["pl18-5","kw-open-identity","kw-path-newconcept"]},
