["fg-leifeng",1940,"1940—1962","雷锋",1,"中国人民解放军战士、共产主义战士和全心全意为人民服务的道德模范。","把有限生命投入无限为人民服务之中，体现崇高理想信念、服务人民助人为乐、干一行爱一行专一行精一行、锐意进取自强不息、艰苦奋斗勤俭节约。","与雷锋精神、志愿服务、平凡岗位和社会主义核心价值观相联，人物评价不能停留在单纯助人为乐。","雷锋精神不是只做生活小事，也包含政治立场、敬业创新和创业精神；1963年毛泽东题词向雷锋同志学习。",[
["1960","参加中国人民解放军","在部队和日常工作中践行服务人民、敬业奉献。"],["1962","因公殉职","年仅22岁，留下日记和先进事迹。"],["1963","“向雷锋同志学习”题词发表","推动全国学雷锋活动广泛开展。"]],["sp-leifeng","sf-life-value"]],
["fg-jiao",1922,"1922—1964","焦裕禄",1,"县委书记的榜样、党的好干部，亲民爱民、艰苦奋斗的模范。","在兰考带领群众治理内涝、风沙、盐碱三害，体现亲民爱民、艰苦奋斗、科学求实、迎难而上、无私奉献的焦裕禄精神。","用于群众路线、调查研究、担当作为和政绩观，突出心中装着全体人民、唯独没有自己。","焦裕禄精神不能简化为吃苦，还包含科学求实和亲民爱民；与大庆精神、雷锋精神内涵不同。",[
["1962","调任兰考县委书记","面对严重自然灾害开展调查研究。"],["1962—1964","带领治理“三害”","深入一线寻找治理内涝、风沙、盐碱办法。"],["1964","病逝","其事迹成为党员干部学习榜样。"],["1966","长篇通讯广泛宣传","焦裕禄精神在全国产生深远影响。"]],["sp-jiao","kw-mass-line"]],
["fg-wangjinxi",1923,"1923—1970","王进喜",2,"大庆石油会战中的劳动模范，“铁人”称号的代表人物，体现中国工人阶级爱国创业精神。","以“宁可少活二十年，拼命也要拿下大油田”的豪情投身石油会战，体现为国分忧、艰苦创业、科学求实和无私奉献，与大庆精神（铁人精神）紧密相连。","用于社会主义建设探索时期的劳模、工业建设和艰苦奋斗，注意其时代不是改革开放后。","大庆精神规范概括为爱国、创业、求实、奉献；王进喜不是两弹一星科学家。",[
["1950年代","成为石油工人","在玉门等油田成长为劳动模范。"],["1960","参加大庆石油会战","带领钻井队艰苦创业、连续奋战。"],["其后","成为全国学习的“铁人”典型","激励工业战线自力更生、奋发图强。"]],["sp-daqing","sg-explore"]],
["fg-qian",1911,"1911—2009","钱学森",1,"中国航天事业奠基人、著名科学家，“两弹一星”功勋奖章获得者。","冲破阻挠回国效力，长期领导火箭、导弹和航天技术研究，体现热爱祖国、无私奉献，自力更生、艰苦奋斗，大力协同、勇于登攀的两弹一星精神。","人物题可用于科技报国、高水平自立自强、科学家精神和个人理想融入国家需要。","钱学森主要贡献在火箭导弹航天和系统科学，不要把所有两弹一星成就归于个人；袁隆平对应杂交水稻。",[
["1955","回国","克服阻挠回到新中国，投身国防科技事业。"],["1956","参与组建导弹研究机构","为中国火箭导弹和航天事业奠基。"],["1970","我国第一颗人造地球卫星发射成功","长期组织领导为两弹一星事业作出重大贡献。"],["1999","获“两弹一星”功勋奖章","国家表彰其突出贡献。"]],["sp-liangdan","xs-sci-talent"]],
["fg-yuan",1930,"1930—2021","袁隆平",1,"著名农业科学家、杂交水稻研究开创者之一，“共和国勋章”获得者。","长期致力于杂交水稻研究与应用，推动三系配套和增产推广，体现求真务实、勇攀高峰、淡泊名利、服务人民的科学家精神和把论文写在大地上的实践品格。","用于粮食安全、科技创新、实践认识论和人生价值，突出解决人民吃饭问题与长期田野实践。","杂交水稻不是个人一时灵感完成，而是团队长期实践和协同研究；不能把其贡献写成发现基因编辑技术。",[
["1960年代","开展杂交水稻研究","从生产实际和田野调查出发探索提高水稻产量。"],["1973","协作实现三系配套","推动杂交水稻研究取得关键突破。"],["1976后","杂交水稻逐步大面积推广","为粮食增产和农业科技进步作重要贡献。"],["2019","获“共和国勋章”","表彰其杰出贡献。"]],["sp-scientist","sf-life-value"]],
["fg-huangnian",1958,"1958—2017","黄大年",2,"著名地球物理学家、时代楷模，体现心有大我、至诚报国的科学家精神。","放弃国外优越条件回国，带领团队攻关深地探测等关键技术，体现胸怀祖国、服务人民、勇攀高峰、敢为人先、淡泊名利和潜心研究。","人物材料题常把个人选择与科技强国、教育报国和爱国奋斗结合，落脚国家需要与创新担当。","黄大年主要领域是地球物理，不要与南仁东FAST、钱学森航天混配。",[
["2009","回国工作","把个人科研事业融入国家发展需要。"],["回国后","组织深地探测科研攻关","推动相关关键技术进步和人才培养。"],["2017","病逝后被追授时代楷模等称号","其爱国敬业精神广为学习。"]],["sp-scientist","xs-sci-talent"]],
["fg-nanrendong",1945,"1945—2017","南仁东",2,"“中国天眼”FAST主要发起者和奠基人、人民科学家，体现长期坚守和协同攻关精神。","长期主持500米口径球面射电望远镜选址、预研究和工程建设，体现胸怀祖国、敢为人先、严谨求实、淡泊名利、甘为人梯的科学家精神。","用于高水平科技自立自强、重大工程和量变积累，强调从选址到建成的长期实践。","中国天眼位于贵州，不是载人航天或北斗工程；南仁东不是探月工程总设计师。",[
["1994前后","推动FAST构想与选址论证","长期开展科学论证和台址考察。"],["2016","FAST落成启用","世界最大单口径球面射电望远镜建成。"],["2017","病逝","其科学报国和执着奋斗精神受到广泛学习。"]],["sp-scientist","my-quality"]]
]);
add("evaluation","马克思主义与民主革命先驱",[
{id:"ev-marx200",y:2018,d:"2018.5.4",t:"纪念马克思诞辰200周年大会讲话",p:1,b:"纪念马克思的伟大人格和历史功绩，重温其崇高精神和光辉思想，宣示对马克思主义科学真理的坚定信念。",c:"马克思是全世界无产阶级和劳动人民的革命导师，是马克思主义主要创始人，是马克思主义政党缔造者和国际共产主义开创者，是近代以来最伟大的思想家。马克思主义是科学的理论、人民的理论、实践的理论、不断发展的开放的理论。",m:"掌握马克思四个身份、马克思主义四个理论定位，以及两个伟大发现使社会主义由空想变科学。",x:"四个理论定位与马克思主义鲜明特征相联但不是简单换词；不要把两个伟大发现写成《共产党宣言》和《资本论》。",r:["fg-marx","my-origin","my-features"],s:"http://www.12371.cn/special/mksdc200zn/"},
{id:"ev-sun150",y:2016,d:"2016.11.11",t:"纪念孙中山先生诞辰150周年大会讲话",p:1,b:"缅怀孙中山领导近代中国民族民主革命的不朽功勋，阐明全体中华儿女共同致力民族复兴和维护统一的历史使命。",c:"孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱。中国共产党人是孙中山革命事业最坚定的支持者、最忠诚的合作者、最忠实的继承者。",m:"学习热爱祖国献身祖国、追求真理与时俱进、坚韧不拔百折不挠和维护国家统一民族团结，联系振兴中华和两岸共同责任。",x:"三个“最”分别对应支持者、合作者、继承者，不能换为领导者、开创者；评价孙中山也要分析旧三民主义局限。",r:["fg-sun","sm-tongmenghui","sm-kmt1"],s:"https://news.12371.cn/2016/11/11/VIDE1478865001658454.shtml"}
]);
add("evaluation","毛泽东与邓小平：周年表述对拍",[
{id:"ev-mao120",y:2013,d:"2013.12.26",t:"纪念毛泽东同志诞辰120周年座谈会讲话",p:2,b:"在全面深化改革开局之际，科学评价毛泽东和毛泽东思想，强调坚持和运用好毛泽东思想活的灵魂。",c:"毛泽东同志是伟大的马克思主义者，伟大的无产阶级革命家、战略家和理论家，是近代以来中国伟大的爱国者和民族英雄，是领导中国人民彻底改变自己命运和国家面貌的一代伟人。",m:"掌握历史功勋、实事求是群众路线独立自主，以及全面历史辩证评价人物的方法，不能把晚年错误等同毛泽东思想。",x:"2023年130周年讲话在此基础上增加伟大开拓者、伟大奠基者、第一代中央领导集体核心和伟大国际主义者等表述，周年题按题干对应。",r:["fg-maozedong","pl11-6","mz-live-soul"]},
{id:"ev-mao130",y:2023,d:"2023.12.26",t:"纪念毛泽东同志诞辰130周年座谈会讲话",p:1,b:"在以中国式现代化推进强国复兴的新征程上，缅怀毛泽东的历史功勋并学习崇高精神风范。",c:"毛泽东是伟大的马克思主义者，伟大的无产阶级革命家、战略家、理论家，是马克思主义中国化的伟大开拓者、中国社会主义现代化建设事业的伟大奠基者，是近代以来中国伟大的爱国者和民族英雄，是党的第一代中央领导集体的核心，是领导中国人民彻底改变自己命运和国家面貌的一代伟人，是为世界被压迫民族解放和人类进步事业作出重大贡献的伟大国际主义者。",m:"最新完整评价是人物帽子题重点；最好纪念是把其开创事业继续推向前进，以中国式现代化推进强国复兴。",x:"“马克思主义中国化伟大开拓者”“社会主义现代化建设事业伟大奠基者”不可漏写或错配给邓小平；邓小平对应改革开放总设计师、中国特色社会主义道路开创者。",r:["fg-maozedong","ev-deng120","xs-modern-features"],s:"https://www.12371.cn/2024/02/04/ARTI1707043731458108.shtml"},
{id:"ev-deng110",y:2014,d:"2014.8.20",t:"纪念邓小平同志诞辰110周年座谈会讲话",p:2,b:"在全面深化改革背景下缅怀邓小平，突出信念坚定、热爱人民、实事求是、开拓创新、战略思维和坦荡无私。",c:"邓小平是全党全军全国各族人民公认的享有崇高威望的卓越领导人，伟大的马克思主义者，伟大的无产阶级革命家、政治家、军事家、外交家，久经考验的共产主义战士，党的第二代中央领导集体核心，中国社会主义改革开放和现代化建设总设计师，中国特色社会主义道路开创者，邓小平理论主要创立者。",m:"掌握总设计师、道路开创者、理论主要创立者三大高频定位，以及解放思想实事求是精髓。",x:"2024年讲话进一步强调为世界和平和发展作出重大贡献的伟大国际主义者，并明确邓小平理论是马克思主义中国化时代化重要里程碑。",r:["fg-deng","ev-deng120","mz-deng-theme"]},
{id:"ev-deng120",y:2024,d:"2024.8.22",t:"纪念邓小平同志诞辰120周年座谈会讲话",p:1,b:"在贯彻二十届三中全会精神、进一步全面深化改革之际，缅怀邓小平并推进其开创的中国特色社会主义事业。",c:"在110周年评价基础上，明确邓小平是为世界和平和发展作出重大贡献的伟大国际主义者；其历史功勋是全方位的、开创性的，对中国和世界影响深刻长远。邓小平理论是马克思主义中国化时代化重要里程碑，是中国特色社会主义理论体系奠基之作。",m:"重点掌握领导伟大历史转折、推动马克思主义中国化新的飞跃、开辟现代化建设新局面、确立统一正确路径、捍卫社会主义旗帜、成功开创中国特色社会主义。",x:"最重要思想财富是以邓小平为主创立的邓小平理论，不是某一篇南方谈话或某一个政策；不能把改革开放总设计师与现代化建设伟大奠基者混配。",r:["fg-deng","pl11-3","doc-south","pl20-3"],s:"http://www.xinhuanet.com/20240822/57fba224afe64296bab08a0619a6bc5b/c.html"}
]);
add("evaluation","老一辈革命家最新纪念讲话",[
{id:"ev-zhou120",y:2018,d:"2018.3.1",t:"纪念周恩来同志诞辰120周年座谈会讲话",p:1,b:"缅怀周恩来为中国人民谋幸福、民族复兴和人类进步事业奋斗的卓著功勋与崇高风范。",c:"周恩来是近代以来中华民族的一颗璀璨巨星，是中国共产党人的一面不朽旗帜。讲话概括六个杰出楷模：不忘初心坚守信仰，对党忠诚维护大局，热爱人民勤政为民，自我革命永远奋斗，勇于担当鞠躬尽瘁，严于律己清正廉洁。",m:"六个楷模可分信仰、忠诚、人民、革命、担当、廉洁六条记忆，适合思修和党建材料题。",x:"不要只记人民总理和外交成就而漏六个楷模；和平共处五项原则与万隆求同存异属于人物事件，不是评价标题。",r:["fg-zhou","sm-bandung","sm-npc1964"],s:"http://www.12371.cn/special/jnzeldc120/"},
{id:"ev-liu120",y:2018,d:"2018.11.23",t:"纪念刘少奇同志诞辰120周年座谈会讲话",p:1,b:"缅怀刘少奇为党和人民事业建立的不朽功勋，学习其崇高品德和高尚情操。",c:"刘少奇是伟大的马克思主义者，伟大的无产阶级革命家、政治家、理论家，党和国家主要领导人之一，中华人民共和国开国元勋，党的第一代中央领导集体重要成员。讲话概括五个光辉榜样：不忘初心对党忠诚、坚持真理实事求是、敢于担当勇于创造、勤于学习知行合一、心系人民廉洁奉公。",m:"与《论共产党员的修养》和党性修养结合，适合理想信念、学习实践、人民立场材料题。",x:"刘少奇定位含理论家，周恩来纪念讲话则突出六个杰出楷模，人物评价不能交叉拼接。",r:["fg-liu","c7","rm-7000"],s:"https://www.12371.cn/2018/11/24/VIDE1543031520594660.shtml"},
{id:"ev-chenyun120",y:2025,d:"2025.6.13",t:"纪念陈云同志诞辰120周年座谈会讲话",p:1,b:"新时代新征程学习陈云为革命、建设、改革建立的不朽功勋及其领导经验和思想方法。",c:"陈云是伟大的无产阶级革命家、政治家，杰出的马克思主义者，中国社会主义经济建设的开创者和奠基人之一，党和国家久经考验的卓越领导人，是党的第一代、第二代中央领导集体重要成员。学习其崇高精神风范、丰富领导经验、科学思想方法和工作方法。",m:"高频包括坚定理想信念、坚强党性原则、求真务实作风、朴素公仆情怀、勤奋学习精神，以及十五字诀和调查研究。",x:"十五字诀是“不唯上、不唯书、只唯实，交换、比较、反复”；三个主体三个补充是经济建设思想，不等于十五字诀。",r:["fg-chenyun","c8","pl8-9"],s:"https://djyj.12371.cn/2025/07/15/ARTI1752543520704699.shtml"}
]);
addFlat("spirit","新民主主义革命时期（17种）","精神谱系",[
["sp-founding","建党精神",1,"中国共产党的先驱们创建中国共产党，在寻求民族独立人民解放和马克思主义中国化实践中形成。","坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。","这是中国共产党的精神之源，贯穿党的全部精神谱系，常作理想信念、初心使命和党建材料题总起。","原始名录列“建党精神”，权威讲话和专题学习常用“伟大建党精神”，本条目不拆成两项；它也不是红船精神的同义替换，四组八句不可随意改字。",["c1","sg-party-found"],"https://www.gov.cn/xinwen/2021-09/29/content_5640143.htm"],
["sp-jinggang","井冈山精神",1,"大革命失败后，毛泽东等创建井冈山革命根据地，探索农村包围城市、武装夺取政权道路。","坚定执着追理想、实事求是闯新路、艰苦奋斗攻难关、依靠群众求胜利。","用于坚定理想信念、独立探索中国道路和依靠群众，与星星之火、反对本本主义交叉。","核心不仅是艰苦奋斗，更包含实事求是闯新路；不要只背坚定信念艰苦奋斗。",["e-jinggang","mao-spark"]],
["sp-suqu","苏区精神",2,"党在中央苏区和其他革命根据地开展土地革命、政权建设和群众工作中形成。","坚定信念、求真务实、一心为民、清正廉洁、艰苦奋斗、争创一流、无私奉献。","用于局部执政、群众工作和调查研究，体现共产党人的政治本色与为民情怀。","苏区精神与井冈山精神、老区精神相关但不是同一名录，不能相互替代。",["sm-soviet1931"]],
["sp-longmarch","长征精神",1,"红军长征在极端艰险中实现战略转移，以理想信念和革命英雄主义战胜围追堵截及自然困难。","把全国人民和中华民族根本利益看得高于一切，坚定革命理想信念、坚信正义事业必然胜利；为救国救民不怕任何艰难险阻、不惜付出一切牺牲；坚持独立自主、实事求是、一切从实际出发；顾全大局、严守纪律、紧密团结；紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗。","从人民利益、理想信念、牺牲奋斗、独立求实、纪律团结、依靠群众六层记忆，适合分析如何走好新的长征路。","原始名录列“长征精神”，权威讲话常用“伟大长征精神”，不拆成两项；长征精神不等于遵义会议精神，也不能把遵义会议说成正式确立毛泽东思想指导地位。",["e-longmarch","rm-zunyi"]],
["sp-zunyi","遵义会议精神",1,"遵义会议在最危急关头纠正军事组织错误，党开始独立自主解决中国革命实际问题。","坚定信念、实事求是、独立自主、敢闯新路、民主团结。","用于实事求是、独立自主、民主集中制和在危机中开新局，与生死攸关转折点结合。","不能把遵义会议精神简化为不怕牺牲长征精神，也不能说会议正式确立毛泽东思想指导地位。",["rm-zunyi","sp-longmarch"]],
["sp-yanan","延安精神",1,"中共中央在延安十三年领导革命、建设根据地、开展整风并形成成熟理论和优良作风。","坚定正确的政治方向，解放思想、实事求是的思想路线，全心全意为人民服务的根本宗旨，自力更生、艰苦奋斗的创业精神。","可按方向、路线、宗旨、作风四层记忆，用于党性教育、群众路线和作风建设。","延安精神不是南泥湾精神简单扩大；坚定正确政治方向居首，实事求是是精髓。",["rm-yanan","sg-yanan"]],
["sp-resist","抗战精神",1,"中国人民在十四年抗战中以巨大牺牲赢得近代以来抗击外敌入侵第一次完全胜利。","天下兴亡、匹夫有责的爱国情怀，视死如归、宁死不屈的民族气节，不畏强暴、血战到底的英雄气概，百折不挠、坚忍不拔的必胜信念。","用于爱国主义、民族团结、斗争精神和世界反法西斯东方主战场，四句按情怀气节气概信念记忆。","原始名录列“抗战精神”，权威讲话常用“伟大抗战精神”，不拆成两项；它不是只指共产党敌后战场，也不否认全民族共同抗战，注意十四年抗战时间口径。",["e1945-victory","sg-anti-win"]],
["sp-hongyan","红岩精神",2,"中共中央南方局在重庆等国民党统治区开展统一战线、群众工作和地下斗争中形成。","崇高思想境界、坚定理想信念、巨大人格力量、浩然革命正气。","用于在复杂环境中坚持原则、团结多数、忠诚担当和革命气节，联系红岩英烈和南方局实践。","红岩精神与抗战精神、红船精神不是同一名称，不能因都有红色文化而混写。",["sg-anti-front"]],
["sp-xibaipo","西柏坡精神",1,"党中央在西柏坡指挥战略决战、筹备新中国并召开七届二中全会，面临全国执政考验。","谦虚谨慎、艰苦奋斗的精神，敢于斗争、敢于胜利的精神，依靠群众、团结统一的精神。","与两个务必、进京赶考和新时代三个务必结合，突出夺取胜利与执政作风统一。","西柏坡精神不等于两个务必，两个务必是七届二中全会重要内容；两组表述不可完全替换。",["pl7-2","cb-three-must"]],
["sp-zhaojin","照金精神",2,"刘志丹、谢子长、习仲勋等创建以照金为中心的陕甘边革命根据地，开展武装斗争和群众工作。","忠诚于党的坚定信念、顽强斗争的英雄气概、扎根群众的工作作风。","用于坚定忠诚、革命斗争和密切联系群众，体现西北革命根据地两点一存历史实践。","照金精神与南梁精神相关但不是同一规范名录项目，按共产党员网条目记三句。",["sm-soviet1931"],"https://www.12371.cn/2023/11/28/STUD1701138146742477.shtml"],
["sp-northeast","东北抗联精神",2,"东北抗日联军在极端恶劣环境中长期坚持抗日游击战争，付出巨大牺牲。","忠贞报国、勇赴国难的爱国主义精神，勇敢顽强、前仆后继的英勇战斗精神，坚贞不屈、勇于献身的不畏牺牲精神，不畏艰险、百折不挠的艰苦奋斗精神，休戚与共、团结御侮的国际主义精神。","用于十四年抗战、爱国主义和顽强斗争，突出最早奋起抗战与长期坚持。","九一八后局部抗战是十四年抗战开端，不能将东北抗联只放入1937年后的全民族抗战。",["e1931-918","sp-resist"]],
["sp-nanniwan","南泥湾精神",2,"抗战相持阶段根据地经济困难，八路军三五九旅在南泥湾开展大生产运动。","以自力更生、艰苦奋斗为核心，体现调查研究、实事求是，上下一致、共克时艰，勇于创造、敢为人先。","用于独立自主、生产自救、调查研究和创新创业，说明克服困难既靠精神也靠科学实践。","南泥湾精神不是单纯苦干，更不等于延安精神全部内容；突出生产自救背景。",["sp-yanan"]],
["sp-taihang","太行精神（吕梁精神）",2,"八路军和太行、吕梁等地军民在华北敌后开展抗日斗争、建设根据地，形成军民团结的优良传统。","不怕牺牲、不畏艰险，百折不挠、艰苦奋斗，万众一心、敢于胜利，英勇奋斗、无私奉献。","用于人民战争、军民团结和艰苦奋斗，原始名录将太行精神与吕梁精神列为同一括号对照项。","原始名录写作“太行精神（吕梁精神）”，在这一项中合并掌握，不另拆计数；与沂蒙精神地域及规范内涵不同。",["sg-anti-front"]],
["sp-dabie","大别山精神",2,"鄂豫皖革命根据地军民长期坚持武装斗争，创造二十八年红旗不倒的革命奇迹。","坚守信念、紧跟党走，顾全大局、团结奋斗，勇当前锋、不胜不休。","用于理想信念、大局意识、团结奋斗和敢当前锋，与刘邓大军挺进大别山等事件联系。","不是简单用朴诚勇毅、不胜不休替代官方三条完整内涵，后者可作地方革命传统理解。",["e1947-offensive"],"https://www.12371.cn/2023/11/28/STUD1701138146777485.shtml"],
["sp-yimeng","沂蒙精神",2,"山东沂蒙根据地党和人民军队与人民群众在革命战争中形成血肉联系和鱼水深情。","党群同心、军民情深、水乳交融、生死与共。","用于人民立场、群众路线和军民团结，说明党把人民利益放在首位、人民全力支持革命。","旧资料常写爱党爱军、开拓奋进、艰苦创业、无私奉献；若题干限定最新规范，用党群同心等十六字。",["kw-mass-line"]],
["sp-oldarea","老区精神",3,"革命老区党和人民在创建巩固根据地、支援革命战争中形成光荣传统和优良作风。","爱党信党、坚定不移的理想信念，舍生忘死、无私奉献的博大胸怀，不屈不挠、敢于胜利的英雄气概，自强不息、艰苦奋斗的顽强斗志，求真务实、开拓创新的科学态度，鱼水情深、生死相依的光荣传统。","用于革命老区振兴、红色基因和人民立场，六层内涵可作中低频识别。","老区精神是第一批46种中的独立项目，不等于大别山精神或苏区精神简称。",["sp-suqu","sp-dabie"]],
["sp-zhangside","张思德精神",2,"张思德在革命队伍中忠实执行分配任务、全心全意为人民服务，毛泽东在其追悼会上发表《为人民服务》。","以全心全意为人民服务为核心，体现对党忠诚、服从大局、爱岗敬业、任劳任怨、无私奉献。","用于党的根本宗旨、平凡岗位和人生价值，强调伟大出自平凡、英雄来自人民。","《为人民服务》发表背景与张思德相关；白求恩对应毫不利己专门利人和国际主义，不要混。",["kw-people-position","sf-life-value"]]
]);
addFlat("spirit","社会主义革命和建设时期（12种）","精神谱系",[
["sp-korea","抗美援朝精神",1,"中国人民志愿军在抗美援朝、保家卫国战争中，以劣势装备同强大敌人英勇作战并赢得胜利。","祖国和人民利益高于一切、为了祖国和民族尊严奋不顾身的爱国主义精神，英勇顽强、舍生忘死的革命英雄主义精神，不畏艰难困苦、始终保持高昂士气的革命乐观主义精神，为完成祖国和人民赋予使命、慷慨奉献一切的革命忠诚精神，为了人类和平与正义事业而奋斗的国际主义精神。","按爱国主义、英雄主义、乐观主义、革命忠诚、国际主义五层记忆，用于维护和平、国防和斗争精神。","抗美援朝精神不是单纯不怕死，国际主义和革命忠诚不可漏；战争胜利提高新中国国际地位并赢得和平环境。",["e1950-korea"]],
["sp-liangdan","“两弹一星”精神",1,"广大科技工作者在物质技术基础薄弱条件下，自主突破核弹、导弹和人造卫星等重大国防科技。","热爱祖国、无私奉献，自力更生、艰苦奋斗，大力协同、勇于登攀。","用于科技自立自强、爱国奋斗、系统协同和科学家精神，与钱学森等人物及高水平科技自立自强相联。","两弹一星是核弹、导弹、人造卫星，不是原子弹、氢弹、卫星的简单固定说法；强调大力协同而非个人英雄主义。",["fg-qian","xs-sci-talent"]],
["sp-leifeng","雷锋精神",1,"雷锋在平凡岗位和日常生活中践行共产主义理想与为人民服务宗旨，学雷锋活动不断发展。","热爱党、热爱祖国、热爱社会主义的崇高理想和坚定信念，服务人民、助人为乐的奉献精神，干一行爱一行、专一行精一行的敬业精神，锐意进取、自强不息的创新精神，艰苦奋斗、勤俭节约的创业精神。","按信念、奉献、敬业、创新、创业五层记忆，用于志愿服务、职业道德和青年人生价值。","雷锋精神不是只助人为乐，也不能等同劳模精神；其理想信念和敬业创新同样是高频得分点。",["fg-leifeng","sf-life-value"]],
["sp-jiao","焦裕禄精神",1,"焦裕禄在兰考带领群众治理三害，把群众利益置于首位并坚持科学求实。","亲民爱民、艰苦奋斗、科学求实、迎难而上、无私奉献。","用于群众路线、调查研究、担当作为和正确政绩观，五句可对应人民、作风、方法、斗争、奉献。","不要只写艰苦奋斗而漏亲民爱民和科学求实；焦裕禄精神与王杰两不怕、雷锋五层内涵不同。",["fg-jiao","kw-mass-line"]],
["sp-daqing","大庆精神（铁人精神）",1,"以王进喜为代表的大庆石油职工在艰苦条件下开展石油会战，为国家能源独立和工业建设作贡献。","大庆精神核心为爱国、创业、求实、奉献；铁人精神突出为国分忧、为民族争气的爱国主义，独立自主、自力更生的艰苦创业，讲究科学、三老四严的求实和胸怀全局、为国分忧的奉献。","用于工业报国、艰苦奋斗、严细求实和职业道德，第一批名录通常作为大庆精神相关项目整体掌握。","原始名录写作“大庆精神（铁人精神）”，二者在这一项中合并掌握，不另拆为第47项；大庆精神不是盲目拼命，还强调科学求实和三老四严。",["fg-wangjinxi"]],
["sp-hongqiqu","红旗渠精神",1,"河南林县人民在太行山悬崖峭壁修建红旗渠，解决缺水问题，体现自力更生和集体协作。","自力更生、艰苦创业、团结协作、无私奉献。","用于艰苦创业、人民主体、团结协作和改造自然的实践精神，与尊重规律、科学组织结合。","红旗渠精神不是单纯征服自然，也不能脱离科学求实；与塞罕坝绿色发展背景不同。",["my-material-unity"]],
["sp-beidahuang","北大荒精神",3,"几代拓荒者在黑龙江垦区开发荒原、建设商品粮基地，把北大荒变为北大仓。","艰苦奋斗、勇于开拓、顾全大局、无私奉献。","用于国家粮食安全、开拓创新、大局意识和奉献，突出农业现代化和屯垦戍边实践。","北大荒精神不是塞罕坝精神，后者是牢记使命、艰苦创业、绿色发展。",["xs-security"]],
["sp-saihanba","塞罕坝精神",2,"塞罕坝林场几代建设者在高寒荒原植树造林，将荒原变林海，创造生态文明建设范例。","牢记使命、艰苦创业、绿色发展。","用于两山论、久久为功、生态文明和代际责任，说明良好生态需要长期科学治理。","塞罕坝不是只有艰苦奋斗，绿色发展是区别于许多建设时期精神的重要关键词。",["xs-ecology","my-quality"]],
["sp-lianglu","“两路”精神",3,"川藏、青藏公路建设者和养护者在高原极端环境中修路护路，促进西藏发展和民族团结。","一不怕苦、二不怕死，顽强拼搏、甘当路石，军民一家、民族团结。","用于高原建设、民族团结、奉献担当和交通强国，注意军民一家和民族团结特色。","两路指川藏、青藏公路；青藏铁路精神另列，规范内涵为挑战极限、勇创一流。",["sp-qingzang"]],
["sp-laoxizang","老西藏精神（孔繁森精神）",3,"进藏人民解放军、干部和各族群众在和平解放、建设西藏过程中形成特别能奋斗的优良传统，孔繁森等先进典型进一步彰显这一精神。","特别能吃苦、特别能战斗、特别能忍耐、特别能团结、特别能奉献。","用于边疆建设、民族团结、艰苦奋斗和奉献，五个特别缺一不可。","原始名录写作“老西藏精神（孔繁森精神）”，二者在这一项中对照掌握，不另拆计数；也不等于“两路”精神。",["sp-lianglu"]],
["sp-xiqian","西迁精神",2,"交通大学等高校师生响应国家需要，从沿海迁往西北，服务西部教育和工业建设。","胸怀大局、无私奉献、弘扬传统、艰苦创业。","用于个人理想与国家需要、教育科技人才和爱国主义，核心是胸怀大局、到祖国最需要的地方建功立业。","西迁精神不是一般搬迁经历，不能与科学家精神六项内涵机械互换。",["fg-qian","sf-ideal-social"]],
["sp-wangjie","王杰精神",2,"王杰在人民军队训练和执行任务的实践中形成革命英雄主义和高尚品德。","一不怕苦、二不怕死；同时学习其在荣誉、待遇、物质上“三不伸手”的境界。","用于革命军人血性胆魄、担当奉献和廉洁自律，两不怕与三不伸手可结合。","王杰精神与两路精神都有一不怕苦二不怕死，但完整内涵不同，不能因一句相同而混配。",["xs-army"],"http://www.12371.cn/special/zgjs/wjjs/"]
]);
addFlat("spirit","改革开放和社会主义现代化建设新时期（9种）","精神谱系",[
["sp-reform","改革开放精神",1,"党领导人民解放思想、实事求是，大胆地试、勇敢地闯，推进改革开放和社会主义现代化建设。","解放思想、实事求是，敢闯敢试、勇于创新，互利合作、命运与共。","改革开放精神极大丰富民族精神内涵，成为当代中国人民最鲜明精神标识，用于改革创新和开放合作。","改革开放精神与时代精神相关但不是简单同义，时代精神核心是改革创新；不能封闭保守理解开放。",["pl11-3","pl20-3"]],
["sp-tequ","特区精神",1,"经济特区建设者冲破思想体制束缚，在改革开放前沿探索社会主义市场经济和现代化建设。","敢闯敢试、敢为人先、埋头苦干。","用于先行先试、创新驱动、实干担当，说明改革既需勇气也需务实执行。","敢闯敢试不是违法乱闯或脱离国情，特区精神不等于改革开放精神全部内涵。",["pl11-3","sp-reform"]],
["sp-kanghong","抗洪精神",2,"1998年抗洪抢险中军民团结、干群同心，战胜特大洪水。","万众一心、众志成城，不怕困难、顽强拼搏，坚韧不拔、敢于胜利。","用于风险挑战、集体主义、人民至上和顽强斗争，强调团结协作和持续奋斗。","抗洪精神与抗震救灾精神开头相同，后两句不同：抗洪是不怕困难顽强拼搏、坚韧不拔敢于胜利。",["sp-dizhen"]],
["sp-sars","抗击“非典”精神",2,"2003年抗击非典疫情中，全国上下团结互助、科学防治，医护人员迎难而上。","万众一心、众志成城，团结互助、和衷共济，迎难而上、敢于胜利。","用于公共卫生、团结协作、责任担当和共同应对风险，可与新时代抗疫精神对拍。","抗击“非典”精神不是生命至上、举国同心、舍生忘死、尊重科学、命运与共，后者是伟大抗疫精神。",["sp-yiqing"]],
["sp-dizhen","抗震救灾精神",2,"汶川特大地震等抗震救灾中，党领导军民全力救援、科学施救并开展恢复重建。","万众一心、众志成城，不畏艰险、百折不挠，以人为本、尊重科学。","用于人民至上、科学救援、社会协同和韧性治理，突出以人为本与尊重科学。","抗震救灾精神与抗洪精神不是同一组；抗震救灾关键词以人为本尊重科学。",["sp-kanghong"]],
["sp-hangtian","载人航天精神",1,"载人航天工程实施中，航天工作者协同攻关、连续奋斗，实现载人飞行和空间探索突破。","特别能吃苦、特别能战斗、特别能攻关、特别能奉献。","用于科技自立自强、协同创新、理想信念和奉献，四个特别与航天事业高风险高技术特点相联。","四个特别是载人航天精神，老西藏精神是五个特别；探月精神和新时代北斗精神另列。",["xs-sci-talent","sp-tanyue"]],
["sp-laomo","劳模精神（劳动精神、工匠精神）",2,"广大劳动者在社会主义现代化建设各岗位爱岗敬业、诚实劳动、创新创造，形成崇尚劳动的社会风尚。","劳模精神：爱岗敬业、争创一流，艰苦奋斗、勇于创新，淡泊名利、甘于奉献。劳动精神：崇尚劳动、热爱劳动、辛勤劳动、诚实劳动。工匠精神：执着专注、精益求精、一丝不苟、追求卓越。","用于劳动价值、职业道德、技能人才和高质量发展，三组概念可整体识别但定义要分清。","原始名录写作“劳模精神（劳动精神、工匠精神）”，三组在这一项中对照掌握，不另拆计数；劳模精神不是只吃苦，工匠精神也不是慢工低效率。",["sf-public-morality","my-practice"]],
["sp-qingzang","青藏铁路精神",2,"青藏铁路建设者攻克高寒缺氧、多年冻土、生态脆弱等世界性工程难题。","挑战极限、勇创一流。","用于科技攻关、艰苦创业、生态文明和重大工程，体现极限条件下创新与一流标准统一。","两路精神指川藏青藏公路，青藏铁路精神是另一项目；二者背景和规范内涵不可混。",["sp-lianglu"]],
["sp-nvp","女排精神",2,"中国女排在国际赛场上为祖国荣誉顽强拼搏，几代队员团结协作、低谷奋起。","祖国至上、团结协作、顽强拼搏、永不言败。","用于爱国主义、集体主义、奋斗精神和正确看待胜负，强调祖国至上和团队协同。","女排精神不是唯金牌论，也不是只凭个人明星；顽强拼搏与科学训练统一。",["sf-patriotism"]]
]);
addFlat("spirit","中国特色社会主义新时代（8种）","精神谱系",[
["sp-tuopin","脱贫攻坚精神",1,"党领导人民完成消除绝对贫困艰巨任务，创造人类减贫史奇迹并全面建成小康社会。","上下同心、尽锐出战、精准务实、开拓创新、攻坚克难、不负人民。","用于以人民为中心、制度优势、精准方法、基层担当和共同富裕，六组词需完整对应。","脱贫攻坚精神不是只讲奉献，精准务实和开拓创新是重要得分点；绝对贫困消除不等于共同富裕已经完成。",["e2021-modern","xs-common-prosperity"]],
["sp-yiqing","抗疫精神",1,"抗击新冠疫情中，党领导人民坚持人民至上生命至上，开展疫情防控人民战争总体战阻击战。","生命至上、举国同心、舍生忘死、尊重科学、命运与共。","用于人民立场、制度优势、担当奉献、科学精神和人类命运共同体，五句顺序和内涵常考。","原始名录列“抗疫精神”，权威讲话常用“伟大抗疫精神”，不拆成两项；它也不是抗击“非典”精神，生命至上和命运与共尤其不可漏。",["xs-people-center","xs-shared-future"]],
["sp-sanniu","“三牛”精神",2,"新征程上发扬为民服务、创新发展和艰苦奋斗精神，以不待扬鞭自奋蹄的劲头推进事业。","为民服务孺子牛、创新发展拓荒牛、艰苦奋斗老黄牛。","用于人民立场、改革创新和实干奋斗，三类形象分别对应不同要求。","三牛顺序与内涵不可混：孺子牛为民、拓荒牛创新、老黄牛奋斗；不是孺子牛艰苦奋斗。",["xs-people-center","kw-innovation-first"]],
["sp-scientist","科学家精神",1,"新时代科技工作者服务高水平自立自强，在基础研究和关键技术攻关中爱国创新求实奉献协同育人。","胸怀祖国、服务人民的爱国精神，勇攀高峰、敢为人先的创新精神，追求真理、严谨治学的求实精神，淡泊名利、潜心研究的奉献精神，集智攻关、团结协作的协同精神，甘为人梯、奖掖后学的育人精神。","按爱国、创新、求实、奉献、协同、育人六项记忆，适合科技、教育和青年报国材料。","科学家精神不是两弹一星精神同义替换，后者有大力协同勇于登攀等特定表述；钱学森、袁隆平等可互证。",["fg-qian","fg-yuan","xs-sci-talent"]],
["sp-entrepreneur","企业家精神",3,"发展社会主义市场经济和建设现代化经济体系，需要企业家爱国创新诚信守法并承担社会责任。","爱国敬业、遵纪守法、艰苦奋斗，创新发展、专注品质、追求卓越，履行责任、敢于担当、服务社会。","用于民营经济、两个毫不动摇、诚信经营和高质量发展，突出创新与责任统一。","企业家精神不是唯利润论，也不等于冒险投机；民营经济人士同样需要守法诚信和履行社会责任。",["xs-market-government"]],
["sp-tanyue","探月精神",2,"探月工程团队坚持自主创新和协同攻关，实现绕、落、回等月球探测目标。","追逐梦想、勇于探索、协同攻坚、合作共赢。","用于航天强国、梦想与实践、协同创新和开放合作，与探月工程具体成就相联。","探月精神不是载人航天精神四个特别，也不是新时代北斗精神自主创新开放融合等表述。",["sp-hangtian","sp-beidou"]],
["sp-beidou","新时代北斗精神",2,"北斗卫星导航系统建设者坚持自主建设、独立运行并服务全球，完成全球组网。","自主创新、开放融合、万众一心、追求卓越。","用于关键核心技术、自主与开放统一、系统协同和世界一流，说明自立自强不是封闭自守。","新时代北斗精神与探月精神共有协同合作理念但规范词不同，不能因同属航天而混组。",["xs-new-pattern","sp-tanyue"]],
["sp-silu","丝路精神",2,"共建一带一路继承古代丝绸之路友好交流传统，回应各国互联互通和共同发展需要。","和平合作、开放包容、互学互鉴、互利共赢。","用于一带一路、文明交流、开放合作和人类命运共同体，体现共商共建共享而非零和扩张。","丝路精神不是三大全球倡议名称，也不是全人类共同价值；两组数字内容不可混。",["xs-initiatives","xs-shared-future"]]
]);
addFlat("combo","政治保证与党建组合","数字组合",[
["cb-two-establish","两个确立",1,"十九届六中全会总结新时代历史性成就和变革，突出坚强核心与科学理论的决定性作用。","确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。","是新时代重大政治成果，对新时代党和国家事业发展、推进民族复兴历史进程具有决定性意义。","两个确立不是两个维护；前一组是核心地位与指导地位，后一组是维护行动和政治规矩。",["doc-history3","xs-two-establish"]],
["cb-two-maintain","两个维护",1,"坚持和加强党中央集中统一领导的首要要求，是全党共同政治责任。","坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。","用于四个意识、党的政治建设和最高政治原则，落脚到思想自觉政治自觉行动自觉。","两个维护不是维护各级政府权威或维护地方部门领导，也不能与两个确立混写。",["xs-two-establish","xs-party-lead"]],
["cb-four-conscious","四个意识与四个自信",1,"加强党的政治建设和坚定中国特色社会主义信念的两组常见数字组合。","四个意识：政治意识、大局意识、核心意识、看齐意识；四个自信：中国特色社会主义道路自信、理论自信、制度自信、文化自信。","四个意识偏政治要求，四个自信偏道路理论制度文化信念；两组需按题干分开。","文化自信是更基础更广泛更深厚的自信，但四个自信的第四项不是法治自信、科技自信。",["xs-two-establish","kw-cultural-confidence"]],
["cb-three-must","三个务必",1,"二十大在迈上全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军关键时刻提出。","务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争。","用于新的赶考、初心使命、作风和斗争精神，可与七届二中全会两个务必作历史承接。","三个务必不是两个务必加一句话的简单机械相加，也不能与三大作风或三大法宝混组。",["doc-20report","pl7-2","sp-xibaipo"]],
["cb-four-great","四个伟大",1,"十九大以来概括新时代党的历史使命，强调梦想、事业、工程和斗争相互贯通。","伟大斗争、伟大工程、伟大事业、伟大梦想，其中起决定性作用的是党的建设新的伟大工程。","用于说明实现民族复兴必须进行斗争、推进党的建设和中国特色社会主义事业，关键在党。","伟大工程是党的建设新的伟大工程，不是重大基础设施工程；四个伟大顺序可按斗工事梦记。",["doc-19report","xs-self-revolution"]],
["cb-two-answers","跳出历史周期率的两个答案",1,"党长期执政面临如何永葆先进纯洁、永葆生机活力的重大课题。","第一个答案是让人民来监督政府，第二个答案是自我革命；人民监督是外在约束，自我革命是内在自觉，二者相互贯通。","党建材料可写人民监督、全过程人民民主、自我净化完善革新提高和全面从严治党。","不能写成第一个答案是自我革命、第二个是人民监督，也不能说第二个答案取代第一个。",["kw-people-supervision","kw-self-revolution"]],
["cb-ten-experience","百年奋斗十条历史经验（十个坚持）",1,"十九届六中全会第三个历史决议总结党和人民共同创造的精神财富。","坚持党的领导、人民至上、理论创新、独立自主、中国道路、胸怀天下、开拓创新、敢于斗争、统一战线、自我革命。","用于历史经验与继续前进的方法论，十个坚持必须长期坚持并在实践中丰富发展。","十个坚持历史经验不是十个明确核心内容，也不是十四个坚持基本方略，三组功能不同。",["doc-history3","sg-newera-history"]],
["cb-four-test-danger","四大考验与四种危险",2,"党长期执政、改革开放、市场经济和外部环境变化对先进纯洁及执政能力提出挑战。","四大考验：执政考验、改革开放考验、市场经济考验、外部环境考验；四种危险：精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险。","用于说明全面从严治党长期性复杂性和自我革命必要性，四大考验具有长期性复杂性。","脱离群众是党执政后的最大危险，四种危险不能只记腐败而漏精神、能力、群众。",["xs-self-revolution"]],
["cb-two-must-change","新时代两个没有变",1,"十九大作出社会主要矛盾转化判断，同时明确历史阶段和国际地位判断没有变。","我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。","用于防止由主要矛盾变化推出已经超越初级阶段或成为发达国家。","变的是主要矛盾，不变的是基本国情和国际地位；不能写主要矛盾没有变。",["c19","xs-contradiction"]]
]);
addFlat("combo","理论体系与方法论组合","数字组合",[
["cb-two-combine","两个结合",1,"推进马克思主义中国化时代化的根本途径和理论创新规律。","把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合；坚守马克思主义魂脉和中华优秀传统文化根脉。","第一个结合解决实践和国情，第二个结合夯实历史基础群众基础和文化主体性，共同回答中国之问等。","两个结合不是马克思主义同世界文化或西方文化结合，也不是把传统文化作为根本指导思想。",["mz-two-combine","doc-20report"],"http://www.12371.cn/2025/01/10/ARTI1736473568068938.shtml"],
["cb-three-questions","新时代思想回答的三个重大时代课题",1,"国内外形势和实践发展要求党从中国特色社会主义、现代化强国和长期执政党三个层面深化规律认识。","新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","答题可概括为道路方向、强国建设、执政党建设三类课题，说明新时代思想的理论主题。","不是邓小平理论首要基本理论问题“什么是社会主义、怎样建设社会主义”的简单重复。",["xs-form","mz-deng-theme"]],
["cb-six-method","六个必须坚持",1,"二十大概括新时代思想的世界观方法论和贯穿其中的立场观点方法。","必须坚持人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。","是继续推进实践基础上理论创新首先要把握的方法，可用于分析改革、发展、党建和外交。","不是二十届三中全会改革六个坚持，也不是十四个坚持基本方略；方法论必须结合材料展开。",["doc-20report","xs-system"]],
["cb-ten-clear","十个明确",1,"十九届六中全会对新时代思想核心内容作出的进一步概括。","明确党的领导最本质特征最大优势；总任务；新时代主要矛盾；五位一体总体布局和四个全面战略布局；全面深化改革总目标；全面依法治国总目标；基本经济制度、新发展理念和高质量发展等；新时代强军目标；中国特色大国外交；全面从严治党战略方针。","十个明确是理论核心内容，回答是什么层面的根本问题，应按领导、任务、矛盾、布局、改革、法治、经济、军队、外交、党建梳理。","不要把十个明确当成十项具体政策步骤；十个明确与十四个坚持、十三方面成就内在贯通但功能不同。",["doc-history3","xs-system"],"http://www.12371.cn/2025/01/10/ARTI1736473568068938.shtml"],
["cb-fourteen","十四个坚持",1,"党的十九大概括新时代坚持和发展中国特色社会主义的基本方略。","坚持党对一切工作的领导、以人民为中心、全面深化改革、新发展理念、人民当家作主、全面依法治国、社会主义核心价值体系、在发展中保障和改善民生、人与自然和谐共生、总体国家安全观、党对人民军队的绝对领导、一国两制和推进祖国统一、推动构建人类命运共同体、全面从严治党。","十四个坚持偏重实践方略，回答新时代怎样坚持和发展中国特色社会主义，可按领导人民改革发展和各领域部署记忆。","不是百年十条历史经验，也不是十个明确；十四个坚持中首条是党对一切工作的领导。",["doc-19report","xs-system"]],
["cb-thirteen","十三个方面成就",1,"十九届六中全会分领域总结新时代党和国家事业取得的历史性成就、发生的历史性变革。","党的全面领导、全面从严治党、经济建设、全面深化改革开放、政治建设、全面依法治国、文化建设、社会建设、生态文明建设、国防和军队建设、维护国家安全、坚持一国两制和推进祖国统一、外交工作。","用于新时代成就材料的分领域定位，同时概括其中原创性思想、变革性实践、突破性进展和标志性成果。","十三方面成就是事实与实践层面，不等于十四个坚持基本方略，也不能写成十三五十三项指标。",["doc-history3","sg-newera-history"]],
["cb-four-confident","中国特色社会主义四个自信",1,"中国特色社会主义道路、理论、制度、文化相互联系，构成事业发展的根本支撑。","道路自信、理论自信、制度自信、文化自信；文化自信是更基础、更广泛、更深厚的自信，是更基本、更深沉、更持久的力量。","用于说明坚定走中国道路、坚持科学理论、发挥制度优势和巩固文化主体性。","不要把文化自信替换为价值观自信，或把文化自信与其他三者割裂；四者统一于伟大实践。",["kw-cultural-confidence","xs-culture"]],
["cb-three-theory","马克思主义三个组成部分与两个伟大发现",2,"马克思主义理论体系结构与马克思一生理论贡献是两组不同数字考点。","三个组成部分：马克思主义哲学、马克思主义政治经济学、科学社会主义；两个伟大发现：唯物史观和剩余价值学说，使社会主义由空想变为科学。","用于马原导论和经典著作题，先辨题干问体系结构还是个人发现。","三个组成部分不是三个理论来源，两个伟大发现也不是《共产党宣言》《资本论》两部著作。",["my-origin","fg-marx"]],
["cb-three-styles","三大法宝、三大作风与活的灵魂",1,"毛泽东思想中有三组三项式表述，来源和功能不同，极易混组。","三大法宝：统一战线、武装斗争、党的建设；三大作风：理论联系实际、密切联系群众、批评和自我批评；活的灵魂：实事求是、群众路线、独立自主。","分别对应《〈共产党人〉发刊词》《论联合政府》和1981年第二个历史决议，按革命策略、党的作风、思想方法区分。","工农武装割据三方面是土地革命、武装斗争、根据地建设，又是另一组，不能混入三大法宝。",["mao-journal","mao-united","mz-live-soul"]]
]);
addFlat("combo","中国式现代化与改革组合","数字组合",[
["cb-modern-features","中国式现代化五个中国特色",1,"二十大概括基于自己国情的鲜明特色。","人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。","五个特征从人口、分配、文明、生态、外交五方面说明中国式现代化区别于西方现代化。","不是五条重大原则或九条本质要求；人口规模巨大不能替换为人口素质优良。",["xs-modern-features","doc-20report"]],
["cb-modern-essence","中国式现代化九条本质要求",1,"二十大从领导、道路、发展布局和世界意义规定中国式现代化本质。","坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。","可按领导道路＋五位一体＋世界意义＋文明形态分层记忆，材料题选择与设问相关项展开。","九条本质要求不是五个中国特色，不能漏首两项领导和道路，也不能把和平发展简单替代人类命运共同体。",["xs-modern-essence"]],
["cb-modern-principles","推进中国式现代化五条重大原则",1,"二十大对推进和拓展中国式现代化提出的实践原则。","坚持和加强党的全面领导，坚持中国特色社会主义道路，坚持以人民为中心的发展思想，坚持深化改革开放，坚持发扬斗争精神。","按领导、道路、人民、动力、精神记忆，用于回答如何推进现代化。","不是改革六个坚持，也不是十五五六项原则；五条重大原则中斗争精神不可漏。",["xs-modern-principles"]],
["cb-reform-six","进一步全面深化改革六个坚持",1,"二十届三中全会总结改革开放以来特别是新时代全面深化改革宝贵经验，提出贯彻原则。","坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以制度建设为主线、坚持全面依法治国、坚持系统观念。","是推进进一步全面深化改革的实践原则，落脚改革系统性整体性协同性和制度现代化。","不是新时代思想六个必须坚持，也不是十五五六项原则；以制度建设为主线是本组特有项。",["pl20-3","doc-reform2024"],"https://www.gov.cn/zhengce/202407/content_6963770.htm"],
["cb-seven-focus","二十届三中全会七个聚焦",1,"《决定》围绕推进中国式现代化，对进一步全面深化改革总目标作分领域展开。","聚焦构建高水平社会主义市场经济体制、发展全过程人民民主、建设社会主义文化强国、提高人民生活品质、建设美丽中国、建设更高水平平安中国、提高党的领导水平和长期执政能力。","按经济、政治、文化、社会、生态、安全、党建七领域对应，便于从材料定位改革部署。","七个聚焦不是七个国家战略，也不是七个必由之路；顺序可按五位一体＋安全党建记。",["pl20-3","doc-reform2024"]],
["cb-15five-six","“十五五”时期六项重要原则",1,"二十届四中全会对2026—2030年经济社会发展提出重要原则。","坚持党的全面领导、人民至上、高质量发展、全面深化改革、有效市场和有为政府相结合、统筹发展和安全。","用于最新规划题，体现十五五夯实基础全面发力关键时期的方向和方法。","与改革六个坚持、现代化五条原则不同；有效市场和有为政府相结合、统筹发展和安全是辨识点。",["pl20-4","sm-npc2026"]],
["cb-five-paths","五个必由之路",1,"二十大总结新时代党和人民奋进历程揭示的规律性认识。","坚持党的全面领导是坚持和发展中国特色社会主义的必由之路；中国特色社会主义是实现中华民族伟大复兴的必由之路；团结奋斗是中国人民创造历史伟业的必由之路；贯彻新发展理念是新时代我国发展壮大的必由之路；全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。","帽子题必须保留每个主语和宾语，分别对应领导、道路、团结、发展、党建。","不可将贯彻新发展理念写成民族复兴必由之路，或将全面从严治党写成中国特色社会主义必由之路。",["kw-path-party","kw-path-socialism","kw-path-newconcept"]],
["cb-two-steps","新时代两步走与三个现代化时间节点",1,"十九大作出两步走战略安排，二十大和相关规划进一步明确阶段任务。","2020年全面建成小康社会；2035年基本实现社会主义现代化；本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。","用于时间帽题和十五五定位，注意2029年完成二十届三中全会《决定》改革任务是另一节点。","2035不是建成现代化强国，2029也不是基本实现现代化；全面建成小康已于2021年宣告完成。",["c19","pl20-3","pl20-4"]],
["cb-four-modern","四个现代化与三步走",2,"社会主义建设时期和改革开放新时期对现代化目标、步骤的不同表述。","1964年三届全国人大提出现代农业、现代工业、现代国防、现代科学技术；1987年十三大三步走是温饱、小康、基本实现现代化。","用于区分四个现代化目标内容与三步走阶段安排，理解中国式现代化历史承接。","四个现代化不是工业、农业、国防、教育；三步走最后一步是基本实现现代化而非全面建成强国。",["sm-npc1964","c13"]]
]);
addFlat("combo","布局、发展、法治与历史组合","数字组合",[
["cb-five-one","五位一体总体布局",1,"中国特色社会主义事业总体布局随实践和认识发展不断完善。","经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体；十八大把生态文明建设纳入总体布局。","用于材料领域定位和全面发展，分析题不能把现代化只理解为经济增长。","五位一体不是四个全面战略布局，也不是五个中国特色；政治、文化、社会、生态顺序不能随意替换为军事外交。",["c18","xs-ecology"]],
["cb-four-all","四个全面战略布局",1,"新时代治国理政战略布局，党的十九届五中全会后因第一个百年目标实现而更新表述。","全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。","四个全面分别对应战略目标与三大战略举措，理解强国建设需要改革、法治、党建协同。","旧资料为全面建成小康社会，当前按更新后的全面建设社会主义现代化国家；不能用五位一体替代。",["pl19-5","xs-system"]],
["cb-three-first","科技、人才、创新三个第一",1,"二十大对教育科技人才一体部署中的三个固定定位。","科技是第一生产力、人才是第一资源、创新是第一动力；实施科教兴国、人才强国、创新驱动发展战略。","用于科教人才题和三个第一帽子题，后接教育优先、科技自立自强、人才引领驱动。","常见错误是科技第一资源、人才第一生产力；发展才是第一要务，高质量发展是首要任务。",["kw-science-first","kw-talent-first","kw-innovation-first"]],
["cb-new-concepts","新发展理念五项内容",1,"十八届五中全会提出的关系发展全局的深刻变革。","创新、协调、绿色、开放、共享；分别解决发展动力、发展不平衡、人与自然和谐、发展内外联动、社会公平正义问题。","与高质量发展五个成为联系：创新第一动力、协调内生特点、绿色普遍形态、开放必由之路、共享根本目的。","不要与五个必由之路或五位一体混组；五大理念的顺序和各自问题不可调换。",["pl18-5","kw-highquality-five"]],
["cb-security-five","总体国家安全观五大要素",1,"总体国家安全观以系统思维构建大安全格局，明确国家安全各要素定位。","以人民安全为宗旨、政治安全为根本、经济安全为基础、军事科技文化社会安全为保障、促进国际安全为依托。","用于安全帽子题和统筹发展安全，强调政治安全根本地位与人民安全价值宗旨。","常见设错把经济安全当根本、政治安全当宗旨；不能漏促进国际安全依托。",["kw-security-elements","xs-security"]],
["cb-law-five","中国特色社会主义法治体系五个子体系",1,"十八届四中全会明确建设中国特色社会主义法治体系是全面依法治国总抓手。","完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系、完善的党内法规体系。","用于法治总目标和总抓手题，注意党内法规体系是五个子体系之一。","不是立法、执法、司法、守法、普法五体系；法治政府是主体工程、法治社会是基础。",["kw-law-system","pl18-4"]],
["cb-two-must","两个务必",1,"七届二中全会在全国胜利前夕针对党的工作重心转移和执政考验提出。","务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。","用于西柏坡赶考和作风建设，与二十大三个务必作历史承接。","两个务必不是理论联系实际等三大作风，也不是不忘初心、敢于斗争等三个务必原句。",["pl7-2","cb-three-must"]],
["cb-three-economic","新民主主义革命三大经济纲领",1,"1947年《目前形势和我们的任务》提出，规定新民主主义经济变革基本内容。","没收封建地主阶级的土地归农民所有，没收官僚垄断资本归新民主主义国家所有，保护民族工商业。","分别对应反封建、反官僚资本及建立国营经济、保护民族资本，没收官僚资本具有双重革命性质。","保护民族工商业不是没收民族资本，土地归农民不是立即归集体或国家。",["mao-present","mz-newdem-program"]],
["cb-three-resolutions","三次历史决议",1,"党在重大历史关头通过历史决议总结经验、统一思想、团结前进。","1945年六届七中全会《关于若干历史问题的决议》；1981年十一届六中全会《关于建国以来党的若干历史问题的决议》；2021年十九届六中全会《中共中央关于党的百年奋斗重大成就和历史经验的决议》。","分别对应整风结束和七大准备、指导思想拨乱反正基本完成、新时代以史为鉴开创未来。","第一个不是七大通过，第二个不是十一届三中全会，第三个不是二十大通过。",["doc-history1","doc-history2","doc-history3"]]
]);
addFlat("hat","高频帽词：先辨判定口径","考法",[
["hat-first","“第一次、首次、开端、起点”怎么判",1,"命题人常把首次提出、首次系统阐述、正式形成、开始实践混为一个选项，如马克思主义中国化命题、革命道路、改革开放。","先确定首次的具体对象：六届六中全会首次明确提出马克思主义中国化命题；《星星之火，可以燎原》标志革命道路理论初步形成；十一届三中全会开启改革开放；五四运动是新民主主义革命开端。","圈出“谁第一次做了什么”，用教材标志词回原文，不因某事更早有相关萌芽就选为首次。","相关思想的早期萌芽不等于首次明确提出，实践开始也不等于理论体系形成。",["pl6-6","mao-spark","pl11-3","e1919"]],
["hat-mark","“标志、里程碑、分水岭、转折点”怎么判",1,"同一事件可有多种意义，命题人会把相近历史事件的标志词互换。","天京事变是太平天国由盛转衰分水岭；五四运动是旧民主主义走向新民主主义转折点；遵义会议是党史上生死攸关转折点；十一届三中全会是伟大历史转折；中共七大确立毛泽东思想指导地位。","按“事件结果＋教材原话”记忆，标志必须能说明前后阶段发生了什么变化。","遵义会议不是毛泽东思想确立标志，辛亥革命结束君主专制不等于结束半殖民地半封建社会。",["fg-hong","e1919","rm-zunyi","pl11-3","c7"]],
["hat-root","“根本、根本原因、根本保证、根本目的”怎么判",1,"选项会把根本原因、重要原因、直接原因并列后偷换，或把不同对象的根本帽子拼接。","反侵略失败根本原因是社会制度腐败；党的领导是中国特色社会主义最本质特征和根本保证；增进民生福祉是发展根本目的；社会基本矛盾是社会发展根本动力。","先问根本修饰的是原因、保证、动力还是目的，再确认主语；不同领域不能用一条万能答案。","发展根本目的不是高质量发展，党建根本保证不能偷换为改革开放，改革根本方向是中国特色社会主义。",["sg-resistance-fail","xs-party-lead","kw-livelihood-goal","my-social动力"]],
["hat-essence","“本质、本质特征、本质要求、本质属性”怎么判",1,"四个帽子语义相近但教材归属不同，常以人民民主、共同富裕、社会主义和马克思主义交叉设错。","社会主义本质包括解放发展生产力等；中国共产党领导是中国特色社会主义最本质特征；全过程人民民主是社会主义民主政治本质属性；共同富裕是中国特色社会主义本质要求；人民性是马克思主义本质属性。","制作“主语—完整帽子—内容”三栏，不把本质要求缩成最本质特征。","人民当家作主是社会主义民主政治本质特征，全过程人民民主是其本质属性，两句话主语不同。",["mz-socialist-essence","xs-party-lead","kw-democracy-attribute","kw-marx-people"]],
["hat-core","“核心、中心、重心、主题”怎么判",1,"核心类帽子最多，命题人会把民族精神、时代精神、新民主主义革命、党的建设和不同理论主题混配。","民族精神核心爱国主义，时代精神核心改革创新；无产阶级领导是新民主主义革命理论核心；党和国家工作以经济建设为中心；正确处理人民内部矛盾是国家政治生活主题。","先判断领域，再看核心是否修饰思想、理论、工作或矛盾；不要看到核心就凭熟悉度选择。","党领导一切不等于党的领导是民族精神核心，新民主主义革命中心问题也不能写成土地问题。",["kw-china-spirit","kw-revolution-core","mao-contradiction"]],
["hat-key","“关键、关键一招、关键作用、关键在”怎么判",1,"关键类表述对象差异大，常以改革、创新、市场、党的建设设错。","改革开放是决定当代中国命运的关键一招，也是决定中国式现代化成败的关键一招；新发展格局关键是经济循环畅通无阻；四个伟大中党的建设伟大工程起决定性作用。","记住“关键一招”的完整主语和决定对象，不将关键一招、第一动力、根本保证互换。","创新是第一动力，不是决定当代中国命运的关键一招；改革开放是关键一招但不是发展第一要务。",["kw-reform-key","kw-newpattern-key","cb-four-great"]],
["hat-priority","“首要、第一、基础、前提”怎么判",1,"命题人常把首要任务、第一要务、第一生产力、第一资源和制度前提混合。","发展是第一要务，高质量发展是首要任务，科技是第一生产力，人才是第一资源，创新是第一动力；一个中国是一国两制前提和基础。","先判断题干是发展、现代化、科技人才还是统一，再背对应帽子，不用“重要程度”自行推断。","高质量发展不是第一生产力，教育不是第一资源，经济建设中心也不等于现代化首要任务。",["xs-highquality","cb-three-first","mz-strategy-unity"]],
["hat-only","“唯一、根本标准、检验标准”怎么判",1,"绝对限定词在教材原文中可能正确，在普通选项中可能绝对化，必须辨来源。","实践是检验真理的唯一标准；全心全意为人民服务是人民军队唯一宗旨；战斗力是军队建设唯一的根本标准。但“改革是发展唯一动力”“科技决定一切”属于绝对化。","唯一帽子只记官方明确条目，普通因果关系若被写成唯一，要高度警惕并检查条件。","不能一见唯一就排错，也不能认为所有唯一都正确；看是否有权威固定表述。",["kw-truth-standard","kw-army-sole-purpose","kw-combat-standard"]],
["hat-decide","“决定、决定性、最终决定力量”怎么判",1,"选项会把经济、政治、文化、人民群众、政党和个人对历史的作用无限扩大。","生产力是人类社会发展最终决定力量，人民群众是历史创造者；经济基础决定上层建筑；党的领导对事业发展起根本保证作用；杰出人物不能决定历史基本趋势。","分层理解决定作用，哲学中区分最终、直接、主体和主导，政治固定表述按原文。","人民群众决定历史不等于每个人随意决定，党的领导根本保证也不等于否定社会客观规律。",["kw-productivity-final","kw-people-force","my-people-history"]],
["hat-purpose","“目的、宗旨、出发点落脚点、奋斗目标”怎么判",1,"发展、改革、党的建设、人民立场经常互换目的类帽子。","全心全意为人民服务是党的根本宗旨；发展根本目的是增进民生福祉；改革出发点和落脚点是促进社会公平正义、增进人民福祉；人民对美好生活向往是党的奋斗目标。","先找行为主体，再看题目问价值目的还是工作方法，回答时保留完整双句。","出发点落脚点不是单纯提高GDP，奋斗目标也不是党的自我革命；方法不能替代目的。",["kw-livelihood-goal","pl20-3","xs-people-center"]]
]);
addFlat("hat","主体陷阱：谁提出、谁通过、谁实施","考法",[

["hat-market-gov","市场决定性作用与政府作用关系倒置",1,"把市场决定性作用写成唯一作用，或把更好发挥政府作用写成政府主导资源配置。","使市场在资源配置中起决定性作用，更好发挥政府作用；坚持两个毫不动摇，建设统一开放竞争有序市场体系，政府维护规则、公共产品和服务宏观调控。","看到决定性先限定“资源配置”，看到政府作用先判断是否更好而非越多越好。","计划和市场是经济手段不是社会制度本质，市场决定不等于政府退出，两个毫不动摇不是一重一轻。",["xs-market-government","pl18-3"]],

["hat-subject-scope","个人、集体、政党与人民贡献被缩窄",1,"把集体智慧结晶写成个人独立完成，或把重大工程成就归于一个英雄人物。","毛泽东思想是党集体智慧结晶且毛泽东为主要创立者；新时代思想是党和人民实践经验集体智慧结晶，习近平为主要创立者；两弹一星体现大力协同。","既承认主要人物突出作用，又写实践、集体和人民条件，避免个人史观和去人物化两个极端。","毛泽东思想不等于毛泽东个人所有言论，钱学森等重要贡献也不能取代两弹一星团队协同。",["mz-mao-status","xs-form","sp-liangdan"]]

addFlat("hat","考场操作：四步排除与复核","考法",[
["hat-step1","第一步：圈主语与限定词",1,"帽子题失分常不是不知道知识，而是没看到“根本原因、最直接、首次系统、当前、从哲学上看”等限定。","把题干主语、时间、领域、程度、问法圈出，明确它问的是人物、会议、著作、原理还是固定表述。","先读设问再读选项，避免用熟悉选项替代题干；主语不同则同一帽子可能完全不适用。","不要只扫关键词秒选，例如人民民主、中国特色社会主义、马克思主义都可搭配不同本质帽子。",[]],
["hat-step2","第二步：还原教材完整搭配",1,"错误选项通常保留一半正确词，再偷换另一个名词或把两个正确句子拼接。","默写主语＋帽子＋内容的完整句，如“高质量发展是全面建设社会主义现代化国家的首要任务”，再对照选项。","优先核对固定表述，不凭语感判断哪个听起来更重要；数字组合还要核对项数与功能。","常见拼接如“创新是决定当代中国命运的关键一招”，两个分句都熟但整体错误。",["xs-highquality","kw-reform-key"]],
["hat-step3","第三步：识别绝对化与拼接项",1,"干扰项常采用偷换主体、扩大范围、因果倒置、条件删除、结果提前和古今混搭。","逐项标注错误类型，能在选项旁写出正确主语或条件，才算真正排除而不是犹豫猜测。","排除后不要立即跳下一题，检查其余选项是否也含隐蔽错误，尤其反向设问“错误的是”。","两个选项看似都正确时，通常一个超出题干限定、一个才是教材原话，不要用政治正确感替代依据。",[]],
["hat-step4","第四步：材料题先找对应再写答案",1,"材料选择题和大题常给大量叙事，诱导只抄材料或只背原理，二者脱节。","将材料分为背景问题、做法、结果、价值四层，每层对应一个原理或理论点，最后回到设问中心。","选择题看材料真正强调哪一层，大题用“理论点＋材料同义转述＋分析”组成每段。","材料出现创新不一定只答创新，也可能强调实践、人民或系统；以设问和主导信息为准。",["ans-material"]],
["hat-review","多选题：宁缺勿滥与漏项检查",1,"多选题常见三项正确一项偷换，也常见四项均正确，漏选和多选均不得分。","逐项独立判真伪，不根据已选数量猜测；对数字组合逐项核对，尤其检查领导、人民、制度等容易漏项。","第一遍逐项判断，第二遍只复核存疑项和绝对词，不随意把确定答案改错。","没有“多选最多三个”或“全选一定错”的规律，题项数量不能替代知识判断。",[]],
["hat-reject","反向题、组合题与排序题复核",1,"“不正确、除外、错误的是”容易看反；组合选项利用一个错项排除多个答案；排序题利用首尾和关键节点。","反向题圈出否定词；组合题先找最确定错误项；排序题先定首末和不可逆节点，再比较中间项。","最后十秒重读设问，确认选择的是正确还是错误、属于还是不属于，并检查答题卡题号。","排序题不要死背所有日期，可用会议先后、理论提出与确立、制度形成等逻辑节点缩小范围。",[]]
]);
addFlat("answer","通用：审题、组织与卷面","答题模板",[
["ans-read","一审设问：确定科目、范围与任务",1,"所有分析题，尤其设问含“运用……原理”“说明原因”“谈启示”“如何认识”“为什么能够”。","圈出四层：①知识范围，如唯物辩证法或新时代思想；②设问动词，如说明、分析、评价、启示；③核心对象和关系；④分值与问数。先写一句直接回应设问的中心判断，再展开。","范围决定可用原理，动词决定作答结构，分值决定要点数量。两问必须分段分别回答，不共用一大段。","最常见失分是答非所问：问方法论却抄定义，问原因却只写意义，问两个原理却只写一个。",[]],
["ans-material","二审材料：把材料转化为答题证据",1,"材料较长、案例叙事或多段政策讲话，要求结合材料分析。","将材料划成“背景问题—实践做法—实际成效—价值方向”四层，每层圈关键词；每写一个理论点，紧接“材料中……体现……”，用同义转述而不是整段照抄。","材料对应要解释理论与事实之间的关系，不能只把原句复制在原理后面；一段一般完成一个理论点。","只背不写材料会空泛，只抄材料没有理论会失分；理论点与材料错配即使字数多也难得分。",[]],
["ans-structure","三段式总分结构：观点—分析—落脚",1,"原因、意义、关系、措施类综合题，没有更具体的专用结构时使用。","第一段直接判断并点题；中间分3—4点，每点“理论句＋解释句＋材料句”；末段按设问写方法论、实践要求或意义提升。要点前标①②③，保持层次清晰。","先保证高频核心点，再补次要点；每点2—4行，避免大段堆叠。末段不是必须喊口号，应回扣材料和设问。","不要把所有知识写成一段，也不要先铺垫大半页才进入正题；无问“启示”时不需机械写长结尾。",[]],
["ans-language","规范表达、时间分配与卷面复核",1,"考场完整作答和最后检查。","使用教材术语和完整主谓宾，如“坚持……是……的根本保证”；重要关键词靠前，分点编号，字迹清楚。按分值分配时间，先答确定点，再补材料点；检查问数、原理名称、人物会议和主语。","政治大题不是作文，不追求华丽排比。确定内容先写，拿不准的冷僻点不要挤掉核心得分句。","避免万能空话、口语化过度、错别字和涂改；不要虚构文献原话或把模板中的对象忘记替换。",[]]
]);
addFlat("answer","马原：原理定位与材料结合","答题模板",[
["ans-marx-locate","原理定位型：指定哲学范围",1,"“运用唯物辩证法／认识论／唯物史观分析……”“材料体现了哪些哲学道理”。","①列范围内候选原理：辩证法想联系发展矛盾质量否定，认识论想实践认识真理，史观想社会存在基本矛盾群众；②选材料最直接的2—3个；③每个按“原理名称＋规范内容＋材料对应＋方法论”展开。","宁选最贴切的核心原理，不堆砌弱相关原理。若指定某一原理，则先完整解释该原理再分析。","常见失分是原理范围答错，如用社会存在解释矛盾转化，或把主次矛盾与主次方面混用。",["my-connection","my-two-leaps","my-social-being"]],
["ans-marx-relation","关系辨析型：A与B的辩证关系",1,"“分析尊重规律与发挥能动性、矛盾普遍性与特殊性、真理与价值、个人与社会的关系”。","①分别界定A、B；②写A对B的作用；③写B对A的反作用或二者统一；④结合材料说明如何统一；⑤反对割裂双方的两种错误倾向。","关系题不能只写“既A又B”，必须说明方向、条件和中介，如意识通过实践反作用于物质。","不要默认关系都是相互决定；生产力与生产关系、经济基础与上层建筑有明确决定方向。",["my-material-unity","my-universal-special","my-truth-value"]],
["ans-marx-dialectic","矛盾分析型：问题、转化与重点",1,"材料出现危机与机遇、优势劣势、主要任务、因地制宜、试点推广、标本兼治。","先判定矛盾属性：对立统一→同一性斗争性及转化条件；普遍特殊→一般与个别结合；不平衡→主次矛盾或主次方面、两点重点；再写具体问题具体分析和创造条件。","“中心工作、突破口”多对应主次矛盾，“性质、主流、评价”多对应主次方面；转化必须写条件。","不要见矛盾就把所有矛盾原理都写一遍，也不要只答一分为二而没有重点和条件。",["my-same-struggle","my-universal-special","my-main-aspect"]],
["ans-marx-practice","实践认识型：调研、试点、理论创新",1,"材料出现调查研究、实践探索、政策试点、认识深化、真理检验、科技发现。","①实践是认识来源动力目的和检验标准；②由感性到理性、再由理性到实践两次飞跃；③认识反复无限，实践认识再实践再认识；④结合材料说明理论随实践发展并指导实践；⑤坚持实践标准和调查研究。","按材料过程安排原理顺序，突出第二次飞跃和实践检验；若涉及政策适用边界可补真理绝对相对。","不要把间接经验说成不是认识来源之一，准确表述是实践是认识来源；也不要把认识反复说成循环。",["my-practice","my-two-leaps","my-cognition-process"]],
["ans-marx-critique","观点评析型：指出错误并说明理由",1,"“评析某种观点”“为什么说该观点是片面的”“反对某种错误倾向”。","①先判断观点是错误、片面还是有条件成立；②指出其承认或忽视的因素；③写正确原理；④用材料说明其后果或片面性；⑤给正确做法，反对形而上学、唯心主义或相对主义等。","先辨再析，不一上来全盘否定；有些观点只是夸大某一方面，应承认合理成分后纠偏。","只贴“唯心主义、形而上学”标签不解释会失分；也不要为了辩证而说错误观点也有真理一半。",[]]
]);
addFlat("answer","毛中特与新思想：原因、路径与部署","答题模板",[
["ans-reason","原因意义型：为什么必须、为什么能够",1,"“为什么坚持党的领导／改革开放／高质量发展”“为什么中国式现代化能够成功推进”。","①直接点题；②理论依据，如性质宗旨、规律、理论定位；③历史依据，如实践证明、历史经验；④现实依据，如主要矛盾、风险任务；⑤意义，如人民、国家、世界；⑥落脚坚持方向。","按设问侧重选依据，不必每题都写五层。能取得成功的题要突出制度优势、人民力量、科学理论和实践路径。","只写意义不答原因、只列成就没有机制，或把“为什么重要”写成“怎样推进”，都会偏离。",["xs-party-lead","sg-reform-history","xs-highquality"]],
["ans-reform","改革部署型：如何进一步全面深化改革",1,"“说明改革为什么是关键一招”“如何以改革推进中国式现代化”“如何理解改革与法治／开放／稳定”。","①性质方向：社会主义制度自我完善发展、坚持中国特色社会主义；②总目标：完善制度、治理现代化；③原则：改革六个坚持；④重点：经济体制牵引、七个聚焦；⑤方法：系统协同、法治轨道、人民评价；⑥结合材料写任务。","二十届三中全会材料优先用最新表述，区分六个坚持、七个聚焦、2029和2035等节点。","不能只抄十八届三中旧表述，也不能把改革写成改变根本制度或只讲经济单项。",["xs-reform2024","cb-reform-six","cb-seven-focus"]],
["ans-modern","中国式现代化型：特征、本质与路径",1,"“如何理解中国式现代化既有共同特征又有中国特色”“如何推进强国复兴”。","①定义和中心任务；②结合材料选五个中国特色；③写党的领导、中国特色社会主义等本质要求；④按五条重大原则或相关领域部署展开；⑤说明创造人类文明新形态及世界意义。","不要机械把五特征九要求全堆上，材料涉及人口、共同富裕、生态或和平时选择对应点重点分析。","把2035与本世纪中叶混淆、漏党的领导、把和平发展写成对外扩张逻辑，是常见错误。",["xs-modern-features","xs-modern-essence","xs-modern-principles"]],
["ans-economy","经济发展型：高质量、创新与新发展格局",1,"“如何推动高质量发展”“为什么要科技自立自强”“如何构建新发展格局／促进共同富裕”。","①首要任务和新发展理念；②建设现代化产业体系、实体经济；③教育科技人才一体、创新驱动；④扩大内需与供给侧改革结合、国内国际双循环；⑤市场政府与两个毫不动摇；⑥共享发展、民生和安全。","按材料主体选点：企业题重创新质量，区域题重协调，外贸题重开放，分配题重共享和制度。","不要把新发展格局写成封闭内循环，也不要只写增长速度而忽略结构、质量、公平和安全。",["xs-highquality","xs-new-pattern","xs-sci-talent"]],
["ans-party","党的领导与自我革命型",1,"“为什么党的领导是根本保证”“如何推进全面从严治党／跳出历史周期率”。","①最本质特征、最大优势、最高政治领导力量；②党的性质宗旨和人民立场；③党中央集中统一领导、两个维护；④政治建设统领、思想制度组织作风纪律反腐；⑤人民监督和自我革命两个答案；⑥以自我革命引领社会革命。","根据材料是基层党建、作风、纪律还是人民监督选择展开，党建题不能只剩反腐败。","两个答案顺序不能反，政治建设根本性建设与思想建设基础性建设不能互换。",["xs-party-lead","xs-self-revolution","cb-two-answers"]],
["ans-five-sphere","五位一体分领域题：政治文化社会生态",1,"“如何发展全过程人民民主／文化自信／民生／生态文明”。","共同结构：①领域定位和价值；②核心原则，如三者统一、文化自信、人民立场、两山论；③制度体系或主要任务；④材料对应；⑤治理效能和人民获得感；⑥与现代化整体联系。","政治题突出制度程序，文化题突出魂脉根脉和两创，民生题尽力而为量力而行，生态题系统治理和绿色转型。","不要把不同领域通用模板完全照搬，政协、核心价值观、共同富裕和双碳各有专属关键词。",["xs-democracy","xs-culture","xs-livelihood","xs-ecology"]]
]);
addFlat("answer","史纲：原因、比较、人物与历史选择","答题模板",[
["ans-history-cause","重大事件原因意义型",1,"“分析五四运动／抗战胜利／新中国成立／改革开放的原因和意义”。","①时代背景和主要矛盾；②根本、主要、直接原因或国内国际条件；③事件核心行动和结果；④历史意义按当时、长远、世界三层；⑤经验教训或历史启示。","原因与意义分开作答，意义避免只复述过程；抗战胜利要写中共中流砥柱、全民族抗战和国际支持。","常见失分是把导火索当根本原因、只写意义不写原因，或把1949与1956的历史标志混用。",["sg-anti-win","sg-founding","sg-reform-history"]],
["ans-history-compare","探索比较型：不同阶级、纲领或道路",1,"“比较太平天国、洋务、维新、辛亥”“为什么某种方案行不通”“新旧三民主义／两次国共合作比较”。","先画比较表：领导阶级—指导思想—纲领目标—依靠力量—实践结果—失败或成功原因；正文按题干维度逐项对拍，最后说明历史结论。","比较题必须同维度对照，不能先完整写A再完整写B而没有对应；结尾指出新的阶级、理论或道路。","不要笼统写都促进近代化就忽略性质和结果，也不能把旧三民主义与新三民主义混写。",["sg-taiping","sg-yangwu","sg-wuxu","sg-xinhai-meaning"]],
["ans-history-person","人物评价型：功勋、思想与局限",1,"“如何评价孙中山／毛泽东等人物”“结合人物事件说明其精神或贡献”。","①时代背景和人物定位；②按时间列2—4项关键实践；③概括思想主张及理论贡献；④历史意义；⑤如教材有明确局限，放在具体历史条件下辩证分析；⑥联系纪念讲话最新评价。","人物评价以事实支撑，不空写伟大；毛泽东等领导人要优先使用权威纪念讲话和教材规范定位。","不能将个人所有言论等同科学理论，也不能以现实细节推翻教材评价；周年限定要匹配讲话年份。",["fg-sun","fg-maozedong","ev-mao130","ev-deng120"]],
["ans-history-choice","历史选择型：为什么历史和人民选择",1,"“为什么历史和人民选择中国共产党／马克思主义／社会主义道路／改革开放”。","①近代国情和两大任务；②农民、地主、资产阶级方案相继失败及原因；③新的阶级力量和科学理论结合；④党领导革命、建设、改革和新时代成就证明；⑤结论体现历史逻辑理论逻辑实践逻辑统一。","按选择对象调整重点：选择党重领导和成就，选择马克思主义重科学性与实践，选择改革开放重转折和发展。","不要只罗列历次成就而缺少旧方案失败比较，也不要把选择说成一次完成、无需继续坚持发展。",["sg-four-history","sg-party-found","sg-reform-history"]]
]);
addFlat("answer","思法：价值、道德与法治","答题模板",[
["ans-sf-person","人生价值与青年担当型",1,"先进人物、青年择业、科技报国、平凡岗位材料，问“如何实现人生价值／担当时代责任”。","①人生目的和理想信念；②个人理想融入社会理想、国家人民需要；③评价价值看社会实践和贡献；④立足岗位、学习本领、艰苦奋斗、勇于创新；⑤正确处理个人社会及得失顺逆；⑥回扣材料行动。","人物事实要分别对应奉献、敬业、创新、信念等，不把所有模范都写成同一种精神。","只喊青春奋斗口号而没有价值原理和实践路径，或否定正当个人利益，均不准确。",["sf-life-value","sf-ideal-social","fg-qian"]],
["ans-sf-morality","道德现象评析与建设型",1,"志愿服务、诚信、网络文明、职业道德、家风材料，问“为何需要道德／如何加强道德建设”。","①道德本质和作用；②对应社会主义道德核心原则、中华传统美德或革命道德；③具体领域规范，如公德职业道德家庭美德；④个人修养方法；⑤教育实践制度舆论共同发力；⑥德治与法治结合。","先辨材料属于哪个生活领域，再选规范；个人与社会两个层面均可写，但不要只要求个人自律。","不要把道德等同法律强制，也不要见网络问题只写技术监管而漏个人品德和法治。",["sf-socialist-morality","sf-public-morality","sf-family-personal"]],
["ans-sf-law","法治案例与全面依法治国型",1,"宪法、法律权威、立法执法司法守法、法治与德治材料。","①法律或宪法定位；②全面依法治国总目标和党的领导；③结合材料选择科学立法严格执法公正司法全民守法；④权利保障、公平正义和程序；⑤公民尊法学法守法用法；⑥法治德治相辅。","案例题先找行为主体和法定职权，再分析程序与权利；宏观题才展开十六字方针。","政协不能行使国家权力，修宪建议与修宪权不能混；法治政府主体工程、法治社会基础不可互换。",["sf-constitution","sf-rule-system","sf-fair-justice"]],
["ans-sf-rights","权利义务关系与依法维权型",1,"网络言论、消费劳动权益、国家安全义务等，问“如何正确行使权利／履行义务”。","①指出具体法律权利或义务；②权利义务相互依存、统一于法律关系；③权利行使不得损害国家社会集体和他人权益；④依法通过协商调解仲裁诉讼等途径救济；⑤自觉履行法定义务并承担责任。","必须结合具体行为说明边界和合法途径，不把权利义务一致理解为简单数量对等。","只强调权利不写义务、把自力救济当私刑，或把所有道德义务都当法律义务，是常见失分。",["sf-right-duty","sf-right-exercise","sf-legal-duty"]]
]);
addFlat("answer","综合时政：年度主题与国际题","答题模板",[
["ans-current","年度时政综合：会议、规划与新部署",1,"围绕二十届三中、四中、五中全会、十五五规划和年度重要讲话的综合材料题。","①先定会议和文件，不混届次；②写历史方位和现实问题；③摘取材料相关核心目标原则；④从五位一体、改革安全党建选点；⑤说明对中国式现代化和人民生活意义；⑥用时间节点和任务落脚。","最新口径优先：二十届三中改革、四中十五五建议、五中全面从严治党；2026全国人大批准十五五纲要。","不要把建议写成纲要、2029写成2035，或将五中全会主题错写为规划建议。",["pl20-3","pl20-4","pl20-5","sm-npc2026"]],
["ans-world","国际题：中国主张、世界意义与全球治理",1,"“如何理解中国为世界提供新机遇／中国方案”“如何推动构建人类命运共同体”。","①世界百年变局和共同挑战；②中国坚持独立自主和平外交与真正多边主义；③人类共同价值、新型国际关系、人类命运共同体；④结合一带一路或三大全球倡议举例；⑤说明中国发展的世界意义与开放合作路径。","国际题既写中国立场又写世界共同利益，举例服务观点，避免只堆外交名词。","不能把中国方案写成输出制度或一国主导，也不能将全人类共同价值与西方所谓普世价值混同。",["xs-shared-future","xs-initiatives","sp-silu"]]
]);
