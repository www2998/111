/* ===== AI 问答页（后加模块） ===== */
.ai-btn{border:1px solid var(--red);background:var(--soft-red);color:var(--red);border-radius:9px;padding:8px 12px;white-space:nowrap;font-weight:600}
.ai-btn:hover{background:#f3e2e2}
.modal-ai-wrap{margin-top:14px}
.ai-ask-item{border:1px dashed var(--red2);background:var(--soft-red);color:var(--red);border-radius:9px;padding:9px 13px;font-size:13px}
.ai-ask-item:hover{background:#f3e2e2}
.search-ai{border:1px solid var(--red2);background:var(--soft-red);color:var(--red);border-radius:8px;padding:3px 10px;font-size:12px}
.search-ai:hover{background:#f3e2e2}
.empty-ai{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ai-empty-btn{border:1px solid var(--red2);background:var(--soft-red);color:var(--red);border-radius:9px;padding:9px 15px;font-size:13px}
.ai-empty-btn:hover{background:#f3e2e2}
.empty-ai span{font-size:11px;color:var(--muted)}
.ai-page{max-width:880px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 152px);padding-bottom:4px}
.ai-top{display:flex;align-items:center;gap:10px;margin:0 0 20px}
.ai-title{font-family:"Songti SC","SimSun",serif;font-size:26px;letter-spacing:1px;color:var(--ink)}
.ai-gear{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:7px 12px;font-size:12px;letter-spacing:1px}
.ai-gear:hover{border-color:var(--red2);color:var(--red)}
.ai-topr{margin-left:auto;display:flex;gap:8px;position:relative}
.ai-topr .ai-gear{margin-left:0}
.ai-hist{position:absolute;top:calc(100% + 10px);right:0;width:min(360px,86vw);max-height:min(58vh,380px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 34px rgba(32,39,40,.13);padding:6px;z-index:40}
.ai-hist[hidden]{display:none}
.ai-hist-new{display:block;width:100%;text-align:left;border:1px dashed var(--red2);background:var(--soft-red);color:var(--red);border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:5px}
.ai-hist-new:hover{background:#f3e2e2}
.ai-hist-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer}
.ai-hist-item:hover{background:var(--soft-red)}
.ai-hist-item b{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-hist-item i{font-style:normal;font-size:11px;color:var(--muted);flex:none}
.ai-hist-del{flex:none;border:0;background:none;color:var(--muted);font-size:13px;line-height:1;padding:3px 2px;border-radius:5px}
.ai-hist-del:hover{color:var(--red);background:#f3e2e2}
.ai-hist-empty{padding:16px 10px;text-align:center;color:var(--muted);font-size:13px}
.ai-down{position:fixed;right:30px;bottom:118px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--red);font-size:16px;line-height:1;cursor:pointer;box-shadow:0 8px 22px rgba(32,39,40,.15);opacity:0;pointer-events:none;transition:opacity .18s;z-index:25}
.ai-down.on{opacity:1;pointer-events:auto}
.ai-down:hover{border-color:var(--red2);background:var(--soft-red)}
.ai-setup{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 18px 13px;margin:0 0 22px;box-shadow:var(--shadow)}
.ai-setup[hidden]{display:none}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ai-f{display:block;margin-bottom:12px}
.ai-f span{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:5px}
.ai-f input,.ai-f select{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);outline:none}
.ai-f input:focus,.ai-f select:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(152,47,60,.07)}
.ai-setup-foot{display:flex;align-items:center;min-height:16px}
.ai-hint{color:var(--red);font-size:12px}
.ai-feed{flex:1;display:flex;flex-direction:column;gap:24px;padding:2px 0 26px}
.ai-msg{display:flex;flex-direction:column;gap:8px}
.ai-msg.user{align-items:flex-end}
.ai-msg.user .ai-bubble{max-width:76%;background:var(--red);color:#fff;border-radius:15px 15px 4px 15px;padding:10px 15px;font-size:14px;line-height:1.75;word-break:break-word}
.ai-msg.bot .ai-bubble{font-size:15px;line-height:1.95;color:var(--ink);max-width:100%}
.ai-bubble p{margin:0 0 12px}
.ai-bubble p:last-child{margin-bottom:0}
.ai-bubble h2,.ai-bubble h3,.ai-bubble h4{font-family:"Songti SC","SimSun",serif;margin:20px 0 9px;line-height:1.5;font-size:17px;letter-spacing:.5px}
.ai-bubble h2:first-child,.ai-bubble h3:first-child,.ai-bubble h4:first-child{margin-top:0}
.ai-bubble ul,.ai-bubble ol{margin:0 0 12px;padding-left:22px}
.ai-bubble li{margin:5px 0}
.ai-bubble li::marker{color:var(--red2)}
.ai-bubble strong{color:var(--red);font-weight:700}
.ai-bubble em{font-style:normal;background:var(--soft-gold);padding:0 3px;border-radius:3px}
.ai-bubble code{background:var(--soft-gold);padding:1px 5px;border-radius:4px;font-size:13px}
.ai-bubble pre{background:#262b2b;color:#eceae2;padding:12px 14px;border-radius:10px;overflow:auto;font-size:13px;line-height:1.7;margin:0 0 12px}
.ai-bubble blockquote{margin:0 0 12px;padding:4px 0 4px 13px;border-left:3px solid var(--gold);color:var(--muted)}
.ai-bubble hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.ai-bubble a{color:var(--blue);border-bottom:1px solid rgba(65,103,126,.35)}
.ai-typing{display:inline-flex;gap:5px;padding:8px 0}
.ai-typing i{width:6px;height:6px;border-radius:50%;background:var(--red2);animation:aibl 1s infinite}
.ai-typing i:nth-child(2){animation-delay:.15s}
.ai-typing i:nth-child(3){animation-delay:.3s}
@keyframes aibl{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.9;transform:translateY(-3px)}}
.ai-err{color:#8d3a3a;font-size:13.5px;line-height:1.8;border-left:2px solid var(--red2);padding-left:12px}
.ai-compose{position:sticky;bottom:0;padding:16px 0 10px;background:linear-gradient(to bottom,rgba(246,243,237,0),var(--paper) 34%)}
.ai-len{display:flex;gap:6px;margin:0 0 8px 3px}
.ai-len button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:4px 11px;font-size:12px;letter-spacing:1px}
.ai-len button:hover{color:var(--red);border-color:var(--red2)}
.ai-len button.on{background:var(--soft-red);border-color:var(--red2);color:var(--red);font-weight:600}
.ai-box{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:var(--shadow)}
.ai-box:focus-within{border-color:var(--red2);box-shadow:0 0 0 3px rgba(152,47,60,.07)}
#aiInput{flex:1;border:0;background:transparent;outline:none;resize:none;font:inherit;font-size:15px;line-height:1.75;color:var(--ink);max-height:170px;min-height:28px;padding:1px 0}
#aiInput::placeholder{color:#a8adab}
.ai-send{border:0;background:var(--red);color:#fff;border-radius:11px;padding:9px 17px;font-size:13px;font-weight:600;letter-spacing:1px;white-space:nowrap}
.ai-send:hover{background:#872634}
.ai-send.stop{background:var(--surface);color:var(--red);border:1px solid var(--line)}
@media(max-width:760px){.ai-page{min-height:calc(100vh - 120px)}.ai-grid{grid-template-columns:1fr}.ai-title{font-size:22px}.top-actions .ai-btn{display:none}}
@media print{.ai-page{display:none!important}}
/* ===== 知识卡片（后加模块） ===== */
.ai-acts{display:flex;gap:6px;margin:9px 0 0 1px}
.ai-acts[data-pending]{display:none}
.ai-acts button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;transition:.16s}
.ai-acts button:hover{border-color:var(--red2);color:var(--red);background:var(--soft-red)}
.card-mask{position:fixed;inset:0;z-index:120;background:rgba(25,29,28,.34);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 30px;overflow:auto}
.card-mask[hidden]{display:none!important}
.card-box{width:min(660px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(20,24,23,.24);padding:18px 20px 15px}
.card-h{font-family:"Songti SC","SimSun",serif;font-size:19px;color:var(--ink);margin:0 0 14px;letter-spacing:.5px}
.card-h b{font-weight:inherit}
.card-h span{display:block;font-family:inherit;font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:5px}
.card-box .ai-f{margin-bottom:11px}
.card-box textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 11px;font:inherit;font-size:13px;line-height:1.85;color:var(--ink);outline:none;resize:vertical;min-height:132px}
.card-box textarea:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(152,47,60,.07)}
.card-foot{display:flex;align-items:center;gap:9px;margin-top:4px}
.card-foot .ai-hint{margin-right:auto;font-size:11px;color:var(--muted)}
.card-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 16px;font-size:13px;cursor:pointer}
.card-btn:hover{border-color:var(--red2);color:var(--red)}
.card-btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.card-btn.primary:hover{background:#852733;color:#fff}
.cards-page{max-width:880px}
.cards-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.cards-head h2{font-family:"Songti SC","SimSun",serif;font-size:27px;letter-spacing:1px;margin:4px 0 6px;color:var(--ink)}
.cards-head p{font-size:12.5px;color:var(--muted);line-height:1.8;margin:0;max-width:520px}
.cards-stat{text-align:right;white-space:nowrap;color:var(--muted);font-size:11px}
.cards-stat b{display:block;font-family:Georgia,serif;font-size:34px;color:var(--red);line-height:1}
.ncard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:15px 18px 12px;margin:0 0 13px;box-shadow:0 1px 0 rgba(32,39,40,.02)}
.ncard-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ncard-cat{font-size:10.5px;letter-spacing:1px;color:var(--red);background:var(--soft-red);border:1px solid rgba(152,47,60,.18);border-radius:5px;padding:2px 7px;white-space:nowrap}
.ncard-top h3{font-family:"Songti SC","SimSun",serif;font-size:16.5px;margin:0;color:var(--ink);font-weight:600;flex:1;min-width:0}
.ncard-del{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 4px;cursor:pointer;border-radius:5px}
.ncard-del:hover{color:var(--red);background:var(--soft-red)}
.ncard-body{font-size:14px;line-height:1.92;color:#2c3233}
.ncard-body p{margin:0 0 8px}
.ncard-body ul,.ncard-body ol{margin:0 0 8px;padding-left:20px}
.ncard-body li{margin:3px 0}
.ncard-body strong{color:var(--red)}
.ncard-body h2,.ncard-body h3,.ncard-body h4{font-size:14.5px;margin:10px 0 6px;color:var(--ink)}
.ncard-body blockquote{margin:6px 0;padding:4px 12px;border-left:2px solid var(--gold);color:var(--muted);background:var(--soft-gold)}
.ncard-foot{display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}
.ncard-copy{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer}
.ncard-copy:hover{border-color:var(--red2);color:var(--red)}
.ncard-tools{margin-left:auto;display:flex;gap:6px}
.ncard-tools button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;transition:border-color .16s,color .16s}
.ncard-tools button:hover{border-color:var(--red2);color:var(--red);background:var(--soft-red)}
@media(max-width:760px){.card-mask{padding:16px 10px}.cards-head{flex-direction:column;align-items:flex-start}.cards-stat{text-align:left}}
@media print{.cards-page{display:none!important}}
</style>
</head>

add("congress","党的创建与大革命时期",[
{id:"c1",y:1921,d:"1921.7.23",t:"中共一大",l:"上海→嘉兴南湖",p:1,b:"十月革命和五四运动促进马克思主义传播并同中国工人运动结合，各地共产党早期组织相继建立。",c:"确定党的名称为中国共产党，通过第一个纲领和决议，选举产生中央局。大会宣告中国共产党正式成立。",m:"党的成立是中华民族发展史上开天辟地的大事变。中国革命有了坚强领导力量、科学理论指导和新的革命方法，面貌焕然一新。",x:"一大通过的是具有党章性质的第一个纲领，不是第一部正式党章；7月1日是建党纪念日，7月23日是一大开幕日。",r:["e1921","c2","bk-manifesto"],s:"https://www.12371.cn/special/lcddh/ddh1/"},
{id:"c2",y:1922,d:"1922.7.16—23",t:"中共二大",l:"上海",p:1,b:"党成立后需要把远大理想同半殖民地半封建中国的现实任务结合起来。",c:"制定党的最高纲领和最低纲领，明确现阶段的反帝反封建民主革命任务；通过第一部正式党章。",m:"第一次明确提出反帝反封建的民主革命纲领，为中国革命指明现阶段斗争方向，体现远大理想与现实任务的统一。",x:"民主革命纲领对应二大；宣告党成立对应一大。二大没有正式确立国共党内合作方针。",r:["c1","c3","doc-declaration-1920"],s:"https://www.12371.cn/special/dzsh/"},
{id:"c3",y:1923,d:"1923.6.12—20",t:"中共三大",l:"广州",p:1,b:"工人运动遭受挫折使党认识到，单靠工人阶级孤军奋战不能战胜强大敌人，需要建立革命统一战线。",c:"决定共产党员以个人身份加入国民党，同国民党建立革命统一战线，同时保持党在政治上、思想上和组织上的独立性。",m:"推动国共合作和革命统一战线建立，为大革命发展创造条件。",x:"三大决定合作方针；第一次国共合作正式形成的标志是1924年国民党一大。党内合作不等于取消党的独立性。",r:["sm-kmt1","e1923"],s:"https://www.12371.cn/special/dzsh/"},
{id:"c4",y:1925,d:"1925.1.11—22",t:"中共四大",l:"上海",p:1,b:"国共合作后革命形势发展，党需要回答民主革命由谁领导、依靠谁的问题。",c:"第一次明确提出无产阶级在民主革命中的领导权问题和工农联盟问题，对民主革命内容作出更完整规定。",m:"推动群众运动发展，为新民主主义革命基本思想形成作出重要贡献。",x:"四大高频只有两把钥匙：无产阶级领导权＋工农联盟；不要与二大的革命纲领混淆。",r:["mao-class","e1925"]}
]);
add("congress","土地革命战争与全民族抗战时期",[
{id:"c5",y:1927,d:"1927.4.27—5.9",t:"中共五大",l:"武汉",p:3,b:"大革命面临严重危机，党内存在右倾机会主义错误。",c:"批评陈独秀右倾机会主义错误，但未能提出挽救革命的有效办法；选举产生党的历史上第一个中央纪律检查监督机构——中央监察委员会。",m:"在组织建设和纪律监督史上具有地位，但未能在危急关头担负起挽救革命的任务。",x:"不能夸大为“纠正了右倾错误并挽救革命”；八七会议才实现由大革命失败到土地革命战争兴起的历史性转变。",r:["rm-87","e1927-fail"]},
{id:"c6",y:1928,d:"1928.6.18—7.11",t:"中共六大",l:"莫斯科",p:2,b:"大革命失败后，党需要重新判断中国社会性质、革命性质和革命形势。",c:"指出中国社会仍是半殖民地半封建社会，中国革命仍是资产阶级民主革命；当时形势处在两个革命高潮之间，党的总任务不是进攻而是争取群众、准备暴动。",m:"基本正确回答革命中的重大问题，对统一全党认识、复兴革命起积极作用；仍存在城市中心等局限。",x:"六大是唯一在国外召开的党的全国代表大会；革命性质仍是资产阶级民主革命，不是社会主义革命。",r:["mao-red","mao-spark"]},
{id:"c7",y:1945,d:"1945.4.23—6.11",t:"中共七大",l:"延安",p:1,b:"抗日战争即将胜利，党经过延安整风和六届七中全会，在思想上政治上组织上达到空前团结。",c:"把毛泽东思想确立为党的指导思想并写入党章；毛泽东作《论联合政府》政治报告，概括理论联系实际、密切联系群众、批评和自我批评三大作风。",m:"为争取抗日战争最后胜利和新民主主义革命在全国胜利奠定思想政治基础，是团结的大会、胜利的大会。",x:"毛泽东思想确立指导地位在七大；马克思主义中国化命题首次明确提出在六届六中全会。",r:["mao-united","pl6-7","doc-history1","e1945-victory"],s:"https://www.12371.cn/special/dzsh/"}
]);
add("congress","社会主义革命和建设时期",[
{id:"c8",y:1956,d:"1956.9.15—27",t:"中共八大",l:"北京",p:1,b:"社会主义改造基本完成，社会主义制度基本建立，党和国家面临把主要精力转向社会主义建设的新任务。",c:"正确分析国内主要矛盾：人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾；主要任务是集中力量发展社会生产力。经济建设坚持既反保守又反冒进、在综合平衡中稳步前进。",m:"是探索中国社会主义建设道路的良好开端，在执政党建设、经济建设和民主法制建设方面提出许多正确思想。",x:"八大主要矛盾不能替换成1981年或2017年表述；陈云提出“三个主体、三个补充”，不是社会主义市场经济。",r:["mao-ten","e1956-system","mao-contradiction"]},
{id:"c9",y:1969,d:"1969.4.1—24",t:"中共九大",l:"北京",p:3,b:"在“文化大革命”特殊历史背景下召开。",c:"在思想上、政治上和组织上的指导方针都是错误的。",m:"用于认识社会主义建设探索中的严重曲折，不作正面理论成果记忆。",x:"低频定位即可，不把九大党章表述当作正确考点。",r:["e-cultural"]},
{id:"c10",y:1973,d:"1973.8.24—28",t:"中共十大",l:"北京",p:3,b:"“文化大革命”期间召开。",c:"继续九大的“左”倾错误方针。",m:"反映当时党和国家政治生活的严重曲折。",x:"与1977年十一大区分，不投入过多背诵时间。",r:["e-cultural"]},
{id:"c11",y:1977,d:"1977.8.12—18",t:"中共十一大",l:"北京",p:3,b:"“文化大革命”结束后，党和国家面临拨乱反正任务。",c:"宣告“文化大革命”已经结束，重申在20世纪内把中国建设成为社会主义现代化强国，但未能从根本上纠正“文化大革命”的错误。",m:"体现党在徘徊中前进的状态，真正伟大转折是1978年十一届三中全会。",x:"宣告文革结束不等于完成拨乱反正；拨乱反正基本完成以十一届六中全会通过历史决议为标志。",r:["pl11-3","pl11-6"],s:"https://www.12371.cn/special/lcddh/ddh11/"}
]);
add("congress","改革开放和社会主义现代化建设新时期",[
{id:"c12",y:1982,d:"1982.9.1—11",t:"中共十二大",l:"北京",p:1,b:"拨乱反正完成和改革开放起步后，需要回答中国走什么道路、怎样推进现代化。",c:"邓小平提出“建设有中国特色的社会主义”重大命题；提出到20世纪末工农业年总产值翻两番、人民生活达到小康水平；通过新党章，首次将入党誓词载入党章。",m:"明确改革开放和现代化建设的根本方向，成为开创社会主义现代化建设新局面的纲领。",x:"“建设有中国特色的社会主义”对应十二大；“社会主义市场经济体制改革目标”对应十四大。",r:["pl11-6","doc-1982const","c13"]},
{id:"c13",y:1987,d:"1987.10.25—11.1",t:"中共十三大",l:"北京",p:1,b:"改革全面展开后，需要从理论上说明我国社会发展所处阶段及基本路线。",c:"系统阐述社会主义初级阶段理论，完整概括“一个中心、两个基本点”的基本路线，制定“三步走”现代化发展战略。",m:"为改革开放和现代化建设提供国情依据、路线遵循和战略步骤。",x:"十三大＝初级阶段理论＋基本路线＋三步走；十二大才是“中国特色社会主义”命题。",r:["c12","doc-south"]},
{id:"c14",y:1992,d:"1992.10.12—18",t:"中共十四大",l:"北京",p:1,b:"南方谈话解放了思想，改革需要突破把计划经济与市场经济当作社会基本制度属性的观念。",c:"明确我国经济体制改革的目标是建立社会主义市场经济体制；提出用邓小平建设有中国特色社会主义理论武装全党。",m:"推动改革开放和现代化建设进入新阶段，为社会主义市场经济体制建设奠定理论和目标基础。",x:"十四大确立改革目标；十四届三中全会构筑基本框架；十五大才把邓小平理论确立为党的指导思想。",r:["doc-south","pl14-3"],s:"https://www.12371.cn/special/lcddh/ddh14/"},
{id:"c15",y:1997,d:"1997.9.12—18",t:"中共十五大",l:"北京",p:1,b:"世纪之交，需要明确跨世纪发展的指导思想、基本纲领和战略安排。",c:"把邓小平理论确立为党的指导思想并写入党章；阐述社会主义初级阶段基本纲领；明确公有制为主体、多种所有制经济共同发展是基本经济制度；提出依法治国是党领导人民治理国家的基本方略。",m:"回答举什么旗、走什么路、实现什么目标的问题，推动中国特色社会主义事业跨世纪发展。",x:"十四大用邓小平建设有中国特色社会主义理论武装全党；十五大正式确立邓小平理论指导地位。",r:["c14","c16","e1997-hk"],s:"https://www.12371.cn/special/dzsh/"},
{id:"c16",y:2002,d:"2002.11.8—14",t:"中共十六大",l:"北京",p:1,b:"进入新世纪，党面临长期执政、改革开放和发展社会主义市场经济的新考验。",c:"把“三个代表”重要思想确立为党的指导思想并写入党章；提出全面建设小康社会奋斗目标，把本世纪头20年作为重要战略机遇期。",m:"为新世纪新阶段加强党的建设和推进中国特色社会主义事业提供指导。",x:"“三个代表”重要思想在2000年提出，十六大确立指导地位；十八大目标为“全面建成”小康社会，注意“建设/建成”。",r:["doc-three","c18"],s:"https://www.12371.cn/special/dzsh/"},
{id:"c17",y:2007,d:"2007.10.15—21",t:"中共十七大",l:"北京",p:1,b:"改革发展进入关键阶段，需要总结改革开放历史经验并回答实现什么样的发展、怎样发展。",c:"将科学发展观写入党章；提出全面建设小康社会奋斗目标的新要求；首次提出中国特色社会主义理论体系的科学概念。",m:"深化对中国特色社会主义道路和理论体系的认识，推动经济社会又好又快发展。",x:"十七大是科学发展观“写入党章”；十八大才“确立为党的指导思想”。中国特色社会主义理论体系不包括毛泽东思想。",r:["pl16-3","c18"]}
]);
add("congress","中国特色社会主义新时代",[
{id:"c18",y:2012,d:"2012.11.8—14",t:"中共十八大",l:"北京",p:1,b:"我国进入全面建成小康社会决定性阶段，发展不平衡、不协调、不可持续问题突出。",c:"把科学发展观确立为党的指导思想；提出全面建成小康社会和全面深化改革开放目标；将生态文明建设纳入中国特色社会主义事业“五位一体”总体布局。",m:"开启中国特色社会主义新时代，党和国家事业由此取得历史性成就、发生历史性变革。",x:"十八大是新时代的历史起点；十九大作出“中国特色社会主义进入新时代”的重大政治判断并明确社会主要矛盾变化。",r:["c19","pl18-3","e2012"],s:"https://www.12371.cn/special/18cpcnc/"},
{id:"c19",y:2017,d:"2017.10.18—24",t:"中共十九大",l:"北京",p:1,b:"全面建成小康社会进入决胜阶段，我国发展站到新的历史方位。",c:"作出中国特色社会主义进入新时代、我国社会主要矛盾已经转化的重大判断；把习近平新时代中国特色社会主义思想确立为党的指导思想并写入党章；作出全面建设社会主义现代化国家“两步走”战略安排。",m:"确立新时代党的指导思想，规划从全面建成小康社会到基本实现现代化、再到全面建成社会主义现代化强国的战略蓝图。",x:"主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；我国仍处于社会主义初级阶段的基本国情没有变。",r:["doc-19report","c20","e2017"]},
{id:"c20",y:2022,d:"2022.10.16—22",t:"中共二十大",l:"北京",p:1,b:"完成脱贫攻坚、全面建成小康社会，实现第一个百年奋斗目标后，党踏上全面建设社会主义现代化国家新征程。",c:"明确新时代新征程党的中心任务：团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴；系统阐述中国式现代化的中国特色、本质要求和重大原则。",m:"为新时代新征程党和国家事业发展制定大政方针、作出全面部署，强调高质量发展是首要任务、自我革命是跳出治乱兴衰历史周期率的第二个答案。",x:"中心任务不等于“以经济建设为中心”的基本路线表述；“三件大事”是迎来建党百年、中国特色社会主义进入新时代、完成脱贫攻坚和全面建成小康社会。",r:["doc-20report","pl20-3","e2022"],s:"https://www.12371.cn/special/20da/bg/"}
]);

add("plenum","新民主主义革命时期",[
{id:"pl6-6",y:1938,d:"1938.9.29—11.6",t:"扩大的六届六中全会",l:"延安",p:1,b:"全民族抗战初期，党内出现右倾错误倾向，对统一战线中的独立自主原则认识不足。",c:"毛泽东作《论新阶段》报告，首次明确提出“马克思主义中国化”命题；强调统一战线中的独立自主和敌后游击战争战略地位，基本纠正王明右倾错误。",m:"进一步巩固毛泽东在全党的领导地位，统一全党思想和步调，推动马克思主义基本原理同中国具体实际结合。",x:"“马克思主义中国化”首次明确提出在六届六中全会；“毛泽东思想确立为指导思想”在七大。",r:["mao-stage","mao-practice","rm-zunyi"],s:"https://www.12371.cn/2021/12/30/ARTI1640819325403900.shtml"},
{id:"pl6-7",y:1945,d:"1944.5.21—1945.4.20",t:"扩大的六届七中全会",l:"延安",p:1,b:"延安整风需要系统总结党的历史经验，分清路线是非，为七大召开作准备。",c:"原则通过《关于若干历史问题的决议》，肯定确立毛泽东在全党领导地位的重大意义，使全党对中国民主革命基本问题的认识达到一致。",m:"标志延安整风胜利结束，实现全党新的团结和统一，为七大召开和新民主主义革命胜利奠定思想政治基础。",x:"第一个历史决议对应六届七中全会，不是七大；第二个在1981年，第三个在2021年。",r:["doc-history1","c7","rm-yanan"],s:"https://www.12371.cn/2022/11/11/VIDE1668129000422711.shtml"}
]);
add("plenum","新中国成立与社会主义建设探索",[
{id:"pl7-2",y:1949,d:"1949.3.5—13",t:"七届二中全会",l:"河北西柏坡",p:1,b:"全国胜利在即，党即将由革命党转变为在全国执政的党，工作环境和中心任务将发生根本变化。",c:"确定党的工作重心由乡村转移到城市；规定全国胜利后政治、经济、外交基本政策，讨论新民主主义建设蓝图；提出“两个务必”。",m:"为新中国筹建和党在全国执政作重要准备，回答胜利后向何处去、怎样建设新中国的问题。",x:"工作重心是“由农村到城市”；“两个务必”是务必谦虚谨慎、不骄不躁，务必艰苦奋斗。",r:["sm-cppcc1","mao-peopledem","e1949-found"]},
{id:"pl7-3",y:1950,d:"1950.6.6—9",t:"七届三中全会",l:"北京",p:2,b:"新中国成立初期财政经济困难，社会秩序尚需巩固，部分干部群众存在急躁情绪。",c:"确定当时中心任务是争取国家财政经济状况基本好转；提出“不要四面出击”的策略方针，团结一切可以团结的力量。",m:"为国民经济恢复时期制定正确策略，避免树敌过多，保证恢复和发展任务推进。",x:"七届三中不是提出过渡时期总路线的会议；总路线于1953年正式提出。",r:["e1950-land","e1952-recover"]},
{id:"pl7-6",y:1955,d:"1955.10.4—11",t:"扩大的七届六中全会",l:"北京",p:3,b:"农业合作化运动逐步展开，中央需要统一对合作化速度和方针的认识。",c:"通过关于农业合作化问题的决议，推动农业社会主义改造。",m:"与手工业、资本主义工商业改造共同构成过渡时期社会主义改造的历史进程。",x:"农业合作化只是三大改造之一；1956年三大改造基本完成才标志社会主义基本制度在我国确立。",r:["e1953-line","e1956-system"]},
{id:"pl8-9",y:1961,d:"1961.1.14—18",t:"八届九中全会",l:"北京",p:2,b:"“大跃进”和人民公社化运动等造成严重经济困难，国民经济比例失调。",c:"正式通过对国民经济实行“调整、巩固、充实、提高”的八字方针，开始纠正经济工作中的“左”倾错误。",m:"推动国民经济转入调整轨道，为此后经济恢复和发展创造条件。",x:"八字方针是“调整、巩固、充实、提高”；不要与1979年“调整、改革、整顿、提高”混淆。",r:["rm-7000","e1961-adjust"]}
]);
add("plenum","改革开放和社会主义现代化建设新时期",[
{id:"pl11-3",y:1978,d:"1978.12.18—22",t:"十一届三中全会",l:"北京",p:1,b:"“文化大革命”结束后，党和国家面临冲破“两个凡是”束缚、实现工作重点转移和拨乱反正的迫切任务。",c:"重新确立解放思想、实事求是的思想路线；停止使用“以阶级斗争为纲”，把党和国家工作中心转移到经济建设上来，作出改革开放历史性决策；恢复民主集中制传统，成立中央纪律检查委员会。",m:"实现新中国成立以来党的历史上具有深远意义的伟大转折，开启改革开放和社会主义现代化建设新时期。",x:"伟大转折对应十一届三中全会；1978年中央工作会议为全会作准备，《解放思想，实事求是，团结一致向前看》成为全会主题报告。",r:["rm-central1978","doc-emancipate","e1978-truth","pl11-6"],s:"https://www.12371.cn/special/lcddh/ddh11/"},
{id:"pl11-6",y:1981,d:"1981.6.27—29",t:"十一届六中全会",l:"北京",p:1,b:"改革开放起步后，需要科学总结新中国成立以来的历史经验，统一全党认识。",c:"通过《关于建国以来党的若干历史问题的决议》，科学评价毛泽东的历史地位，概括毛泽东思想活的灵魂：实事求是、群众路线、独立自主；规范表述社会主义改造基本完成后我国社会主要矛盾。",m:"标志党和国家在指导思想上拨乱反正基本完成，为坚持和发展中国特色社会主义奠定重要思想基础。",x:"第二个历史决议在十一届六中全会；毛泽东思想不等于毛泽东个人所有言论，必须区分科学体系与晚年错误。",r:["doc-history2","pl11-3","c12"]},
{id:"pl12-3",y:1984,d:"1984.10.20",t:"十二届三中全会",l:"北京",p:1,b:"农村改革取得突破后，增强企业活力和推进城市经济体制改革成为迫切任务。",c:"通过《中共中央关于经济体制改革的决定》，提出社会主义经济是公有制基础上有计划的商品经济，突破把计划经济同商品经济对立起来的传统观念。",m:"标志我国经济体制改革重点由农村转向城市，改革在更广阔领域展开。",x:"“有计划的商品经济”对应十二届三中；“社会主义市场经济体制目标”对应1992年十四大。",r:["c14","e1984-city"]},
{id:"pl14-3",y:1993,d:"1993.11.11—14",t:"十四届三中全会",l:"北京",p:1,b:"十四大确立社会主义市场经济体制改革目标后，需要把目标转化为可操作的制度框架。",c:"通过《关于建立社会主义市场经济体制若干问题的决定》，构想在国家宏观调控下使市场对资源配置起基础性作用，构筑社会主义市场经济体制基本框架。",m:"推动经济体制改革进入整体推进、重点突破的新阶段。",x:"十四大定目标，十四届三中建框架；“使市场在资源配置中起决定性作用”是十八届三中全会的重大理论突破。",r:["c14","pl18-3"]},
{id:"pl16-3",y:2003,d:"2003.10.11—14",t:"十六届三中全会",l:"北京",p:1,b:"市场经济体制初步建立后，发展不平衡问题显现，改革进入完善体制的新阶段。",c:"通过关于完善社会主义市场经济体制若干问题的决定；提出坚持以人为本，树立全面、协调、可持续的发展观，促进经济社会和人的全面发展。",m:"是科学发展观形成过程中的重要节点，为完善社会主义市场经济体制作出部署。",x:"科学发展观形成脉络：2003年提出→十七大写入党章→十八大确立指导地位。",r:["c17","c18"]},
{id:"pl16-4",y:2004,d:"2004.9.16—19",t:"十六届四中全会",l:"北京",p:2,b:"党长期执政面临提高领导水平和执政水平、提高拒腐防变和抵御风险能力的重大课题。",c:"通过《关于加强党的执政能力建设的决定》，系统部署科学执政、民主执政、依法执政。",m:"把执政能力建设作为党的建设重要内容，推动党的建设新的伟大工程。",x:"会议关键词是“执政能力建设”，不要与十八届六中“全面从严治党”混淆。",r:["pl18-6","pl20-5"]},
{id:"pl16-6",y:2006,d:"2006.10.8—11",t:"十六届六中全会",l:"北京",p:2,b:"经济社会发展中城乡、区域、收入分配等矛盾需要协调，社会建设重要性上升。",c:"通过关于构建社会主义和谐社会若干重大问题的决定，把社会和谐作为中国特色社会主义本质属性。",m:"推动中国特色社会主义事业总体布局更加重视社会建设，丰富科学发展理念。",x:"关键词为“和谐社会”；“新发展理念”对应十八届五中全会。",r:["pl18-5","c17"]},
{id:"pl17-3",y:2008,d:"2008.10.9—12",t:"十七届三中全会",l:"北京",p:3,b:"城乡发展差距和农村体制机制问题仍需破解。",c:"通过关于推进农村改革发展若干重大问题的决定，部署新形势下农村改革发展。",m:"把建设社会主义新农村作为战略任务，把走中国特色农业现代化道路作为基本方向。",x:"农村改革起点是1978年前后家庭联产承包责任制的探索，不是本次全会才起步。",r:["e1978-xiaogang"]},
{id:"pl17-6",y:2011,d:"2011.10.15—18",t:"十七届六中全会",l:"北京",p:3,b:"文化在综合国力竞争和人民精神生活中的作用更加突出。",c:"通过关于深化文化体制改革、推动社会主义文化大发展大繁荣若干重大问题的决定。",m:"提出建设社会主义文化强国的战略目标，推动文化改革发展。",x:"不要与六届七中全会混淆；一个关键词为文化，一个关键词为历史决议。",r:["c17"]}
]);
add("plenum","新时代：十八届中央全会",[
{id:"pl18-3",y:2013,d:"2013.11.9—12",t:"十八届三中全会",l:"北京",p:1,b:"改革进入攻坚期和深水区，深层次体制机制障碍需要以系统整体设计加以破除。",c:"通过《关于全面深化改革若干重大问题的决定》，提出全面深化改革总目标：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化；使市场在资源配置中起决定性作用和更好发挥政府作用。",m:"开启新时代全面深化改革、系统整体设计推进改革新征程，实现由局部探索、破冰突围到系统集成、全面深化的转变。",x:"“决定性作用”不是“基础性作用”；二十届三中全会总目标增加“继续”二字并紧扣中国式现代化。",r:["pl14-3","pl20-3","e2013-belt"],s:"https://www.12371.cn/2024/07/23/VIDE1721691721495105.shtml"},
{id:"pl18-4",y:2014,d:"2014.10.20—23",t:"十八届四中全会",l:"北京",p:1,b:"全面建成小康社会和全面深化改革要求更加重视法治的引领、规范和保障作用。",c:"通过《关于全面推进依法治国若干重大问题的决定》，明确全面依法治国总目标：建设中国特色社会主义法治体系，建设社会主义法治国家。",m:"在党的历史上首次以中央全会形式专题研究全面依法治国，为法治中国建设作出顶层设计。",x:"“全面依法治国总目标”有两个落点：法治体系＋法治国家；不要只写建设法治国家。",r:["doc-1954const","doc-1982const","sm-npc2018"]},
{id:"pl18-5",y:2015,d:"2015.10.26—29",t:"十八届五中全会",l:"北京",p:1,b:"“十三五”时期发展环境变化，传统发展方式难以为继，必须破解发展难题、厚植发展优势。",c:"通过“十三五”规划建议，鲜明提出创新、协调、绿色、开放、共享的新发展理念；提出全面建成小康社会新的目标要求。",m:"新发展理念是关系我国发展全局的深刻变革，为高质量发展提供行动先导。",x:"五大发展理念顺序和内涵要准确：创新是动力、协调是内生特点、绿色是普遍形态、开放是必由之路、共享是根本目的。",r:["pl16-6","pl19-5","pl20-4"]},
{id:"pl18-6",y:2016,d:"2016.10.24—27",t:"十八届六中全会",l:"北京",p:1,b:"推进伟大事业、伟大工程、伟大斗争需要严明党内政治生活、加强党内监督。",c:"专题研究全面从严治党，通过《关于新形势下党内政治生活的若干准则》和《中国共产党党内监督条例》；明确习近平总书记党中央的核心、全党的核心地位。",m:"推动全面从严治党向纵深发展，为党和国家事业发展提供坚强政治保证。",x:"十八届三中改革、四中法治、五中发展、六中党建，可按“改—法—发—党”串联。",r:["pl16-4","pl20-5","c19"]}
]);
add("plenum","新时代：十九届中央全会",[
{id:"pl19-2",y:2018,d:"2018.1.18—19",t:"十九届二中全会",l:"北京",p:2,b:"中国特色社会主义进入新时代，宪法需要更好体现党和国家事业发展新成就新经验新要求。",c:"通过《关于修改宪法部分内容的建议》，按法定程序提请十三届全国人大一次会议审议。",m:"为新时代坚持和发展中国特色社会主义提供有力宪法保障。",x:"党中央提出修宪建议，全国人大依法行使修宪权；不要把建议提出与宪法修正案通过混为一谈。",r:["sm-npc2018","doc-1982const"]},
{id:"pl19-3",y:2018,d:"2018.2.26—28",t:"十九届三中全会",l:"北京",p:2,b:"党和国家机构设置和职能配置同新时代任务要求还不完全适应。",c:"通过《关于深化党和国家机构改革的决定》和《深化党和国家机构改革方案》，部署系统性、整体性、重构性改革。",m:"推进国家治理体系和治理能力现代化，加强党的全面领导并优化协同高效的机构职能体系。",x:"十九届二中修宪、三中机构改革、四中制度治理，时间与主题要一一对应。",r:["pl20-2","pl19-4"]},
{id:"pl19-4",y:2019,d:"2019.10.28—31",t:"十九届四中全会",l:"北京",p:1,b:"新中国成立70年和改革开放实践需要把制度优势更好转化为国家治理效能。",c:"通过《关于坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化若干重大问题的决定》，系统概括我国国家制度和国家治理体系显著优势。",m:"是坚持和完善中国特色社会主义制度、推进国家治理现代化的纲领性文件，突出制度建设的基础性、战略性地位。",x:"主题既有“制度”也有“治理”，不能只背国家治理而漏掉中国特色社会主义制度。",r:["pl18-3","pl20-3"]},
{id:"pl19-5",y:2020,d:"2020.10.26—29",t:"十九届五中全会",l:"北京",p:1,b:"“十四五”时期我国将进入新发展阶段，世界百年未有之大变局加速演进。",c:"通过“十四五”规划和2035年远景目标建议，统筹新发展阶段、新发展理念、新发展格局；提出到2035年基本实现社会主义现代化远景目标。",m:"为开启全面建设社会主义现代化国家新征程作出战略谋划，强调高质量发展和高水平安全。",x:"新发展阶段是“十四五”时期我国发展的历史方位；新发展格局以国内大循环为主体、国内国际双循环相互促进，不是封闭内循环。",r:["pl18-5","pl20-4","sm-npc2026"]},
{id:"pl19-6",y:2021,d:"2021.11.8—11",t:"十九届六中全会",l:"北京",p:1,b:"建党百年之际，需要全面总结党的百年奋斗重大成就和历史经验，团结全党全国各族人民开启新征程。",c:"通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》；突出“两个确立”的决定性意义，概括“十个明确”和十条历史经验。",m:"是新时代中国共产党人牢记初心使命、坚持和发展中国特色社会主义的政治宣言，是以史为鉴、开创未来、实现中华民族伟大复兴的行动指南。",x:"第三个历史决议在十九届六中全会；“十个明确”是新时代思想核心内容的概括，十条历史经验是“十个坚持”，两组不可混写。",r:["doc-history3","doc-centenary","c20"]}
]);
add("plenum","新时代：二十届中央全会",[
{id:"pl20-2",y:2023,d:"2023.2.26—28",t:"二十届二中全会",l:"北京",p:2,b:"全面建设社会主义现代化国家需要进一步优化党和国家机构职能体系。",c:"审议通过《党和国家机构改革方案》，同意将涉及国务院机构改革的部分内容依法提交十四届全国人大一次会议审议。",m:"深化重点领域机构改革，为推进国家治理体系和治理能力现代化提供组织保障。",x:"二十届二中对应机构改革，三中对应进一步全面深化改革，四中对应“十五五”规划建议，五中对应全面从严治党。",r:["pl19-3","pl20-3"],s:"https://www.12371.cn/special/lczgzyqh/"},
{id:"pl20-3",y:2024,d:"2024.7.15—18",t:"二十届三中全会",l:"北京",p:1,b:"以中国式现代化全面推进强国建设、民族复兴伟业，要求把改革摆在更加突出位置，破除体制机制障碍。",c:"通过《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。总目标是继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化；部署“七个聚焦”，强调“六个坚持”。",m:"是新时代新征程推动全面深化改革向广度和深度进军的总动员、总部署，为中国式现代化提供强大动力和制度保障。到2029年中华人民共和国成立80周年时完成《决定》提出的改革任务。",x:"六个坚持：党的全面领导、以人民为中心、守正创新、以制度建设为主线、全面依法治国、系统观念。不要与二十届四中“十五五”六项原则混淆。",r:["doc-reform2024","pl18-3","c20"],s:"https://www.12371.cn/2024/07/23/VIDE1721691721495105.shtml"},
{id:"pl20-4",y:2025,d:"2025.10.20—23",t:"二十届四中全会",l:"北京",p:1,b:"“十四五”即将完成，“十五五”时期处于基本实现社会主义现代化夯实基础、全面发力的关键时期。",c:"通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，明确“十五五”时期经济社会发展指导思想、重要原则、主要目标和战略任务。",m:"对未来五年发展作出顶层设计和战略擘画，为基本实现社会主义现代化奠定更加坚实的基础。",x:"“十五五”六项原则：党的全面领导、人民至上、高质量发展、全面深化改革、有效市场和有为政府相结合、统筹发展和安全。中央《建议》与全国人大批准的《纲要》主体不同。",r:["doc-15proposal","sm-npc2026","pl20-3"],s:"https://www.gov.cn/yaowen/liebiao/202510/content_7045444.htm"},
{id:"pl20-5",y:2026,d:"2026.10.26—29",t:"二十届五中全会",l:"北京",p:1,b:"新征程推进强国建设、民族复兴，需要以永远在路上的坚韧执着推进党的自我革命和全面从严治党。",c:"审议通过《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，总结管党治党经验，部署持之以恒推进全面从严治党。",m:"以党的自我革命引领社会革命，为“十五五”时期和中国式现代化建设提供坚强政治保证。",x:"这是2026年最新会议：关键词为“持之以恒推进全面从严治党”，不要沿用旧资料误写成审议其他规划。",r:["pl18-6","pl16-4","doc-15outline"],s:"http://www.hppc.gov.cn/szyw/2115966830530469890.html"}
]);

add("revmeeting","土地革命战争时期",[
{id:"rm-87",y:1927,d:"1927.8.7",t:"八七会议",l:"汉口",p:1,b:"大革命失败，党组织遭到严重破坏，革命处于危急关头，必须清算右倾错误并确定新的斗争方针。",c:"确定土地革命和武装反抗国民党反动派的总方针；毛泽东提出“须知政权是由枪杆子中取得的”；选出中央临时政治局。",m:"实现由大革命失败到土地革命战争兴起的历史性转变，为思想混乱、组织涣散的党指明新的出路。",x:"八七会议确定总方针，不等于已经完整提出农村包围城市道路；南昌起义是独立领导革命战争、创建人民军队和武装夺取政权的开端。",r:["e-nanchang","rm-sanwan","mao-spark"],s:"https://www.12371.cn/2021/08/05/ARTI1628148259018334.shtml"},
{id:"rm-sanwan",y:1927,d:"1927.9.29—10.3",t:"三湾改编",l:"江西永新三湾",p:1,b:"秋收起义受挫后部队减员严重、思想动摇，旧军队习气和组织松散问题突出。",c:"缩编部队，把党支部建在连上，班排设党小组，营团建立党委；成立士兵委员会，实行官兵平等和民主制度。",m:"从组织上确立党对军队的领导，是建设无产阶级领导的新型人民军队的重要开端。",x:"三湾改编记“支部建在连上”；古田会议记“思想建党、政治建军”和新型人民军队定型。",r:["rm-gutian","e-jinggang"],s:"http://www.12371.cn/2022/05/13/VIDE1652439482001851.shtml"},
{id:"rm-gutian",y:1929,d:"1929.12.28—29",t:"古田会议（红四军党的九大）",l:"福建上杭古田",p:1,b:"红军和农村根据地发展中，党内军内存在单纯军事观点、极端民主化等非无产阶级思想。",c:"通过古田会议决议，强调用无产阶级思想进行军队和党的建设，确立思想建党、政治建军原则；规定红军是执行革命政治任务的武装集团，必须绝对服从党的领导。",m:"解决在农村进行革命战争环境中保持党的无产阶级先锋队性质和建设新型人民军队的问题，是我军政治工作奠基、人民军队定型的重要会议。",x:"古田不是一般土地政策会议；其核心是党和军队建设。《关于纠正党内的错误思想》是决议重要组成部分。",r:["rm-sanwan","mao-correct","rm-gutian2014"],s:"https://www.12371.cn/2021/12/23/ARTI1640247136521162.shtml"},
{id:"rm-pre-zunyi",y:1934,d:"1934.12—1935.1.1",t:"通道、黎平、猴场会议",l:"湖南、贵州",p:3,b:"第五次反“围剿”失败和湘江战役严重损失后，中央红军向何处转移成为生死攸关的问题。",c:"通道会议讨论转兵贵州；黎平会议作出战略方针决定，肯定向川黔边建立根据地的主张；猴场会议重申渡乌江后的行动方针并加强政治局对军委的领导。",m:"为遵义会议召开和实现伟大转折作了思想与组织上的准备。",x:"三会议是遵义会议的前奏，不替代遵义会议“生死攸关转折点”的地位。",r:["rm-zunyi","e-longmarch"],s:"http://www.12371.cn/2025/01/14/ARTI1736811128608387.shtml"},
{id:"rm-zunyi",y:1935,d:"1935.1.15—17",t:"遵义会议（中央政治局扩大会议）",l:"贵州遵义",p:1,b:"“左”倾教条主义错误导致第五次反“围剿”失败和长征初期严重损失，党和红军处于极端危险境地。",c:"集中解决当时具有决定意义的军事问题和组织问题，事实上确立毛泽东在党中央和红军的领导地位，开始确立以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位，开始形成党的第一代中央领导集体。",m:"开启党独立自主解决中国革命实际问题的新阶段，在最危急关头挽救党、挽救红军、挽救中国革命，是党的历史上生死攸关的转折点。",x:"规范用语是“事实上确立”“开始确立”“开始形成”，不能简单写成“正式确立毛泽东思想的指导地位”；后者与七大相关。",r:["rm-pre-zunyi","pl6-6","e1936-longend"],s:"http://www.12371.cn/2025/01/14/ARTI1736811128608387.shtml"},
{id:"rm-wayaobao",y:1935,d:"1935.12.17—25",t:"瓦窑堡会议（中央政治局会议）",l:"陕西安定瓦窑堡",p:1,b:"华北事变后中日民族矛盾上升为主要矛盾，国内阶级关系发生变化，但党内仍存在“左”倾关门主义。",c:"确立建立抗日民族统一战线的基本策略，批评“左”倾关门主义，提出团结一切可能团结的抗日力量。",m:"解决党的政治策略问题，为第二次国共合作和全民族抗战作重要准备。",x:"瓦窑堡会议解决抗日民族统一战线策略；洛川会议制定全面抗战路线和持久战相关部署。",r:["doc-81","e1935-129","rm-luochuan","e-xian"]}
]);
add("revmeeting","全民族抗战与解放战争时期",[
{id:"rm-luochuan",y:1937,d:"1937.8.22—25",t:"洛川会议（中央政治局扩大会议）",l:"陕北洛川",p:1,b:"全民族抗战爆发后，党需要制定领导抗战的政治路线、军事战略和具体纲领。",c:"通过《抗日救国十大纲领》，制定全面全民族抗战路线；决定坚持统一战线中独立自主原则，开展独立自主山地游击战争，开辟敌后战场、建立抗日根据地。",m:"为党领导人民坚持长期抗战、争取最后胜利指明具体道路，推动敌后抗日根据地和人民抗日力量发展。",x:"洛川＝全面抗战路线＋独立自主游击战；瓦窑堡＝抗日民族统一战线策略。",r:["doc-anti10","mao-protracted","rm-wayaobao","e1937-war"],s:"http://www.12371.cn/2025/06/30/ARTI1751274174285307.shtml"},
{id:"rm-yanan",y:1942,d:"1942.5",t:"延安文艺座谈会",l:"延安",p:2,b:"延安文艺界需要解决文艺为什么人服务、如何服务以及文艺与革命事业关系的问题。",c:"毛泽东发表讲话，指出文艺为人民大众服务，首先为工农兵服务，阐明革命文艺的方向以及普及与提高的关系。",m:"推动文艺界整风和革命文艺发展，使文艺成为团结人民、教育人民、打击敌人的重要力量。",x:"文艺“为什么人”是根本问题；不要与延安整风“反对主观主义、宗派主义、党八股”的内容混写。",r:["mao-literature","e-yananrectify"],s:"https://www.12371.cn/2022/08/08/ARTI1659935177946775.shtml"},
{id:"rm-sep1948",y:1948,d:"1948.9.8—13",t:"中共中央政治局九月会议",l:"河北西柏坡",p:3,b:"人民解放战争即将进入战略决战，党需要统一战略部署并加强集中统一领导。",c:"提出“军队向前进，生产长一寸，加强纪律性，革命无不胜”，讨论军事战略、经济建设和党的建设，为战略决战作准备。",m:"推动全党全军加强纪律和集中统一，为辽沈、淮海、平津三大战役及全国胜利作重要准备。",x:"战略决战的实践标志是三大战役；会议部署与战役实践要区分。",r:["e1948-battles","pl7-2"]}
]);
add("revmeeting","社会主义建设与改革关键节点",[
{id:"rm-7000",y:1962,d:"1962.1.11—2.7",t:"扩大的中央工作会议（七千人大会）",l:"北京",p:2,b:"国民经济严重困难，需要总结“大跃进”以来经验教训，统一认识并加强民主集中制。",c:"初步总结“大跃进”中的经验教训，开展批评和自我批评，强调恢复实事求是、群众路线的优良作风，部署国民经济调整。",m:"对纠正“左”倾错误、贯彻八字方针和恢复国民经济起积极作用。",x:"会议是建设道路探索中的自我调整，不是改革开放的起点；改革开放伟大转折仍是十一届三中全会。",r:["pl8-9","e1961-adjust"]},
{id:"rm-central1978",y:1978,d:"1978.11.10—12.15",t:"1978年中央工作会议",l:"北京",p:1,b:"真理标准问题大讨论推动思想解放，全党需要集中讨论工作重点转移和一系列重大政治历史问题。",c:"邓小平作《解放思想，实事求是，团结一致向前看》重要讲话，强调解放思想是当前重大政治问题，民主是解放思想的重要条件；会议为十一届三中全会作充分准备。",m:"讲话成为十一届三中全会的主题报告，是开辟新时期新道路、开创中国特色社会主义新理论的宣言书之一。",x:"中央工作会议在前，十一届三中全会在后；不能把讲话日期12月13日写成三中全会开幕日。",r:["doc-emancipate","pl11-3","e1978-truth"]},
{id:"rm-gutian2014",y:2014,d:"2014.10.30—11.2",t:"全军政治工作会议（新古田会议）",l:"福建上杭古田",p:3,b:"新的历史条件下，人民军队需要加强和改进政治工作，确保绝对忠诚、绝对纯洁、绝对可靠。",c:"强调革命的政治工作是革命军队的生命线，坚持党对军队绝对领导，研究解决新的历史条件下党从思想上政治上建设军队的重大问题。",m:"加强新时代政治建军，为强军目标提供坚强政治保证。",x:"1929年古田会议确立思想建党、政治建军原则；2014年会议是新古田会议，二者时间、背景不能混。",r:["rm-gutian","c19"]}
]);

add("statemeeting","近代政党与革命政权会议",[
{id:"sm-tongmenghui",y:1905,d:"1905.8.20",t:"中国同盟会成立大会",l:"日本东京",p:1,b:"各地资产阶级革命团体分散活动，需要统一组织和共同纲领推进反清革命。",c:"孙中山联合兴中会、华兴会、光复会等成立中国同盟会，以“驱除鞑虏，恢复中华，创立民国，平均地权”为纲领，后概括为三民主义。",m:"同盟会是近代中国第一个统一的资产阶级革命政党，使资产阶级民主革命进入比较有组织、有纲领的新阶段。",x:"三民主义没有明确反帝纲领，民生主义也未真正解决农民土地问题；这是辛亥革命局限的重要表现。",r:["e1911","sm-kmt1"]},
{id:"sm-kmt1",y:1924,d:"1924.1.20—30",t:"中国国民党第一次全国代表大会",l:"广州",p:1,b:"中共三大确定党内合作方针后，孙中山改组国民党，推动联俄、联共、扶助农工。",c:"大会事实上确立联俄、联共、扶助农工三大政策，重新解释三民主义，使新三民主义具有明确反帝反封建内容。",m:"标志第一次国共合作正式形成和革命统一战线建立，推动国民革命兴起。",x:"中共三大是“决定合作”，国民党一大是“合作正式形成”；新三民主义成为第一次国共合作的政治基础。",r:["c3","e1926-north","e1927-fail"]},
{id:"sm-soviet1931",y:1931,d:"1931.11.7—20",t:"中华苏维埃第一次全国代表大会",l:"江西瑞金",p:2,b:"农村革命根据地和红色政权发展，需要建立统一的中央政权机构。",c:"通过《中华苏维埃共和国宪法大纲》等文件，成立中华苏维埃共和国临时中央政府，选举中央执行委员会。",m:"是中国共产党在局部地区执政的重要尝试，为根据地政权建设和后来新中国国家制度建设积累经验。",x:"这是土地革命战争时期的红色政权，不要与1949年中国人民政治协商会议及中央人民政府成立混淆。",r:["e-jinggang","mao-red"]}

add("statemeeting","抗战、建国与国际舞台",[
{id:"sm-cairo",y:1943,d:"1943.11.22—26",t:"开罗会议与《开罗宣言》",l:"埃及开罗",p:2,b:"世界反法西斯战争形势发生转折，中美英需要协调对日作战和战后处置。",c:"中美英三国首脑会晤，会后发表《开罗宣言》，明确日本所窃取于中国之领土，例如东北、台湾、澎湖群岛等归还中国。",m:"从国际法和国际文件层面确认中国收复失地的正当权利，为战后中国恢复对台湾行使主权提供重要依据。",x:"《开罗宣言》发表于1943年；《波茨坦公告》发表于1945年并重申开罗宣言之条件必须实施。",r:["sm-potsdam","e1945-taiwan"]},
{id:"sm-potsdam",y:1945,d:"1945.7.17—8.2",t:"波茨坦会议与《波茨坦公告》",l:"德国波茨坦",p:3,b:"欧洲战事结束后，反法西斯同盟需要敦促日本尽快无条件投降。",c:"中美英于7月26日发表促令日本投降的《波茨坦公告》，重申《开罗宣言》条件必须实施。",m:"与《开罗宣言》等国际文件共同构成战后处置日本、恢复中国被占领土的重要法理依据。",x:"公告不是日本投降书；日本签署投降书是1945年9月2日，中国人民抗日战争胜利纪念日是9月3日。",r:["sm-cairo","e1945-victory"]},
{id:"sm-chongqing",y:1945,d:"1945.8.29—10.10",t:"重庆谈判",l:"重庆",p:1,b:"抗战胜利后人民要求和平民主，国民党坚持独裁内战方针但以和平谈判争取准备时间。",c:"国共双方会谈并签署“双十协定”，确认和平建国基本方针，同意长期合作、坚决避免内战。",m:"中国共产党以实际行动表明和平诚意，推动全国人民争取和平民主的斗争。",x:"重庆谈判签署“双十协定”；1946年政治协商会议达成五项协议，二者不是同一会议。",r:["sm-cppcc1946","e1946-civil"]},
{id:"sm-cppcc1946",y:1946,d:"1946.1.10—31",t:"政治协商会议（旧政协）",l:"重庆",p:2,b:"“双十协定”签订后，全国要求和平民主、反对内战独裁的压力推动各党派协商建国。",c:"通过政府组织、国民大会、和平建国纲领、军事问题、宪法草案等五项协议。",m:"协议有利于冲破国民党一党独裁和实行民主政治，但最终被国民党当局撕毁，使人民进一步认清内战责任。",x:"旧政协在重庆、1946年；新政协在北平、1949年，通过《共同纲领》并筹备新中国成立。",r:["sm-chongqing","sm-cppcc1","e1946-civil"]},
{id:"sm-cppcc1",y:1949,d:"1949.9.21—30",t:"中国人民政治协商会议第一届全体会议",l:"北平",p:1,b:"人民解放战争取得基本胜利，建立新中国的条件已经成熟，需要团结各民主党派、人民团体和各族各界人士共同建国。",c:"通过《中国人民政治协商会议共同纲领》，选举中央人民政府委员会，确定国都、纪年、国歌、国旗等，完成创建新中国的筹备工作。",m:"标志中国新型政党制度——中国共产党领导的多党合作和政治协商制度的确立；《共同纲领》起临时宪法作用。",x:"新政协不是第一届全国人大；1954年一届全国人大一次会议通过第一部《中华人民共和国宪法》。",r:["doc-common","pl7-2","e1949-found"]}
]);
add("statemeeting","新中国国家制度与外交会议",[
{id:"sm-npc1954",y:1954,d:"1954.9.15—28",t:"第一届全国人民代表大会第一次会议",l:"北京",p:1,b:"新中国政权巩固和国民经济恢复后，需要通过国家根本法确认人民民主制度并推进社会主义改造和建设。",c:"通过《中华人民共和国宪法》，确立人民代表大会制度这一根本政治制度，规定国家的根本性质和根本任务。",m:"以国家根本法形式确立人民当家作主的新型政治制度，为社会主义民主法制建设奠定基础。",x:"1954年宪法是新中国第一部社会主义类型宪法；《共同纲领》是临时宪法；1982年宪法是现行宪法。",r:["doc-1954const","doc-common","sm-cppcc1"]},
{id:"sm-geneva",y:1954,d:"1954.4—7",t:"日内瓦会议",l:"瑞士日内瓦",p:2,b:"朝鲜停战后，印度支那和平问题成为国际社会关注的重大议题。",c:"中国代表团参加讨论和平解决朝鲜问题和恢复印度支那和平问题，为会议取得成果作出重要贡献。",m:"是新中国首次以五大国之一的地位和身份参加的重要国际会议，展示独立自主的和平外交形象。",x:"日内瓦会议与万隆会议区分：前者突出五大国之一身份，后者突出“求同存异”和亚非团结。",r:["sm-bandung","e1953-five"]},
{id:"sm-bandung",y:1955,d:"1955.4.18—24",t:"万隆会议（亚非会议）",l:"印度尼西亚万隆",p:1,b:"亚非新兴独立国家希望加强团结合作，但社会制度和意识形态差异以及外部干扰影响会议。",c:"周恩来提出“求同存异”方针，推动会议形成团结、友谊、合作的万隆精神和十项原则。",m:"加强中国同亚非国家团结合作，提高新中国国际影响，体现和平共处五项原则的实践运用。",x:"“求同存异”对应万隆会议；和平共处五项原则首次提出于1953年周恩来会见印度政府代表团时。",r:["sm-geneva","e1953-five"]},
{id:"sm-npc1964",y:1964,d:"1964.12.21—1965.1.4",t:"第三届全国人民代表大会第一次会议",l:"北京",p:1,b:"社会主义建设需要明确现代化奋斗目标和战略步骤。",c:"周恩来在政府工作报告中提出“四个现代化”宏伟目标：现代农业、现代工业、现代国防和现代科学技术，并提出分两步实现现代化的设想。",m:"成为激励全国人民建设社会主义的重要战略目标，为后来现代化战略发展提供历史基础。",x:"四个现代化不等于党的十三大“三步走”；十三大是改革开放新时期现代化发展战略。",r:["c13","doc-20report"]},
{id:"sm-npc1982",y:1982,d:"1982.11.26—12.10",t:"第五届全国人大第五次会议",l:"北京",p:1,b:"拨乱反正和改革开放需要新的国家根本法确认新的政治、经济和社会制度安排。",c:"12月4日通过现行《中华人民共和国宪法》，此后又根据实践发展多次修正。",m:"为改革开放和社会主义现代化建设提供根本法治保障，确立国家制度和公民基本权利义务的基本规范。",x:"12月4日是国家宪法日，源于1982年现行宪法通过；1954年宪法与1982年宪法不能混称。",r:["doc-1982const","pl18-4","sm-npc2018"]},
{id:"sm-npc2018",y:2018,d:"2018.3.5—20",t:"十三届全国人大一次会议",l:"北京",p:1,b:"新时代坚持和发展中国特色社会主义需要完善宪法和国家监察体制。",c:"3月11日表决通过《中华人民共和国宪法修正案》，把习近平新时代中国特色社会主义思想载入国家根本法；会议还通过监察法，决定成立国家监察委员会。",m:"使宪法更好体现新时代要求，为党和国家事业发展提供根本法治保障，推动国家监察体制改革。",x:"修宪建议由十九届二中全会提出，宪法修正案由全国人大表决通过；主体和法定程序常考。",r:["pl19-2","doc-1982const","pl18-4"]},
{id:"sm-npc2021",y:2021,d:"2021.3.5—11",t:"十三届全国人大四次会议",l:"北京",p:2,b:"“十三五”收官、“十四五”开局，需要将党关于未来五年和2035年的战略部署转化为国家意志。",c:"审查批准国民经济和社会发展第十四个五年规划和2035年远景目标纲要。",m:"为全面建设社会主义现代化国家开好局、起好步提供国家行动纲领。",x:"十九届五中全会审议《建议》，全国人大会议批准《纲要》；2026年“十五五”同样是这一程序。",r:["pl19-5","sm-npc2026"]},
{id:"sm-npc2026",y:2026,d:"2026.3.4—12",t:"2026年全国两会与“十五五”规划纲要",l:"北京",p:1,b:"“十五五”开局需要把党的二十届四中全会《建议》通过法定程序转化为国家意志和人民共同行动。",c:"全国政协十四届四次会议于3月4—11日举行；十四届全国人大四次会议于3月5—12日举行，3月12日表决通过关于“十五五”规划纲要的决议。",m:"批准2026—2030年国家发展行动纲领，推动“十五五”时期夯实基础、全面发力，为2035年基本实现社会主义现代化奠定基础。",x:"政协会议是参政议政、协商讨论，不行使国家权力；全国人大会议依法审查批准规划纲要。",r:["pl20-4","doc-15outline","pl20-5"],s:"https://www.gov.cn/zhuanti/2026qglh/index.htm"}
]);

add("maobook","毛泽东思想萌芽：大革命时期",[
{id:"mao-class",y:1925,d:"1925.12.1",t:"《中国社会各阶级的分析》",p:1,b:"国民革命发展中，党内对革命领导权、依靠力量和同盟军问题存在不同认识。",c:"分析中国社会各阶级的经济地位和政治态度，指出分清敌友是革命的首要问题，阐明无产阶级领导权和农民同盟军思想。",m:"初步回答中国革命的对象、动力和领导力量，是毛泽东思想萌芽的代表作。",x:"“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题”对应本篇，不是《新民主主义论》。",r:["c4","mao-hunan"]},
{id:"mao-hunan",y:1927,d:"1927.3",t:"《湖南农民运动考察报告》",p:1,b:"农民运动迅猛发展，社会上和党内出现责难农民运动的声音。",c:"通过实地调查肯定农民革命的伟大作用，论述建立农民政权和农民武装的重要性，强调无产阶级必须领导农民斗争。",m:"驳斥对农民运动的攻击，进一步阐明农民是中国革命最广大同盟军，为探索革命道路提供重要认识。",x:"与《中国社会各阶级的分析》同属毛泽东思想萌芽代表作，但本篇突出农民运动和调查研究。",r:["mao-class","mao-book","c4"]}
]);
add("maobook","毛泽东思想开始形成：土地革命战争前中期",[
{id:"mao-red",y:1928,d:"1928.10.5",t:"《中国的红色政权为什么能够存在？》",p:1,b:"大革命失败后，革命处于低潮，党内和红军中有人对农村红色政权能否长期存在产生疑问。",c:"分析中国政治经济发展不平衡、群众基础、革命形势、红军存在和党的正确领导等条件，论证红色政权存在发展的可能性。",m:"为工农武装割据和农村革命根据地建设提供理论说明，是探索中国革命新道路的重要著作。",x:"红色政权存在的根本原因是近代中国政治经济发展极端不平衡；不能把“有红军”单独写成唯一原因。",r:["mao-jinggang","c6","sm-soviet1931"]},
{id:"mao-jinggang",y:1928,d:"1928.11.25",t:"《井冈山的斗争》",p:2,b:"井冈山根据地需要在武装斗争、土地革命和政权建设之间形成相互配合的实践体系。",c:"总结井冈山根据地斗争经验，阐述工农武装割据思想，把武装斗争、土地革命和根据地建设结合起来。",m:"深化对红色政权存在发展规律的认识，为农村包围城市道路理论形成奠定基础。",x:"工农武装割据三位一体的基本内容是土地革命、武装斗争、根据地建设；不是三大法宝。",r:["mao-red","mao-spark","e-jinggang"]},
{id:"mao-correct",y:1929,d:"1929.12",t:"《关于纠正党内的错误思想》",p:1,b:"红四军党内存在单纯军事观点、极端民主化、非组织观点、主观主义等非无产阶级思想。",c:"分析各种错误思想的来源、表现和纠正方法，强调从思想上建党并加强党对军队的领导。",m:"是古田会议决议的核心部分，为思想建党、政治建军原则奠定理论基础。",x:"篇名对应古田会议决议；不要与1942年延安整风文献混淆。",r:["rm-gutian","rm-sanwan"]},
{id:"mao-spark",y:1930,d:"1930.1.5",t:"《星星之火，可以燎原》",p:1,b:"革命低潮中出现悲观思想，有人质疑红旗能够打多久，也有人坚持城市中心道路。",c:"批评单纯流动游击和城市中心观点，阐明农村根据地发展对促进全国革命高潮的意义，进一步论证以乡村为中心的道路。",m:"标志农村包围城市、武装夺取政权道路理论初步形成，是毛泽东思想开始形成的重要标志。",x:"“道路理论初步形成”对应本篇；新民主主义理论体系形成对应《新民主主义论》等著作。",r:["mao-red","mao-book","rm-87"]},
{id:"mao-book",y:1930,d:"1930.5",t:"《反对本本主义》",p:1,b:"党内和红军中存在把马克思主义教条化、把共产国际决议和苏联经验神圣化的倾向。",c:"提出“没有调查，没有发言权”“中国革命斗争的胜利要靠中国同志了解中国情况”，强调马克思主义本本必须同中国实际结合，提出从斗争中创造新局面的思想路线。",m:"初步阐明实事求是、群众路线和独立自主的基本思想，为党的思想路线形成奠定重要基础。",x:"本篇不是一般强调读书无用，而是反对脱离实际的教条主义；调查研究的目的是解决中国问题。",r:["mao-spark","mao-practice","mao-study"],s:"https://news.12371.cn/2013/12/19/ARTI1387444613103395.shtml"},
{id:"mao-strategy1936",y:1936,d:"1936.12",t:"《中国革命战争的战略问题》",p:2,b:"需要总结第二次国内革命战争经验，纠正军事上的教条主义和“左”倾冒险主义。",c:"系统分析中国革命战争特点，阐明积极防御、诱敌深入、集中兵力等战略战术原则。",m:"把土地革命战争经验上升为军事理论，丰富人民战争和人民军队战略战术思想。",x:"本篇侧重革命战争战略；1938年《论持久战》侧重全民族抗战前途和持久抗战三阶段。",r:["mao-protracted","rm-zunyi"]}
]);
add("maobook","毛泽东思想成熟：哲学与抗战理论",[
{id:"mao-practice",y:1937,d:"1937.7",t:"《实践论》",p:1,b:"党内教条主义和经验主义从认识论上割裂认识与实践，需要为正确思想路线提供哲学论证。",c:"阐明实践是认识的来源、动力、目的和检验真理的标准，论述从感性认识到理性认识、再从理性认识到革命实践的两次飞跃，强调认识与实践具体的历史的统一。",m:"丰富和发展马克思主义认识论，为实事求是思想路线奠定哲学基础，为反对主观主义提供理论武器。",x:"第一次飞跃是感性到理性，第二次飞跃是理性认识到实践；第二次飞跃意义更重大。",r:["mao-contradict","mao-book","e1978-truth"]},
{id:"mao-contradict",y:1937,d:"1937.8",t:"《矛盾论》",p:1,b:"教条主义不理解矛盾普遍性与特殊性的关系，不能具体分析中国革命的特殊规律。",c:"系统阐述对立统一规律，论述矛盾普遍性和特殊性、主要矛盾和次要矛盾、矛盾主要方面和次要方面、同一性和斗争性，强调具体问题具体分析。",m:"为马克思主义中国化提供哲学方法论，为正确认识中国革命特殊道路奠定基础。",x:"矛盾普遍性与特殊性的关系是矛盾问题精髓；不要与实践论的认识两次飞跃混写。",r:["mao-practice","mao-chinarev"]},
{id:"mao-guerrilla",y:1938,d:"1938.5",t:"《抗日游击战争的战略问题》",p:2,b:"全民族抗战初期有人轻视游击战，只把它看作正规战的附属形式。",c:"把抗日游击战争提到战略地位，分析其长期性、独立性和大规模发展的条件，阐明敌后游击战战略战术。",m:"统一和提高全党全军对游击战争战略地位的认识，促进敌后战场和抗日根据地发展。",x:"洛川会议作出独立自主游击战部署，本篇从理论上系统论证游击战战略地位。",r:["rm-luochuan","mao-protracted"]},
{id:"mao-protracted",y:1938,d:"1938.5.26—6.3",t:"《论持久战》",p:1,b:"抗战初期“亡国论”和“速胜论”流传，需要科学回答中国抗战能否胜利、怎样胜利。",c:"分析中日双方敌强我弱、敌小我大、敌退步我进步、敌寡助我多助的特点，指出抗战是持久战、最后胜利属于中国；预见战略防御、战略相持、战略反攻三阶段，强调“兵民是胜利之本”。",m:"科学阐明抗战发展规律和人民战争思想，驳斥错误论调，坚定全国军民抗战信心，为持久抗战提供战略指导。",x:"相持阶段是转到最后胜利的枢纽；不要写成“战略防御阶段决定最终胜利”。",r:["rm-luochuan","mao-guerrilla","e1938-stalemate"],s:"https://www.12371.cn/2021/05/24/ARTI1621842952283895.shtml"},
{id:"mao-stage",y:1938,d:"1938.10—11",t:"《论新阶段》",p:1,b:"抗战进入相持阶段前后，党内需要纠正右倾倾向并解决如何对待马克思主义和外国经验的问题。",c:"毛泽东在六届六中全会所作政治报告，明确提出“使马克思主义在中国具体化”的历史任务，即马克思主义中国化，强调统一战线中的独立自主。",m:"把马克思主义中国化提升为全党的自觉任务，推动党的理论创新和中国革命实践发展。",x:"首次明确提出“马克思主义中国化”对应六届六中全会《论新阶段》；《反对本本主义》是更早的思想基础。",r:["pl6-6","mao-book"]}
]);
add("maobook","毛泽东思想成熟：新民主主义理论体系",[
{id:"mao-journal",y:1939,d:"1939.10.4",t:"《〈共产党人〉发刊词》",p:1,b:"需要总结建党以来两次胜利、两次失败的经验，建设一个能够领导中国革命的马克思主义政党。",c:"提出统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的三个法宝，并把党的建设称为“伟大的工程”。",m:"揭示中国革命发展的基本规律和党的领导关键，为正确处理三大法宝相互关系提供指导。",x:"三大法宝≠三大作风。三大法宝在本篇，三大作风在《论联合政府》。",r:["mao-chinarev","mao-united","pl6-6"]},
{id:"mao-chinarev",y:1939,d:"1939.12",t:"《中国革命和中国共产党》",p:1,b:"需要把对中国国情和革命基本问题的认识系统化，教育干部认清中国革命性质和任务。",c:"分析近代中国半殖民地半封建社会性质和主要矛盾，阐明中国革命对象、任务、动力、性质和前途，首次提出“新民主主义革命”的科学概念。",m:"为新民主主义革命理论形成奠定国情分析和概念基础，回答中国革命“是什么、依靠谁、向何处去”。",x:"首次提出新民主主义革命科学概念对应本篇；系统阐明新民主主义理论对应《新民主主义论》。",r:["mao-newdem","mao-contradict"]}
]);
add("maobook","毛泽东思想成熟：纲领与整风",[
{id:"mao-newdem",y:1940,d:"1940.1.9",t:"《新民主主义论》",p:1,b:"需要回答抗战时期“中国向何处去”，驳斥顽固派反共论调并明确中国革命前途。",c:"系统阐明新民主主义革命理论，指出中国革命分新民主主义和社会主义两步走；完整提出新民主主义政治、经济、文化纲领，即各革命阶级联合专政、民主集中制，节制资本和平均地权，民族的科学的大众的文化。",m:"标志新民主主义理论体系形成，是毛泽东思想达到成熟的重要代表作，为中国革命和国家建设指明方向。",x:"两步走不是一次完成社会主义革命，也不允许在两步之间横插资产阶级专政阶段。",r:["mao-chinarev","mao-united","c7"],s:"https://fuwu.12371.cn/2012/08/27/ARTI1346055674878195_all.shtml"},
{id:"mao-study",y:1941,d:"1941.5.19",t:"《改造我们的学习》",p:1,b:"党内主观主义特别是教条主义仍严重存在，理论和实际分离影响中国革命。",c:"倡导研究现状、研究历史、学习国际革命经验并注重马克思主义理论应用，对“实事求是”作出科学解释，批判主观主义学风。",m:"为延安整风作思想准备，推动全党树立理论和实际相统一的马克思主义学风。",x:"“实事”是客观存在着的一切事物，“是”是客观事物的内部联系即规律性，“求”是去研究。",r:["mao-party","mao-book","e-yananrectify"]},
{id:"mao-party",y:1942,d:"1942.2.1",t:"《整顿党的作风》",p:1,b:"全党整风需要明确反对什么、以什么方针解决党内思想不纯和作风不纯。",c:"提出反对主观主义以整顿学风、反对宗派主义以整顿党风，并号召反对党八股以整顿文风；强调整风采取“惩前毖后、治病救人”的方针。",m:"指导延安整风深入开展，促进全党思想统一和团结。",x:"整风最主要任务是反对主观主义以整顿学风；主观主义主要表现为教条主义和经验主义。",r:["mao-eight","mao-study","pl6-7"]},
{id:"mao-eight",y:1942,d:"1942.2.8",t:"《反对党八股》",p:2,b:"主观主义和宗派主义需要通过党八股这种形式主义宣传方式表现和传播。",c:"分析党八股的表现和危害，提倡生动活泼、联系实际、为群众喜闻乐见的马克思主义文风。",m:"推动宣传教育和党的作风建设，促进理论联系实际和密切联系群众。",x:"《整顿党的作风》重在学风党风，《反对党八股》集中反对文风；三风共同构成整风内容。",r:["mao-party","mao-literature"]}
]);
add("maobook","毛泽东思想成熟与发展：建国和解放全国",[
{id:"mao-literature",y:1942,d:"1942.5",t:"《在延安文艺座谈会上的讲话》",p:1,b:"革命文艺需要明确服务对象、创作立场以及文艺与政治、与人民生活的关系。",c:"指出文艺为人民大众服务，首先为工农兵服务；阐明生活是文艺创作源泉，论述普及与提高、文艺与革命工作的关系。",m:"确立革命文艺的根本方向，推动解放区文艺和后来社会主义文艺发展。",x:"文艺首先为工农兵服务不等于只写工农兵；核心是文艺为什么人、如何服务。",r:["rm-yanan","mao-party"]},
{id:"mao-united",y:1945,d:"1945.4.24",t:"《论联合政府》",p:1,b:"抗战胜利在望，中国面临两种前途、两种命运的选择。",c:"提出废止国民党一党专政、建立民主联合政府，系统阐述新民主主义国家一般纲领和当前具体纲领；概括理论联系实际、密切联系群众、批评和自我批评三大作风。",m:"为争取抗战胜利和建立新中国提供政治纲领，三大作风成为中国共产党区别于其他政党的显著标志。",x:"三大作风≠三大法宝；七大确立毛泽东思想指导地位与本篇报告相互关联但不是同一考点。",r:["c7","mao-journal","sm-chongqing"],s:"https://www.12371.cn/2021/04/21/ARTI1618988091020144.shtml"},
{id:"mao-present",y:1947,d:"1947.12.25",t:"《目前形势和我们的任务》",p:1,b:"人民解放军转入战略进攻，需要明确夺取全国胜利的军事、经济和政治纲领。",c:"总结十大军事原则，提出新民主主义革命三大经济纲领：没收封建地主阶级土地归农民所有，没收官僚垄断资本归新民主主义国家所有，保护民族工商业。",m:"为战略进攻和夺取全国胜利提供政策指导，丰富新民主主义革命理论。",x:"没收官僚资本具有双重性质：民主革命性质和社会主义革命性质。",r:["e1947-offensive","mao-jinsui","doc-land1947"]},
{id:"mao-jinsui",y:1948,d:"1948.4.1",t:"《在晋绥干部会议上的讲话》",p:1,b:"土地改革和解放战争深入发展，需要完整概括新民主主义革命总路线和土地改革总路线，防止政策偏差。",c:"完整表述新民主主义革命总路线：无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命；提出土地改革总路线：依靠贫农，团结中农，有步骤地、有分别地消灭封建剥削制度，发展农业生产。",m:"统一全党对新民主主义革命和土地改革政策的认识，为夺取全国胜利提供路线依据。",x:"总路线完整表述在本篇；《中国革命和中国共产党》首次提出新民主主义革命科学概念。",r:["mao-chinarev","mao-present","doc-land1947"]},
{id:"mao-peopledem",y:1949,d:"1949.6.30",t:"《论人民民主专政》",p:1,b:"新中国即将成立，需要从理论上说明新国家的阶级基础、国家性质和内外政策。",c:"总结近代中国革命经验，阐明工人阶级是领导力量、工农联盟是基础，人民民主专政是对人民内部民主和对反动派专政的结合。",m:"为新中国成立奠定理论和政策基础，是对马克思主义国家学说的丰富和发展。",x:"新民主主义国家是各革命阶级联合专政，不是资产阶级共和国，也不是无产阶级单独专政。",r:["pl7-2","sm-cppcc1","e1949-found"],s:"https://www.12371.cn/2021/06/28/ARTI1624892522458230.shtml"}
]);
add("maobook","社会主义革命和建设时期",[
{id:"mao-ten",y:1956,d:"1956.4.25",t:"《论十大关系》",p:1,b:"社会主义改造即将基本完成，苏联模式弊端逐渐暴露，中国需要独立探索适合国情的社会主义建设道路。",c:"围绕调动国内外一切积极因素为社会主义事业服务，分析重工业和轻工业农业、沿海和内地、经济建设和国防建设、中央和地方等十大关系。",m:"是以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主义建设道路的标志，为中共八大召开作理论准备。",x:"基本方针是调动一切积极因素为社会主义事业服务；《关于正确处理人民内部矛盾的问题》重点是两类矛盾。",r:["c8","mao-contradiction","e1956-system"]},
{id:"mao-contradiction",y:1957,d:"1957.2.27",t:"《关于正确处理人民内部矛盾的问题》",p:1,b:"社会主义制度基本建立后，国内外出现新情况，需要回答社会主义社会是否还有矛盾、怎样区分和处理不同矛盾。",c:"系统阐述社会主义社会基本矛盾理论，区分敌我矛盾和人民内部矛盾两类不同性质矛盾，提出正确处理人民内部矛盾是国家政治生活主题；人民内部矛盾用民主方法解决。",m:"创造性丰富马克思主义关于社会主义社会矛盾的学说，为社会主义建设和改革提供重要理论基础。",x:"社会主义社会基本矛盾仍是生产力与生产关系、经济基础与上层建筑之间的矛盾，不具有对抗性，可以通过社会主义制度自我调整解决。",r:["mao-ten","c8","pl8-9"]}
]);

add("classic","马克思主义形成时期",[
{id:"bk-yearbook1844",y:1844,d:"1844.2",t:"《德法年鉴》上的论文",p:2,b:"马克思、恩格斯在接触社会现实和工人运动过程中实现思想转变。",c:"马克思发表《论犹太人问题》和《〈黑格尔法哲学批判〉导言》，恩格斯发表《国民经济学批判大纲》等，探讨政治解放、人的解放和无产阶级历史使命。",m:"标志马克思和恩格斯完成从唯心主义向唯物主义、从革命民主主义向共产主义的转变，为马克思主义创立奠定思想前提。",x:"“两个转变”对应《德法年鉴》论文，不是《共产党宣言》。",r:["bk-manifesto","bk-holy1844"],s:"https://fuwu.12371.cn/2012/08/27/ARTI1346047581809688_5.shtml"},
{id:"bk-manuscript1844",y:1844,d:"1844",t:"《1844年经济学哲学手稿》",p:3,b:"马克思开始系统研究政治经济学，试图从经济关系说明人的异化和解放。",c:"以异化劳动为中心分析资本主义条件下劳动者同劳动产品、劳动活动、类本质以及人与人的相异化。",m:"是青年马克思探索哲学、政治经济学和共产主义理论的重要文献，为理解马克思主义形成史提供材料。",x:"该手稿当时未正式出版，不能取代《德意志意识形态》“首次系统阐述唯物史观”的地位。",r:["bk-yearbook1844","bk-german1845"]},
{id:"bk-holy1844",y:1844,d:"1844",t:"《神圣家族》",p:2,b:"马克思、恩格斯需要批判青年黑格尔派鲍威尔等人的主观唯心主义。",c:"马克思、恩格斯第一次合著，批判自我意识哲学，强调现实的人和人民群众在历史发展中的作用。",m:"为唯物史观形成迈出重要一步，是两人共同理论创作的起点。",x:"“第一次合著”是《神圣家族》；“首次系统阐述唯物史观”是《德意志意识形态》。",r:["bk-german1845","bk-theses1845"]},
{id:"bk-theses1845",y:1845,d:"1845春",t:"《关于费尔巴哈的提纲》",p:1,b:"旧唯物主义主要停留于直观理解世界，不能科学说明实践和人的社会性。",c:"把实践作为新世界观基础，强调人的本质是一切社会关系的总和、社会生活在本质上是实践的，提出哲学家们只是用不同方式解释世界，而问题在于改变世界。",m:"被恩格斯称为包含着新世界观天才萌芽的第一个文件，标志马克思同旧唯物主义划清界限。",x:"提纲的关键词是“实践”；第十一条高频考查“解释世界/改变世界”。",r:["bk-german1845","mao-practice"]},
{id:"bk-german1845",y:1845,d:"1845—1846",t:"《德意志意识形态》",p:1,b:"需要彻底清算费尔巴哈、布·鲍威尔、施蒂纳及“真正的社会主义”的唯心史观。",c:"马克思、恩格斯首次系统阐述历史唯物主义基本原理，说明物质生产是社会存在发展的基础，生产力与交往形式、经济基础与上层建筑的矛盾运动推动历史发展。",m:"标志唯物史观基本形成，为科学社会主义奠定哲学基础，实现哲学史上的伟大变革。",x:"当时以手稿形式写成，未能正式出版；“首次系统阐述唯物史观”仍是其教材地位。",r:["bk-theses1845","bk-manifesto"],s:"https://djyj.12371.cn/2026/02/24/ARTI1771922530322271.shtml"},
{id:"bk-poverty1847",y:1847,d:"1847",t:"《哲学的贫困》",p:2,b:"蒲鲁东《贫困的哲学》用唯心主义政治经济学观点解释社会矛盾，影响工人运动。",c:"马克思批判蒲鲁东改良主义和形而上学，论证经济范畴的历史性、暂时性，阐述马克思主义政治经济学基本原理。",m:"是公开阐述马克思主义的重要文献，促进科学理论同工人运动结合。",x:"不要与《共产党宣言》“马克思主义公开问世”的标志简单互换；答题按教材对应表述。",r:["bk-manifesto","bk-capital1867"]},
{id:"bk-manifesto",y:1848,d:"1848.2",t:"《共产党宣言》",p:1,b:"资本主义发展和阶级矛盾激化，共产主义者同盟需要公开说明共产党人的观点、目的和意图。",c:"马克思、恩格斯为共产主义者同盟起草，系统阐述阶级斗争、资产阶级历史作用与局限、无产阶级历史使命、共产党性质和奋斗目标，号召“全世界无产者，联合起来”。",m:"标志马克思主义公开问世和科学社会主义诞生，为无产阶级认识世界、改造世界提供科学理论。",x:"唯物史观和剩余价值学说使社会主义由空想变为科学；《共产党宣言》是马克思主义公开问世的标志，三者表述不能混。",r:["bk-german1845","c1","doc-declaration-1920"],s:"https://www.12371.cn/2022/02/22/ARTI1645516372838368.shtml"}
]);
add("classic","马克思主义发展与丰富",[
{id:"bk-capital1867",y:1867,d:"1867（第一卷）",t:"《资本论》",p:1,b:"需要揭示资本主义经济运动规律和资产阶级与无产阶级对立的经济根源。",c:"以商品为逻辑起点，分析劳动二重性、价值、货币和资本，系统阐明剩余价值生产、实现和分配，揭示资本主义积累一般规律及历史趋势。",m:"是马克思主义政治经济学最重要的著作，被誉为“工人阶级的圣经”；剩余价值学说与唯物史观一起使社会主义从空想变为科学。",x:"马克思一生两大发现是唯物史观和剩余价值学说；劳动价值论不是马克思凭空首创，但他实现了科学改造。",r:["bk-manifesto","bk-gotha1875"]},
{id:"bk-civil1871",y:1871,d:"1871",t:"《法兰西内战》",p:2,b:"巴黎公社失败，需要总结无产阶级第一次夺取政权的经验教训。",c:"分析巴黎公社革命，阐述无产阶级必须打碎旧国家机器、建立新型国家政权的思想。",m:"丰富和发展马克思主义国家学说和无产阶级革命理论。",x:"巴黎公社是无产阶级建立政权的第一次伟大尝试，不是第一个社会主义国家。",r:["bk-state1917","bk-gotha1875"]},
{id:"bk-gotha1875",y:1875,d:"1875",t:"《哥达纲领批判》",p:2,b:"德国社会主义工人党纲领中存在拉萨尔机会主义观点，需要科学说明未来社会发展阶段和分配原则。",c:"论述过渡时期和无产阶级专政，区分共产主义第一阶段和高级阶段，分析按劳分配及其历史局限。",m:"丰富科学社会主义关于未来社会发展阶段、分配和国家问题的理论。",x:"按劳分配是共产主义第一阶段的原则，不是高级阶段按需分配。",r:["bk-capital1867","bk-state1917"]},
{id:"bk-anti1878",y:1878,d:"1878",t:"《反杜林论》",p:1,b:"杜林以所谓终极真理体系向马克思主义发起全面挑战，并在德国党内产生影响。",c:"恩格斯从哲学、政治经济学和社会主义三个领域批判杜林，系统阐述马克思主义哲学、政治经济学和科学社会主义。",m:"被称为马克思主义的百科全书，是系统阐述马克思主义基本理论的重要著作。",x:"马克思主义三个组成部分在本著得到系统阐述，不等于马克思主义有三个彼此割裂的理论来源。",r:["bk-feuerbach1886","bk-manifesto"]},
{id:"bk-origin1884",y:1884,d:"1884",t:"《家庭、私有制和国家的起源》",p:2,b:"需要用唯物史观说明家庭、私有制和国家并非永恒存在，而是历史发展的产物。",c:"恩格斯分析原始社会、家庭形式演变、私有制产生和阶级形成，揭示国家是阶级矛盾不可调和的产物和表现。",m:"丰富历史唯物主义和马克思主义国家学说，说明国家产生、发展和消亡的历史性。",x:"国家不是从来就有，也不是社会契约的简单结果；其实质是阶级统治工具。",r:["bk-state1917","bk-feuerbach1886"]},
{id:"bk-feuerbach1886",y:1886,d:"1886",t:"《路德维希·费尔巴哈和德国古典哲学的终结》",p:1,b:"需要系统说明马克思主义哲学同德国古典哲学的关系，批判唯心主义和旧唯物主义。",c:"恩格斯明确提出哲学基本问题是思维和存在的关系问题，分析唯物主义与唯心主义、可知论与不可知论，阐明历史唯物主义基本观点。",m:"系统阐述马克思主义哲学基本原理，是理解辩证唯物主义和历史唯物主义的重要经典。",x:"哲学基本问题第一方面是何为第一性，第二方面是有无同一性；不要只回答“物质和意识的关系”而丢掉两方面。",r:["bk-anti1878","bk-theses1845"],s:"https://news.12371.cn/2018/05/03/ARTI1525354702167198.shtml"}
]);
add("classic","列宁对马克思主义的发展",[
{id:"bk-material1909",y:1909,d:"1909",t:"《唯物主义和经验批判主义》",p:2,b:"俄国经验批判主义者用主观唯心主义攻击马克思主义哲学，动摇党的理论基础。",c:"列宁批判马赫主义，阐述辩证唯物主义认识论，给物质下科学定义：物质是标志客观实在的哲学范畴，这种客观实在是人通过感觉感知的，不依赖于感觉而存在并为感觉所复写、摄影、反映。",m:"捍卫和发展马克思主义认识论，明确物质客观实在性和认识能动性。",x:"物质的唯一特性是客观实在性；不要把物质等同于某种具体物质形态或自然科学结构。",r:["bk-feuerbach1886","bk-imperial1916"]},
{id:"bk-imperial1916",y:1916,d:"1916",t:"《帝国主义是资本主义的最高阶段》",p:1,b:"19世纪末20世纪初资本主义从自由竞争发展到垄断，第一次世界大战暴露帝国主义矛盾。",c:"列宁分析垄断、金融资本、资本输出、国际垄断同盟瓜分世界、列强完成领土瓜分等基本特征，揭示帝国主义实质和历史地位。",m:"创立科学的帝国主义理论，为认识时代特征、战争根源和无产阶级革命条件提供理论依据。",x:"垄断是帝国主义最深厚经济基础；帝国主义是资本主义发展的特殊历史阶段，不是简单等同于对外侵略政策。",r:["bk-state1917","bk-capital1867"]},
{id:"bk-state1917",y:1917,d:"1917",t:"《国家与革命》",p:2,b:"第二国际机会主义者歪曲马克思主义国家学说，俄国革命需要回答如何对待资产阶级国家和建立何种新政权。",c:"系统阐述国家起源、本质和消亡，强调无产阶级革命必须打碎旧国家机器，建立无产阶级专政并创造条件使国家逐步消亡。",m:"恢复和发展马克思主义国家与革命学说，为十月革命和无产阶级政权建设提供理论指导。",x:"无产阶级专政不是不要民主，而是对广大人民实行民主、对少数剥削者实行专政。",r:["bk-civil1871","bk-origin1884"]}
]);

add("document","马克思主义传播与革命纲领文献",[
{id:"doc-declaration-1920",y:1920,d:"1920.8",t:"《共产党宣言》首个中文全译本",p:2,b:"五四运动后马克思主义在中国广泛传播，先进知识分子需要直接阅读科学社会主义经典。",c:"陈望道翻译的《共产党宣言》中文全译本在上海出版，使中国读者得以系统接触这部经典。",m:"推动马克思主义在中国传播，为先进分子确立共产主义信仰和中国共产党创建提供思想条件。",x:"中文全译本是陈望道翻译，不是李大钊；李大钊《我的马克思主义观》是系统介绍马克思主义的重要文章。",r:["bk-manifesto","c1","e1919"]},
{id:"doc-81",y:1935,d:"1935.8.1",t:"《为抗日救国告全体同胞书》（八一宣言）",p:1,b:"日本扩大侵华、民族危机加深，需要停止内战并动员全国各阶层共同抗日。",c:"呼吁停止内战、一致抗日，提出组织国防政府和抗日联军，倡议建立抗日民族统一战线。",m:"表达中国共产党团结抗日的政治主张，推动抗日救亡运动和抗日民族统一战线形成。",x:"八一宣言是倡议；瓦窑堡会议把建立抗日民族统一战线确立为党的基本策略。",r:["rm-wayaobao","e1935-129","e-xian"]},
{id:"doc-anti10",y:1937,d:"1937.8",t:"《抗日救国十大纲领》",p:1,b:"全民族抗战爆发后，需要把全面抗战主张转化为明确行动纲领。",c:"洛川会议通过，主张打倒日本帝国主义、全国军事和总动员、改革政治机构、实行抗日外交、改善人民生活、抗日教育、肃清汉奸卖国贼、财政经济政策、民族团结、建立抗日民族统一战线等。",m:"体现全面全民族抗战路线，为党领导人民坚持长期抗战提供具体纲领。",x:"十大纲领与洛川会议绑定；国民党片面抗战路线与中国共产党全面抗战路线是选择题比较点。",r:["rm-luochuan","mao-protracted"]},
{id:"doc-history1",y:1945,d:"1945.4.20",t:"《关于若干历史问题的决议》",p:1,b:"延安整风中需要总结建党以来特别是六届四中全会至遵义会议前的历史经验，分清路线是非。",c:"六届七中全会原则通过，系统总结党的历史经验，评价重大是非，肯定毛泽东领导地位和正确路线。",m:"第一个历史决议，标志延安整风胜利结束，使全党在马克思列宁主义基础上达到空前团结，为七大召开奠定基础。",x:"通过主体是扩大的六届七中全会，不是中共七大。",r:["pl6-7","c7","doc-history2"]},
{id:"doc-land1947",y:1947,d:"1947.9.13",t:"《中国土地法大纲》",p:1,b:"解放战争进入战略进攻，广大农民要求彻底废除封建土地制度。",c:"规定废除封建性及半封建性剥削的土地制度，实行耕者有其田的土地制度；乡村中一切地主土地及公地由农会接收，按人口平均分配土地。",m:"推动解放区土地改革，调动亿万农民革命和生产积极性，为解放战争胜利提供深厚群众基础。",x:"抗日战争时期主要是减租减息；解放战争时期转为耕者有其田；1950年土地改革法在新解放区实施并保存富农经济。",r:["mao-jinsui","doc-land1950","e1947-offensive"]},
{id:"doc-common",y:1949,d:"1949.9.29",t:"《中国人民政治协商会议共同纲领》",p:1,b:"新政协筹备建立新中国，需要以共同纲领确认国家性质、政权机关和基本政策。",c:"规定中华人民共和国为新民主主义即人民民主主义国家，实行工人阶级领导、工农联盟为基础、团结各民主阶级和国内各民族的人民民主专政，规定政治、经济、文化、民族、外交等基本政策。",m:"在新中国成立初期起临时宪法作用，是新政协和中央人民政府施政的共同基础。",x:"《共同纲领》不是1954年宪法，也不是1982年现行宪法。",r:["sm-cppcc1","doc-1954const","mao-peopledem"]}
]);
add("document","新中国制度与改革开放文献",[
{id:"doc-land1950",y:1950,d:"1950.6.30",t:"《中华人民共和国土地改革法》",p:1,b:"新解放区广大农民仍受封建土地制度束缚，恢复国民经济和巩固人民政权要求完成土地改革。",c:"废除地主阶级封建剥削的土地所有制，实行农民的土地所有制；在政策上保存富农经济，以利于孤立地主、保护中农和稳定生产。",m:"到1952年底土地改革基本完成，彻底摧毁我国两千多年封建土地制度，解放农村生产力，巩固工农联盟和人民政权。",x:"1950年政策特点是“保存富农经济”；农民获得土地后仍是个体私有制，农业社会主义改造后才逐步转向集体所有制。",r:["doc-land1947","e1950-land","e1952-recover"]},
{id:"doc-1954const",y:1954,d:"1954.9.20",t:"1954年《中华人民共和国宪法》",p:1,b:"第一届全国人大需要以国家根本法确认新中国的国家制度和向社会主义过渡的方向。",c:"规定我国是工人阶级领导的、以工农联盟为基础的人民民主国家，确立人民代表大会制度，体现人民民主原则和社会主义原则。",m:"是新中国第一部社会主义类型宪法，以根本法形式确立中国人民行使国家权力的政治制度，为社会主义建设提供法律保障。",x:"《共同纲领》起临时宪法作用；1954年宪法是第一部社会主义类型宪法；1982年宪法是现行宪法。",r:["sm-npc1954","doc-common","doc-1982const"]},
{id:"doc-emancipate",y:1978,d:"1978.12.13",t:"《解放思想，实事求是，团结一致向前看》",p:1,b:"“两个凡是”束缚思想，党和国家需要打破僵化、实现工作重点转移。",c:"邓小平在中央工作会议闭幕会上发表重要讲话，强调解放思想、开动脑筋、实事求是、团结一致向前看，研究新情况、解决新问题。",m:"实际上成为十一届三中全会的主题报告，是开辟新时期新道路、开创中国特色社会主义新理论的宣言书之一。",x:"讲话在1978年中央工作会议，不是在十一届三中全会开幕当天；南方谈话是1992年又一个解放思想宣言书。",r:["rm-central1978","pl11-3","doc-south"]},
{id:"doc-history2",y:1981,d:"1981.6.27",t:"《关于建国以来党的若干历史问题的决议》",p:1,b:"需要科学总结新中国成立以来正反两方面经验，统一全党对历史和现实的认识。",c:"十一届六中全会通过，科学评价毛泽东历史地位和毛泽东思想，概括毛泽东思想活的灵魂，明确社会主义改造完成后社会主要矛盾和中心任务。",m:"第二个历史决议，标志党和国家在指导思想上拨乱反正基本完成，为改革开放和现代化建设提供思想政治基础。",x:"决议既充分肯定历史贡献又纠正错误，不是简单否定历史；活的灵魂是实事求是、群众路线、独立自主。",r:["pl11-6","doc-history1","doc-history3"]},
{id:"doc-1982const",y:1982,d:"1982.12.4",t:"1982年《中华人民共和国宪法》",p:1,b:"改革开放和拨乱反正后，需要适应新的历史条件健全国家根本法。",c:"五届全国人大五次会议通过现行宪法，确立国家根本制度、国家机构体系和公民基本权利义务；此后经历1988、1993、1999、2004、2018年修正。",m:"是新时代坚持和发展中国特色社会主义的根本法治保障，12月4日被确定为国家宪法日。",x:"现行宪法是1982年宪法，不是1954年宪法直接沿用；2018年修正是现行宪法的第五次修改。",r:["sm-npc1982","sm-npc2018","pl18-4"]},
{id:"doc-south",y:1992,d:"1992.1.18—2.21",t:"邓小平南方谈话",p:1,b:"国际形势深刻变化，国内改革开放面临姓“资”姓“社”等思想困扰，需要回答社会主义本质和计划市场关系。",c:"阐明社会主义本质是解放生产力、发展生产力，消灭剥削、消除两极分化，最终达到共同富裕；提出“三个有利于”、计划和市场都是经济手段、发展才是硬道理等。",m:"从理论上深刻回答长期束缚思想的重大认识问题，是把改革开放和现代化建设推向新阶段的又一个解放思想、实事求是宣言书。",x:"南方谈话不是十四大报告；十四大随后明确建立社会主义市场经济体制的改革目标。",r:["c14","pl12-3","doc-emancipate"]},
{id:"doc-three",y:2001,d:"2001.7.1",t:"庆祝中国共产党成立80周年大会讲话",p:2,b:"长期执政和改革开放条件下，党需要回答建设什么样的党、怎样建设党，巩固执政基础。",c:"系统阐述“三个代表”重要思想的科学内涵和基本要求，强调增强党的阶级基础、扩大党的群众基础。",m:"推动“三个代表”重要思想学习贯彻，为加强和改进党的建设提供理论指导。",x:"“三个代表”重要思想在2000年提出，2001年讲话系统阐述，2002年十六大确立指导地位。",r:["c16","c17"]}
]);
add("document","新时代重要报告、决议与规划",[
{id:"doc-19report",y:2017,d:"2017.10.18",t:"党的十九大报告",p:1,b:"中国特色社会主义进入新时代，需要阐明新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展。",c:"提出习近平新时代中国特色社会主义思想，以“八个明确”概括其核心内容，以“十四个坚持”概括新时代坚持和发展中国特色社会主义基本方略；作出社会主要矛盾转化和“两步走”战略安排。",m:"是全党全国各族人民决胜全面建成小康社会、夺取新时代中国特色社会主义伟大胜利的政治宣言和行动纲领。",x:"十九大报告是“八个明确”；十九届六中全会《决议》进一步概括为“十个明确”。基本方略是“十四个坚持”，历史经验是“十个坚持”。",r:["c19","doc-history3","doc-20report"]},
{id:"doc-centenary",y:2021,d:"2021.7.1",t:"庆祝中国共产党成立100周年大会讲话",p:1,b:"实现第一个百年奋斗目标、向第二个百年奋斗目标迈进之际，需要总结百年历程并宣示未来方向。",c:"庄严宣告全面建成小康社会，首次提出并概括伟大建党精神：坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民；提出以史为鉴、开创未来“九个必须”。",m:"阐明党的精神之源和百年奋斗主题，激励全党全国人民在新征程上继续推进民族复兴。",x:"伟大建党精神是中国共产党的精神之源；不要与井冈山精神、长征精神、延安精神等具体精神混为同一层级。",r:["pl19-6","doc-history3","c20"]},
{id:"doc-history3",y:2021,d:"2021.11.11",t:"《中共中央关于党的百年奋斗重大成就和历史经验的决议》",p:1,b:"建党百年、开启全面建设社会主义现代化国家新征程，需要以历史经验统一思想、统一意志、统一行动。",c:"十九届六中全会通过，全面总结四个历史时期重大成就和历史性飞跃，阐明“两个确立”的决定性意义，以“十个明确”概括新时代思想核心内容，总结“十个坚持”历史经验。",m:"第三个历史决议，是新时代坚持和发展中国特色社会主义、以史为鉴开创未来的政治宣言和行动指南。",x:"三次决议分别对应1945年六届七中、1981年十一届六中、2021年十九届六中；“十个明确”与“十个坚持”不能互换。",r:["pl19-6","doc-history1","doc-history2"]},
{id:"doc-20report",y:2022,d:"2022.10.16",t:"党的二十大报告",p:1,b:"迈上全面建设社会主义现代化国家新征程，需要明确中心任务、战略部署和党的建设要求。",c:"阐明中国式现代化五个中国特色、九条本质要求和五条重大原则，部署高质量发展、科教人才、全过程人民民主、依法治国、文化自信、共同富裕、绿色发展、国家安全、国防军队、祖国统一、大国外交和全面从严治党。",m:"是党团结带领全国各族人民夺取中国特色社会主义新胜利的政治宣言和行动纲领，为新时代新征程提供路线图。",x:"五个中国特色：人口规模巨大、全体人民共同富裕、两个文明协调、人与自然和谐共生、走和平发展道路；重大原则另有“五条”，不要与本质要求混背。",r:["c20","pl20-3","doc-history3"],s:"https://www.12371.cn/special/20da/bg/"},
{id:"doc-reform2024",y:2024,d:"2024.7.18",t:"《中共中央关于进一步全面深化改革、推进中国式现代化的决定》",p:1,b:"推进中国式现代化面临深层次体制机制障碍，需要系统部署未来五年改革任务。",c:"二十届三中全会通过，提出300多项重要改革举措，明确总目标、“七个聚焦”和“六个坚持”，强调发挥经济体制改革牵引作用，构建支持全面创新体制机制。",m:"是新时代新征程进一步全面深化改革的纲领性文件，为中国式现代化提供动力和制度保障；改革任务要求到2029年完成。",x:"到2035年是全面建成高水平社会主义市场经济体制等阶段性目标；到2029年是完成本《决定》提出的改革任务，时间不可混。",r:["pl20-3","pl18-3","doc-20report"]},
{id:"doc-15proposal",y:2025,d:"2025.10.23",t:"“十五五”规划建议",p:1,b:"“十五五”时期是基本实现社会主义现代化夯实基础、全面发力的关键时期，发展环境深刻复杂变化。",c:"二十届四中全会通过，提出六项原则和七方面主要目标：高质量发展、科技自立自强、进一步全面深化改革、社会文明程度、人民生活品质、美丽中国建设、国家安全屏障等取得新进展。",m:"发挥国家发展规划战略导向作用，凝聚全党全国各族人民推进中国式现代化的力量，为2035年基本实现社会主义现代化奠定基础。",x:"《建议》由中央全会审议通过；《纲要》由国务院编制并由全国人大审查批准，二者是党内战略部署与国家法定规划的关系。",r:["pl20-4","doc-15outline","doc-reform2024"],s:"https://www.gov.cn/zhengce/202510/content_7046052.htm"},
{id:"doc-15outline",y:2026,d:"2026.3.12",t:"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》",p:1,b:"依据二十届四中全会《建议》，国务院编制规划纲要草案并依法提请全国人大审查。",c:"十四届全国人大四次会议批准，规划期为2026—2030年，围绕现代化产业体系、科技自立自强、数字中国、强大国内市场、改革、开放、乡村振兴、文化、人口、民生、绿色、安全、国防、民主法治等部署任务。",m:"主要阐明国家战略意图、明确政府工作重点、引导规范社会主体行为，是“十五五”时期国家发展的宏伟蓝图和各族人民共同行动纲领。",x:"2026年是“十五五”开局之年；二十届五中全会主题为全面从严治党，不要再把规划《纲要》写成五中全会审议通过。",r:["sm-npc2026","pl20-4","pl20-5"],s:"http://www.npc.gov.cn/npc/c2/c30834/202603/t20260316_453274.html"}
]);
add("document","近代救国与思想启蒙文献",[
{id:"doc-haiguo",y:1843,d:"1843",t:"《海国图志》｜魏源",p:1,b:"鸦片战争失败暴露闭目塞听的危害，部分先进地主阶级知识分子开始了解世界、寻求御侮之道。",c:"系统介绍世界各国地理、历史和西方先进技术，提出“师夷长技以制夷”，主张学习西方长处抵抗外国侵略。",m:"开阔国人视野，开创近代向西方学习的新风，对洋务思想和日本明治维新也产生影响。",x:"“师夷长技以制夷”不是洋务运动“中体西用”的同义句；前者在《海国图志》，后者是洋务派指导思想。",r:["e1840-opium","e1861-western"]},
{id:"doc-taiping",y:1853,d:"1853",t:"《天朝田亩制度》",p:1,b:"太平天国希望建立理想社会，解决农民土地和社会平等要求。",c:"以解决土地问题为中心，提出按人口和年龄平均分配土地，设想“有田同耕，有饭同食，有衣同穿，有钱同使，无处不均匀，无人不饱暖”。",m:"体现农民要求废除封建土地所有制的强烈愿望，是农民反封建思想结晶；但绝对平均主义具有空想性，未能真正实行。",x:"它从根本上否定封建地主土地所有制，不等于建立了科学的社会主义土地制度。",r:["e1851-taiping","doc-zizheng","doc-land1947"]},
{id:"doc-zizheng",y:1859,d:"1859",t:"《资政新篇》｜洪仁玕",p:1,b:"太平天国后期面临内外危机，洪仁玕结合在香港接触的西方知识提出改革方案。",c:"主张学习西方，发展近代交通、金融、工矿、邮政等事业，改革政治和社会文化，具有鲜明资本主义色彩。",m:"是先进中国人较早提出的发展资本主义方案，具有进步意义；受历史条件和农民战争局限，未能付诸实施。",x:"《资政新篇》不是农民平均主义纲领，与《天朝田亩制度》性质和内容明显不同。",r:["doc-taiping","e1851-taiping"]},
{id:"doc-shengshi",y:1894,d:"1894",t:"《盛世危言》｜郑观应",p:3,b:"洋务运动单纯学习技术难以解决国家富强问题，早期维新思想家开始关注经济和制度变革。",c:"主张发展民族工商业、同外国进行“商战”，并提出设议院、实行君民共主等政治主张。",m:"体现早期维新思想由经济改革向政治改革推进，为戊戌维新提供思想资源。",x:"早期维新派与康梁维新派有联系但不完全相同；答题抓住“商战”和制度变革。",r:["e1861-western","e1898-reform"]},
{id:"doc-tianyan",y:1898,d:"1898",t:"《天演论》｜严复译述",p:1,b:"甲午战争后民族危机空前严重，需要唤醒国人救亡图存、奋发图强。",c:"严复译述赫胥黎有关进化论著作，以“物竞天择、适者生存”等观点警示民族危亡，宣传变法自强。",m:"震动思想界，激发救亡意识，为维新变法提供重要思想武器。",x:"《天演论》是译述，不是严复原创生物进化理论；其主要政治意义在救亡图存。",r:["e1894-sino","e1898-reform"]},
{id:"doc-gemingjun",y:1903,d:"1903",t:"《革命军》｜邹容",p:2,b:"清政府腐朽和民族危机加深，资产阶级革命派需要宣传民主革命、反对改良保皇。",c:"以通俗激烈语言阐述革命必要性，号召推翻清朝专制统治，建立“中华共和国”。",m:"广泛传播民主革命思想，激励青年投身反清革命。",x:"邹容《革命军》与陈天华《警世钟》《猛回头》同属民主革命宣传文献。",r:["doc-jingshizhong","sm-tongmenghui","e1911"]},
{id:"doc-jingshizhong",y:1903,d:"1903",t:"《警世钟》《猛回头》｜陈天华",p:3,b:"列强侵略和清政府卖国使民族危机加深，需要唤醒民众反帝反清。",c:"揭露帝国主义侵略和清政府腐朽，号召人民奋起救亡、推翻清政府。",m:"推动资产阶级民主革命思想传播，为革命形势发展作舆论准备。",x:"篇名与作者要成对记，避免与邹容《革命军》混写。",r:["doc-gemingjun","e1911"]},
{id:"doc-minbao",y:1905,d:"1905.11",t:"《民报》发刊词与三民主义",p:1,b:"同盟会成立后需要把十六字纲领概括为系统革命理论。",c:"孙中山在《民报》发刊词中将同盟会纲领概括为民族、民权、民生三大主义，即民族主义、民权主义、民生主义。",m:"三民主义是比较完整的资产阶级民主革命纲领，指导辛亥革命；但缺乏明确反帝内容和彻底土地革命纲领。",x:"旧三民主义对应1905年；新三民主义在1924年国民党一大重新解释，增加明确反帝等内容。",r:["sm-tongmenghui","sm-kmt1","e1911"]},
{id:"doc-xinqingnian",y:1915,d:"1915.9",t:"《青年杂志》（后改名《新青年》）",p:1,b:"袁世凯统治时期思想文化领域复古逆流抬头，需要新的思想启蒙。",c:"陈独秀在上海创刊，倡导民主与科学，成为新文化运动主要阵地。",m:"标志新文化运动兴起，推动思想解放并为五四运动和马克思主义传播创造条件。",x:"创刊时名为《青年杂志》，第二卷起改名《新青年》；创刊人是陈独秀。",r:["e1915-culture","e1919","doc-marxli"]},
{id:"doc-marxli",y:1919,d:"1918—1919",t:"李大钊传播马克思主义的文章",p:1,b:"十月革命和五四运动推动先进知识分子重新认识世界和中国出路。",c:"《法俄革命之比较观》《庶民的胜利》《布尔什维主义的胜利》热情歌颂十月革命；《我的马克思主义观》较系统介绍唯物史观、政治经济学和科学社会主义。",m:"在中国大地上率先举起马克思主义旗帜，推动马克思主义传播，为建党作思想准备。",x:"《我的马克思主义观》作者李大钊；《共产党宣言》首个中文全译本译者陈望道。",r:["e1917-october","e1919","doc-declaration-1920"]}
]);
